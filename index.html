async function renderReader(container, novelId, chapterId = null) {
  if (!novelId) { container.innerHTML = '<p>Karya tidak ditemukan</p>'; return; }
  const workSnap = await getDoc(doc(db, 'works', novelId));
  if (!workSnap.exists()) { container.innerHTML = '<p class="text-red-400">Karya tidak ditemukan.</p>'; return; }
  const work = { id: workSnap.id, ...workSnap.data() };
  
  if (isTakedown(work)) { container.innerHTML = takedownBanner(work); return; }
  
  const canManage = currentUser && (currentUser.uid === work.authorId || isAdminUser(userProfile));
  
  if (isNonPublish(work) && !canManage) {
    container.innerHTML = `<button onclick="window.location.hash='home'" class="text-amber-400 mb-4 hover:text-amber-300 transition"><i class="fas fa-arrow-left mr-2"></i>Kembali</button>` + nonpublishBanner(work);
    return;
  }
  
  const chaptersSnap = await getDocs(query(collection(db, 'works', novelId, 'chapters'), orderBy('number', 'asc')));
  const chapters = []; chaptersSnap.forEach(d => chapters.push({ id: d.id, ...d.data() }));
  let currentChapter = null;
  if (chapterId) currentChapter = chapters.find(c => c.id === chapterId);
  else if (chapters.length > 0) { currentChapter = chapters[0]; window.location.hash = `reader/${novelId}/${currentChapter.id}`; return; }
  
  const viewKey = `viewed_${novelId}`;
  const alreadyViewed = sessionStorage.getItem(viewKey);
  if (!alreadyViewed) {
    try {
      await updateDoc(doc(db, 'works', novelId), { views: (work.views || 0) + 1, updatedAt: serverTimestamp() });
      work.views = (work.views || 0) + 1;
      sessionStorage.setItem(viewKey, '1');
    } catch (e) {}
  }
  if (currentUser && currentChapter) await addExp(EXP_PER_READ);
  
  const chapterLabel = work.type === 'novel' ? 'Chapter' : 'Eps';
  const cats = parseCategories(work.category);
  const isKomik = work.type === 'komik';
  const isBookmarked = currentUser && (userProfile?.bookmarks || []).includes(novelId);
  const isLiked = currentUser && (work.likedBy || []).includes(currentUser.uid);
  const socialHtml = buildSocialLinks({ sosmed: work.authorSosmed || {} });
  const vBadge = getVerifiedBadge(work.authorFollowerCount || 0);
  const isUnggulanAuthor = work.featuredCreator === true;
  
  const chItemHtml = (ch) => {
    const idx = chapters.indexOf(ch);
    return `
      <div class="flex items-center gap-1">
        <button onclick="window.location.hash='reader/${novelId}/${ch.id}'" class="flex-1 text-left px-3 py-2 rounded-lg ${currentChapter && currentChapter.id === ch.id ? 'bg-amber-500/20 border border-amber-500' : 'hover:bg-slate-800'} text-sm truncate transition">
          ${chapterLabel} ${ch.number || idx+1}${ch.title ? ': ' + escHtml(ch.title) : ''}
        </button>
        ${canManage ? `<button onclick="deleteChapterFromReader('${novelId}','${ch.id}','${ch.number || idx+1}')" class="text-red-400 hover:text-red-300 px-2"><i class="fas fa-trash text-xs"></i></button>` : ''}
      </div>`;
  };
  const readerSections = groupChapters(chapters, work);
  const hasGroups = getGroups(work).length > 0;
  const listHtml = !hasGroups ? chapters.map(chItemHtml).join('') : readerSections.map(sec => {
    const isOpen = currentChapter && sec.items.some(c => c.id === currentChapter.id);
    const name = sec.group ? escHtml(groupTitleText(sec.group, work.type)) : `Tanpa ${groupLabel(work.type)}`;
    return `<details class="rounded-lg border border-slate-700/60 bg-slate-900/40" ${isOpen ? 'open' : ''}>
      <summary class="cursor-pointer select-none px-3 py-2 text-sm font-bold text-amber-300 flex items-center gap-2"><i class="fas fa-folder text-amber-400 text-xs"></i><span class="flex-1 truncate">${name}</span><span class="text-[10px] text-slate-500 font-normal">${sec.items.length}</span></summary>
      <div class="px-1 pb-2 space-y-1">${sec.items.length ? sec.items.map(chItemHtml).join('') : '<p class="text-xs text-slate-500 italic px-3 py-1">Belum ada isi.</p>'}</div>
    </details>`;
  }).join('');
  const curGroup = currentChapter && currentChapter.groupId ? getGroups(work).find(g => g.id === currentChapter.groupId) : null;
  const crumbHtml = curGroup ? `<p class="text-xs text-amber-400 font-bold mb-1"><i class="fas fa-folder mr-1"></i>${escHtml(groupTitleText(curGroup, work.type))}</p>` : '';

  const savedPos = getReadingPos(novelId);
  const hasSavedPos = savedPos && savedPos.chapterId === currentChapter?.id && savedPos.scrollY > 100;
  
  container.innerHTML = `
    <div id="readerContent" class="card-anim">
      <div class="reader-header mb-6 flex flex-wrap justify-between items-center gap-2">
        <button onclick="window.location.hash='home'" class="text-amber-400 hover:text-amber-300 transition"><i class="fas fa-arrow-left mr-2"></i>Kembali</button>
        <div class="flex gap-2 flex-wrap">
          <button id="bookmarkToggle" class="text-sm font-bold px-4 py-2 rounded-full transition ${isBookmarked ? 'bg-green-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}"><i class="fas fa-bookmark mr-1"></i>${isBookmarked ? 'Tersimpan' : 'Bookmark'}</button>
          <button id="readerLikeBtn" class="text-sm font-bold px-4 py-2 rounded-full transition ${isLiked ? 'bg-red-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}"><i class="fas fa-heart mr-1"></i><span id="readerLikeCount">${formatCount(work.likes || 0)}</span></button>
        </div>
      </div>
      <div class="reader-header card-bg rounded-2xl p-4 md:p-6 mb-6 ${work.isTamat ? 'tamat-border' : 'berlanjut-border'} ${isUnggulanAuthor ? 'unggulan-border' : ''}">
        <div class="flex flex-col md:flex-row gap-4 md:gap-6">
          <div class="w-full md:w-48 h-64 bg-slate-800 rounded-xl overflow-hidden flex-shrink-0 relative">
            ${work.coverURL ? `<img src="${work.coverURL}" class="w-full h-full object-cover cover-clickable" onclick="window.showImgFullscreen('${escAttr(work.coverURL)}','Sampul: ${escAttr(work.title)}')" onerror="this.style.display='none';">` : `<div class="flex items-center justify-center h-full"><i class="fas fa-image text-5xl text-slate-600"></i></div>`}
            ${statusLabel(work.isTamat)}
          </div>
          <div class="flex-1">
            <h1 class="text-xl md:text-2xl font-black">${work.title}${isUnggulanAuthor ? ' <span class="unggulan-tag">⭐ UNGGULAN</span>' : ''}</h1>
            <p class="text-amber-400/90 italic mt-2">${work.teaser || ''}</p>
            <p class="text-slate-400 mt-2 text-sm">${work.description || ''}</p>
            <div class="flex items-center gap-3 mt-3 text-sm flex-wrap">${cats.map(c => `<span class="bg-slate-700 px-3 py-1 rounded-full text-xs">${c}</span>`).join('')}</div>
            <div class="mt-3 flex items-center gap-2 cursor-pointer hover:opacity-80" onclick="window.location.hash='user/${work.authorId}'">
              <img src="${work.authorPhotoURL || 'https://ui-avatars.com/api/?name='+encodeURIComponent(work.authorName||'U')}" class="w-8 h-8 rounded-full border border-slate-700">
              <span class="text-sm text-amber-400 hover:underline">${work.authorName || 'Anonim'}${vBadge}</span>
              ${work.authorLevel > 1000 ? '<i class="fas fa-crown text-amber-400 badge-float"></i>' : ''}
            </div>
            <div class="flex items-center gap-3 mt-3 text-xs text-slate-400 flex-wrap">
              <span class="view-badge"><i class="fas fa-eye"></i> ${formatCount(work.views || 0)} kali dilihat</span>
              <span class="view-badge"><i class="fas fa-heart" style="color:#ef4444"></i> ${formatCount(work.likes || 0)} suka</span>
              <span class="view-badge"><i class="fas fa-star"></i> ${formatCount(work.ratingCount || 0)} rating</span>
            </div>
            ${socialHtml ? `<div class="flex flex-wrap gap-1 mt-3">${socialHtml}</div>` : ''}

  const bmBtn = document.getElementById('bookmarkToggle');

  if (currentChapter) {

    const savePos = () => { const scrollY = window.scrollY || document.documentElement.scrollTop; if (scrollY > 100) saveReadingPos(novelId, currentChapter.id, scrollY); };
    const scrollHandler = () => { if (saveTimer) clearTimeout(saveTimer); saveTimer = setTimeout(savePos, 500); };
    window.addEventListener('scroll', scrollHandler, { passive: true });
    window.addEventListener('beforeunload', savePos);
  }

  if (!currentChapter) return;
  const commentsRef = collection(db, 'works', novelId, 'chapters', currentChapter.id, 'comments');
  const ratingsRef = collection(db, 'works', novelId, 'chapters', currentChapter.id, 'ratings');
  
  onSnapshot(ratingsRef, async (snap) => {
    const summaryDiv = document.getElementById('ratingSummary');
    if (!summaryDiv) return;
    const arr = []; snap.forEach(d => arr.push({ id: d.id, ...d.data() }));
    if (arr.length === 0) { summaryDiv.innerHTML = '<p class="text-xs text-slate-500">Belum ada rating.</p>'; return; }
    
    for (const r of arr) {
      if (!usersCache[r.userId]) {
        try {
          const uSnap = await getDoc(doc(db, 'users', r.userId));
          if (uSnap.exists()) {
            usersCache[r.userId] = { id: r.userId, ...uSnap.data() };
          }
        } catch (e) {}
      }
    }
    
    const avg = arr.reduce((s, r) => s + (r.rating || 0), 0) / arr.length;
    summaryDiv.innerHTML = `
      <div class="flex items-center gap-3 mb-3 flex-wrap">
        <div class="text-3xl font-black text-amber-400">${avg.toFixed(1)}</div>
        <div>
          <div class="flex">${[1,2,3,4,5].map(n => `<i class="fas fa-star ${n <= Math.round(avg) ? 'text-amber-400' : 'text-slate-600'}"></i>`).join('')}</div>
          <p class="text-xs text-slate-400">${arr.length} rating</p>
        </div>
      </div>
      <div class="flex flex-wrap gap-1">
        ${arr.map(r => {
          const u = usersCache[r.userId] || {};
          let un = u.username || r.username || '';
          if (!un || un === 'User' || un === 'Guest') un = 'Anonim';
          const uPhoto = u.photoURL || r.photoURL || '';
          const vB = getVerifiedBadge(u.followerCount || 0) + getCreatorVerifiedBadge(u);
          return `<div class="rating-display user-rating" title="${un} kasih ${r.rating} bintang">
            <img src="${uPhoto || 'https://ui-avatars.com/api/?name='+encodeURIComponent(un)}" class="w-4 h-4 rounded-full">
            <span class="text-xs text-slate-300">${un}${vB}</span>
            <span class="text-amber-400 font-bold">${r.rating}★</span>
          </div>`;
        }).join('')}
      </div>`;
  });
  
  onSnapshot(query(commentsRef, orderBy('createdAt', 'desc')), (snap) => {
    const div = document.getElementById('commentsList');
    if (!div) return;
    const arr = []; snap.forEach(d => arr.push({ id: d.id, ...d.data() }));
    const parents = arr.filter(c => !c.parentId);
    const replies = arr.filter(c => c.parentId);
    if (parents.length === 0) { div.innerHTML = '<p class="text-slate-500 text-sm">Belum ada komentar.</p>'; return; }
    div.innerHTML = parents.map(c => {
      const cReps = replies.filter(r => r.parentId === c.id);
      const isOwnComment = currentUser && c.userId === currentUser.uid;
      const canDelete = isOwnComment || isAdminUser(userProfile);
      const u = usersCache[c.userId] || {};
      const vB = getVerifiedBadge(u.followerCount || 0) + getCreatorVerifiedBadge(u);
      return `<div class="comment-card rounded-xl p-3 card-anim" data-commentid="${c.id}">
        <div class="flex items-start gap-2">
          <img src="${c.photoURL || 'https://ui-avatars.com/api/?name='+encodeURIComponent(c.username||'U')}" class="w-8 h-8 rounded-full cursor-pointer hover:scale-110 transition" onclick="window.location.hash='user/${c.userId}'">
          <div class="flex-1">
            <div class="flex items-center gap-2 text-xs mb-1 flex-wrap">
              <span class="${isGolden(c.userLevel) ? 'gold-glow font-bold' : 'text-slate-300 font-semibold'} cursor-pointer" onclick="window.location.hash='user/${c.userId}'">${c.username || 'Anonim'}${vB}</span>
              ${isGolden(c.userLevel) ? '<i class="fas fa-crown text-amber-400 text-xs"></i>' : ''}
              <span class="text-slate-500">Lv.${c.userLevel || 1}</span>
              ${buildUserTags(u, c.userId)}
              <span class="text-slate-500">• ${fmtDate(c.createdAt)}</span>
              ${c.edited ? '<span class="text-slate-500 text-xs italic">(diedit)</span>' : ''}
            </div>
            <div id="comment-text-${c.id}" class="text-sm">${sensor(c.text || '')}</div>
            <div class="flex items-center gap-3 mt-2 text-xs">
              <button onclick="likeComment('${novelId}','${currentChapter.id}','${c.id}')" class="text-slate-400 hover:text-red-400 transition"><i class="fas fa-heart"></i> ${c.likes || 0}</button>
              <button onclick="showReplyInput('${c.id}')" class="text-slate-400 hover:text-amber-400 transition"><i class="fas fa-reply"></i> Balas</button>
              ${isOwnComment ? `<button onclick="editComment('${novelId}','${currentChapter.id}','${c.id}')" class="text-blue-400 hover:text-blue-300 transition"><i class="fas fa-edit"></i> Edit</button>` : ''}
              ${canDelete ? `<button onclick="deleteComment('${novelId}','${currentChapter.id}','${c.id}')" class="text-red-400 hover:text-red-300 transition"><i class="fas fa-trash"></i> Hapus</button>` : ''}
            </div>
            <div id="reply-input-${c.id}" class="hidden mt-2 flex gap-2"><input type="text" id="reply-text-${c.id}" placeholder="Balasan..." class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-xs"><button onclick="submitReply('${novelId}','${currentChapter.id}','${c.id}')" class="bg-amber-500 text-black px-3 py-1.5 rounded-lg text-xs font-bold">Kirim</button></div>
            ${cReps.length > 0 ? `<div class="mt-3 space-y-2">${cReps.map(r => {
              const ru = usersCache[r.userId] || {};
              const rvB = getVerifiedBadge(ru.followerCount || 0) + getCreatorVerifiedBadge(ru);
              return `<div class="reply-indent">
                <div class="flex items-start gap-2">
                  <img src="${r.photoURL || 'https://ui-avatars.com/api/?name='+encodeURIComponent(r.username||'U')}" class="w-6 h-6 rounded-full">
                  <div><span class="${isGolden(r.userLevel) ? 'gold-glow font-bold' : 'text-slate-300'} text-xs">${r.username}${rvB}</span> ${buildUserTags(ru, r.userId)}<p class="text-xs">${sensor(r.text || '')}</p></div>
                </div>
              </div>`;
            }).join('')}</div>` : ''}
          </div>
        </div>
      </div>`;
    }).join('');
  });
  
  let selRating = 0;
  document.querySelectorAll('#ratingStars .star-rating').forEach(s => s.onclick = () => {
    selRating = parseInt(s.dataset.star);
    document.querySelectorAll('#ratingStars .star-rating').forEach((x, i) => { x.classList.toggle('text-amber-400', i < selRating); x.classList.toggle('text-slate-600', i >= selRating); });
    s.classList.add('star-pop');
    setTimeout(() => s.classList.remove('star-pop'), 300);
    document.getElementById('ratingText').textContent = selRating + ' bintang';
  });
  document.getElementById('submitComment').onclick = async () => {
    if (!currentUser || !userProfile) { showToast('Login dulu'); return; }
    const text = document.getElementById('commentInput').value.trim();
    if (!text && selRating === 0) { showToast('Tulis komentar/rating'); return; }
    const uname = userProfile.username || currentUser.displayName || 'User';
    const uphoto = userProfile.photoURL || currentUser.photoURL || '';
    if (text) {
      await addDoc(commentsRef, { userId: currentUser.uid, username: uname, photoURL: uphoto, userLevel: userProfile.level || 1, isAdmin: isAdminUser(userProfile), isPenulis: hasRole(userProfile, 'penulis'), isKomikus: hasRole(userProfile, 'komikus'), text: sensor(text), likes: 0, parentId: null, edited: false, createdAt: serverTimestamp() });
      await addExp(EXP_PER_COMMENT);
    }
    if (selRating > 0) {
      await setDoc(doc(db, 'works', novelId, 'chapters', currentChapter.id, 'ratings', currentUser.uid), { userId: currentUser.uid, rating: selRating, username: uname, photoURL: uphoto, createdAt: serverTimestamp() });
      await recalcWorkRating(novelId);
    }
    document.getElementById('commentInput').value = ''; selRating = 0;
    document.querySelectorAll('#ratingStars .star-rating').forEach(s => { s.classList.remove('text-amber-400'); s.classList.add('text-slate-600'); });
    document.getElementById('ratingText').textContent = 'Pilih';
    showToast('Terkirim');
  };
}

async function recalcWorkRating(workId) {
  const cs = await getDocs(collection(db, 'works', workId, 'chapters'));
  let total = 0, count = 0;
  for (const ch of cs.docs) {
    const rs = await getDocs(collection(db, 'works', workId, 'chapters', ch.id, 'ratings'));
    rs.forEach(r => { total += r.data().rating || 0; count++; });
  }
  await updateDoc(doc(db, 'works', workId), { avgRating: count > 0 ? total/count : 0, ratingCount: count, updatedAt: serverTimestamp() });
}

window.deleteChapterFromReader = async (wid,cid,num) => {
  if (!confirm(`Hapus ${num}?`)) return;
  try {
    const cs = await getDocs(collection(db,'works',wid,'chapters',cid,'comments'));
    for (const c of cs.docs) await deleteDoc(doc(db,'works',wid,'chapters',cid,'comments',c.id));
    const rs = await getDocs(collection(db,'works',wid,'chapters',cid,'ratings'));
    for (const r of rs.docs) await deleteDoc(doc(db,'works',wid,'chapters',cid,'ratings',r.id));
    await deleteDoc(doc(db,'works',wid,'chapters',cid));
    showToast('Dihapus'); window.location.hash = 'reader/' + wid;

async function renderChat(container) {
  container.innerHTML = `
    <h2 class="text-2xl font-bold mb-4"><i class="fas fa-comments text-amber-400 mr-2"></i>Chat Publik</h2>
    <div class="card-bg rounded-2xl p-4 h-[65vh] flex flex-col card-anim">
      <div id="chatMessages" class="flex-1 overflow-y-auto scrollbar-thin space-y-3 mb-3 p-2"></div>
      <div id="publicReplyPreview"></div>
      <div id="publicImgPreview"></div>
      <div class="flex gap-2 items-center mt-2">
        <label class="chat-img-send-btn" title="Kirim gambar"><i class="fas fa-image text-lg"></i><input type="file" id="publicImgInput" accept="image/*"></label>
        <input id="chatInput" type="text" placeholder="Tulis pesan..." class="flex-1 bg-slate-800 border border-slate-700 rounded-full px-4 py-2 text-sm focus:border-amber-500 transition">
        <button id="sendChat" class="bg-amber-500 text-black px-5 py-2 rounded-full font-bold text-sm hover:scale-105 transition"><i class="fas fa-paper-plane"></i></button>
      </div>
    </div>`;
  const messagesDiv = document.getElementById('chatMessages');
  const input = document.getElementById('chatInput');
  const sendBtn = document.getElementById('sendChat');
  let rawMessages = [];
  let lastId = null;
  chatUnsub = onSnapshot(query(collection(db,'chats'), orderBy('createdAt','asc'), limit(100)), snapshot => {
    rawMessages = []; snapshot.forEach(d => rawMessages.push({ id: d.id, ...d.data() }));
    renderMsgs();
  });
  chatUsersUnsub = onSnapshot(collection(db,'users'), snap => {
    usersCache = {}; snap.forEach(d => usersCache[d.id] = { id: d.id, ...d.data() });
    renderMsgs();
  });
  onSnapshot(collection(db,'clans'), snap => {
    clansCache = {}; snap.forEach(d => clansCache[d.id] = { id: d.id, ...d.data() });
    renderMsgs();
  });
  function renderMsgs() {
    if (rawMessages.length === 0) { messagesDiv.innerHTML = '<p class="text-slate-500 text-sm text-center">Belum ada pesan.</p>'; return; }
    const lastMsg = rawMessages[rawMessages.length - 1];
    const isNew = lastId && lastMsg.id !== lastId;
    messagesDiv.innerHTML = rawMessages.map((msg, idx) => {
      const u = usersCache[msg.userId] || {};
      const un = u.username || msg.username || 'Anonim';
      const pu = u.photoURL || msg.photoURL || '';
      const ul = u.level || 1;
      const roles = u.roles || (u.role ? [u.role] : ['pembaca']);
      const isO = roles.includes('owner'), isA = roles.includes('admin'), isP = roles.includes('penulis'), isK = roles.includes('komikus'), isPc = roles.includes('pembaca');
      const isG = ul > 1000;
      const vB = getVerifiedBadge(u.followerCount || 0) + getCreatorVerifiedBadge(u);
      const own = msg.userId === currentUser?.uid;
      const clanId = u.clanId;
      const clan = clanId ? clansCache[clanId] : null;
      const isClanOwner = clan && clan.leader === u.uid;
      const isClanAdminMsg = clan && (clan.admins || []).includes(u.uid);
      let bc = 'pembaca-chat-border';
      if (isO) bc = 'owner-chat-border';
      else if (isA) bc = 'admin-chat-border';
      else if (clan) bc = 'clan-chat-border';
      else if (isP) bc = 'penulis-chat-border';
      else if (isK) bc = 'komikus-chat-border';
      const isImgOnly = msg.image && !msg.text;
      if (own) bc += ' bg-amber-500/20';
      if (isImgOnly) bc = 'chat-img-msg';
      const isLast = idx === rawMessages.length - 1;
      const anim = isLast && isNew ? (own ? 'chat-msg-new-own' : 'chat-msg-new') : '';
      let tagsHtml = '';
      if (isO) tagsHtml += '<span class="owner-tag">👑 OWNER</span> ';
      if (isA) tagsHtml += '<span class="admin-tag">ADMIN</span> ';
      if (isP) tagsHtml += '<span class="penulis-tag">PENULIS</span> ';
      if (isK) tagsHtml += '<span class="komikus-tag">KOMIKUS</span> ';
      if (isPc) tagsHtml += '<span class="pembaca-tag">PEMBACA</span> ';
      if (clan) {
        if (isClanOwner) tagsHtml += `<span class="clan-owner-tag cursor-pointer" onclick="event.stopPropagation();window.location.hash='clan/${clan.id}'">👑 ${clan.name}</span> `;
        else if (isClanAdminMsg) tagsHtml += `<span class="clan-admin-tag cursor-pointer" onclick="event.stopPropagation();window.location.hash='clan/${clan.id}'">⚔️ ${clan.name}</span> `;
        else tagsHtml += `<span class="clan-tag cursor-pointer" onclick="event.stopPropagation();window.location.hash='clan/${clan.id}'">${clan.name}</span> `;
      }
      let replyPreview = '';
      if (msg.replyTo && msg.replyToText) {
        replyPreview = `<div class="reply-preview"><i class="fas fa-reply text-amber-400 mr-1"></i><b class="text-amber-400">${msg.replyToName || 'Anonim'}:</b> ${sensor(msg.replyToText).slice(0, 80)}</div>`;
      }
      return `<div class="flex items-start gap-2 ${own ? 'justify-end' : ''} group ${anim}" data-publicmsgid="${msg.id}">
        ${!own ? `<img src="${pu || 'https://ui-avatars.com/api/?name='+encodeURIComponent(un)}" class="w-8 h-8 rounded-full cursor-pointer hover:scale-110 transition" onclick="window.location.hash='user/${msg.userId}'">` : ''}
        <div class="max-w-[75%] rounded-2xl px-3 py-2 ${bc}">
          ${!isImgOnly ? `<div class="flex items-center gap-1 flex-wrap text-xs mb-1">
            <span class="${isG ? 'gold-glow font-bold' : 'text-slate-300 font-semibold'} cursor-pointer hover:underline" onclick="window.location.hash='user/${msg.userId}'">${un}${vB}</span>
            ${isG ? '<i class="fas fa-crown text-amber-400 text-xs"></i>' : ''}
            ${tagsHtml}
            <span class="text-slate-500">Lv.${ul}</span>
            ${msg.edited ? '<span class="text-slate-500 text-xs italic">(diedit)</span>' : ''}
          </div>` : ''}
          ${replyPreview}
          ${msg.image ? `<img src="${msg.image}" class="chat-img" onclick="window.showImgFullscreen('${escAttr(msg.image)}','Gambar dari ${escAttr(un)}')">` : ''}
          ${msg.text ? `<div id="pubmt-${msg.id}" class="text-sm ${msg.image ? 'mt-1' : ''}">${sensor(msg.text || '')}</div>` : `<div id="pubmt-${msg.id}" class="hidden"></div>`}
          <div class="flex gap-2 mt-1 text-xs">
            <button onclick="replyPubMsg('${msg.id}')" class="text-slate-400 hover:text-green-400 transition opacity-0 group-hover:opacity-100"><i class="fas fa-reply"></i> Balas</button>
            ${own ? `
              ${!msg.image ? `<button onclick="editPubMsg('${msg.id}')" class="text-blue-400 hover:text-blue-300 transition opacity-0 group-hover:opacity-100"><i class="fas fa-edit"></i> Edit</button>` : ''}
              <button onclick="delPubMsg('${msg.id}')" class="text-red-400 hover:text-red-300 transition opacity-0 group-hover:opacity-100"><i class="fas fa-trash"></i> Hapus</button>
            ` : ''}
          </div>
        </div>
        ${own ? `<img src="${pu || 'https://ui-avatars.com/api/?name='+encodeURIComponent(un)}" class="w-8 h-8 rounded-full">` : ''}
      </div>`;
    }).join('');
    lastId = lastMsg.id;
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }
  
  const pubImgInput = document.getElementById('publicImgInput');
  const pubImgPreview = document.getElementById('publicImgPreview');
  pubImgInput.onchange = async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    pubImgPreview.innerHTML = '<p class="text-xs text-amber-400 mb-2">Mengupload...</p>';
    try {
      const dataUrl = await compressImage(f);
      pendingChatImg.public = dataUrl;
      pubImgPreview.innerHTML = `<div class="chat-img-preview"><img src="${dataUrl}"><span class="remove-btn" onclick="event.stopPropagation();window.cancelChatImg('public')">×</span></div>`;
    } catch (err) { pubImgPreview.innerHTML = `<p class="text-xs text-red-400 mb-1">Gagal: ${err.message}</p>`; }
    pubImgInput.value = '';
  };
  
  sendBtn.onclick = async () => {
    const text = input.value.trim();
    const img = pendingChatImg.public;
    if ((!text && !img) || !currentUser) { showToast('Login dulu'); return; }
    const msgData = {
      userId: currentUser.uid, username: userProfile.username || 'Guest',
      photoURL: userProfile.photoURL || '', userLevel: userProfile.level || 1,
      isAdmin: isAdminUser(userProfile), isPenulis: hasRole(userProfile,'penulis'), isKomikus: hasRole(userProfile,'komikus'),
      text: text ? sensor(text) : '', edited: false, createdAt: serverTimestamp()
    };
    if (img) msgData.image = img;
    if (replyingToPublic) { msgData.replyTo = replyingToPublic.id; msgData.replyToText = replyingToPublic.text || (replyingToPublic.image ? '🖼️ Gambar' : ''); msgData.replyToName = replyingToPublic.username; }
    await addDoc(collection(db,'chats'), msgData);
    input.value = '';
    replyingToPublic = null;
    pendingChatImg.public = null;
    document.getElementById('publicReplyPreview').innerHTML = '';
    document.getElementById('publicImgPreview').innerHTML = '';
    await addExp(EXP_PER_CHAT);
  };
  input.addEventListener('keypress', e => { if (e.key === 'Enter') sendBtn.click(); });
}
window.replyPubMsg = (msgId) => {
  const el = document.querySelector(`[data-publicmsgid="${msgId}"]`);
  if (!el) return;
  const text = el.querySelector(`#pubmt-${msgId}`)?.textContent || '';
  const username = el.querySelector('span.font-semibold, span.gold-glow')?.textContent || 'Anonim';
  const img = el.querySelector('.chat-img')?.src || '';
  replyingToPublic = { id: msgId, text, username, image: img };
  const preview = img ? '🖼️ Gambar' : `${text.slice(0, 60)}${text.length > 60 ? '...' : ''}`;
  document.getElementById('publicReplyPreview').innerHTML = `
    <div class="flex items-center justify-between bg-amber-500/10 border-l-2 border-amber-500 rounded px-3 py-2 mb-2">
      <div class="text-xs"><i class="fas fa-reply text-amber-400 mr-2"></i><b class="text-amber-400">${username}:</b> <span class="text-slate-300">${preview}</span></div>
      <button onclick="cancelReplyPub()" class="text-red-400 hover:text-red-300 text-lg">&times;</button>
    </div>`;
  document.getElementById('chatInput')?.focus();
};
window.cancelReplyPub = () => { replyingToPublic = null; document.getElementById('publicReplyPreview').innerHTML = ''; };
window.editPubMsg = async (id) => {
  const ref = doc(db,'chats',id); const s = await getDoc(ref);
  if (!s.exists() || s.data().userId !== currentUser.uid) return;
  const orig = s.data().text || '';
  const el = document.getElementById('pubmt-'+id);
  if (!el) return;
  el.classList.remove('hidden');
  el.innerHTML = `<textarea id="pubet-${id}" rows="2" class="chat-edit-input">${orig}</textarea><div class="flex gap-2 mt-1"><button onclick="savePubMsg('${id}')" class="bg-green-600 text-white px-3 py-1 rounded text-xs font-bold">Simpan</button><button onclick="cancelPubEdit('${id}', '${escAttr(orig)}')" class="bg-slate-600 text-white px-3 py-1 rounded text-xs font-bold">Batal</button></div>`;
};
window.savePubMsg = async (id) => {
  const t = document.getElementById('pubet-'+id).value.trim();
  if (!t) return;
  await updateDoc(doc(db,'chats',id), { text: sensor(t), edited: true, updatedAt: serverTimestamp() });
};
window.cancelPubEdit = (id, orig) => { const el = document.getElementById('pubmt-'+id); if (el) el.textContent = orig; };
window.delPubMsg = async (id) => {
  const r = doc(db,'chats',id); const s = await getDoc(r);
  if (!s.exists() || s.data().userId !== currentUser.uid) return;
  if (!confirm('Hapus?')) return;
  await deleteDoc(r); showToast('Dihapus');
};

          <div><label class="block text-xs font-semibold mb-1 text-sky-400"><i class="fab fa-twitter mr-1"></i>Twitter/X</label><input id="sm_twitter" type="url" value="${sosmed.twitter || ''}" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm"></div>
          <div><label class="block text-xs font-semibold mb-1 text-red-500"><i class="fab fa-youtube mr-1"></i>YouTube</label><input id="sm_youtube" type="url" value="${sosmed.youtube || ''}" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm"></div>
          <div><label class="block text-xs font-semibold mb-1 text-slate-300"><i class="fas fa-globe mr-1"></i>Website</label><input id="sm_website" type="url" value="${sosmed.website || ''}" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm"></div>
          <button id="saveSosmedBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-full transition">Simpan Link Sosmed</button>
        </div>
      </div>` : ''}
    </div>`;
  document.getElementById('saveProfile').onclick = async () => {
    const nu = document.getElementById('profileUsername').value.trim();
    const nb = document.getElementById('profileBio').value.trim();
    const nbd = document.getElementById('profileBirthday').value.trim();
    let bdayMMDD = '';
    if (nbd) {
      const parts = nbd.split('-');
      if (parts.length === 2) {
        const dd = parseInt(parts[0], 10);
        const mm = parseInt(parts[1], 10);
        if (dd >= 1 && dd <= 31 && mm >= 1 && mm <= 12) {
          bdayMMDD = String(mm).padStart(2,'0') + '-' + String(dd).padStart(2,'0');
        } else { showToast('Format tanggal lahir tidak valid (DD-MM)'); return; }
      } else { showToast('Format: DD-MM (contoh: 17-08)'); return; }
    }
    await updateDoc(doc(db,'users',currentUser.uid), { username: nu || userProfile.username, bio: nb, birthday: bdayMMDD, updatedAt: serverTimestamp() });
    userProfile.username = nu || userProfile.username;
    userProfile.bio = nb;
    userProfile.birthday = bdayMMDD;
    showToast('Profil disimpan!'); renderPage();
  };
  if (document.getElementById('saveSosmedBtn')) {
    document.getElementById('saveSosmedBtn').onclick = async () => {
      const newSosmed = {
        saweria: document.getElementById('sm_saweria').value.trim(),
        trakteer: document.getElementById('sm_trakteer').value.trim(),
        facebook: document.getElementById('sm_facebook').value.trim(),
        tiktok: document.getElementById('sm_tiktok').value.trim(),
        instagram: document.getElementById('sm_instagram').value.trim(),
        threads: document.getElementById('sm_threads').value.trim(),
        twitter: document.getElementById('sm_twitter').value.trim(),
        youtube: document.getElementById('sm_youtube').value.trim(),
        website: document.getElementById('sm_website').value.trim()
      };
      await updateDoc(doc(db, 'users', currentUser.uid), { sosmed: newSosmed, updatedAt: serverTimestamp() });
      userProfile.sosmed = newSosmed;
      showToast('Link sosmed disimpan!'); renderPage();
    };
  }
  document.getElementById('linkGoogle')?.addEventListener('click', signInWithGoogle);
  document.getElementById('logoutBtn').onclick = logout;
}

          const newContent = document.getElementById('editChContent').value.trim();
          if (!newTitle) { showToast('Judul wajib!'); return; }
          if (!newContent) { showToast('Isi wajib!'); return; }
          await updateDoc(doc(db, 'works', wid, 'chapters', cid), { title: newTitle, content: newContent, ...extra, updatedAt: serverTimestamp() });
        } else {
          const existingImages = window[`_existing_${cid}_images`] || ch.images || [];
          const newImages = getMultiImages('editAdd-' + cid);
          const finalImages = [...existingImages, ...newImages];
          await updateDoc(doc(db, 'works', wid, 'chapters', cid), { title: newTitle, ...extra, images: finalImages, coverImage: finalImages[0] || '', updatedAt: serverTimestamp() });
          if (finalImages.length > 0) {
            const workRef = doc(db, 'works', wid);
            const workSnap = await getDoc(workRef);
            if (workSnap.exists()) { const w = workSnap.data(); if (!w.coverURL || w.coverURL === '') await updateDoc(workRef, { coverURL: finalImages[0] }); }
          }
        }
        showToast('Tersimpan!'); close(); loadManage();
      };
    });
    list.querySelectorAll('.subC').forEach(b => b.onclick = async () => {
      const wid = b.dataset.wid, sid = b.dataset.sid, type = b.dataset.type;
      const t = document.getElementById('ct-' + sid).value.trim();
      const cs = await getDocs(collection(db,'works',wid,'chapters'));
      const next = cs.docs.reduce((m, d) => Math.max(m, Number(d.data().number) || 0), 0) + 1;
      const groupId = document.getElementById('cg-' + sid)?.value || '';
      if (type === 'novel') {
        const c = document.getElementById('cc-' + sid).value.trim();
        if (!t) { showToast('Judul wajib'); return; }
        if (!c) { showToast('Isi wajib'); return; }
        await addDoc(collection(db,'works',wid,'chapters'), { number: next, title: t, content: c, images: [], groupId, createdAt: serverTimestamp() });
      } else {
        const images = getMultiImages('mi-' + sid);
        if (images.length === 0) { showToast('Pilih minimal 1 gambar'); return; }
        await addDoc(collection(db,'works',wid,'chapters'), { number: next, title: t, content: '', images: images, coverImage: images[0], groupId, createdAt: serverTimestamp() });
        const workRef = doc(db, 'works', wid);
        const workSnap = await getDoc(workRef);
        if (workSnap.exists()) { const w = workSnap.data(); if (!w.coverURL || w.coverURL === '') await updateDoc(workRef, { coverURL: images[0] }); }
      }
      showToast('Ditambahkan'); loadManage();
    });
  }
  document.getElementById('creatorTabUpload').onclick = loadUploadForm;
  document.getElementById('creatorTabManage').onclick = loadManage;
  loadManage();
}

async function renderMgRoom(container, roomId) {
  const roomSnap = await getDoc(doc(db, 'mg_rooms', roomId));
  if (!roomSnap.exists()) { showToast('Room tidak ditemukan'); window.location.hash = 'minigame'; renderPage(); return; }
  const room = { id: roomSnap.id, ...roomSnap.data() };
  mgCurrentRoom = room;

  // Setup listeners
  if (mgUnsubRoom) { try { mgUnsubRoom(); } catch(e){} mgUnsubRoom = null; }
  if (mgUnsubGuesses) { try { mgUnsubGuesses(); } catch(e){} mgUnsubGuesses = null; }

  mgUnsubRoom = onSnapshot(doc(db, 'mg_rooms', roomId), (snap) => {
    if (!snap.exists()) { window.location.hash = 'minigame'; renderPage(); return; }
    const r = { id: snap.id, ...snap.data() };
    mgCurrentRoom = r;
    // Cek apakah player masih di room
    if (!r.players.includes(currentUser.uid)) {
      if (mgUnsubRoom) { mgUnsubRoom(); mgUnsubRoom = null; }
      showToast('Kamu telah keluar dari room');
      window.location.hash = 'minigame'; renderPage();
      return;
    }
    // Update UI berdasarkan status
    if (r.status === 'waiting') {
      renderMgWaiting(r);
    } else if (r.status === 'playing') {
      renderMgPlaying(r);
    } else if (r.status === 'finished') {
      renderMgFinished(r);
    }
  });

  // Initial render based on current state
  if (room.status === 'waiting') renderMgWaiting(room);
  else if (room.status === 'playing') renderMgPlaying(room);
  else renderMgFinished(room);
}

                      <span class="text-amber-400 font-bold text-xs">${sc}</span>
                    </div>
                  </div>`;
                }).join('')}
              </div>
            </div>

            <div class="card-bg rounded-2xl p-4">
              <h3 class="font-bold text-sm text-amber-400 mb-2"><i class="fas fa-comments mr-1"></i>Log Tebakan</h3>
              <div id="mgGuessLog" class="mg-guess-log"></div>
            </div>

            ${!isDrawer ? `
            <div class="card-bg rounded-2xl p-4">
              <h3 class="font-bold text-sm text-amber-400 mb-2"><i class="fas fa-lightbulb mr-1"></i>Tebak Jawaban</h3>

              <div class="flex gap-2">
                <input id="mgGuessInput" type="text" placeholder="Ketik tebakanmu..." class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:border-green-500 transition" ${room.roundStatus !== 'drawing' ? 'disabled' : ''}>
                <button id="mgGuessBtn" class="bg-green-600 text-white px-4 py-2 rounded-xl font-bold text-sm hover:scale-105 transition" ${room.roundStatus !== 'drawing' ? 'disabled' : ''}><i class="fas fa-paper-plane"></i></button>
              </div>
            </div>
            ` : `
            <div class="card-bg rounded-2xl p-4">
              <h3 class="font-bold text-sm text-amber-400 mb-2"><i class="fas fa-check-circle mr-1"></i>Beri Respon</h3>
              <p class="text-xs text-slate-400 mb-2">Jawaban: <b class="text-green-400">${room.word}</b></p>
              <div class="grid grid-cols-3 gap-2">
                <button onclick="window.mgDrawerRespond('${room.id}','benar')" class="bg-green-600 text-white py-2 rounded-lg text-xs font-bold hover:scale-105 transition ${room.roundStatus !== 'drawing' ? 'opacity-50' : ''}" ${room.roundStatus !== 'drawing' ? 'disabled' : ''}>✅ Benar</button>
                <button onclick="window.mgDrawerRespond('${room.id}','kurang')" class="bg-amber-600 text-white py-2 rounded-lg text-xs font-bold hover:scale-105 transition ${room.roundStatus !== 'drawing' ? 'opacity-50' : ''}" ${room.roundStatus !== 'drawing' ? 'disabled' : ''}>🟡 Kurang Tepat</button>
                <button onclick="window.mgDrawerRespond('${room.id}','salah')" class="bg-red-600 text-white py-2 rounded-lg text-xs font-bold hover:scale-105 transition ${room.roundStatus !== 'drawing' ? 'opacity-50' : ''}" ${room.roundStatus !== 'drawing' ? 'disabled' : ''}>❌ Salah</button>
              </div>
            </div>
            `}
          </div>
        </div>
      </div>`;

    // Setup canvas
    setTimeout(() => initMgCanvas(room, isDrawer), 100);
    // Setup timer
    if (mgTimerInterval) clearInterval(mgTimerInterval);
    mgTimerInterval = setInterval(() => updateMgTimer(room), 1000);
    updateMgTimer(room);
    // Render log
    renderMgGuessLog(room);
  } else {
    // Update hanya timer & log
    updateMgTimer(room);
    renderMgGuessLog(room);
    // Update skor
    const scoreContainer = document.querySelector('#mgGameArea .card-bg .space-y-2');
    if (scoreContainer) {
      scoreContainer.innerHTML = players.map(pid => {
        const pName = room.playerNames?.[pid] || 'Player';
        const pPhoto = room.playerPhotos?.[pid] || '';
        const sc = scores[pid] || 0;
        const isDrawerP = pid === room.drawerId;
        return `<div class="mg-player-chip ${isDrawerP ? 'drawer' : (pid === currentUser.uid ? 'active' : '')} w-full justify-between">
          <div class="flex items-center gap-2 min-w-0">
            <img src="${pPhoto || 'https://ui-avatars.com/api/?name='+encodeURIComponent(pName)}" class="w-6 h-6 rounded-full">
            <span class="truncate text-xs">${pName}${pid === currentUser.uid ? ' (Kamu)' : ''}</span>
          </div>
          <div class="flex items-center gap-1">
            ${isDrawerP ? '<i class="fas fa-paint-brush text-green-400 text-xs"></i>' : ''}
            <span class="text-amber-400 font-bold text-xs">${sc}</span>
          </div>
        </div>`;
      }).join('');
    }
  }
}

function updateMgTimer(room) {
  const timerEl = document.getElementById('mgTimerDisplay');
  if (!timerEl) return;
  const now = Date.now();
  const timeLeft = Math.max(0, Math.floor((room.endTime - now) / 1000));
  const mins = Math.floor(timeLeft / 60);
  const secs = timeLeft % 60;
  timerEl.textContent = `${mins}:${String(secs).padStart(2,'0')}`;
  timerEl.classList.toggle('warning', timeLeft <= 120);
  if (timeLeft <= 0) {
    if (mgTimerInterval) { clearInterval(mgTimerInterval); mgTimerInterval = null; }
    // Waktu habis — penggambar tidak berhasil
    if (room.status === 'playing') {
      window.mgTimeUp(room.id);
    }
  }
}

function renderMgGuessLog(room) {
  const logEl = document.getElementById('mgGuessLog');
  if (!logEl) return;
  const log = room.guessLog || [];
  logEl.innerHTML = log.slice(-30).map(l => {
    const time = new Date(l.at || Date.now()).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
    let cls = 'info';
    if (l.type === 'correct') cls = 'correct';
    else if (l.type === 'wrong') cls = 'wrong';
    else if (l.type === 'close') cls = 'close';
    else if (l.type === 'system') cls = 'system';
    return `<div class="${cls} mb-1">[${time}] ${l.text}</div>`;
  }).join('');
  logEl.scrollTop = logEl.scrollHeight;
}

function initMgCanvas(room, isDrawer) {
  const canvas = document.getElementById('mgCanvas');
  if (!canvas) return;
  mgCanvas = canvas;
  mgCtx = canvas.getContext('2d');
  mgCtx.lineCap = 'round';
  mgCtx.lineJoin = 'round';

  // Load canvas dari data tersimpan
  if (room.canvasData && room.canvasData.startsWith('data:image')) {
    const img = new Image();
    img.onload = () => {
      mgCtx.drawImage(img, 0, 0, canvas.width, canvas.height);
      mgDrawingHistory.push(canvas.toDataURL());
      mgHistoryIndex = 0;
    };
    img.src = room.canvasData;
  } else {
    mgCtx.fillStyle = '#ffffff';
    mgCtx.fillRect(0, 0, canvas.width, canvas.height);
    mgDrawingHistory = [canvas.toDataURL()];
    mgHistoryIndex = 0;
  }

  if (!isDrawer) {
    canvas.style.cursor = 'default';
    return;
  }

  // Warna
  const colors = ['#000000','#ffffff','#ef4444','#f97316','#fbbf24','#10b981','#3b82f6','#8b5cf6','#ec4899','#78716c','#0ea5e9','#84cc16'];
  const colorsDiv = document.getElementById('mgColors');
  if (colorsDiv) {
    colorsDiv.innerHTML = colors.map(c => `<div class="mg-color-swatch ${c === '#000000' ? 'active' : ''}" style="background:${c}" data-color="${c}"></div>`).join('');
    colorsDiv.querySelectorAll('.mg-color-swatch').forEach(sw => {
      sw.onclick = () => {
        mgBrushColor = sw.dataset.color;
        colorsDiv.querySelectorAll('.mg-color-swatch').forEach(s => s.classList.remove('active'));
        sw.classList.add('active');
      };
    });
  }

  // Tool buttons
  document.querySelectorAll('.mg-tool-btn[data-tool]').forEach(btn => {
    btn.onclick = () => {
      mgTool = btn.dataset.tool;
      document.querySelectorAll('.mg-tool-btn[data-tool]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    };
  });

  // Brush size
  const sizeInput = document.getElementById('mgBrushSize');
  const sizeLabel = document.getElementById('mgBrushSizeLabel');
  if (sizeInput) {
    sizeInput.oninput = () => {
      mgBrushSize = parseInt(sizeInput.value);
      sizeLabel.textContent = mgBrushSize + 'px';
    };
  }

  // Drawing events
  let lastX = 0, lastY = 0;
  let startX = 0, startY = 0;
  let snapshot = null;

  const getPos = (e) => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      x: (clientX - rect.left) * scaleX,
      y: (clientY - rect.top) * scaleY
    };
  };

  const startDraw = (e) => {
    e.preventDefault();
    if (mgTool === 'fill') {
      const pos = getPos(e);
      floodFill(pos.x, pos.y, mgBrushColor);
      pushHistory();
      mgLastDrawTime = Date.now();
      syncCanvas(room.id);
      return;
    }
    mgDrawing = true;
    const pos = getPos(e);
    lastX = pos.x; lastY = pos.y;
    startX = pos.x; startY = pos.y;
    snapshot = mgCtx.getImageData(0, 0, canvas.width, canvas.height);
    if (mgTool === 'brush') {
      mgCtx.globalCompositeOperation = 'source-over';
      mgCtx.strokeStyle = mgBrushColor;
      mgCtx.lineWidth = mgBrushSize;
      mgCtx.beginPath();
      mgCtx.moveTo(lastX, lastY);
      mgCtx.lineTo(lastX + 0.1, lastY + 0.1);
      mgCtx.stroke();
    }
  };

  const draw = (e) => {
    if (!mgDrawing) return;
    e.preventDefault();
    const pos = getPos(e);
    if (mgTool === 'brush' || mgTool === 'eraser') {
      mgCtx.globalCompositeOperation = mgTool === 'eraser' ? 'destination-out' : 'source-over';
      mgCtx.strokeStyle = mgTool === 'eraser' ? 'rgba(0,0,0,1)' : mgBrushColor;
      mgCtx.lineWidth = mgTool === 'eraser' ? mgBrushSize * 2 : mgBrushSize;
      mgCtx.beginPath();
      mgCtx.moveTo(lastX, lastY);
      mgCtx.lineTo(pos.x, pos.y);
      mgCtx.stroke();
      lastX = pos.x; lastY = pos.y;
    } else if (mgTool === 'line') {
      mgCtx.putImageData(snapshot, 0, 0);
      mgCtx.globalCompositeOperation = 'source-over';
      mgCtx.strokeStyle = mgBrushColor;
      mgCtx.lineWidth = mgBrushSize;
      mgCtx.beginPath();
      mgCtx.moveTo(startX, startY);
      mgCtx.lineTo(pos.x, pos.y);
      mgCtx.stroke();
    } else if (mgTool === 'rect') {
      mgCtx.putImageData(snapshot, 0, 0);
      mgCtx.globalCompositeOperation = 'source-over';
      mgCtx.strokeStyle = mgBrushColor;
      mgCtx.lineWidth = mgBrushSize;
      mgCtx.strokeRect(startX, startY, pos.x - startX, pos.y - startY);
    } else if (mgTool === 'circle') {
      mgCtx.putImageData(snapshot, 0, 0);
      mgCtx.globalCompositeOperation = 'source-over';
      mgCtx.strokeStyle = mgBrushColor;
      mgCtx.lineWidth = mgBrushSize;
      const rx = Math.abs(pos.x - startX) / 2;
      const ry = Math.abs(pos.y - startY) / 2;
      const cx = (pos.x + startX) / 2;
      const cy = (pos.y + startY) / 2;
      mgCtx.beginPath();
      mgCtx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
      mgCtx.stroke();
    }
  };

  const endDraw = (e) => {
    if (!mgDrawing) return;
    mgDrawing = false;
    pushHistory();
    mgLastDrawTime = Date.now();
    syncCanvas(room.id);
  };

  canvas.addEventListener('mousedown', startDraw);
  canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('mouseup', endDraw);
  canvas.addEventListener('mouseleave', endDraw);
  canvas.addEventListener('touchstart', startDraw, { passive: false });
  canvas.addEventListener('touchmove', draw, { passive: false });
  canvas.addEventListener('touchend', endDraw);

  // Undo
  document.getElementById('mgUndoBtn').onclick = () => {
    if (mgHistoryIndex > 0) {
      mgHistoryIndex--;
      const img = new Image();
      img.onload = () => {
        mgCtx.clearRect(0, 0, canvas.width, canvas.height);
        mgCtx.drawImage(img, 0, 0);
        syncCanvas(room.id);
      };
      img.src = mgDrawingHistory[mgHistoryIndex];
    }
  };

  // Clear
  document.getElementById('mgClearBtn').onclick = () => {
    if (!confirm('Hapus semua gambar?')) return;
    mgCtx.fillStyle = '#ffffff';
    mgCtx.fillRect(0, 0, canvas.width, canvas.height);
    pushHistory();
    syncCanvas(room.id);
  };
}

function pushHistory() {
  if (!mgCanvas) return;
  const data = mgCanvas.toDataURL();
  mgDrawingHistory = mgDrawingHistory.slice(0, mgHistoryIndex + 1);
  mgDrawingHistory.push(data);
  if (mgDrawingHistory.length > 30) mgDrawingHistory.shift();
  mgHistoryIndex = mgDrawingHistory.length - 1;
}

async function syncCanvas(roomId) {
  if (!mgCanvas || !roomId) return;
  const now = Date.now();
  if (now - mgLastDrawTime < 500) return; // throttle
  mgLastDrawTime = now;
  try {
    const data = mgCanvas.toDataURL('image/png');
    await updateDoc(doc(db, 'mg_rooms', roomId), { canvasData: data, updatedAt: serverTimestamp() });
  } catch (e) {}
}

function floodFill(x, y, color) {
  if (!mgCtx || !mgCanvas) return;
  const w = mgCanvas.width, h = mgCanvas.height;
  const imageData = mgCtx.getImageData(0, 0, w, h);
  const data = imageData.data;
  const px = Math.floor(x), py = Math.floor(y);
  if (px < 0 || px >= w || py < 0 || py >= h) return;
  const idx = (py * w + px) * 4;
  const targetR = data[idx], targetG = data[idx+1], targetB = data[idx+2], targetA = data[idx+3];
  const fillRGB = hexToRgb(color);
  if (!fillRGB) return;
  if (targetR === fillRGB.r && targetG === fillRGB.g && targetB === fillRGB.b && targetA === 255) return;
  const stack = [[px, py]];
  while (stack.length > 0) {
    const [cx, cy] = stack.pop();
    const ci = (cy * w + cx) * 4;
    if (cx < 0 || cx >= w || cy < 0 || cy >= h) continue;
    if (data[ci] !== targetR || data[ci+1] !== targetG || data[ci+2] !== targetB || data[ci+3] !== targetA) continue;
    data[ci] = fillRGB.r; data[ci+1] = fillRGB.g; data[ci+2] = fillRGB.b; data[ci+3] = 255;
    stack.push([cx+1, cy], [cx-1, cy], [cx, cy+1], [cx, cy-1]);
  }
  mgCtx.putImageData(imageData, 0, 0);
}

function hexToRgb(hex) {
  const m = hex.match(/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i);
  return m ? { r: parseInt(m[1],16), g: parseInt(m[2],16), b: parseInt(m[3],16) } : null;
}

// ===== GUESS SUBMISSION =====
window.mgDrawerRespond = async (roomId, type) => {
  try {
    const roomSnap = await getDoc(doc(db, 'mg_rooms', roomId));
    if (!roomSnap.exists()) return;
    const room = roomSnap.data();
    if (room.drawerId !== currentUser.uid) return;
    const log = room.guessLog || [];
    let text = '';
    if (type === 'benar') text = `✅ Benar! Jawaban: "${room.word}"`;
    else if (type === 'kurang') text = `🟡 Kurang tepat, coba lagi!`;
    else text = `❌ Salah, bukan itu!`;
    log.push({ type: type === 'benar' ? 'correct' : type === 'kurang' ? 'close' : 'wrong', text, at: Date.now() });
    const updates = { guessLog: log, updatedAt: serverTimestamp() };
    if (type === 'benar') {
      updates.roundStatus = 'correct';
      updates.status = 'finished';
      updates.endTime = Date.now();
      // Tambah skor penggambar
      const scores = room.scores || {};
      scores[currentUser.uid] = (scores[currentUser.uid] || 0) + 5;
      updates.scores = scores;
    }
    await updateDoc(doc(db, 'mg_rooms', roomId), updates);
  } catch (e) { showToast('Gagal: ' + e.message); }
};

// Setup guess input listener via event delegation
document.addEventListener('click', async (e) => {
  if (e.target && e.target.id === 'mgGuessBtn') {
    const input = document.getElementById('mgGuessInput');
    if (!input) return;
    const guess = input.value.trim().toLowerCase();
    if (!guess) return;
    if (mgGuessSubmitting) return;
    mgGuessSubmitting = true;
    try {
      const roomSnap = await getDoc(doc(db, 'mg_rooms', mgCurrentRoom?.id || ''));
      if (!roomSnap.exists()) { mgGuessSubmitting = false; return; }
      const room = roomSnap.data();
      if (room.drawerId === currentUser.uid) { showToast('Kamu penggambar, tidak bisa menebak!'); mgGuessSubmitting = false; return; }
      const log = room.guessLog || [];
      const isCorrect = guess === room.word.toLowerCase();
      log.push({
        type: isCorrect ? 'correct' : 'wrong',
        text: `${isCorrect ? '✅' : '❌'} ${userProfile.username}: "${guess}"`,
        at: Date.now()
      });
      const updates = { guessLog: log, updatedAt: serverTimestamp() };
      if (isCorrect) {
        updates.roundStatus = 'correct';
        updates.status = 'finished';
        updates.endTime = Date.now();
        const scores = room.scores || {};
        scores[currentUser.uid] = (scores[currentUser.uid] || 0) + 10;
        scores[room.drawerId] = (scores[room.drawerId] || 0) + 5;
        updates.scores = scores;
      }
      await updateDoc(doc(db, 'mg_rooms', room.id), updates);
      input.value = '';
    } catch (err) { showToast('Gagal: ' + err.message); }
    mgGuessSubmitting = false;
  }
});

document.addEventListener('keypress', async (e) => {
  if (e.target && e.target.id === 'mgGuessInput' && e.key === 'Enter') {
    document.getElementById('mgGuessBtn')?.click();
  }
});

window.mgTimeUp = async (roomId) => {
  try {
    const roomSnap = await getDoc(doc(db, 'mg_rooms', roomId));
    if (!roomSnap.exists()) return;
    const room = roomSnap.data();
    if (room.status !== 'playing') return;
    const log = room.guessLog || [];
    log.push({ type: 'system', text: '⏰ Waktu habis! Tidak ada yang menebak dengan benar.', at: Date.now() });
    await updateDoc(doc(db, 'mg_rooms', roomId), {
      status: 'finished',
      roundStatus: 'timeup',
      guessLog: log,
      endTime: Date.now(),
      updatedAt: serverTimestamp()
    });
  } catch (e) {}
};

window.mgLeaveRoom = async (roomId) => {
  try {
    const roomSnap = await getDoc(doc(db, 'mg_rooms', roomId));
    if (!roomSnap.exists()) { window.location.hash = 'minigame'; renderPage(); return; }
    const room = roomSnap.data();
    const players = (room.players || []).filter(p => p !== currentUser.uid);
    const scores = { ...(room.scores || {}) };
    delete scores[currentUser.uid];
    const playerNames = { ...(room.playerNames || {}) };
    delete playerNames[currentUser.uid];
    const playerPhotos = { ...(room.playerPhotos || {}) };
    delete playerPhotos[currentUser.uid];

    if (players.length === 0) {
      await deleteDoc(doc(db, 'mg_rooms', roomId));
    } else {
      await updateDoc(doc(db, 'mg_rooms', roomId), {
        players, scores, playerNames, playerPhotos,
        updatedAt: serverTimestamp()
      });
    }
    await updateDoc(doc(db, 'users', currentUser.uid), { mgRoomId: null });
    if (mgUnsubRoom) { mgUnsubRoom(); mgUnsubRoom = null; }
    if (mgUnsubGuesses) { mgUnsubGuesses(); mgUnsubGuesses = null; }
    if (mgTimerInterval) { clearInterval(mgTimerInterval); mgTimerInterval = null; }
    mgCurrentRoom = null; mgMyRole = null;
    showToast('Keluar dari room');
    window.location.hash = 'minigame';
    renderPage();
  } catch (e) { showToast('Gagal keluar: ' + e.message); }
};

window.mgPlayAgain = async (roomId) => {
  try {
    const roomSnap = await getDoc(doc(db, 'mg_rooms', roomId));
    if (!roomSnap.exists()) return;
    const room = roomSnap.data();
    const players = room.players || [];
    const drawerId = players[Math.floor(Math.random() * players.length)];
    const drawerName = room.playerNames?.[drawerId] || 'Player';
    const word = MG_WORD_LIST[Math.floor(Math.random() * MG_WORD_LIST.length)];
    const scores = {};
    players.forEach(p => scores[p] = 0);
    await updateDoc(doc(db, 'mg_rooms', roomId), {
      status: 'playing',
      drawerId, drawerName, word,
      currentRound: (room.currentRound || 0) + 1,
      scores,
      canvasData: '',
      drawingHistory: [],
      guessLog: [{ type: 'system', text: `Ronde baru dimulai! ${drawerName} adalah penggambar.`, at: Date.now() }],
      startTime: Date.now(),
      endTime: Date.now() + (MG_DRAW_TIME * 1000),
      roundStatus: 'drawing',
      updatedAt: serverTimestamp()
    });
    showToast('Ronde baru dimulai!');
  } catch (e) { showToast('Gagal: ' + e.message); }
};

// ============================================================
// ===================== END MINIGAME =========================
// ============================================================

function handleAuthClick() {
  if (currentUser) logout();
  else {
    const m = document.getElementById('modalContainer');
    const c = document.getElementById('modalContent');
    c.innerHTML = `<div class="text-center mb-4"><img src="${LOGO_URL}" class="w-20 h-20 mx-auto rounded-2xl mb-3 border-2 border-amber-500 logo-glow"><h3 class="text-xl font-bold">Masuk</h3></div>
      <div class="flex flex-col gap-3">
        <button id="mg" class="bg-white text-black font-bold py-3 rounded-full hover:scale-105 transition"><i class="fab fa-google mr-2"></i>Google</button>
        <button id="mgu" class="bg-slate-700 text-slate-300 font-bold py-2 rounded-full text-xs">Guest</button>
      </div>`;
    m.classList.remove('hidden');
    document.getElementById('mg').onclick = () => { signInWithGoogle(); m.classList.add('hidden'); };
    document.getElementById('mgu').onclick = () => { signInAsGuest(); m.classList.add('hidden'); };
  }
}
document.getElementById('navAuthMobile').onclick = handleAuthClick;
document.getElementById('modalContainer').onclick = e => { if (e.target.id === 'modalContainer') e.target.classList.add('hidden'); };
window.addEventListener('hashchange', renderPage);

(async function init() {
  await initAuth();
  if (!window.location.hash) window.location.hash = 'home';
  renderPage();
})();
</script>
