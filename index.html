                <input id="mgGuessInput" type="text" placeholder="Ketik tebakanmu..." class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:border-green-500 transition" ${room.roundStatus !== 'drawing' ? 'disabled' : ''}>
                <button id="mgGuessBtn" class="bg-green-600 text-white px-4 py-2 rounded-xl font-bold text-sm hover:scale-105 transition" ${room.roundStatus !== 'drawing' ? 'disabled' : ''}><i class="fas fa-paper-plane"></i></button>
              </div>
            </div>
            ` : `
            <div class="card-bg rounded-2xl p-4">
              <h3 class="font-bold text-sm text-amber-400 mb-2"><i class="fas fa-check-circle mr-1"></i>Beri Respon</h3>
              <p class="text-xs text-slate-400 mb-2">Jawaban: <b class="text-green-400">${room.word}</b></p>
              <div class="grid grid-cols-3 gap-2">
                <button onclick="window.mgDrawerRespond('${room.id}','benar')" class="bg-green-600 text-white py-2 rounded-lg text-xs font-bold hover:scale-105 transition ${room.roundStatus !== 'drawing' ? 'opacity-50' : ''}" ${room.roundStatus !== 'drawing' ? 'disabled' : ''}>✅ Benar</button>
                <button onclick="window.mgDrawerRespond('${room.id}','kurang')" class="bg-amber-600 text-white py-2 rounded-lg text-xs font-bold hover:scale-105 transition ${room.roundStatus !== 'drawing' ? 'opacity-50' : ''}" ${room.roundStatus !== 'drawing' ? 'disabled' : ''}>🟡 Kurang</button>
                <button onclick="window.mgDrawerRespond('${room.id}','salah')" class="bg-red-600 text-white py-2 rounded-lg text-xs font-bold hover:scale-105 transition ${room.roundStatus !== 'drawing' ? 'opacity-50' : ''}" ${room.roundStatus !== 'drawing' ? 'disabled' : ''}>❌ Salah</button>
              </div>
            </div>
            `}
          </div>
        </div>
      </div>`;

    setTimeout(() => initMgCanvas(room, isDrawer), 100);
    if (mgTimerInterval) clearInterval(mgTimerInterval);
    mgTimerInterval = setInterval(() => updateMgTimer(room), 1000);
    updateMgTimer(room);
    renderMgGuessLog(room);
  } else {
    updateMgTimer(room);
    renderMgGuessLog(room);
    const scoreContainer = document.getElementById('mgScoreList');
    if (scoreContainer) {
      scoreContainer.innerHTML = players.map(pid => {
        const pName = room.playerNames?.[pid] || 'Player';
        const pPhoto = room.playerPhotos?.[pid] || '';
        const sc = scores[pid] || 0;
        const isDrawerP = pid === room.drawerId;
        return `<div class="flex items-center gap-2 ${isDrawerP ? 'bg-green-900/30 border-green-600/40' : (pid === currentUser.uid ? 'bg-amber-900/30 border-amber-600/40' : 'bg-slate-800/60 border-slate-700')} border rounded-xl px-2 py-1.5 justify-between">
          <div class="flex items-center gap-2 min-w-0">
            <img src="${pPhoto || 'https://ui-avatars.com/api/?name='+encodeURIComponent(pName)}" class="w-6 h-6 rounded-full">
            <span class="truncate text-xs">${pName}${pid === currentUser.uid ? ' (Kamu)' : ''}</span>
          </div>
          <div class="flex items-center gap-1">
            ${isDrawerP ? '<i class="fas fa-paint-brush text-green-400 text-xs"></i>' : ''}
            <span class="text-amber-400 font-bold text-xs">${sc}</span>
          </div>
        </div>`;
      }).join('');
    }
    if (!isDrawer && mgCanvas && room.canvasData && room.canvasData !== mgLastCanvasData) {
      mgLastCanvasData = room.canvasData;
      const img = new Image();
      img.onload = () => {
        if (mgCtx) {
          mgCtx.clearRect(0, 0, mgCanvas.width, mgCanvas.height);
          mgCtx.drawImage(img, 0, 0, mgCanvas.width, mgCanvas.height);
        }
      };
      img.src = room.canvasData;
    }
  }
}

function updateMgTimer(room) {
  const timerEl = document.getElementById('mgTimerDisplay');
  if (!timerEl) return;
  const now = Date.now();
  const timeLeft = Math.max(0, Math.floor((room.endTime - now) / 1000));
  const mins = Math.floor(timeLeft / 60);
  const secs = timeLeft % 60;
  timerEl.textContent = `${mins}:${String(secs).padStart(2,'0')}`;
  timerEl.classList.toggle('text-red-400', timeLeft <= 120);
  timerEl.classList.toggle('text-amber-400', timeLeft > 120);
  if (timeLeft <= 0) {
    if (mgTimerInterval) { clearInterval(mgTimerInterval); mgTimerInterval = null; }
    if (room.status === 'playing') window.mgTimeUp(room.id);
  }
}

function renderMgGuessLog(room) {
  const logEl = document.getElementById('mgGuessLog');
  if (!logEl) return;
  const log = room.guessLog || [];
  logEl.innerHTML = log.slice(-30).map(l => {
    const time = new Date(l.at || Date.now()).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
    let cls = 'text-slate-400';
    if (l.type === 'correct') cls = 'text-green-400 font-bold';
    else if (l.type === 'wrong') cls = 'text-red-400';
    else if (l.type === 'close') cls = 'text-amber-400';
    else if (l.type === 'system') cls = 'text-purple-400 italic';
    const tagHtml = l.uid ? getRoleTagsForUid(l.uid) : '';
    return `<div class="${cls} mb-1">[${time}] ${l.text} ${tagHtml}</div>`;
  }).join('');
  logEl.scrollTop = logEl.scrollHeight;
}

function initMgCanvas(room, isDrawer) {
  const canvas = document.getElementById('mgCanvas');
  if (!canvas) return;
  mgCanvas = canvas;
  mgCtx = canvas.getContext('2d');
  mgCtx.lineCap = 'round';
  mgCtx.lineJoin = 'round';
  if (room.canvasData && room.canvasData.startsWith('data:image')) {
    const img = new Image();
    img.onload = () => {
      mgCtx.drawImage(img, 0, 0, canvas.width, canvas.height);
      mgDrawingHistory.push(canvas.toDataURL());
      mgHistoryIndex = 0;
    };
    img.src = room.canvasData;
  } else {
    mgCtx.fillStyle = '#ffffff';
    mgCtx.fillRect(0, 0, canvas.width, canvas.height);
    mgDrawingHistory = [canvas.toDataURL()];
    mgHistoryIndex = 0;
  }
  if (!isDrawer) { canvas.style.cursor = 'default'; return; }
  const colors = ['#000000','#ffffff','#ef4444','#f97316','#fbbf24','#10b981','#3b82f6','#8b5cf6','#ec4899','#78716c','#0ea5e9','#84cc16'];
  const colorsDiv = document.getElementById('mgColors');
  if (colorsDiv) {
    colorsDiv.innerHTML = colors.map(c => `<div class="w-6 h-6 rounded-full border-2 ${c === '#000000' ? 'border-amber-400' : 'border-slate-600'} cursor-pointer hover:scale-110 transition" style="background:${c}" data-color="${c}"></div>`).join('');
    colorsDiv.querySelectorAll('[data-color]').forEach(sw => {
      sw.onclick = () => {
        mgBrushColor = sw.dataset.color;
        colorsDiv.querySelectorAll('[data-color]').forEach(s => s.classList.remove('border-amber-400'));
        sw.classList.add('border-amber-400');
      };
    });
  }
  document.querySelectorAll('.mg-tool-btn[data-tool]').forEach(btn => {
    btn.onclick = () => {
      mgTool = btn.dataset.tool;
      document.querySelectorAll('.mg-tool-btn[data-tool]').forEach(b => { b.classList.remove('active','bg-amber-500','text-black'); b.classList.add('bg-slate-700','text-slate-300'); });
      btn.classList.add('active','bg-amber-500','text-black');
      btn.classList.remove('bg-slate-700','text-slate-300');
    };
  });
  const sizeInput = document.getElementById('mgBrushSize');
  const sizeLabel = document.getElementById('mgBrushSizeLabel');
  if (sizeInput) {
    sizeInput.oninput = () => {
      mgBrushSize = parseInt(sizeInput.value);
      sizeLabel.textContent = mgBrushSize + 'px';
    };
  }
  let lastX = 0, lastY = 0, startX = 0, startY = 0, snapshot = null;
  const getPos = (e) => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
  };
  const startDraw = (e) => {
    e.preventDefault();
    if (mgTool === 'fill') {
      const pos = getPos(e);
      floodFill(pos.x, pos.y, mgBrushColor);
      pushHistory();
      syncCanvas(room.id);
      return;
    }
    mgDrawing = true;
    const pos = getPos(e);
    lastX = pos.x; lastY = pos.y;
    startX = pos.x; startY = pos.y;
    snapshot = mgCtx.getImageData(0, 0, canvas.width, canvas.height);
    if (mgTool === 'brush') {
      mgCtx.globalCompositeOperation = 'source-over';
      mgCtx.strokeStyle = mgBrushColor;
      mgCtx.lineWidth = mgBrushSize;
      mgCtx.beginPath();
      mgCtx.moveTo(lastX, lastY);
      mgCtx.lineTo(lastX + 0.1, lastY + 0.1);
      mgCtx.stroke();
    }
  };
  const draw = (e) => {
    if (!mgDrawing) return;
    e.preventDefault();
    const pos = getPos(e);
    if (mgTool === 'brush' || mgTool === 'eraser') {
      mgCtx.globalCompositeOperation = mgTool === 'eraser' ? 'destination-out' : 'source-over';
      mgCtx.strokeStyle = mgTool === 'eraser' ? 'rgba(0,0,0,1)' : mgBrushColor;
      mgCtx.lineWidth = mgTool === 'eraser' ? mgBrushSize * 2 : mgBrushSize;
      mgCtx.beginPath();
      mgCtx.moveTo(lastX, lastY);
      mgCtx.lineTo(pos.x, pos.y);
      mgCtx.stroke();
      lastX = pos.x; lastY = pos.y;
    } else if (mgTool === 'line') {
      mgCtx.putImageData(snapshot, 0, 0);
      mgCtx.globalCompositeOperation = 'source-over';
      mgCtx.strokeStyle = mgBrushColor;
      mgCtx.lineWidth = mgBrushSize;
      mgCtx.beginPath();
      mgCtx.moveTo(startX, startY);
      mgCtx.lineTo(pos.x, pos.y);
      mgCtx.stroke();
    } else if (mgTool === 'rect') {
      mgCtx.putImageData(snapshot, 0, 0);
      mgCtx.globalCompositeOperation = 'source-over';
      mgCtx.strokeStyle = mgBrushColor;
      mgCtx.lineWidth = mgBrushSize;
      mgCtx.strokeRect(startX, startY, pos.x - startX, pos.y - startY);
    } else if (mgTool === 'circle') {
      mgCtx.putImageData(snapshot, 0, 0);
      mgCtx.globalCompositeOperation = 'source-over';
      mgCtx.strokeStyle = mgBrushColor;
      mgCtx.lineWidth = mgBrushSize;
      const rx = Math.abs(pos.x - startX) / 2;
      const ry = Math.abs(pos.y - startY) / 2;
      const cx = (pos.x + startX) / 2;
      const cy = (pos.y + startY) / 2;
      mgCtx.beginPath();
      mgCtx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
      mgCtx.stroke();
    }
  };
  const endDraw = () => {
    if (!mgDrawing) return;
    mgDrawing = false;
    pushHistory();
    syncCanvas(room.id);
  };
  canvas.addEventListener('mousedown', startDraw);
  canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('mouseup', endDraw);
  canvas.addEventListener('mouseleave', endDraw);
  canvas.addEventListener('touchstart', startDraw, { passive: false });
  canvas.addEventListener('touchmove', draw, { passive: false });
  canvas.addEventListener('touchend', endDraw);
  document.getElementById('mgUndoBtn').onclick = () => {
    if (mgHistoryIndex > 0) {
      mgHistoryIndex--;
      const img = new Image();
      img.onload = () => {
        mgCtx.clearRect(0, 0, canvas.width, canvas.height);
        mgCtx.drawImage(img, 0, 0);
        syncCanvas(room.id);
      };
      img.src = mgDrawingHistory[mgHistoryIndex];
    }
  };
  document.getElementById('mgClearBtn').onclick = () => {
    if (!confirm('Hapus semua gambar?')) return;
    mgCtx.fillStyle = '#ffffff';
    mgCtx.fillRect(0, 0, canvas.width, canvas.height);
    pushHistory();
    syncCanvas(room.id);
  };
}

function pushHistory() {
  if (!mgCanvas) return;
  const data = mgCanvas.toDataURL();
  mgDrawingHistory = mgDrawingHistory.slice(0, mgHistoryIndex + 1);
  mgDrawingHistory.push(data);
  if (mgDrawingHistory.length > 30) mgDrawingHistory.shift();
  mgHistoryIndex = mgDrawingHistory.length - 1;
}

async function syncCanvas(roomId) {
  if (!mgCanvas || !roomId) return;
  const data = mgCanvas.toDataURL('image/png');
  try { await updateDoc(doc(db, 'mg_rooms', roomId), { canvasData: data, updatedAt: serverTimestamp() }); } catch (e) {}
}

function floodFill(x, y, color) {
  if (!mgCtx || !mgCanvas) return;
  const w = mgCanvas.width, h = mgCanvas.height;
  const imageData = mgCtx.getImageData(0, 0, w, h);
  const data = imageData.data;
  const px = Math.floor(x), py = Math.floor(y);
  if (px < 0 || px >= w || py < 0 || py >= h) return;
  const idx = (py * w + px) * 4;
  const targetR = data[idx], targetG = data[idx+1], targetB = data[idx+2], targetA = data[idx+3];
  const fillRGB = hexToRgb(color);
  if (!fillRGB) return;
  if (targetR === fillRGB.r && targetG === fillRGB.g && targetB === fillRGB.b && targetA === 255) return;
  const stack = [[px, py]];
  while (stack.length > 0) {
    const [cx, cy] = stack.pop();
    const ci = (cy * w + cx) * 4;
    if (cx < 0 || cx >= w || cy < 0 || cy >= h) continue;
    if (data[ci] !== targetR || data[ci+1] !== targetG || data[ci+2] !== targetB || data[ci+3] !== targetA) continue;
    data[ci] = fillRGB.r; data[ci+1] = fillRGB.g; data[ci+2] = fillRGB.b; data[ci+3] = 255;
    stack.push([cx+1, cy], [cx-1, cy], [cx, cy+1], [cx, cy-1]);
  }
  mgCtx.putImageData(imageData, 0, 0);
}

function hexToRgb(hex) {
  const m = hex.match(/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i);
  return m ? { r: parseInt(m[1],16), g: parseInt(m[2],16), b: parseInt(m[3],16) } : null;
}

window.mgDrawerRespond = async (roomId, type) => {
  try {
    const roomSnap = await getDoc(doc(db, 'mg_rooms', roomId));
    if (!roomSnap.exists()) return;
    const room = roomSnap.data();
    if (room.drawerId !== currentUser.uid) return;
    const log = room.guessLog || [];
    let text = '';
    if (type === 'benar') text = `✅ Benar! Jawaban: "${room.word}"`;
    else if (type === 'kurang') text = `🟡 Kurang tepat, coba lagi!`;
    else text = `❌ Salah, bukan itu!`;
    log.push({ type: type === 'benar' ? 'correct' : type === 'kurang' ? 'close' : 'wrong', text, at: Date.now() });
    const updates = { guessLog: log, updatedAt: serverTimestamp() };
    if (type === 'benar') {
      updates.roundStatus = 'correct';
      updates.status = 'finished';
      updates.endTime = Date.now();
      const scores = room.scores || {};
      scores[currentUser.uid] = (scores[currentUser.uid] || 0) + 5;
      updates.scores = scores;
    }
    await updateDoc(doc(db, 'mg_rooms', roomId), updates);
  } catch (e) { showToast('Gagal: ' + e.message); }
};

window.mgSubmitGuess = async () => {
  const input = document.getElementById('mgGuessInput');
  const button = document.getElementById('mgGuessBtn');
  if (!input || !currentUser || !userProfile) return;
  const normalizeGuess = value => String(value || '').normalize('NFKC').trim().toLocaleLowerCase('id').replace(/\s+/g, ' ');
  const guess = normalizeGuess(input.value);
  if (!guess || mgGuessSubmitting) return;
  const roomId = mgCurrentRoom?.id || getHash().match(/^minigame\/(.+)$/)?.[1] || '';
  if (!roomId) { showToast('Room tidak ditemukan. Coba masuk ulang ke room.'); return; }
  mgGuessSubmitting = true;
  if (button) { button.disabled = true; button.dataset.originalHtml = button.innerHTML; button.innerHTML = '<i class="fas fa-spinner fa-spin"></i>'; }
  try {
    const roomRef = doc(db, 'mg_rooms', roomId);
    const roomSnap = await getDoc(roomRef);
    if (!roomSnap.exists()) { showToast('Room tidak ditemukan.'); return; }
    const room = { id: roomSnap.id, ...roomSnap.data() };
    mgCurrentRoom = room;
    if (!(room.players || []).includes(currentUser.uid)) { showToast('Kamu bukan anggota room ini.'); return; }
    if (room.drawerId === currentUser.uid) { showToast('Kamu penggambar, tidak bisa menebak!'); return; }
    if (room.roundStatus !== 'drawing' || room.status !== 'playing') { showToast('Ronde sudah selesai.'); return; }
    const answer = normalizeGuess(room.word);
    if (!answer) { showToast('Kata tebakan belum tersedia.'); return; }
    const log = [...(room.guessLog || [])];
    const isCorrect = guess === answer;
    log.push({ type: isCorrect ? 'correct' : 'wrong', text: `${isCorrect ? '✅' : '❌'} ${userProfile.username || 'Player'}: "${guess}"`, uid: currentUser.uid, at: Date.now() });
    const updates = { guessLog: log, updatedAt: serverTimestamp() };
    if (isCorrect) {
      updates.roundStatus = 'correct';
      updates.status = 'finished';
      updates.endTime = Date.now();
      const scores = { ...(room.scores || {}) };
      scores[currentUser.uid] = (scores[currentUser.uid] || 0) + 10;
      scores[room.drawerId] = (scores[room.drawerId] || 0) + 5;
      updates.scores = scores;
    }
    await updateDoc(roomRef, updates);
    input.value = '';
    if (!isCorrect) input.focus();
  } catch (err) { showToast('Gagal mengirim jawaban: ' + (err?.message || 'Kesalahan tidak diketahui')); }
  finally {
    mgGuessSubmitting = false;
    const liveButton = document.getElementById('mgGuessBtn');
    if (liveButton) { liveButton.disabled = false; liveButton.innerHTML = liveButton.dataset.originalHtml || '<i class="fas fa-paper-plane"></i>'; }
  }
};
document.addEventListener('click', (e) => {
  if (e.target && (e.target.id === 'mgGuessBtn' || e.target.closest('#mgGuessBtn'))) window.mgSubmitGuess();
});
document.addEventListener('keypress', (e) => {
  if (e.target && e.target.id === 'mgGuessInput' && e.key === 'Enter') window.mgSubmitGuess();
});

window.mgTimeUp = async (roomId) => {
  try {
    const roomSnap = await getDoc(doc(db, 'mg_rooms', roomId));
    if (!roomSnap.exists()) return;
    const room = roomSnap.data();
    if (room.status !== 'playing') return;
    const log = room.guessLog || [];
    log.push({ type: 'system', text: '⏰ Waktu habis! Tidak ada yang menebak dengan benar.', at: Date.now() });
    await updateDoc(doc(db, 'mg_rooms', roomId), { status: 'finished', roundStatus: 'timeup', guessLog: log, endTime: Date.now(), updatedAt: serverTimestamp() });
  } catch (e) {}
};

                </div>

              <span class="text-amber-400 font-black text-lg">${sc}</span>
            </div>`;
          }).join('')}
        </div>
      </div>
      <div class="card-bg rounded-2xl p-6 mb-4">
        <h3 class="font-bold text-sm text-amber-400 mb-3"><i class="fas fa-history mr-1"></i>Riwayat Tebakan</h3>

          ${(room.guessLog || []).slice(-20).map(l => {
            let cls = 'text-slate-400';
            if (l.type === 'correct') cls = 'text-green-400 font-bold';
            else if (l.type === 'wrong') cls = 'text-red-400';
            else if (l.type === 'close') cls = 'text-amber-400';
            else if (l.type === 'system') cls = 'text-purple-400 italic';
            const tagHtml = l.uid ? getRoleTagsForUid(l.uid) : '';
            return `<div class="${cls} mb-1">${l.text} ${tagHtml}</div>`;
          }).join('')}
        </div>
      </div>
      <div class="flex gap-3">
        <button onclick="window.mgConfirmLeave('${room.id}')" class="flex-1 bg-slate-700 text-white font-bold py-3 rounded-full hover:scale-105 transition"><i class="fas fa-sign-out-alt mr-1"></i>Keluar</button>
        ${isHost ? `<button onclick="window.mgPlayAgain('${room.id}')" class="flex-1 bg-purple-500 text-white font-bold py-3 rounded-full hover:scale-105 transition btn-glow"><i class="fas fa-redo mr-1"></i>Main Lagi</button>` : ''}
      </div>
    </div>`;
}

window.mgConfirmLeave = (roomId) => {
  const modal = document.getElementById('modalContainer');
  const content = document.getElementById('modalContent');
  content.innerHTML = `
    <div class="text-center">
      <div class="w-20 h-20 mx-auto rounded-full bg-red-600/20 flex items-center justify-center mb-4"><i class="fas fa-sign-out-alt text-red-500 text-4xl"></i></div>
      <h2 class="text-2xl font-black text-red-400 mb-2">Keluar dari Room?</h2>
      <p class="text-slate-400 text-sm mb-6">Kamu yakin ingin keluar dari permainan? Progress akan hilang dan tidak bisa dilanjutkan.</p>
      <div class="flex gap-3">
        <button id="mgConfirmLeaveYes" class="flex-1 bg-red-600 text-white font-bold py-3 rounded-full hover:scale-105 transition">Ya, Keluar</button>
        <button id="mgConfirmLeaveNo" class="flex-1 bg-slate-700 text-white font-bold py-3 rounded-full hover:scale-105 transition">Batal</button>
      </div>
    </div>`;
  modal.classList.remove('hidden');
  document.getElementById('mgConfirmLeaveNo').onclick = () => modal.classList.add('hidden');
  document.getElementById('mgConfirmLeaveYes').onclick = () => { modal.classList.add('hidden'); window.mgLeaveRoom(roomId); };
};

window.mgLeaveRoom = async (roomId) => {
  try {
    const roomSnap = await getDoc(doc(db, 'mg_rooms', roomId));
    if (!roomSnap.exists()) { window.location.hash = 'minigame'; renderPage(); return; }
    const room = roomSnap.data();
    const players = (room.players || []).filter(p => p !== currentUser.uid);
    const scores = { ...(room.scores || {}) }; delete scores[currentUser.uid];
    const playerNames = { ...(room.playerNames || {}) }; delete playerNames[currentUser.uid];
    const playerPhotos = { ...(room.playerPhotos || {}) }; delete playerPhotos[currentUser.uid];
    if (players.length === 0) await deleteDoc(doc(db, 'mg_rooms', roomId));
    else await updateDoc(doc(db, 'mg_rooms', roomId), { players, scores, playerNames, playerPhotos, updatedAt: serverTimestamp() });
    await updateDoc(doc(db, 'users', currentUser.uid), { mgRoomId: null });
    if (mgUnsubRoom) { mgUnsubRoom(); mgUnsubRoom = null; }
    if (mgUnsubGuesses) { mgUnsubGuesses(); mgUnsubGuesses = null; }
    if (mgTimerInterval) { clearInterval(mgTimerInterval); mgTimerInterval = null; }
    if (mgCanvasSyncTimer) { clearInterval(mgCanvasSyncTimer); mgCanvasSyncTimer = null; }
    mgCurrentRoom = null; mgMyRole = null;
    showToast('Keluar dari room');
    window.location.hash = 'minigame';
    renderPage();
  } catch (e) { showToast('Gagal keluar: ' + e.message); }
};

window.mgPlayAgain = async (roomId) => {
  try {
    const roomSnap = await getDoc(doc(db, 'mg_rooms', roomId));
    if (!roomSnap.exists()) return;
    const room = roomSnap.data();
    const players = room.players || [];
    const drawerId = players[Math.floor(Math.random() * players.length)];
    const drawerName = room.playerNames?.[drawerId] || 'Player';
    const word = MG_WORD_LIST[Math.floor(Math.random() * MG_WORD_LIST.length)];
    const scores = {};
    players.forEach(p => scores[p] = 0);
    await updateDoc(doc(db, 'mg_rooms', roomId), {
      status: 'playing', drawerId, drawerName, word,
      currentRound: (room.currentRound || 0) + 1, scores,
      canvasData: '', drawingHistory: [],
      guessLog: [{ type: 'system', text: `Ronde baru dimulai! ${drawerName} adalah penggambar.`, at: Date.now() }],
      startTime: Date.now(), endTime: Date.now() + (MG_DRAW_TIME * 1000),
      roundStatus: 'drawing', updatedAt: serverTimestamp()
    });
    showToast('Ronde baru dimulai!');
  } catch (e) { showToast('Gagal: ' + e.message); }
};
