      for (let t of LEVEL_TITLES) if (level >= t.min && level <= t.max) return t.title;

    }
    function isGolden(level) { return level > 1000; }

      let result = text;
      KATA_KASAR.forEach(kata => {
        const regex = new RegExp(`\\b${kata}\\b`, 'gi');
        result = result.replace(regex, match => '*'.repeat(match.length));
      });
      return result;

      isFullscreenReader = !isFullscreenReader;
      const readerContent = document.getElementById('readerContent');
      const fullscreenBtn = document.getElementById('fullscreenBtn');
      const closeBtn = document.getElementById('fullscreenClose');
      if (!readerContent) return;
      
      if (isFullscreenReader) {
        readerContent.classList.add('reader-fullscreen');
        if (fullscreenBtn) fullscreenBtn.classList.add('hidden');
        // Buat tombol close
        if (!closeBtn) {
          const btn = document.createElement('button');
          btn.id = 'fullscreenClose';
          btn.className = 'fullscreen-close';
          btn.innerHTML = '<i class="fas fa-times"></i>';
          btn.onclick = toggleFullscreenReader;
          document.body.appendChild(btn);
        }
        document.body.style.overflow = 'hidden';
      } else {
        readerContent.classList.remove('reader-fullscreen');
        if (fullscreenBtn) fullscreenBtn.classList.remove('hidden');
        const cb = document.getElementById('fullscreenClose');
        if (cb) cb.remove();
        document.body.style.overflow = '';

    // ==================== AUTH ====================
    async function initAuth() {
      onAuthStateChanged(auth, async (user) => {
        if (user) {
          currentUser = user;
          const userRef = doc(db, 'users', user.uid);
          const userSnap = await getDoc(userRef);
          if (!userSnap.exists()) {
            const newProfile = {
              uid: user.uid, username: user.displayName || 'User', email: user.email || '',
              photoURL: user.photoURL || '', role: 'pembaca', roles: ['pembaca'],
              exp: 0, level: 1, banned: false,
              createdAt: serverTimestamp(), updatedAt: serverTimestamp()
            };
            await setDoc(userRef, newProfile);
            userProfile = newProfile;
          } else {
            userProfile = userSnap.data();
            if (!userProfile.roles) {
              userProfile.roles = [userProfile.role || 'pembaca'];
              await updateDoc(userRef, { roles: userProfile.roles });
            }
            if (hasRole(userProfile, 'admin') && userProfile.level !== MAX_LEVEL) {
              await updateDoc(userRef, { level: MAX_LEVEL, exp: MAX_LEVEL * 20 });
              userProfile.level = MAX_LEVEL; userProfile.exp = MAX_LEVEL * 20;
            }
            if (!userProfile.photoURL && user.photoURL) {
              await updateDoc(userRef, { photoURL: user.photoURL });
              userProfile.photoURL = user.photoURL;
            }
            if (userProfile.banned) {
              showToast('Akun Anda telah diblokir oleh Admin!', 5000);
              await signOut(auth); return;
            }
          }
          const authLabel = `<i class="fas fa-sign-out-alt mr-1"></i>Keluar`;
          document.getElementById('navAuth').innerHTML = authLabel;
          document.getElementById('navAuthMobile').innerHTML = `<i class="fas fa-sign-out-alt"></i>`;
          if (isAdminUser(userProfile)) document.getElementById('navAdmin').classList.remove('hidden');
          else document.getElementById('navAdmin').classList.add('hidden');
          if (isCreator(userProfile)) document.getElementById('navCreator').classList.remove('hidden');
          else document.getElementById('navCreator').classList.add('hidden');
          renderPage();
        } else {
          currentUser = null; userProfile = null;
          document.getElementById('navAuth').innerHTML = `<i class="fas fa-sign-in-alt mr-1"></i>Masuk`;
          document.getElementById('navAuthMobile').innerHTML = `<i class="fas fa-sign-in-alt"></i>`;
          if (!isAdminSession) document.getElementById('navAdmin').classList.add('hidden');
          document.getElementById('navCreator').classList.add('hidden');
          renderPage();
        }
      });
    }

    async function signInWithGoogle() {
      try {
        if (currentUser && currentUser.isAnonymous) {
          await linkWithPopup(currentUser, googleProvider);
          showToast('Akun Google ditautkan!');
          const userRef = doc(db, 'users', currentUser.uid);
          const snap = await getDoc(userRef);
          if (snap.exists()) {
            userProfile = snap.data();
            await updateDoc(userRef, {
              email: currentUser.email,
              username: currentUser.displayName || userProfile.username,
              photoURL: currentUser.photoURL || userProfile.photoURL
            });
          }
        } else {
          await signInWithPopup(auth, googleProvider);
          showToast('Masuk dengan Google berhasil');
        }
      } catch (e) { showToast('Gagal: ' + e.message); }
    }
    async function signInAsGuest() {
      try { await signInAnonymously(auth); showToast('Masuk sebagai Guest'); }
      catch (e) { showToast('Gagal: ' + e.message); }
    }
    async function logout() {
      await signOut(auth); isAdminSession = false; adminEmail = null;
      localStorage.removeItem('adminSession'); localStorage.removeItem('adminEmail');
      showToast('Telah keluar');
    }

    // ==================== ADMIN ====================
    async function adminLogin(email, password) {
      if (email === ADMIN_EMAIL && password === ADMIN_PASSWORD) {
        isAdminSession = true; adminEmail = email;
        localStorage.setItem('adminSession', 'true'); localStorage.setItem('adminEmail', email);
        showToast('Login Admin berhasil!');
        document.getElementById('navAdmin').classList.remove('hidden');
        window.location.hash = 'admin'; renderPage();
      } else {
        try {
          const cred = await signInWithEmailAndPassword(auth, email, password);
          const userRef = doc(db, 'users', cred.user.uid);
          const snap = await getDoc(userRef);
          const roles = snap.data()?.roles || ['pembaca'];
          if (!roles.includes('admin')) roles.push('admin');
          await updateDoc(userRef, { role: 'admin', roles, level: MAX_LEVEL, exp: MAX_LEVEL * 20 });
          isAdminSession = true; adminEmail = email;
          localStorage.setItem('adminSession', 'true'); localStorage.setItem('adminEmail', email);
          showToast('Login Admin berhasil!');
          document.getElementById('navAdmin').classList.remove('hidden');
          window.location.hash = 'admin'; renderPage();
        } catch (e) { showToast('Email atau sandi admin salah!'); }
      }
    }
    function adminLogout() {
      isAdminSession = false; adminEmail = null;
      localStorage.removeItem('adminSession'); localStorage.removeItem('adminEmail');
      document.getElementById('navAdmin').classList.add('hidden');
      showToast('Logout admin'); window.location.hash = 'home'; renderPage();
    }
    if (localStorage.getItem('adminSession') === 'true') {
      isAdminSession = true; adminEmail = localStorage.getItem('adminEmail');
    }

    // ==================== EXP ====================
    async function addExp(amount) {
      if (!currentUser || !userProfile) return;
      if (isAdminUser(userProfile)) return;
      const userRef = doc(db, 'users', currentUser.uid);
      const newExp = (userProfile.exp || 0) + amount;
      const newLevel = getLevelFromExp(newExp);
      await updateDoc(userRef, { exp: newExp, level: newLevel, updatedAt: serverTimestamp() });
      userProfile.exp = newExp; userProfile.level = newLevel;
    }

    // ==================== ROUTING ====================
    function getHash() { return window.location.hash.replace('#', '') || 'home'; }
    async function renderPage() {
      // Reset fullscreen state saat pindah halaman
      if (isFullscreenReader) {
        isFullscreenReader = false;
        document.body.style.overflow = '';
        const cb = document.getElementById('fullscreenClose');
        if (cb) cb.remove();
      }
      const hash = getHash();
      const main = document.getElementById('mainContent');
      if (hash.startsWith('admin')) {
        if (!isAdminSession && !hasRole(userProfile, 'admin')) { renderAdminLogin(main); return; }
        await renderAdminPanel(main);
      } else if (hash.startsWith('creator')) {
        if (!isCreator(userProfile) && !isAdminSession) {
          main.innerHTML = `<div class="card-bg rounded-2xl p-8 text-center"><i class="fas fa-lock text-4xl text-red-400 mb-4"></i><h2 class="text-xl font-bold">Akses Ditolak</h2><p class="text-slate-400">Halaman ini hanya untuk Kreator.</p></div>`;
          return;
        }
        await renderCreatorDashboard(main);
      } else if (hash.startsWith('reader/')) {
        const parts = hash.split('/');
        await renderReader(main, parts[1], parts[2]);
      } else if (hash === 'kategori') await renderKategori(main);
      else if (hash === 'leaderboard') await renderLeaderboard(main);
      else if (hash === 'chat') await renderChat(main);
      else if (hash === 'kritik') await renderKritikSaran(main);
      else if (hash === 'profil') await renderProfil(main);
      else await renderHome(main);
    }

      if (!novelId) { container.innerHTML = '<p>Karya tidak ditemukan</p>'; return; }
      const workSnap = await getDoc(doc(db, 'works', novelId));
      if (!workSnap.exists()) { container.innerHTML = '<p class="text-red-400">Karya tidak ditemukan.</p>'; return; }
      const work = { id: workSnap.id, ...workSnap.data() };
      const chaptersSnap = await getDocs(query(collection(db, 'works', novelId, 'chapters'), orderBy('number', 'asc')));
      const chapters = [];
      chaptersSnap.forEach(d => chapters.push({ id: d.id, ...d.data() }));

      let currentChapter = null;
      if (chapterId) currentChapter = chapters.find(c => c.id === chapterId);
      else if (chapters.length > 0) {
        currentChapter = chapters[0];
        window.location.hash = `reader/${novelId}/${currentChapter.id}`; return;
      }
      if (currentUser && currentChapter) await addExp(EXP_PER_READ);

      const chapterLabel = work.type === 'novel' ? 'Chapter' : 'Eps';
      const canManage = currentUser && (currentUser.uid === work.authorId || isAdminUser(userProfile));
      const cats = parseCategories(work.category);
      const isKomik = work.type === 'komik';

      container.innerHTML = `
        <div id="readerContent">
          <div class="reader-header mb-6 flex flex-wrap justify-between items-center">
            <button onclick="window.location.hash='home'" class="text-amber-400 hover:text-amber-300"><i class="fas fa-arrow-left mr-2"></i>Kembali</button>
            <span class="text-sm text-slate-400">${work.type === 'novel' ? 'Novel' : 'Komik'} • ${cats.slice(0, 2).join(', ')} ${work.isTamat ? '<span class="tamat-tag ml-1">TAMAT</span>' : ''}</span>
          </div>
          <div class="reader-header card-bg rounded-2xl p-4 md:p-6 mb-6 ${work.isTamat ? 'tamat-border' : ''}">
            <div class="flex flex-col md:flex-row gap-4 md:gap-6">
              <div class="w-full md:w-48 h-64 bg-slate-800 rounded-xl overflow-hidden flex-shrink-0">
                ${work.coverURL ? `<img src="${work.coverURL}" class="w-full h-full object-cover" onerror="this.style.display='none';">` : `<div class="flex items-center justify-center h-full"><i class="fas fa-image text-5xl text-slate-600"></i></div>`}
              </div>
              <div class="flex-1">
                <h1 class="text-xl md:text-2xl font-black">${work.title} ${work.isTamat ? '<span class="tamat-tag">TAMAT</span>' : ''}</h1>
                <p class="text-amber-400/90 italic mt-2">${work.teaser || ''}</p>
                <p class="text-slate-400 mt-2 text-sm">${work.description || ''}</p>
                <div class="flex items-center gap-3 mt-3 text-sm flex-wrap">
                  ${cats.map(c => `<span class="bg-slate-700 px-3 py-1 rounded-full text-xs">${c}</span>`).join('')}
                  <span class="text-amber-400 text-xs"><i class="fas fa-user"></i> ${work.authorName || 'Anonim'}</span>
                  ${work.avgRating ? `<span class="text-amber-400 text-xs"><i class="fas fa-star"></i> ${work.avgRating.toFixed(1)} (${work.ratingCount || 0})</span>` : ''}
                </div>
              </div>
            </div>
          </div>
          <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <div class="reader-sidebar lg:col-span-1 card-bg rounded-2xl p-4 max-h-[70vh] overflow-y-auto scrollbar-thin order-2 lg:order-1">
              <h3 class="font-bold mb-3 text-amber-400">Daftar ${chapterLabel} (${chapters.length})</h3>
              <div class="space-y-2">
                ${chapters.map((ch, idx) => `
                  <div class="flex items-center gap-1">
                    <button onclick="window.location.hash='reader/${novelId}/${ch.id}'" class="flex-1 text-left px-3 py-2 rounded-lg ${currentChapter && currentChapter.id === ch.id ? 'bg-amber-500/20 border border-amber-500' : 'hover:bg-slate-800'} transition text-sm truncate">
                      ${chapterLabel} ${ch.number || idx+1}${ch.title ? ': ' + ch.title : ''}
                    </button>
                    ${canManage ? `<button onclick="deleteChapterFromReader('${novelId}','${ch.id}','${ch.number || idx+1}')" class="text-red-400 hover:text-red-300 px-2" title="Hapus"><i class="fas fa-trash text-xs"></i></button>` : ''}
                  </div>
                `).join('')}
                ${chapters.length === 0 ? `<p class="text-slate-500 text-sm">Belum ada ${chapterLabel}.</p>` : ''}
              </div>
            </div>
            <div class="lg:col-span-3 space-y-6 order-1 lg:order-2">
              <div class="reader-content card-bg rounded-2xl p-4 md:p-6">
                ${currentChapter ? `
                  <div class="flex justify-between items-start mb-4 gap-2 flex-wrap">
                    <h2 class="text-lg md:text-xl font-bold">${chapterLabel} ${currentChapter.number}${currentChapter.title ? ': ' + currentChapter.title : ''}</h2>
                    ${isKomik && currentChapter.images && currentChapter.images.length > 0 ? `
                      <button onclick="toggleFullscreenReader()" class="bg-amber-500 text-black text-xs md:text-sm font-bold px-3 py-2 rounded-full flex items-center gap-1">
                        <i class="fas fa-expand"></i> Fullscreen
                      </button>
                    ` : ''}
                  </div>
                  <div class="prose prose-invert max-w-none">
                    ${work.type === 'novel' ? 
                      `<div class="whitespace-pre-wrap leading-relaxed text-slate-200" style="line-height: 1.9; font-size: 15px;">${currentChapter.content || 'Belum ada konten.'}</div>` : 
                      `<div class="reader-images grid grid-cols-1 gap-4">${(currentChapter.images || []).map(img => `<img src="${img}" class="w-full rounded-lg">`).join('')}</div>`}
                  </div>
                ` : `<p class="text-slate-400">Pilih ${chapterLabel} untuk membaca.</p>`}
              </div>

              ${currentChapter ? `
              <div class="reader-comments card-bg rounded-2xl p-4 md:p-6">
                <h3 class="font-bold mb-4 text-amber-400"><i class="fas fa-star mr-2"></i>Beri Rating & Komentar</h3>
                <div class="flex items-center gap-2 mb-4" id="ratingStars">
                  ${[1,2,3,4,5].map(n => `<i class="fas fa-star text-2xl star-rating" data-star="${n}"></i>`).join('')}
                  <span id="ratingText" class="text-sm text-slate-400 ml-2">Pilih bintang</span>
                </div>
                <div class="flex gap-2">
                  <input id="commentInput" type="text" placeholder="Tulis komentar..." class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-amber-500">
                  <button id="submitComment" class="bg-amber-500 text-black px-5 py-2 rounded-xl font-bold text-sm">Kirim</button>
                </div>
              </div>
              <div class="reader-comments card-bg rounded-2xl p-4 md:p-6">
                <h3 class="font-bold mb-4 text-amber-400"><i class="fas fa-comments mr-2"></i>Komentar Pembaca</h3>
                <div id="commentsList" class="space-y-3 max-h-[50vh] overflow-y-auto scrollbar-thin"></div>
              </div>
              ` : ''}
            </div>
          </div>
          ${isKomik && currentChapter && currentChapter.images && currentChapter.images.length > 0 ? `
            <button id="fullscreenBtn" class="fullscreen-btn" onclick="toggleFullscreenReader()">
              <i class="fas fa-expand"></i>
            </button>
          ` : ''}
        </div>
      `;

      if (!currentChapter) return;

      const commentsRef = collection(db, 'works', novelId, 'chapters', currentChapter.id, 'comments');
      const q = query(commentsRef, orderBy('createdAt', 'desc'));
      onSnapshot(q, (snap) => {
        const commentsDiv = document.getElementById('commentsList');
        if (!commentsDiv) return;
        const comments = [];
        snap.forEach(d => comments.push({ id: d.id, ...d.data() }));
        const parents = comments.filter(c => !c.parentId);
        const replies = comments.filter(c => c.parentId);
        if (parents.length === 0) { commentsDiv.innerHTML = `<p class="text-slate-500 text-sm">Belum ada komentar.</p>`; return; }
        commentsDiv.innerHTML = parents.map(c => {
          const cReplies = replies.filter(r => r.parentId === c.id);
          return `
            <div class="comment-card rounded-xl p-3">
              <div class="flex items-start gap-2">
                <img src="${c.photoURL || 'https://ui-avatars.com/api/?name='+encodeURIComponent(c.username || 'U')}" class="w-8 h-8 rounded-full">
                <div class="flex-1">
                  <div class="flex items-center gap-2 text-xs mb-1 flex-wrap">
                    <span class="${isGolden(c.userLevel) ? 'gold-glow font-bold' : 'text-slate-300 font-semibold'}">${c.username || 'Anonim'}</span>
                    ${isGolden(c.userLevel) ? '<i class="fas fa-crown text-amber-400 text-xs"></i>' : ''}
                    <span class="text-slate-500">Lv.${c.userLevel || 1}</span>
                    ${c.isAdmin ? '<span class="admin-tag">ADMIN</span>' : ''}
                    ${c.isPenulis ? '<span class="penulis-tag">PENULIS</span>' : ''}
                    ${c.isKomikus ? '<span class="komikus-tag">KOMIKUS</span>' : ''}
                    <span class="text-slate-600">•</span>
                    <span class="text-slate-500">${formatDate(c.createdAt)}</span>
                  </div>
                  <p class="text-sm break-words ${c.isAdmin ? 'text-amber-200' : c.isPenulis ? 'text-blue-200' : c.isKomikus ? 'text-purple-200' : ''}">${sensorKataKasar(c.text || '')}</p>
                  <div class="flex items-center gap-3 mt-2 text-xs">
                    <button onclick="likeComment('${novelId}','${currentChapter.id}','${c.id}')" class="text-slate-400 hover:text-red-400"><i class="fas fa-heart"></i> ${c.likes || 0}</button>
                    <button onclick="showReplyInput('${c.id}')" class="text-slate-400 hover:text-amber-400"><i class="fas fa-reply"></i> Balas</button>
                  </div>
                  <div id="reply-input-${c.id}" class="hidden mt-2 flex gap-2">
                    <input type="text" id="reply-text-${c.id}" placeholder="Tulis balasan..." class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:border-amber-500">
                    <button onclick="submitReply('${novelId}','${currentChapter.id}','${c.id}')" class="bg-amber-500 text-black px-3 py-1.5 rounded-lg text-xs font-bold">Kirim</button>
                  </div>
                  ${cReplies.length > 0 ? `
                    <div class="mt-3 space-y-2">
                      ${cReplies.map(r => `
                        <div class="reply-indent">
                          <div class="flex items-start gap-2">
                            <img src="${r.photoURL || 'https://ui-avatars.com/api/?name='+encodeURIComponent(r.username || 'U')}" class="w-6 h-6 rounded-full">
                            <div class="flex-1">
                              <div class="flex items-center gap-2 text-xs mb-1 flex-wrap">
                                <span class="${isGolden(r.userLevel) ? 'gold-glow font-bold' : 'text-slate-300 font-semibold'}">${r.username || 'Anonim'}</span>
                                ${r.isAdmin ? '<span class="admin-tag">ADMIN</span>' : ''}
                                ${r.isPenulis ? '<span class="penulis-tag">PENULIS</span>' : ''}
                                ${r.isKomikus ? '<span class="komikus-tag">KOMIKUS</span>' : ''}
                                <span class="text-slate-500">Lv.${r.userLevel || 1}</span>
                              </div>
                              <p class="text-xs break-words ${r.isAdmin ? 'text-amber-200' : r.isPenulis ? 'text-blue-200' : r.isKomikus ? 'text-purple-200' : ''}">${sensorKataKasar(r.text || '')}</p>
                              <button onclick="likeComment('${novelId}','${currentChapter.id}','${r.id}')" class="text-xs text-slate-400 hover:text-red-400 mt-1"><i class="fas fa-heart"></i> ${r.likes || 0}</button>
                            </div>
                          </div>
                        </div>
                      `).join('')}
                    </div>
                  ` : ''}
                </div>
              </div>
            </div>
          `;
        }).join('');
      });

      let selectedRating = 0;
      document.querySelectorAll('#ratingStars .star-rating').forEach(star => {
        star.onclick = () => {
          selectedRating = parseInt(star.dataset.star);
          document.querySelectorAll('#ratingStars .star-rating').forEach((s, i) => {
            s.classList.toggle('text-amber-400', i < selectedRating);
            s.classList.toggle('text-slate-600', i >= selectedRating);
          });
          document.getElementById('ratingText').textContent = `${selectedRating} bintang`;
        };
      });
      document.querySelectorAll('#ratingStars .star-rating').forEach(s => s.classList.add('text-slate-600'));

      document.getElementById('submitComment').onclick = async () => {
        if (!currentUser || !userProfile) { showToast('Silakan masuk dulu'); return; }
        const text = document.getElementById('commentInput').value.trim();
        if (!text && selectedRating === 0) { showToast('Tulis komentar atau beri rating'); return; }
        if (text) {
          await addDoc(collection(db, 'works', novelId, 'chapters', currentChapter.id, 'comments'), {
            userId: currentUser.uid, username: userProfile.username || 'Guest',
            photoURL: userProfile.photoURL || '', userLevel: userProfile.level || 1,
            isAdmin: isAdminUser(userProfile), isPenulis: hasRole(userProfile, 'penulis'),
            isKomikus: hasRole(userProfile, 'komikus'), text, likes: 0, parentId: null,
            createdAt: serverTimestamp()
          });
          await addExp(EXP_PER_COMMENT);
        }
        if (selectedRating > 0) {
          await setDoc(doc(db, 'works', novelId, 'chapters', currentChapter.id, 'ratings', currentUser.uid), {
            userId: currentUser.uid, rating: selectedRating, createdAt: serverTimestamp()
          });
          await recalcWorkRating(novelId);
        }
        document.getElementById('commentInput').value = '';
        selectedRating = 0;
        document.querySelectorAll('#ratingStars .star-rating').forEach(s => { s.classList.remove('text-amber-400'); s.classList.add('text-slate-600'); });
        document.getElementById('ratingText').textContent = 'Pilih bintang';
        showToast('Terkirim!');
      };
    }

    async function recalcWorkRating(workId) {
      const chaptersSnap = await getDocs(collection(db, 'works', workId, 'chapters'));
      let totalRating = 0, totalCount = 0;
      for (const ch of chaptersSnap.docs) {
        const ratingsSnap = await getDocs(collection(db, 'works', workId, 'chapters', ch.id, 'ratings'));
        ratingsSnap.forEach(r => { totalRating += r.data().rating || 0; totalCount++; });
      }
      const avg = totalCount > 0 ? totalRating / totalCount : 0;
      await updateDoc(doc(db, 'works', workId), { avgRating: avg, ratingCount: totalCount, updatedAt: serverTimestamp() });
    }

    // ==================== GLOBAL FUNCTIONS ====================
    window.likeComment = async (workId, chapterId, commentId) => {
      if (!currentUser) { showToast('Silakan masuk dulu'); return; }
      const ref = doc(db, 'works', workId, 'chapters', chapterId, 'comments', commentId);
      const snap = await getDoc(ref);
      if (!snap.exists()) return;
      await updateDoc(ref, { likes: (snap.data().likes || 0) + 1 });
    };
    window.showReplyInput = (commentId) => {
      document.getElementById('reply-input-' + commentId)?.classList.toggle('hidden');
    };
    window.submitReply = async (workId, chapterId, parentId) => {
      if (!currentUser || !userProfile) { showToast('Silakan masuk dulu'); return; }
      const input = document.getElementById('reply-text-' + parentId);
      const text = input.value.trim();
      if (!text) return;
      await addDoc(collection(db, 'works', workId, 'chapters', chapterId, 'comments'), {
        userId: currentUser.uid, username: userProfile.username || 'Guest',
        photoURL: userProfile.photoURL || '', userLevel: userProfile.level || 1,
        isAdmin: isAdminUser(userProfile), isPenulis: hasRole(userProfile, 'penulis'),
        isKomikus: hasRole(userProfile, 'komikus'), text, likes: 0, parentId,
        createdAt: serverTimestamp()
      });
      await addExp(EXP_PER_COMMENT);
      input.value = '';
      document.getElementById('reply-input-' + parentId).classList.add('hidden');
      showToast('Balasan terkirim!');
    };
    window.deleteChapterFromReader = async (workId, chapId, chapNum) => {
      if (!confirm(`Yakin hapus Chapter/Eps ${chapNum}? Tidak bisa dikembalikan.`)) return;
      try {
        const comSnap = await getDocs(collection(db, 'works', workId, 'chapters', chapId, 'comments'));
        for (const com of comSnap.docs) await deleteDoc(doc(db, 'works', workId, 'chapters', chapId, 'comments', com.id));
        const rateSnap = await getDocs(collection(db, 'works', workId, 'chapters', chapId, 'ratings'));
        for (const r of rateSnap.docs) await deleteDoc(doc(db, 'works', workId, 'chapters', chapId, 'ratings', r.id));
        await deleteDoc(doc(db, 'works', workId, 'chapters', chapId));
        showToast('Chapter/Eps dihapus');
        window.location.hash = `reader/${workId}`;
        renderPage();
      } catch (e) { showToast('Gagal hapus: ' + e.message); }
    };

    // ==================== KATEGORI ====================
    async function renderKategori(container) {
      container.innerHTML = `
        <h2 class="text-2xl font-bold mb-4">Kategori</h2>
        <p class="text-xs text-slate-500 mb-3">Klik kategori untuk filter. Karya bisa punya lebih dari 1 kategori.</p>
        <div class="flex flex-wrap gap-2 mb-6">
          <button class="cat-btn px-4 py-2 rounded-full bg-amber-500 text-black font-bold text-sm" data-cat="all">Semua</button>
          ${ALL_CATEGORIES.map(c => `<button class="cat-btn px-4 py-2 rounded-full bg-slate-800 hover:bg-slate-700 text-sm" data-cat="${c}">${c}</button>`).join('')}
        </div>
        <div id="kategoriList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
      `;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('bg-amber-500','text-black'));
          btn.classList.add('bg-amber-500','text-black');
          currentCategory = btn.dataset.cat;
          loadKategoriList();
        };
      });
      async function loadKategoriList() {
        const list = document.getElementById('kategoriList');
        try {
          const snap = await getDocs(collection(db, 'works'));
          let works = [];
          snap.forEach(d => works.push({ id: d.id, ...d.data() }));
          if (currentCategory !== 'all') {
            works = works.filter(w => parseCategories(w.category).includes(currentCategory));
          }
          works.sort((a, b) => (b.createdAt?.toDate?.() || 0) - (a.createdAt?.toDate?.() || 0));
          if (works.length === 0) {
            list.innerHTML = `<div class="col-span-full card-bg rounded-2xl p-12 text-center empty-animation"><i class="fas fa-folder-open text-5xl text-amber-400/50 mb-3"></i><p class="text-slate-300">Belum ada karya di kategori ini.</p></div>`;
            return;
          }
          list.innerHTML = works.map(work => {
            const cats = parseCategories(work.category);
            return `
            <div class="card-bg rounded-2xl overflow-hidden shadow-lg hover:border-amber-500/50 transition cursor-pointer ${work.isTamat ? 'tamat-border' : ''}" onclick="window.location.hash='reader/${work.id}'">
              <div class="h-40 bg-slate-800 flex items-center justify-center overflow-hidden relative">
                ${work.coverURL ? `<img src="${work.coverURL}" class="w-full h-full object-cover" onerror="this.style.display='none';">` : ''}
                ${work.isTamat ? '<span class="tamat-tag absolute top-2 right-2">TAMAT</span>' : ''}
              </div>
              <div class="p-4">
                <h3 class="font-bold">${work.title}</h3>
                <p class="text-xs text-slate-400 line-clamp-2">${work.teaser || ''}</p>
                <div class="flex flex-wrap gap-1 mt-2">
                  ${cats.slice(0, 2).map(c => `<span class="text-xs bg-slate-700 px-2 py-0.5 rounded-full">${c}</span>`).join('')}
                  ${cats.length > 2 ? `<span class="text-xs bg-slate-700 px-2 py-0.5 rounded-full">+${cats.length - 2}</span>` : ''}
                </div>
                <p class="text-xs text-amber-400 mt-2">${work.type === 'novel' ? 'Novel' : 'Komik'}</p>
              </div>
            </div>
          `}).join('');
        } catch (e) { list.innerHTML = `<p class="text-red-400">Gagal: ${e.message}</p>`; }
      }
      loadKategoriList();
    }

    // ==================== CHAT ====================
    async function renderChat(container) {
      container.innerHTML = `
        <h2 class="text-2xl font-bold mb-4"><i class="fas fa-comments text-amber-400 mr-2"></i>Chat Publik</h2>
        <p class="text-xs text-slate-500 mb-3">Hover pesan Anda sendiri untuk edit/hapus.</p>
        <div class="card-bg rounded-2xl p-4 h-[60vh] flex flex-col">
          <div id="chatMessages" class="flex-1 overflow-y-auto scrollbar-thin space-y-3 mb-3 p-2"></div>
          <div class="flex gap-2">
            <input id="chatInput" type="text" placeholder="Tulis pesan..." class="flex-1 bg-slate-800 border border-slate-700 rounded-full px-4 py-2 text-sm focus:outline-none focus:border-amber-500">
            <button id="sendChat" class="bg-amber-500 text-black px-5 py-2 rounded-full font-bold text-sm"><i class="fas fa-paper-plane"></i></button>
          </div>
        </div>
      `;
      const messagesDiv = document.getElementById('chatMessages');
      const input = document.getElementById('chatInput');
      const sendBtn = document.getElementById('sendChat');
      let rawMessages = [];

      if (chatUnsubscribe) chatUnsubscribe();
      const q = query(collection(db, 'chats'), orderBy('createdAt', 'asc'), limit(100));
      chatUnsubscribe = onSnapshot(q, (snapshot) => {
        rawMessages = [];
        snapshot.forEach(d => rawMessages.push({ id: d.id, ...d.data() }));
        renderChatMessages();
      });
      if (chatUsersUnsub) chatUsersUnsub();
      chatUsersUnsub = onSnapshot(collection(db, 'users'), (snap) => {
        usersCache = {};
        snap.forEach(d => { usersCache[d.id] = { id: d.id, ...d.data() }; });
        renderChatMessages();
      });

      function renderChatMessages() {
        if (rawMessages.length === 0) {
          messagesDiv.innerHTML = '<p class="text-slate-500 text-sm text-center">Belum ada pesan.</p>';
          return;
        }
        messagesDiv.innerHTML = rawMessages.map(msg => {
          const user = usersCache[msg.userId] || {};
          const username = user.username || msg.username || 'Anonim';
          const photoURL = user.photoURL || msg.photoURL || '';
          const userLevel = user.level || 1;
          const roles = user.roles || (user.role ? [user.role] : ['pembaca']);
          const isAdminMsg = roles.includes('admin') || msg.isAdmin;
          const isPenulisMsg = roles.includes('penulis');
          const isKomikusMsg = roles.includes('komikus');
          const isGoldenUser = userLevel > 1000;
          const isOwn = msg.userId === currentUser?.uid;
          let borderClass = 'bg-slate-800';
          if (isAdminMsg) borderClass = 'admin-chat-border';
          else if (isPenulisMsg) borderClass = 'penulis-chat-border';
          else if (isKomikusMsg) borderClass = 'komikus-chat-border';
          if (isOwn) borderClass += ' bg-amber-500/20';
          const editedTag = msg.edited ? '<span class="text-slate-500 text-xs italic">(diedit)</span>' : '';
          return `
            <div class="flex items-start gap-2 ${isOwn ? 'justify-end' : ''} group">
              ${!isOwn ? `<img src="${photoURL || 'https://ui-avatars.com/api/?name='+encodeURIComponent(username)}" class="w-8 h-8 rounded-full">` : ''}
              <div class="max-w-[70%] rounded-2xl px-3 py-2 ${borderClass}">
                <div class="flex items-center gap-2 text-xs mb-1 flex-wrap">
                  <span class="${isGoldenUser ? 'gold-glow font-bold' : 'text-slate-300 font-semibold'}">${username}</span>
                  ${isGoldenUser ? '<i class="fas fa-crown text-amber-400 text-xs"></i>' : ''}

    window.editChat = async (msgId) => {
      if (!currentUser) return;
      const msgRef = doc(db, 'chats', msgId);
      const snap = await getDoc(msgRef);
      if (!snap.exists()) return;
      if (snap.data().userId !== currentUser.uid) { showToast('Tidak bisa edit pesan orang lain'); return; }
      const textDiv = document.getElementById('msg-text-' + msgId);
      if (!textDiv) return;
      const originalText = snap.data().text || '';
      textDiv.innerHTML = `
        <div class="space-y-2">
          <textarea id="edit-text-${msgId}" rows="2" class="chat-edit-input">${originalText}</textarea>
          <div class="flex gap-2">
            <button onclick="saveEditChat('${msgId}')" class="bg-green-600 text-white px-3 py-1 rounded-lg text-xs font-bold">Simpan</button>
            <button onclick="cancelEditChat('${msgId}', '${originalText.replace(/'/g, "\\'")}')" class="bg-slate-600 text-white px-3 py-1 rounded-lg text-xs font-bold">Batal</button>
          </div>
        </div>
      `;
    };
    window.saveEditChat = async (msgId) => {
      const newText = document.getElementById('edit-text-' + msgId).value.trim();
      if (!newText) { showToast('Pesan kosong'); return; }
      await updateDoc(doc(db, 'chats', msgId), { text: sensorKataKasar(newText), edited: true, updatedAt: serverTimestamp() });
      showToast('Pesan diedit');
    };
    window.cancelEditChat = (msgId, originalText) => {
      const textDiv = document.getElementById('msg-text-' + msgId);
      if (textDiv) textDiv.textContent = originalText;
    };
    window.deleteChat = async (msgId) => {
      if (!currentUser) return;
      const msgRef = doc(db, 'chats', msgId);
      const snap = await getDoc(msgRef);
      if (!snap.exists()) return;
      if (snap.data().userId !== currentUser.uid) { showToast('Tidak bisa hapus pesan orang lain'); return; }
      if (!confirm('Yakin hapus pesan ini?')) return;
      await deleteDoc(msgRef);
      showToast('Pesan dihapus');
    };

                <label class="block text-xs font-semibold mb-1">Gambar Komik <span class="text-red-400">*</span></label>
                <p class="text-xs text-slate-500 mb-2">Paste URL ImgBB, satu URL per baris. Bebas berapa gambar.</p>
                <textarea id="ch-urls-${sid}" rows="6" placeholder="https://i.ibb.co/xxx/gambar1.jpg&#10;https://i.ibb.co/yyy/gambar2.jpg&#10;https://i.ibb.co/zzz/gambar3.jpg" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm font-mono text-xs"></textarea>
                <a href="https://imgbb.com" target="_blank" class="inline-block mt-2 text-xs bg-amber-500 text-black px-3 py-1 rounded font-bold"><i class="fas fa-external-link-alt mr-1"></i>Buka ImgBB</a>
              </div>
              `}
              <div class="flex gap-2">
                <button class="submitChapterBtn bg-green-600 text-white px-4 py-2 rounded-lg text-sm font-bold flex-1" data-worksid="${w.id}" data-type="${w.type}" data-sid="${sid}">
                  <i class="fas fa-save mr-1"></i>Simpan
                </button>
                <button class="cancelChapterBtn bg-slate-700 text-slate-300 px-4 py-2 rounded-lg text-sm font-bold" data-sid="${sid}">Batal</button>
              </div>
            </div>
          </div>
        `}).join('');

        document.querySelectorAll('.addChapterBtn').forEach(btn => {
          btn.onclick = () => {
            const sid = safeId(btn.dataset.worksid);
            const form = document.getElementById('chapter-form-' + sid);
            form.classList.toggle('hidden');
          };
        });
        document.querySelectorAll('.cancelChapterBtn').forEach(btn => {
          btn.onclick = () => document.getElementById('chapter-form-' + btn.dataset.sid).classList.add('hidden');
        });
        document.querySelectorAll('.tamatBtn').forEach(btn => {
          btn.onclick = async () => {
            const workId = btn.dataset.worksid;
            const isTamatNow = btn.dataset.tamat === 'true';
            if (!confirm(isTamatNow ? 'Buka status TAMAT?' : 'Tandai karya sebagai TAMAT?')) return;
            await updateDoc(doc(db, 'works', workId), { isTamat: !isTamatNow, updatedAt: serverTimestamp() });
            showToast(!isTamatNow ? 'Karya TAMAT' : 'Status dibatalkan');
            loadManage();
          };
        });
        document.querySelectorAll('.deleteWorkBtn').forEach(btn => {
          btn.onclick = async () => {
            const workId = btn.dataset.worksid;
            const title = btn.dataset.title;
            if (!confirm(`Hapus "${title}"?\n\nSemua chapter & komentar akan ikut terhapus!`)) return;
            try {
              const chapSnap = await getDocs(collection(db, 'works', workId, 'chapters'));
              for (const ch of chapSnap.docs) {
                const comSnap = await getDocs(collection(db, 'works', workId, 'chapters', ch.id, 'comments'));
                for (const com of comSnap.docs) await deleteDoc(doc(db, 'works', workId, 'chapters', ch.id, 'comments', com.id));
                const rateSnap = await getDocs(collection(db, 'works', workId, 'chapters', ch.id, 'ratings'));
                for (const r of rateSnap.docs) await deleteDoc(doc(db, 'works', workId, 'chapters', ch.id, 'ratings', r.id));
                await deleteDoc(doc(db, 'works', workId, 'chapters', ch.id));
              }
              await deleteDoc(doc(db, 'works', workId));
              showToast('Karya dihapus');
              loadManage();
            } catch (e) { showToast('Gagal: ' + e.message); }
          };
        });
        document.querySelectorAll('.deleteChapterBtn').forEach(btn => {
          btn.onclick = async (e) => {
            e.stopPropagation();
            const workId = btn.dataset.worksid;
            const chapId = btn.dataset.chapid;
            const chapNum = btn.dataset.chapnum;
            if (!confirm(`Hapus Chapter/Eps ${chapNum}?`)) return;
            try {
              const comSnap = await getDocs(collection(db, 'works', workId, 'chapters', chapId, 'comments'));
              for (const com of comSnap.docs) await deleteDoc(doc(db, 'works', workId, 'chapters', chapId, 'comments', com.id));
              const rateSnap = await getDocs(collection(db, 'works', workId, 'chapters', chapId, 'ratings'));
              for (const r of rateSnap.docs) await deleteDoc(doc(db, 'works', workId, 'chapters', chapId, 'ratings', r.id));
              await deleteDoc(doc(db, 'works', workId, 'chapters', chapId));
              showToast('Dihapus');
              loadManage();
            } catch (e) { showToast('Gagal: ' + e.message); }
          };
        });
        document.querySelectorAll('.submitChapterBtn').forEach(btn => {
          btn.onclick = async () => {
            const realWorkId = btn.dataset.worksid;
            const sid = btn.dataset.sid;
            const type = btn.dataset.type;
            let title = '';
            let content = '';
            let images = [];
            
            if (type === 'novel') {
              title = document.getElementById('ch-title-' + sid).value.trim();
              content = document.getElementById('ch-content-' + sid).value.trim();
              if (!title) { showToast('Judul Chapter wajib!'); return; }
              if (!content) { showToast('Isi cerita wajib!'); return; }
            } else {
              const titleInput = document.getElementById('ch-title-' + sid);
              title = titleInput ? titleInput.value.trim() : '';
              const urlText = document.getElementById('ch-urls-' + sid).value.trim();
              images = parseImgbbUrls(urlText);
              if (images.length === 0) { showToast('Paste minimal 1 URL ImgBB!'); return; }
            }
            
            const chapSnap = await getDocs(collection(db, 'works', realWorkId, 'chapters'));
            const nextNum = chapSnap.size + 1;
            await addDoc(collection(db, 'works', realWorkId, 'chapters'), {
              number: nextNum, title, content, images, createdAt: serverTimestamp()
            });
            showToast(`${type === 'novel' ? 'Chapter' : 'Eps'} ${nextNum} ditambahkan!`);
            loadManage();
          };
        });
      }

      document.getElementById('creatorTabUpload').onclick = () => loadUploadForm();
      document.getElementById('creatorTabManage').onclick = () => loadManage();
      loadManage();
    }

    // ==================== ADMIN PANEL ====================
    async function renderAdminPanel(container) {
      container.innerHTML = `
        <div class="flex justify-between items-center mb-4 flex-wrap gap-2">
          <h2 class="text-xl md:text-2xl font-bold"><i class="fas fa-crown text-amber-400 mr-2"></i>Admin Panel</h2>
          <div class="flex gap-2">
            <span class="text-xs text-amber-400 self-center hidden md:inline"><i class="fas fa-user-shield mr-1"></i>${adminEmail || 'Admin'} • Lv.${MAX_LEVEL}</span>
            <button id="adminLogoutBtn" class="bg-red-900/50 hover:bg-red-800 text-red-300 font-bold py-2 px-4 rounded-full text-xs">Logout Admin</button>
          </div>
        </div>
        <div class="flex flex-wrap gap-2 mb-6">
          <button id="adminTabUsers" class="px-4 py-2 rounded-full bg-amber-500 text-black font-bold text-sm">Kelola User</button>
          <button id="adminTabUpload" class="px-4 py-2 rounded-full bg-slate-800 text-slate-300 text-sm">Upload Karya</button>
          <button id="adminTabKritik" class="px-4 py-2 rounded-full bg-slate-800 text-slate-300 text-sm">Kritik & Saran</button>
          <button id="adminTabSettings" class="px-4 py-2 rounded-full bg-slate-800 text-slate-300 text-sm">Pengaturan</button>
        </div>
        <div id="adminContent"></div>
      `;
      document.getElementById('adminLogoutBtn').onclick = adminLogout;
      const adminContent = document.getElementById('adminContent');

      async function loadUsers() {
        const userList = await getDocs(collection(db, 'users'));
        const users = [];
        userList.forEach(d => users.push({ id: d.id, ...d.data() }));
        adminContent.innerHTML = `
          <div class="mb-4">
            <input id="adminSearchUser" type="text" placeholder="Cari username..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm">
          </div>
          <div class="space-y-3 max-h-[60vh] overflow-y-auto scrollbar-thin">
            ${users.map(u => {
              const roles = u.roles || [u.role || 'pembaca'];
              return `
              <div class="card-bg rounded-xl p-3 user-row" data-username="${(u.username || '').toLowerCase()}">
                <div class="flex items-center gap-2 mb-2">
                  <img src="${u.photoURL || 'https://ui-avatars.com/api/?name='+encodeURIComponent(u.username || 'U')}" class="w-10 h-10 rounded-full">
                  <div class="flex-1">
                    <p class="font-semibold text-sm">${u.username || 'User'}</p>
                    <p class="text-xs text-slate-400">${u.email || 'Guest'} • Lv.${u.level || 1}</p>
                  </div>
                  <button class="ban-btn ${u.banned ? 'bg-green-600' : 'bg-red-600'} text-white px-3 py-1 rounded-lg text-xs font-bold" data-uid="${u.id}" data-banned="${u.banned || false}">
                    ${u.banned ? 'Buka Ban' : 'Ban'}
                  </button>
                </div>
                <div class="flex flex-wrap gap-3 pl-12">
                  <label class="flex items-center gap-2 text-xs cursor-pointer">
                    <input type="checkbox" class="role-checkbox role-toggle" data-uid="${u.id}" data-role="pembaca" ${roles.includes('pembaca') ? 'checked' : ''}><span>Pembaca</span>
                  </label>
                  <label class="flex items-center gap-2 text-xs cursor-pointer">
                    <input type="checkbox" class="role-checkbox role-toggle" data-uid="${u.id}" data-role="penulis" ${roles.includes('penulis') ? 'checked' : ''}><span class="text-blue-400">Penulis</span>
                  </label>
                  <label class="flex items-center gap-2 text-xs cursor-pointer">
                    <input type="checkbox" class="role-checkbox role-toggle" data-uid="${u.id}" data-role="komikus" ${roles.includes('komikus') ? 'checked' : ''}><span class="text-purple-400">Komikus</span>
                  </label>
                  <label class="flex items-center gap-2 text-xs cursor-pointer">
                    <input type="checkbox" class="role-checkbox role-toggle" data-uid="${u.id}" data-role="admin" ${roles.includes('admin') ? 'checked' : ''}><span class="text-amber-400">Admin</span>
                  </label>
                </div>
              </div>
            `}).join('')}
          </div>
        `;
        document.querySelectorAll('.role-toggle').forEach(cb => {
          cb.onchange = async () => {
            const uid = cb.dataset.uid;
            const userRef = doc(db, 'users', uid);
            const snap = await getDoc(userRef);
            let roles = snap.data().roles || ['pembaca'];
            if (cb.checked) { if (!roles.includes(cb.dataset.role)) roles.push(cb.dataset.role); }
            else { roles = roles.filter(r => r !== cb.dataset.role); if (roles.length === 0) roles = ['pembaca']; }
            const priority = ['admin', 'penulis', 'komikus', 'pembaca'];
            let primary = 'pembaca';
            for (let p of priority) if (roles.includes(p)) { primary = p; break; }
            const updateData = { roles, role: primary };
            if (roles.includes('admin')) { updateData.level = MAX_LEVEL; updateData.exp = MAX_LEVEL * 20; }
            await updateDoc(userRef, updateData);
            showToast('Role diperbarui');
          };
        });
        document.querySelectorAll('.ban-btn').forEach(btn => {
          btn.onclick = async () => {
            const uid = btn.dataset.uid;
            const currentlyBanned = btn.dataset.banned === 'true';
            await updateDoc(doc(db, 'users', uid), { banned: !currentlyBanned });
            showToast(!currentlyBanned ? 'Diblokir' : 'Dibuka');
            loadUsers();
          };
        });
        document.getElementById('adminSearchUser').oninput = (e) => {
          const val = e.target.value.toLowerCase();
          document.querySelectorAll('.user-row').forEach(row => {
            row.style.display = row.dataset.username.includes(val) ? 'block' : 'none';
          });
        };
      }

      async function loadUploadForm() {
        adminContent.innerHTML = `
          <div class="card-bg rounded-2xl p-6 max-w-2xl mx-auto">
            <h3 class="font-bold text-lg mb-4">Upload Karya Baru (Admin)</h3>
            <div class="space-y-4">
              <div><label class="block text-sm font-semibold mb-1">Judul <span class="text-red-400">*</span></label>
                <input id="adminUploadTitle" type="text" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm"></div>
              <div><label class="block text-sm font-semibold mb-1">Teaser <span class="text-red-400">*</span> <span class="text-xs text-slate-500">(maks 150 karakter)</span></label>
                <input id="adminUploadTeaser" type="text" maxlength="150" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm"></div>
              <div><label class="block text-sm font-semibold mb-1">Tipe</label>
                <select id="adminUploadType" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm">
                  <option value="novel">Novel</option><option value="komik">Komik</option>
                </select></div>
              ${categoryCheckboxField('adminUploadCategories')}
              <div><label class="block text-sm font-semibold mb-1">Deskripsi</label>
                <textarea id="adminUploadDesc" rows="3" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm"></textarea></div>
              <div><label class="block text-sm font-semibold mb-1">Sampul <span class="text-red-400">*</span></label>
                ${imgbbUrlField('adminUploadCoverURL', 'URL Sampul dari ImgBB')}
              </div>
              <button id="adminUploadSubmit" class="w-full bg-amber-500 text-black font-bold py-3 rounded-full">Upload Karya</button>
            </div>
          </div>
        `;
        document.getElementById('adminUploadSubmit').onclick = async () => {
          const title = document.getElementById('adminUploadTitle').value.trim();
          const teaser = document.getElementById('adminUploadTeaser').value.trim();
          const type = document.getElementById('adminUploadType').value;
          const cats = getSelectedCategories('adminUploadCategories');
          const category = cats.join(', ');
          const desc = document.getElementById('adminUploadDesc').value.trim();
          const coverURL = document.getElementById('adminUploadCoverURL').value.trim();
          if (!title || !teaser || cats.length === 0 || !coverURL) { showToast('Wajib diisi!'); return; }
          if (teaser.length > 150) { showToast('Teaser maks 150 karakter!'); return; }
          showToast('Menyimpan...');
          try {
            await addDoc(collection(db, 'works'), {
              title, teaser, type, category, description: desc, coverURL,
              authorId: currentUser?.uid || 'admin', authorName: userProfile?.username || 'Admin',
              authorLevel: MAX_LEVEL, avgRating: 0, ratingCount: 0,
              isTamat: false, createdAt: serverTimestamp(), updatedAt: serverTimestamp()
            });
            showToast('Karya dibuat!');
            window.location.hash = 'creator';
          } catch (e) { showToast('Gagal: ' + e.message); }
        };
      }

      async function loadKritik() {
        adminContent.innerHTML = `<div class="card-bg rounded-2xl p-6"><h3 class="font-bold mb-4">Kritik & Saran</h3><div id="kritikList" class="space-y-3">Memuat...</div></div>`;
        const snap = await getDocs(query(collection(db, 'kritik_saran'), orderBy('createdAt', 'desc'), limit(50)));
        const list = document.getElementById('kritikList');
        const items = [];
        snap.forEach(d => items.push({ id: d.id, ...d.data() }));
        if (items.length === 0) { list.innerHTML = '<p class="text-slate-400">Belum ada.</p>'; return; }
        list.innerHTML = items.map(k => `
          <div class="comment-card rounded-xl p-3">
            <div class="flex items-center gap-2 text-xs mb-1">
              <span class="font-semibold text-amber-400">${k.nama || 'Anonim'}</span>
              <span class="bg-slate-700 px-2 py-0.5 rounded-full">${k.jenis}</span>
              <span class="text-slate-500 ml-auto">${formatDate(k.createdAt)}</span>
            </div>
            <p class="text-sm whitespace-pre-wrap">${k.pesan}</p>
          </div>
        `).join('');
      }

      async function loadSettings() {
        adminContent.innerHTML = `
          <div class="card-bg rounded-2xl p-6 max-w-lg mx-auto">
            <h3 class="font-bold text-lg mb-4">Pengaturan</h3>
            <div class="space-y-4">
              <div>
                <label class="block text-sm font-semibold mb-1">Nomor WA Admin</label>
                <input id="adminWANumber" type="text" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm" value="${localStorage.getItem('adminWA') || DEFAULT_WA}">
              </div>
              <button id="saveSettings" class="w-full bg-amber-500 text-black font-bold py-2 rounded-full">Simpan</button>
            </div>
          </div>
        `;
        document.getElementById('saveSettings').onclick = () => {
          localStorage.setItem('adminWA', document.getElementById('adminWANumber').value.trim());
          showToast('Disimpan');
        };
      }

      document.getElementById('adminTabUsers').onclick = () => loadUsers();
      document.getElementById('adminTabUpload').onclick = () => loadUploadForm();
      document.getElementById('adminTabKritik').onclick = () => loadKritik();
      document.getElementById('adminTabSettings').onclick = () => loadSettings();
      loadUsers();
    }

    // ==================== NAV (DESKTOP) ====================
    document.getElementById('navHome').onclick = () => { window.location.hash = 'home'; };
    document.getElementById('navKategori').onclick = () => { window.location.hash = 'kategori'; };
    document.getElementById('navLeaderboard').onclick = () => { window.location.hash = 'leaderboard'; };
    document.getElementById('navChat').onclick = () => { window.location.hash = 'chat'; };
    document.getElementById('navKritik').onclick = () => { window.location.hash = 'kritik'; };
    document.getElementById('navProfil').onclick = () => { window.location.hash = 'profil'; };
    document.getElementById('navCreator').onclick = () => { window.location.hash = 'creator'; };
    document.getElementById('navAdmin').onclick = () => { window.location.hash = 'admin'; };
    
    // Auth button (desktop & mobile)
    function handleAuthClick() {
      if (currentUser) logout();
      else {
        const modal = document.getElementById('modalContainer');
        const content = document.getElementById('modalContent');
        content.innerHTML = `
          <div class="text-center mb-4">
            <img src="${LOGO_URL}" alt="Logo" class="w-20 h-20 mx-auto rounded-2xl mb-3 border-2 border-amber-500">
            <h3 class="text-xl font-bold">Masuk ke KomiNovel</h3>
            <p class="text-xs text-slate-400 mt-1">Untuk akun & PP, wajib login Google.</p>
          </div>
          <div class="flex flex-col gap-3">
            <button id="modalGoogle" class="bg-white text-black font-bold py-3 rounded-full"><i class="fab fa-google mr-2"></i>Masuk dengan Google</button>
            <button id="modalGuest" class="bg-slate-700 text-slate-300 font-bold py-2 rounded-full text-xs">Masuk sebagai Guest</button>
          </div>
        `;
        modal.classList.remove('hidden');
        document.getElementById('modalGoogle').onclick = () => { signInWithGoogle(); modal.classList.add('hidden'); };
        document.getElementById('modalGuest').onclick = () => { signInAsGuest(); modal.classList.add('hidden'); };
      }
    }
    document.getElementById('navAuth').onclick = handleAuthClick;
    document.getElementById('navAuthMobile').onclick = handleAuthClick;
    
    document.getElementById('modalContainer').onclick = (e) => {
      if (e.target.id === 'modalContainer') e.target.classList.add('hidden');
    };
    window.addEventListener('hashchange', () => renderPage());

    // ==================== INIT ====================
    (async function init() {
      await initAuth();
      if (localStorage.getItem('adminSession') === 'true') {
        isAdminSession = true;
        adminEmail = localStorage.getItem('adminEmail');
        document.getElementById('navAdmin').classList.remove('hidden');
      }
      if (!window.location.hash) window.location.hash = 'home';
      renderPage();
    })();

  </script>
</body>
</html>
