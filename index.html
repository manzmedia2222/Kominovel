  }

  if (currentChapter) {
    let saveTimer = null;
    const savePos = () => { const scrollY = window.scrollY || document.documentElement.scrollTop; if (scrollY > 100) saveReadingPos(novelId, currentChapter.id, scrollY); };
    const scrollHandler = () => { if (saveTimer) clearTimeout(saveTimer); saveTimer = setTimeout(savePos, 500); };
    window.addEventListener('scroll', scrollHandler, { passive: true });
    window.addEventListener('beforeunload', savePos);
  }

  if (!currentChapter) return;
  const commentsRef = collection(db, 'works', novelId, 'chapters', currentChapter.id, 'comments');
  const ratingsRef = collection(db, 'works', novelId, 'chapters', currentChapter.id, 'ratings');

  onSnapshot(ratingsRef, async (snap) => {
    const summaryDiv = document.getElementById('ratingSummary');
    if (!summaryDiv) return;
    const arr = []; snap.forEach(d => arr.push({ id: d.id, ...d.data() }));
    if (arr.length === 0) { summaryDiv.innerHTML = '<p class="text-xs text-slate-500">Belum ada rating.</p>'; return; }

    for (const r of arr) {
      if (!usersCache[r.userId]) {
        try {
          const uSnap = await getDoc(doc(db, 'users', r.userId));
          if (uSnap.exists()) usersCache[r.userId] = { id: r.userId, ...uSnap.data() };
        } catch (e) {}
      }
    }

    const avg = arr.reduce((s, r) => s + (r.rating || 0), 0) / arr.length;
    summaryDiv.innerHTML = `
      <div class="flex items-center gap-3 mb-3 flex-wrap">
        <div class="text-3xl font-black text-amber-400">${avg.toFixed(1)}</div>
        <div>
          <div class="flex">${[1,2,3,4,5].map(n => `<i class="fas fa-star ${n <= Math.round(avg) ? 'text-amber-400' : 'text-slate-600'}"></i>`).join('')}</div>
          <p class="text-xs text-slate-400">${arr.length} rating</p>
        </div>
      </div>
      <div class="flex flex-wrap gap-1">
        ${arr.map(r => {
          const u = usersCache[r.userId] || {};
          let un = u.username || r.username || '';
          if (!un || un === 'User' || un === 'Guest') un = 'Anonim';
          const uPhoto = u.photoURL || r.photoURL || '';
          const vB = getVerifiedBadge(u.followerCount || 0) + getCreatorVerifiedBadge(u);
          return `<div class="rating-display user-rating" title="${un} kasih ${r.rating} bintang">
            <img src="${uPhoto || 'https://ui-avatars.com/api/?name='+encodeURIComponent(un)}" class="w-4 h-4 rounded-full">
            <span class="text-xs text-slate-300">${un}${vB}</span>
            ${getRoleTagsForUid(r.userId, u)}
            <span class="text-amber-400 font-bold">${r.rating}★</span>
          </div>`;
        }).join('')}
      </div>`;
  });

  onSnapshot(query(commentsRef, orderBy('createdAt', 'desc')), async (snap) => {
    const div = document.getElementById('commentsList');
    if (!div) return;
    const arr = []; snap.forEach(d => arr.push({ id: d.id, ...d.data() }));
    const uniqueUids = [...new Set(arr.map(c => c.userId))];
    await Promise.all(uniqueUids.map(async uid => {
      if (!usersCache[uid]) {
        try {
          const uSnap = await getDoc(doc(db, 'users', uid));
          if (uSnap.exists()) usersCache[uid] = { id: uid, ...uSnap.data() };
        } catch (e) {}
      }
    }));
    const parents = arr.filter(c => !c.parentId);
    const replies = arr.filter(c => c.parentId);
    if (parents.length === 0) { div.innerHTML = '<p class="text-slate-500 text-sm">Belum ada komentar.</p>'; return; }
    div.innerHTML = parents.map(c => {
      const cReps = replies.filter(r => r.parentId === c.id);
      const isOwnComment = currentUser && c.userId === currentUser.uid;
      const canDelete = isOwnComment || isAdminUser(userProfile);
      const u = usersCache[c.userId] || {};
      const vB = getVerifiedBadge(u.followerCount || 0) + getCreatorVerifiedBadge(u);
      return `<div class="comment-card rounded-xl p-3 card-anim" data-commentid="${c.id}">
        <div class="flex items-start gap-2">
          <img src="${c.photoURL || 'https://ui-avatars.com/api/?name='+encodeURIComponent(c.username||'U')}" class="w-8 h-8 rounded-full cursor-pointer hover:scale-110 transition" onclick="window.location.hash='user/${c.userId}'">
          <div class="flex-1">
            <div class="flex items-center gap-2 text-xs mb-1 flex-wrap">
              <span class="${isGolden(c.userLevel) ? 'gold-glow font-bold' : 'text-slate-300 font-semibold'} cursor-pointer" onclick="window.location.hash='user/${c.userId}'">${c.username || 'Anonim'}${vB}</span>
              ${isGolden(c.userLevel) ? '<i class="fas fa-crown text-amber-400 text-xs"></i>' : ''}
              <span class="text-slate-500">Lv.${c.userLevel || 1}</span>
              ${getRoleTagsForUid(c.userId, u)}
              <span class="text-slate-500">• ${fmtDate(c.createdAt)}</span>
              ${c.edited ? '<span class="text-slate-500 text-xs italic">(diedit)</span>' : ''}
            </div>
            <div id="comment-text-${c.id}" class="text-sm">${sensor(c.text || '')}</div>
            <div class="flex items-center gap-3 mt-2 text-xs">
              <button onclick="likeComment('${novelId}','${currentChapter.id}','${c.id}')" class="text-slate-400 hover:text-red-400 transition"><i class="fas fa-heart"></i> ${c.likes || 0}</button>
              <button onclick="showReplyInput('${c.id}')" class="text-slate-400 hover:text-amber-400 transition"><i class="fas fa-reply"></i> Balas</button>
              ${isOwnComment ? `<button onclick="editComment('${novelId}','${currentChapter.id}','${c.id}')" class="text-blue-400 hover:text-blue-300 transition"><i class="fas fa-edit"></i> Edit</button>` : ''}
              ${canDelete ? `<button onclick="deleteComment('${novelId}','${currentChapter.id}','${c.id}')" class="text-red-400 hover:text-red-300 transition"><i class="fas fa-trash"></i> Hapus</button>` : ''}
            </div>
            <div id="reply-input-${c.id}" class="hidden mt-2 flex gap-2"><input type="text" id="reply-text-${c.id}" placeholder="Balasan..." class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-xs"><button onclick="submitReply('${novelId}','${currentChapter.id}','${c.id}')" class="bg-amber-500 text-black px-3 py-1.5 rounded-lg text-xs font-bold">Kirim</button></div>
            ${cReps.length > 0 ? `<div class="mt-3 space-y-2">${cReps.map(r => {
              const ru = usersCache[r.userId] || {};
              const rvB = getVerifiedBadge(ru.followerCount || 0) + getCreatorVerifiedBadge(ru);
              return `<div class="reply-indent">
                <div class="flex items-start gap-2">
                  <img src="${r.photoURL || 'https://ui-avatars.com/api/?name='+encodeURIComponent(r.username||'U')}" class="w-6 h-6 rounded-full">
                  <div><span class="${isGolden(r.userLevel) ? 'gold-glow font-bold' : 'text-slate-300'} text-xs">${r.username}${rvB}</span> ${getRoleTagsForUid(r.userId, ru)}<p class="text-xs">${sensor(r.text || '')}</p></div>
                </div>
              </div>`;
            }).join('')}</div>` : ''}
          </div>
        </div>
      </div>`;
    }).join('');
  });

  let selRating = 0;
  document.querySelectorAll('#ratingStars .star-rating').forEach(s => s.onclick = () => {
    selRating = parseInt(s.dataset.star);
    document.querySelectorAll('#ratingStars .star-rating').forEach((x, i) => { x.classList.toggle('text-amber-400', i < selRating); x.classList.toggle('text-slate-600', i >= selRating); });
    s.classList.add('star-pop');
    setTimeout(() => s.classList.remove('star-pop'), 300);
    document.getElementById('ratingText').textContent = selRating + ' bintang';
  });
  document.getElementById('submitComment').onclick = async () => {
    if (!currentUser || !userProfile) { showToast('Login dulu'); return; }
    const text = document.getElementById('commentInput').value.trim();
    if (!text && selRating === 0) { showToast('Tulis komentar/rating'); return; }
    const uname = userProfile.username || currentUser.displayName || 'User';
    const uphoto = userProfile.photoURL || currentUser.photoURL || '';
    if (text) {
      await addDoc(commentsRef, { userId: currentUser.uid, username: uname, photoURL: uphoto, userLevel: userProfile.level || 1, isAdmin: isAdminUser(userProfile), isPenulis: hasRole(userProfile, 'penulis'), isKomikus: hasRole(userProfile, 'komikus'), text: sensor(text), likes: 0, parentId: null, edited: false, createdAt: serverTimestamp() });
      await trackWorkActivity(novelId,'comments',1);
      await addExp(EXP_PER_COMMENT);
    }
    if (selRating > 0) {
      await setDoc(doc(db, 'works', novelId, 'chapters', currentChapter.id, 'ratings', currentUser.uid), { userId: currentUser.uid, rating: selRating, username: uname, photoURL: uphoto, createdAt: serverTimestamp() });
      await recalcWorkRating(novelId);
    }
    document.getElementById('commentInput').value = ''; selRating = 0;
    document.querySelectorAll('#ratingStars .star-rating').forEach(s => { s.classList.remove('text-amber-400'); s.classList.add('text-slate-600'); });
    document.getElementById('ratingText').textContent = 'Pilih';
    showToast('Terkirim');
  };
}

async function recalcWorkRating(workId) {
  const cs = await getDocs(collection(db, 'works', workId, 'chapters'));
  let total = 0, count = 0;
  for (const ch of cs.docs) {
    const rs = await getDocs(collection(db, 'works', workId, 'chapters', ch.id, 'ratings'));
    rs.forEach(r => { total += r.data().rating || 0; count++; });
  }
  await updateDoc(doc(db, 'works', workId), { avgRating: count > 0 ? total/count : 0, ratingCount: count, updatedAt: serverTimestamp() });
}

async function renderKategori(container) {
  const allCats = [...new Set([...ALL_CATEGORIES, ...customCategories.map(c => c.name)])];
  selectedCategories = Array.isArray(selectedCategories) ? selectedCategories : [];
  container.innerHTML = `
    <div class="flex items-center justify-between gap-3 flex-wrap mb-4">
      <div><h2 class="text-2xl font-bold">Kategori</h2><p class="text-xs text-slate-400 mt-1">Pilih lebih dari satu kategori untuk memperluas pencarian.</p></div>
      <button id="v111ClearCats" class="text-xs bg-slate-800 px-3 py-2 rounded-full font-bold">Reset</button>
    </div>
    <div class="v111-cat-summary mb-4" id="v111CatSummary">Semua kategori</div>
    <div class="flex flex-wrap gap-2 mb-6" id="catContainer">
      ${allCats.map(c => `<button class="cat-btn cat-chip ${selectedCategories.includes(c) ? 'v111-cat-selected' : ''}" data-cat="${escAttr(c)}">${escHtml(c)}</button>`).join('')}
    </div>
    <div id="kategoriList" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 md:gap-5"></div>`;
  const summary = document.getElementById('v111CatSummary');
  const refreshSummary = () => {
    summary.textContent = selectedCategories.length
      ? `Dipilih: ${selectedCategories.join(', ')} • menampilkan karya yang memiliki minimal satu kategori`
      : 'Semua kategori';
  };
  document.querySelectorAll('#catContainer .cat-btn').forEach(b => b.onclick = () => {
    const cat = b.dataset.cat;
    if (selectedCategories.includes(cat)) {
      selectedCategories = selectedCategories.filter(x => x !== cat);
      b.classList.remove('v111-cat-selected');
    } else {
      selectedCategories.push(cat);
      b.classList.add('v111-cat-selected');
    }
    refreshSummary();
    loadKL();
  });
  document.getElementById('v111ClearCats').onclick = () => {
    selectedCategories = [];
    document.querySelectorAll('#catContainer .cat-btn').forEach(x => x.classList.remove('v111-cat-selected'));
    refreshSummary();
    loadKL();
  };
  async function loadKL() {
    const list = document.getElementById('kategoriList');
    if (!list) return;
    const snap = await getDocs(collection(db, 'works'));
    let works = []; snap.forEach(d => works.push({ id: d.id, ...d.data() }));
    works = works.filter(w => !isNonPublish(w) && !isTakedown(w));
    if (selectedCategories.length) {
      works = works.filter(w => {
        const cats = parseCategories(w.category);
        return selectedCategories.some(cat => cats.includes(cat));
      });
    }
    works.sort((a,b) => (b.views || 0) + (b.likes || 0) * 2 - ((a.views || 0) + (a.likes || 0) * 2));
    const authorIds = works.map(w => w.authorId).filter(Boolean);
    await ensureAuthorProfiles(authorIds, () => {
      if (document.getElementById('kategoriList')) renderWorkList(document.getElementById('kategoriList'), works, new Set(), true);
    });
    if (works.length === 0) {
      list.innerHTML = `<div class="col-span-full card-bg rounded-2xl p-12 text-center card-anim"><i class="fas fa-folder-open text-5xl text-amber-400/50 mb-3"></i><p>Belum ada karya dengan kategori tersebut.</p></div>`;
      return;
    }
    renderWorkList(list, works, new Set(), true);
  }
  refreshSummary();
  loadKL();
}

    <h2 class="text-2xl font-bold mb-4"><i class="fas fa-trophy text-amber-400 mr-2 badge-float"></i>Leaderboard</h2>
    <div class="flex gap-2 mb-6">
      <button id="lbKomik" class="px-5 py-2 rounded-full font-bold text-sm ${currentContentType === 'komik' ? 'bg-orange-500 text-white' : 'bg-slate-800 text-slate-300'}">Komik</button>
      <button id="lbNovel" class="px-5 py-2 rounded-full font-bold text-sm ${currentContentType === 'novel' ? 'bg-amber-500 text-black' : 'bg-slate-800 text-slate-300'}">Novel</button>
    </div>
    <div id="leaderboardList" class="space-y-3"></div>`;
  document.getElementById('lbKomik').onclick = () => { currentContentType='komik'; renderPage(); };
  document.getElementById('lbNovel').onclick = () => { currentContentType='novel'; renderPage(); };
  const list = document.getElementById('leaderboardList');
  const snap = await getDocs(query(collection(db,'works'), where('type','==',currentContentType)));
  let works = []; snap.forEach(d => works.push({ id: d.id, ...d.data() }));
  works = works.filter(w => !isTakedown(w) && !isNonPublish(w));
  works.sort((a,b) => (b.avgRating || 0) - (a.avgRating || 0) || (b.ratingCount || 0) - (a.ratingCount || 0));
  works = works.slice(0,20);
  if (works.length === 0) { list.innerHTML = '<div class="card-bg rounded-2xl p-8 text-center text-slate-400">Belum ada.</div>'; return; }
  const rankColors = ['bg-gradient-to-br from-yellow-400 to-amber-600 text-black', 'bg-gradient-to-br from-slate-300 to-slate-500 text-black', 'bg-gradient-to-br from-amber-700 to-amber-900 text-white'];
  list.innerHTML = works.map((w,i) => `
    <div class="card-bg hover-lift rounded-2xl p-4 flex items-center gap-4 cursor-pointer card-anim ${isUnggulan(w) ? 'unggulan-border' : ''}" style="animation-delay:${i*0.05}s" onclick="window.location.hash='reader/${w.id}'">
      <div class="leaderboard-rank ${i < 3 ? rankColors[i] : 'bg-slate-700 text-slate-300'}">${i+1}</div>
      <div class="w-16 h-20 bg-slate-800 rounded-lg overflow-hidden">${w.coverURL ? `<img src="${w.coverURL}" class="w-full h-full object-cover">` : ''}</div>
      <div class="flex-1 min-w-0"><h3 class="font-bold truncate">${w.title}${isUnggulan(w) ? ' ⭐' : ''}</h3><p class="text-xs text-slate-400 line-clamp-2">${w.teaser || ''}</p>
        <div class="flex gap-3 mt-1 text-[10px] text-slate-400">
          <span><i class="fas fa-eye text-amber-400"></i> ${formatCount(w.views || 0)}</span>
          <span><i class="fas fa-heart" style="color:#ef4444"></i> ${formatCount(w.likes || 0)}</span>
        </div>
      </div>
      <div class="text-right"><div class="text-amber-400 font-black">${(w.avgRating || 0).toFixed(1)}</div><div class="text-xs text-slate-400">${w.ratingCount || 0}</div></div>
    </div>`).join('');
}

async function renderChat(container) {
  markNotifSeen('chat', Date.now());
  container.innerHTML = `
    <h2 class="text-2xl font-bold mb-4"><i class="fas fa-comments text-amber-400 mr-2"></i>Chat Publik</h2>
    <div class="card-bg rounded-2xl p-4 h-[65vh] flex flex-col card-anim">
      <div id="chatMessages" class="flex-1 overflow-y-auto scrollbar-thin space-y-3 mb-3 p-2"></div>
      <div id="publicReplyPreview"></div>
      <div id="publicStickerPreview"></div>
      <div id="publicImgPreview"></div>
      <div class="flex gap-2 items-center mt-2">
        <button class="sticker-send-btn" title="Stiker" onclick="window.openStickerPanel('public')"><i class="fas fa-sticky-note text-lg"></i></button>
        <label class="chat-img-send-btn" title="Kirim gambar"><i class="fas fa-image text-lg"></i><input type="file" id="publicImgInput" accept="image/*"></label>
        <input id="chatInput" type="text" placeholder="Tulis pesan..." class="flex-1 bg-slate-800 border border-slate-700 rounded-full px-4 py-2 text-sm focus:border-amber-500 transition">
        <button id="sendChat" class="bg-amber-500 text-black px-5 py-2 rounded-full font-bold text-sm hover:scale-105 transition"><i class="fas fa-paper-plane"></i></button>
      </div>
    </div>`;
  const messagesDiv = document.getElementById('chatMessages');
  const input = document.getElementById('chatInput');
  const sendBtn = document.getElementById('sendChat');
  let rawMessages = [];
  let lastId = null;
  chatUnsub = onSnapshot(query(collection(db,'chats'), orderBy('createdAt','asc'), limit(100)), snapshot => {
    rawMessages = []; snapshot.forEach(d => rawMessages.push({ id: d.id, ...d.data() }));
    renderMsgs();
  });
  chatUsersUnsub = onSnapshot(collection(db,'users'), snap => {
    snap.forEach(d => usersCache[d.id] = { id: d.id, ...d.data() });
    renderMsgs();
  });
  onSnapshot(collection(db,'clans'), snap => {
    clansCache = {}; snap.forEach(d => clansCache[d.id] = { id: d.id, ...d.data() });
    renderMsgs();
  });
  function renderMsgs() {
    if (rawMessages.length === 0) { messagesDiv.innerHTML = '<p class="text-slate-500 text-sm text-center">Belum ada pesan.</p>'; return; }
    const lastMsg = rawMessages[rawMessages.length - 1];
    const isNew = lastId && lastMsg.id !== lastId;
    messagesDiv.innerHTML = rawMessages.map((msg, idx) => {
      const u = usersCache[msg.userId] || (msg.userId === currentUser?.uid ? userProfile : {}) || {};
      const un = u.username || msg.username || 'Anonim';
      const pu = u.photoURL || msg.photoURL || '';
      const ul = u.level || 1;
      const roles = u.roles || (u.role ? [u.role] : ['pembaca']);
      const isO = roles.includes('owner'), isA = roles.includes('admin'), isP = roles.includes('penulis'), isK = roles.includes('komikus');
      const isG = ul > 1000;
      const vB = getVerifiedBadge(u.followerCount || 0) + getCreatorVerifiedBadge(u);
      const own = msg.userId === currentUser?.uid;
      const clanId = u.clanId;
      const clan = clanId ? clansCache[clanId] : null;
      let bc = 'pembaca-chat-border';
      if (isO) bc = 'owner-chat-border';
      else if (isA) bc = 'admin-chat-border';
      else if (clan) bc = 'clan-chat-border';
      else if (isP) bc = 'penulis-chat-border';
      else if (isK) bc = 'komikus-chat-border';
      const isImgOnly = (msg.image || msg.sticker) && !msg.text;
      if (own) bc += ' bg-amber-500/20';
      if (isImgOnly) bc = 'chat-img-msg';
      const isLast = idx === rawMessages.length - 1;
      const anim = isLast && isNew ? (own ? 'chat-msg-new-own' : 'chat-msg-new') : '';
      const tagsHtml = getRoleTagsForUid(msg.userId, u);
      let replyPreview = '';
      if (msg.replyTo && msg.replyToText) {
        replyPreview = `<div class="reply-preview"><i class="fas fa-reply text-amber-400 mr-1"></i><b class="text-amber-400">${msg.replyToName || 'Anonim'}:</b> ${sensor(msg.replyToText).slice(0, 80)}</div>`;
      }
      return `<div class="flex items-start gap-2 ${own ? 'justify-end' : ''} group ${anim}" data-publicmsgid="${msg.id}">
        ${!own ? `<img src="${pu || 'https://ui-avatars.com/api/?name='+encodeURIComponent(un)}" class="w-8 h-8 rounded-full cursor-pointer hover:scale-110 transition" onclick="window.location.hash='user/${msg.userId}'">` : ''}
        <div class="max-w-[75%] rounded-2xl px-3 py-2 ${bc}">
          ${!isImgOnly ? `<div class="flex items-center gap-1 flex-wrap text-xs mb-1">
            <span class="${isG ? 'gold-glow font-bold' : 'text-slate-300 font-semibold'} cursor-pointer hover:underline" onclick="window.location.hash='user/${msg.userId}'">${un}${vB}</span>
            ${isG ? '<i class="fas fa-crown text-amber-400 text-xs"></i>' : ''}
            ${tagsHtml}
            <span class="text-slate-500">Lv.${ul}</span>
            ${msg.edited ? '<span class="text-slate-500 text-xs italic">(diedit)</span>' : ''}
          </div>` : ''}
          ${replyPreview}
          ${msg.sticker ? `<img src="${msg.sticker}" class="chat-sticker" onclick="window.showImgFullscreen('${escAttr(msg.sticker)}','Stiker dari ${escAttr(un)}')">` : ''}
          ${msg.image && !msg.sticker ? `<img src="${msg.image}" class="chat-img" onclick="window.showImgFullscreen('${escAttr(msg.image)}','Gambar dari ${escAttr(un)}')">` : ''}
          ${msg.text ? `<div id="pubmt-${msg.id}" class="text-sm ${msg.image || msg.sticker ? 'mt-1' : ''}">${sensor(msg.text || '')}</div>` : `<div id="pubmt-${msg.id}" class="hidden"></div>`}
          <div class="flex gap-2 mt-1 text-xs">
            <button onclick="replyPubMsg('${msg.id}')" class="text-slate-400 hover:text-green-400 transition opacity-0 group-hover:opacity-100"><i class="fas fa-reply"></i> Balas</button>
            ${own ? `
              ${!msg.image && !msg.sticker ? `<button onclick="editPubMsg('${msg.id}')" class="text-blue-400 hover:text-blue-300 transition opacity-0 group-hover:opacity-100"><i class="fas fa-edit"></i> Edit</button>` : ''}
              <button onclick="delPubMsg('${msg.id}')" class="text-red-400 hover:text-red-300 transition opacity-0 group-hover:opacity-100"><i class="fas fa-trash"></i> Hapus</button>
            ` : ''}
          </div>
        </div>
        ${own ? `<img src="${pu || 'https://ui-avatars.com/api/?name='+encodeURIComponent(un)}" class="w-8 h-8 rounded-full">` : ''}
      </div>`;
    }).join('');
    lastId = lastMsg.id;
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  const pubImgInput = document.getElementById('publicImgInput');
  const pubImgPreview = document.getElementById('publicImgPreview');
  pubImgInput.onchange = async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    pubImgPreview.innerHTML = '<p class="text-xs text-amber-400 mb-2">Mengupload...</p>';
    try {
      const dataUrl = await compressImage(f);
      pendingChatImg.public = dataUrl;
      pubImgPreview.innerHTML = `<div class="chat-img-preview"><img src="${dataUrl}"><span class="remove-btn" onclick="event.stopPropagation();window.cancelChatImg('public')">×</span></div>`;
    } catch (err) { pubImgPreview.innerHTML = `<p class="text-xs text-red-400 mb-1">Gagal: ${err.message}</p>`; }
    pubImgInput.value = '';
  };

  sendBtn.onclick = async () => {
    const text = input.value.trim();
    const img = pendingChatImg.public;
    const sticker = pendingChatSticker.public;
    if ((!text && !img && !sticker) || !currentUser) { showToast('Login dulu'); return; }
    const msgData = {
      userId: currentUser.uid, username: userProfile.username || 'Guest',
      photoURL: userProfile.photoURL || '', userLevel: userProfile.level || 1,
      isAdmin: isAdminUser(userProfile), isPenulis: hasRole(userProfile,'penulis'), isKomikus: hasRole(userProfile,'komikus'),
      text: text ? sensor(text) : '', edited: false, createdAt: serverTimestamp()
    };
    if (img) msgData.image = img;
    if (sticker) msgData.sticker = sticker;
    if (replyingToPublic) { msgData.replyTo = replyingToPublic.id; msgData.replyToText = replyingToPublic.text || (replyingToPublic.image ? '🖼️ Gambar' : (replyingToPublic.sticker ? '🎨 Stiker' : '')); msgData.replyToName = replyingToPublic.username; }
    const publicMsgRef = await addDoc(collection(db,'chats'), msgData);
    pushNotify({ kind: 'chat', id: publicMsgRef.id });
    input.value = '';
    replyingToPublic = null;
    pendingChatImg.public = null;
    pendingChatSticker.public = null;
    document.getElementById('publicReplyPreview').innerHTML = '';
    document.getElementById('publicImgPreview').innerHTML = '';
    document.getElementById('publicStickerPreview').innerHTML = '';
    await addExp(EXP_PER_CHAT);
  };
  input.addEventListener('keypress', e => { if (e.key === 'Enter') sendBtn.click(); });
}
window.replyPubMsg = (msgId) => {
  const el = document.querySelector(`[data-publicmsgid="${msgId}"]`);
  if (!el) return;
  const text = el.querySelector(`#pubmt-${msgId}`)?.textContent || '';
  const username = el.querySelector('span.font-semibold, span.gold-glow')?.textContent || 'Anonim';
  const img = el.querySelector('.chat-img')?.src || '';
  const sticker = el.querySelector('.chat-sticker')?.src || '';
  replyingToPublic = { id: msgId, text, username, image: img, sticker };
  const preview = sticker ? '🎨 Stiker' : (img ? '🖼️ Gambar' : `${text.slice(0, 60)}${text.length > 60 ? '...' : ''}`);
  document.getElementById('publicReplyPreview').innerHTML = `
    <div class="flex items-center justify-between bg-amber-500/10 border-l-2 border-amber-500 rounded px-3 py-2 mb-2">
      <div class="text-xs"><i class="fas fa-reply text-amber-400 mr-2"></i><b class="text-amber-400">${username}:</b> <span class="text-slate-300">${preview}</span></div>
      <button onclick="cancelReplyPub()" class="text-red-400 hover:text-red-300 text-lg">&times;</button>
    </div>`;
  document.getElementById('chatInput')?.focus();
};
window.cancelReplyPub = () => { replyingToPublic = null; document.getElementById('publicReplyPreview').innerHTML = ''; };
window.editPubMsg = async (id) => {
  const ref = doc(db,'chats',id); const s = await getDoc(ref);
  if (!s.exists() || s.data().userId !== currentUser.uid) return;
  const orig = s.data().text || '';
  const el = document.getElementById('pubmt-'+id);
  if (!el) return;
  el.classList.remove('hidden');
  el.innerHTML = `<textarea id="pubet-${id}" rows="2" class="chat-edit-input">${orig}</textarea><div class="flex gap-2 mt-1"><button onclick="savePubMsg('${id}')" class="bg-green-600 text-white px-3 py-1 rounded text-xs font-bold">Simpan</button><button onclick="cancelPubEdit('${id}', '${escAttr(orig)}')" class="bg-slate-600 text-white px-3 py-1 rounded text-xs font-bold">Batal</button></div>`;
};
window.savePubMsg = async (id) => {
  const t = document.getElementById('pubet-'+id).value.trim();
  if (!t) return;
  await updateDoc(doc(db,'chats',id), { text: sensor(t), edited: true, updatedAt: serverTimestamp() });
};
window.cancelPubEdit = (id, orig) => { const el = document.getElementById('pubmt-'+id); if (el) el.textContent = orig; };
window.delPubMsg = async (id) => {
  const r = doc(db,'chats',id); const s = await getDoc(r);
  if (!s.exists() || s.data().userId !== currentUser.uid) return;
  if (!confirm('Hapus?')) return;
  await deleteDoc(r); showToast('Dihapus');
};

        <div>
          <label class="block text-sm font-semibold mb-1">Tanggal Lahir <span class="text-xs text-slate-500">(format: DD-MM, contoh 17-08)</span></label>
          <input id="profileBirthday" type="text" placeholder="DD-MM (contoh: 17-08)" value="${userProfile.birthday ? userProfile.birthday.split('-').reverse().join('-') : ''}" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm">
        </div>
        <div class="flex flex-col md:flex-row gap-3">
          <button id="saveProfile" class="flex-1 bg-amber-500 text-black font-bold py-2 rounded-full hover:scale-105 transition">Simpan Profil</button>
          ${currentUser.isAnonymous ? `<button id="linkGoogle" class="flex-1 bg-white text-black font-bold py-2 rounded-full hover:scale-105 transition"><i class="fab fa-google mr-2"></i>Tautkan</button>` : ''}
        </div>
        <button id="logoutBtn" class="w-full bg-red-900/50 hover:bg-red-800 text-red-300 font-bold py-2 rounded-full transition">Keluar</button>
      </div>

      ${isKreator ? `
      <div class="mt-6 border-t border-slate-700 pt-6">
        <h3 class="font-bold text-amber-400 mb-3"><i class="fas fa-link mr-2"></i>Link Sosmed & Dukungan</h3>
        <div class="space-y-3">
          <div><label class="block text-xs font-semibold mb-1 text-orange-400"><i class="fa-solid fa-coffee mr-1"></i>Saweria</label><input id="sm_saweria" type="url" value="${sosmed.saweria || ''}" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm"></div>
          <div><label class="block text-xs font-semibold mb-1 text-red-400"><i class="fa-solid fa-mug-hot mr-1"></i>Trakteer</label><input id="sm_trakteer" type="url" value="${sosmed.trakteer || ''}" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm"></div>
          <div><label class="block text-xs font-semibold mb-1 text-blue-400"><i class="fab fa-facebook mr-1"></i>Facebook</label><input id="sm_facebook" type="url" value="${sosmed.facebook || ''}" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm"></div>
          <div><label class="block text-xs font-semibold mb-1 text-white"><i class="fab fa-tiktok mr-1"></i>TikTok</label><input id="sm_tiktok" type="url" value="${sosmed.tiktok || ''}" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm"></div>
          <div><label class="block text-xs font-semibold mb-1 text-pink-400"><i class="fab fa-instagram mr-1"></i>Instagram</label><input id="sm_instagram" type="url" value="${sosmed.instagram || ''}" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm"></div>
          <div><label class="block text-xs font-semibold mb-1 text-white"><i class="fa-solid fa-at mr-1"></i>Threads</label><input id="sm_threads" type="url" value="${sosmed.threads || ''}" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm"></div>
          <div><label class="block text-xs font-semibold mb-1 text-sky-400"><i class="fab fa-twitter mr-1"></i>Twitter/X</label><input id="sm_twitter" type="url" value="${sosmed.twitter || ''}" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm"></div>
          <div><label class="block text-xs font-semibold mb-1 text-red-500"><i class="fab fa-youtube mr-1"></i>YouTube</label><input id="sm_youtube" type="url" value="${sosmed.youtube || ''}" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm"></div>
          <div><label class="block text-xs font-semibold mb-1 text-slate-300"><i class="fas fa-globe mr-1"></i>Website</label><input id="sm_website" type="url" value="${sosmed.website || ''}" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm"></div>
          <button id="saveSosmedBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-full transition">Simpan Link Sosmed</button>
        </div>
      </div>` : ''}
    </div>`;
  const profilePhotoInput = document.getElementById('profilePhotoInput');
  const profilePhotoPreview = document.getElementById('profilePhotoPreview');
  if (profilePhotoInput && profilePhotoPreview) {
    profilePhotoInput.onchange = () => {
      const file = profilePhotoInput.files?.[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) { showToast('Pilih file gambar.'); profilePhotoInput.value = ''; return; }
      profilePhotoPreview.src = URL.createObjectURL(file);
    };
  }

  document.getElementById('saveProfile').onclick = async () => {
    const nu = document.getElementById('profileUsername').value.trim();
    const nb = document.getElementById('profileBio').value.trim();
    const nbd = document.getElementById('profileBirthday').value.trim();
    let bdayMMDD = '';
    if (nbd) {
      const parts = nbd.split('-');
      if (parts.length === 2) {
        const dd = parseInt(parts[0], 10);
        const mm = parseInt(parts[1], 10);
        if (dd >= 1 && dd <= 31 && mm >= 1 && mm <= 12) {
          bdayMMDD = String(mm).padStart(2,'0') + '-' + String(dd).padStart(2,'0');
        } else { showToast('Format tanggal lahir tidak valid (DD-MM)'); return; }
      } else { showToast('Format: DD-MM (contoh: 17-08)'); return; }
    }
    let newPhotoURL = userProfile.photoURL || '';
    const photoFile = document.getElementById('profilePhotoInput')?.files?.[0];
    if (photoFile) {
      const progress = document.getElementById('profilePhotoProgress');
      if (progress) progress.textContent = 'Mengupload foto...';
      try {
        newPhotoURL = await uploadToImgbb(photoFile);
      } catch (e) {
        if (progress) progress.textContent = '';
        showToast('Gagal upload foto: ' + e.message);
        return;
      }
      if (progress) progress.textContent = 'Foto siap disimpan ✓';
    }

    await updateDoc(doc(db,'users',currentUser.uid), {
      username: nu || userProfile.username,
      bio: nb,
      birthday: bdayMMDD,
      photoURL: newPhotoURL,
      updatedAt: serverTimestamp()
    });
    userProfile.username = nu || userProfile.username;
    userProfile.bio = nb;
    userProfile.birthday = bdayMMDD;
    userProfile.photoURL = newPhotoURL;
    showToast('Profil disimpan! Foto profil KomiNovel berhasil diperbarui.');
    renderPage();
  };
  if (document.getElementById('saveSosmedBtn')) {
    document.getElementById('saveSosmedBtn').onclick = async () => {
      const newSosmed = {
        saweria: document.getElementById('sm_saweria').value.trim(),
        trakteer: document.getElementById('sm_trakteer').value.trim(),
        facebook: document.getElementById('sm_facebook').value.trim(),
        tiktok: document.getElementById('sm_tiktok').value.trim(),
        instagram: document.getElementById('sm_instagram').value.trim(),
        threads: document.getElementById('sm_threads').value.trim(),
        twitter: document.getElementById('sm_twitter').value.trim(),
        youtube: document.getElementById('sm_youtube').value.trim(),
        website: document.getElementById('sm_website').value.trim()
      };
      await updateDoc(doc(db, 'users', currentUser.uid), { sosmed: newSosmed, updatedAt: serverTimestamp() });
      userProfile.sosmed = newSosmed;
      showToast('Link sosmed disimpan!'); renderPage();
    };
  }
  document.getElementById('linkGoogle')?.addEventListener('click', signInWithGoogle);
  document.getElementById('logoutBtn').onclick = logout;
}

async function renderCreatorDashboard(container) {
  container.innerHTML = `
    <div class="flex justify-between items-center mb-6 flex-wrap gap-2">
      <h2 class="text-xl md:text-2xl font-bold"><i class="fas fa-pen-fancy text-blue-400 mr-2"></i>Creator</h2>
      <div class="flex gap-2 flex-wrap items-center">
        ${hasRole(userProfile,'penulis') ? '<span class="penulis-tag text-xs px-3 py-1">PENULIS</span>' : ''}
        ${hasRole(userProfile,'komikus') ? '<span class="komikus-tag text-xs px-3 py-1">KOMIKUS</span>' : ''}
        <button id="openGuideBtn" class="bg-blue-600 text-white text-xs font-bold px-3 py-2 rounded-full hover:scale-105 transition"><i class="fas fa-question-circle mr-1"></i>Panduan</button>
      </div>
    </div>
    <div class="flex flex-wrap gap-2 mb-6">
      <button id="creatorTabUpload" class="px-4 py-2 rounded-full bg-amber-500 text-black font-bold text-sm hover:scale-105 transition">Buat Baru</button>

    </div>
    <div id="creatorContent"></div>`;
  document.getElementById('openGuideBtn').onclick = showUploadGuide;
  const cC = document.getElementById('creatorContent');

  async function loadUploadForm() {
    const canN = hasRole(userProfile,'penulis') || isAdminSession;
    const canK = hasRole(userProfile,'komikus') || isAdminSession;
    let opts = ''; if (canN) opts += '<option value="novel">Novel</option>'; if (canK) opts += '<option value="komik">Komik</option>';
    if (!opts) opts = '<option value="novel">Novel</option>';
    cC.innerHTML = `<div class="card-bg rounded-2xl p-6 max-w-2xl mx-auto card-anim">
      <h3 class="font-bold text-lg mb-4">Buat Karya Baru</h3>
      <div class="bg-amber-900/20 border border-amber-600/40 rounded-xl p-3 mb-4">
        <p class="text-xs text-amber-200"><i class="fas fa-info-circle mr-1"></i>Karya baru otomatis berstatus <b>NONPUBLISH</b>. Setelah dibuat, buka <b>Creator → Kelola → Review & Publish</b> untuk cek dan publish.</p>
      </div>
      <div class="space-y-4">
        <div><label class="block text-sm font-semibold mb-1">Judul <span class="text-red-400">*</span></label><input id="uploadTitle" type="text" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm focus:border-amber-500 transition"></div>
        <div><label class="block text-sm font-semibold mb-1">Teaser <span class="text-red-400">*</span> <span class="text-xs text-slate-500">(maks 150)</span></label><input id="uploadTeaser" type="text" maxlength="150" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm focus:border-amber-500 transition"><p class="text-xs text-slate-500 mt-1"><span id="teaserCount">0</span>/150</p></div>
        <div><label class="block text-sm font-semibold mb-1">Tipe <span class="text-red-400">*</span></label><select id="uploadType" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm">${opts}</select></div>
        ${categoryChipsField('uploadCategories')}
        <div><label class="block text-sm font-semibold mb-1">Deskripsi</label><textarea id="uploadDesc" rows="3" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm"></textarea></div>
        ${coverField('uploadCover')}
        <button id="uploadSubmit" class="w-full bg-amber-500 text-black font-bold py-3 rounded-full btn-glow">Buat Karya (Nonpublish)</button>
      </div></div>`;
    document.getElementById('uploadTeaser').oninput = e => document.getElementById('teaserCount').textContent = e.target.value.length;
    attachCoverHandler('uploadCover');
    updateSelectedCount('uploadCategories');
    document.getElementById('uploadSubmit').onclick = async () => {
      const title = document.getElementById('uploadTitle').value.trim();
      const teaser = document.getElementById('uploadTeaser').value.trim();
      const type = document.getElementById('uploadType').value;
      const cats = getSelectedCats('uploadCategories');
      const category = cats.join(', ');
      const desc = document.getElementById('uploadDesc').value.trim();
      const coverURL = getCoverValue('uploadCover');
      if (!title || !teaser || cats.length === 0 || !coverURL) { showToast('Lengkapi field *'); return; }
      if (teaser.length > 150) { showToast('Teaser max 150'); return; }
      const btn = document.getElementById('uploadSubmit');
      btn.disabled = true; btn.innerHTML = '<span class="uploading-spinner"></span>Menyimpan...';
      try {
        await addDoc(collection(db,'works'), {
          title, teaser, type, category, description: desc, coverURL, status: 'nonpublish',
          authorId: currentUser.uid, authorName: userProfile.username || 'Kreator',
          authorPhotoURL: userProfile.photoURL || '', authorSosmed: userProfile.sosmed || {},
          authorLevel: userProfile.level || 1, authorFollowerCount: userProfile.followerCount || 0,
          authorRoles: userProfile.roles || ['pembaca'],
          featuredCreator: userProfile.featuredCreator || false,
          avgRating: 0, ratingCount: 0, isTamat: false, featured: false,
          views: 0, likes: 0, likedBy: [], reports: [],
          takedown: { active: false, reason: '', by: '', at: null },
          createdAt: serverTimestamp(), updatedAt: serverTimestamp()
        });
        showToast('✅ Karya dibuat! Status: NONPUBLISH. Silakan review & publish di menu Kelola.');
        loadManage();
      } catch (e) { showToast('Gagal: ' + e.message); }
      finally { btn.disabled = false; btn.innerHTML = 'Buat Karya (Nonpublish)'; }
    };
  }

  async function loadManage() {
    cC.innerHTML = `<div class="card-bg rounded-2xl p-6 card-anim"><h3 class="font-bold mb-4">Karya Saya</h3><div id="mW" class="space-y-4">Memuat...</div></div>`;
    const snap = await getDocs(query(collection(db,'works'), where('authorId','==',currentUser.uid)));
    const works = []; snap.forEach(d => works.push({ id: d.id, ...d.data() }));
    const list = document.getElementById('mW');
    if (works.length === 0) { list.innerHTML = '<p class="text-slate-400">Belum ada karya. Klik "Buat Baru" untuk mulai!</p>'; return; }
    const withCh = await Promise.all(works.map(async w => {
      const cs = await getDocs(query(collection(db,'works',w.id,'chapters'), orderBy('number','asc')));
      const chapters = []; cs.forEach(d => chapters.push({ id: d.id, ...d.data() }));
      return { ...w, chapters };
    }));
    list.innerHTML = withCh.map(w => {
      const sid = safeId(w.id);
      const lbl = w.type === 'novel' ? 'Chapter' : 'Eps';
      const isTD = isTakedown(w);
      const isNP = isNonPublish(w);
      const isUN = isUnggulan(w);
      const gl = groupLabel(w.type);
      const wGroups = getGroups(w);
      const secs = groupChapters(w.chapters, w);
      const reportCount = (w.reports || []).length;
      const epRow = (ch) => `
        <div class="flex items-center justify-between bg-slate-800/50 rounded px-2 py-1.5 text-xs gap-2">
          <span class="truncate flex-1"><span class="text-amber-400 font-bold">${lbl} ${ch.number}</span>${ch.title ? ': ' + escHtml(ch.title) : ''}</span>
          ${w.type === 'komik' && ch.images ? `<span class="text-slate-500">${ch.images.length}🖼️</span>` : ''}
          <button class="editChapterBtn text-blue-400 hover:text-blue-300 px-1" data-wid="${w.id}" data-cid="${ch.id}" data-type="${w.type}" title="Edit" ${isTD ? 'disabled' : ''}><i class="fas fa-edit"></i></button>
          <button class="delC text-red-400 hover:text-red-300 px-1" data-wid="${w.id}" data-cid="${ch.id}" data-num="${ch.number}" ${isTD ? 'disabled' : ''}><i class="fas fa-trash"></i></button>
        </div>`;
      const listInner = wGroups.length === 0 ? w.chapters.map(epRow).join('') : secs.map(sec => `
        <div class="mb-2">
          <div class="flex items-center gap-2 px-1 py-1 text-xs font-bold text-amber-300">
            <i class="fas fa-folder"></i><span class="flex-1 truncate">${sec.group ? escHtml(groupTitleText(sec.group, w.type)) : 'Tanpa ' + gl}</span>
            <span class="text-[10px] text-slate-500 font-normal">${sec.items.length}</span>
          </div>
          <div class="space-y-1 pl-2 border-l-2 border-amber-500/30">${sec.items.length ? sec.items.map(epRow).join('') : '<p class="text-[11px] text-slate-500 italic">Kosong</p>'}</div>
        </div>`).join('');
      const borderClass = isTD ? 'takedown-border' : isNP ? 'nonpublish-border' : isUN ? 'unggulan-border' : (w.isTamat ? 'tamat-border' : 'berlanjut-border');
      return `<div class="comment-card rounded-xl p-4 card-anim ${borderClass}">
        <div class="flex items-center gap-3 mb-3">
          <div class="w-14 h-20 bg-slate-800 rounded-lg overflow-hidden relative">${w.coverURL ? `<img src="${w.coverURL}" class="w-full h-full object-cover ${isTD || isNP ? 'grayscale' : ''}">` : ''}${workStatusBadge(w)}${statusLabel(w.isTamat)}</div>
          <div class="flex-1 min-w-0">
            <h4 class="font-bold truncate ${isTD ? 'line-through text-slate-500' : ''}">${w.title}</h4>
            <p class="text-xs text-slate-400">${w.chapters.length} ${lbl}${wGroups.length ? ' • ' + wGroups.length + ' ' + gl : ''}</p>
            <div class="flex gap-3 mt-1 text-[10px] text-slate-400">
              <span><i class="fas fa-eye text-amber-400"></i> ${formatCount(w.views || 0)}</span>
              <span><i class="fas fa-heart" style="color:#ef4444"></i> ${formatCount(w.likes || 0)}</span>
              <span><i class="fas fa-star text-amber-400"></i> ${formatCount(w.ratingCount || 0)}</span>
              ${reportCount > 0 ? `<span class="text-red-400"><i class="fas fa-flag"></i> ${reportCount}/10 report</span>` : ''}
            </div>
          </div>
        </div>
        ${isNP ? `<div class="bg-amber-900/30 border border-amber-600/50 rounded-lg p-3 mb-3">
          <p class="text-xs text-amber-200"><i class="fas fa-clipboard-check mr-1"></i><b>MENUNGGU REVIEW</b> — Karya belum dipublish. Klik <b>Review & Publish</b> untuk cek dan publish manual.</p>
        </div>` : ''}
        ${isTD ? `<div class="bg-red-950/40 border border-red-800 rounded-lg p-3 mb-3">
          <p class="text-xs text-red-400 font-bold mb-1"><i class="fas fa-ban mr-1"></i>KARYA DI-TAKEDOWN</p>
          <p class="text-xs text-red-300 mb-1"><b>Alasan:</b> ${sensor(w.takedown.reason || '-')}</p>
        </div>` : ''}
        ${reportCount >= 5 && !isTD ? `<div class="bg-yellow-900/30 border border-yellow-600/50 rounded-lg p-3 mb-3">
          <p class="text-xs text-yellow-200"><i class="fas fa-exclamation-triangle mr-1"></i><b>PERINGATAN:</b> Karya ini sudah dilaporkan <b>${reportCount}/10</b> kali. Jika mencapai 10, akan otomatis di-takedown sistem!</p>
        </div>` : ''}
        <div class="flex flex-wrap gap-2 mb-3">
          ${!isTD ? `<button class="reviewWorkBtn ${isNP ? 'bg-green-600' : 'bg-amber-600'} text-white px-4 py-2 rounded-lg text-xs font-bold hover:scale-105 transition" data-wid="${w.id}" title="Review & Publish"><i class="fas fa-clipboard-check mr-1"></i>${isNP ? 'Review & Publish' : 'Review Karya'}</button>` : ''}
          <button class="editWorkBtn bg-purple-600 text-white px-4 py-2 rounded-lg text-xs font-bold hover:scale-105 transition" data-wid="${w.id}" title="Edit info karya"><i class="fas fa-edit mr-1"></i>Edit Karya</button>
          <button class="addC bg-amber-500 text-black px-4 py-2 rounded-lg text-xs font-bold flex-1 hover:scale-105 transition" data-wid="${w.id}" data-type="${w.type}" ${isTD ? 'disabled' : ''}>+ ${lbl}</button>
          <button class="manageG bg-blue-600 text-white px-4 py-2 rounded-lg text-xs font-bold hover:scale-105 transition" data-wid="${w.id}" data-type="${w.type}" ${isTD ? 'disabled' : ''}><i class="fas fa-folder-open mr-1"></i>${gl}</button>
          <button class="tamatB ${w.isTamat ? 'bg-yellow-600' : 'bg-red-600'} text-white px-4 py-2 rounded-lg text-xs font-bold hover:scale-105 transition" data-wid="${w.id}" data-t="${w.isTamat ? 'true' : 'false'}" ${isTD ? 'disabled' : ''}>${w.isTamat ? 'Batal' : 'Tamatkan'}</button>
          <button class="delW bg-red-800 text-white px-4 py-2 rounded-lg text-xs font-bold hover:scale-105 transition" data-wid="${w.id}" data-title="${escAttr(w.title)}"><i class="fas fa-trash"></i></button>
        </div>
        <div class="border-t border-slate-700 pt-3 max-h-72 overflow-y-auto scrollbar-thin space-y-1">${listInner}</div>
        <div id="f-${sid}" class="hidden border-t border-slate-700 pt-4 space-y-3 mt-3">
          <input type="text" id="ct-${sid}" placeholder="${w.type === 'novel' ? 'Judul Chapter *' : 'Judul Eps (opsional)'}" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm">
          ${wGroups.length ? `<div><label class="block text-xs font-semibold text-amber-400 mb-1">Masukkan ke ${gl}</label>${groupSelectHtml('cg-' + sid, wGroups, wGroups[wGroups.length - 1].id, w.type)}</div>` : ''}
          ${w.type === 'novel' ? `<textarea id="cc-${sid}" rows="10" placeholder="Isi cerita *" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm"></textarea>` : `${multiImageField('mi-' + sid)}`}
          <div class="flex gap-2"><button class="subC bg-green-600 text-white px-4 py-2 rounded-lg text-sm font-bold flex-1 hover:scale-105 transition" data-wid="${w.id}" data-type="${w.type}" data-sid="${sid}">Simpan</button><button class="canC bg-slate-700 text-slate-300 px-4 py-2 rounded-lg text-sm font-bold" data-sid="${sid}">Batal</button></div>
        </div>
      </div>`;
    }).join('');

    withCh.forEach(w => { if (w.type === 'komik' && !isTakedown(w)) attachMultiImageHandlers('mi-' + safeId(w.id)); });

    list.querySelectorAll('.reviewWorkBtn').forEach(b => b.onclick = () => window.openReviewWorkModal(b.dataset.wid));
    list.querySelectorAll('.editWorkBtn').forEach(b => b.onclick = () => window.openEditWorkModal(b.dataset.wid));
    list.querySelectorAll('.addC').forEach(b => b.onclick = () => document.getElementById('f-' + safeId(b.dataset.wid)).classList.toggle('hidden'));
    list.querySelectorAll('.manageG').forEach(b => b.onclick = () => window.openGroupManager(b.dataset.wid, b.dataset.type, loadManage));
    list.querySelectorAll('.canC').forEach(b => b.onclick = () => document.getElementById('f-' + b.dataset.sid).classList.add('hidden'));
    list.querySelectorAll('.tamatB').forEach(b => b.onclick = async () => { const n = b.dataset.t === 'true'; if (!confirm(n ? 'Batal?' : 'Tamatkan?')) return; await updateDoc(doc(db,'works',b.dataset.wid), { isTamat: !n, updatedAt: serverTimestamp() }); loadManage(); });
    list.querySelectorAll('.delW').forEach(b => b.onclick = async () => {
      if (!confirm(`Hapus "${b.dataset.title}"?`)) return;
      const wid = b.dataset.wid;
      const cs = await getDocs(collection(db,'works',wid,'chapters'));
      for (const ch of cs.docs) {
        const coms = await getDocs(collection(db,'works',wid,'chapters',ch.id,'comments'));
        for (const cm of coms.docs) await deleteDoc(doc(db,'works',wid,'chapters',ch.id,'comments',cm.id));
        const rs = await getDocs(collection(db,'works',wid,'chapters',ch.id,'ratings'));
        for (const r of rs.docs) await deleteDoc(doc(db,'works',wid,'chapters',ch.id,'ratings',r.id));
        await deleteDoc(doc(db,'works',wid,'chapters',ch.id));
      }
      await deleteDoc(doc(db,'works',wid));
      showToast('Dihapus'); loadManage();
    });
    list.querySelectorAll('.delC').forEach(b => b.onclick = async () => {
      if (!confirm(`Hapus ${b.dataset.num}?`)) return;
      const wid = b.dataset.wid, cid = b.dataset.cid;
      const coms = await getDocs(collection(db,'works',wid,'chapters',cid,'comments'));
      for (const cm of coms.docs) await deleteDoc(doc(db,'works',wid,'chapters',cid,'comments',cm.id));
      const rs = await getDocs(collection(db,'works',wid,'chapters',cid,'ratings'));
      for (const r of rs.docs) await deleteDoc(doc(db,'works',wid,'chapters',cid,'ratings',r.id));
      await deleteDoc(doc(db,'works',wid,'chapters',cid));
      loadManage();
    });
    list.querySelectorAll('.editChapterBtn').forEach(b => b.onclick = async () => {
      const wid = b.dataset.wid, cid = b.dataset.cid, type = b.dataset.type;
      const chSnap = await getDoc(doc(db, 'works', wid, 'chapters', cid));
      if (!chSnap.exists()) return;
      const ch = chSnap.data();
      const wDataSnap = await getDoc(doc(db, 'works', wid));
      const editGroups = getGroups(wDataSnap.exists() ? wDataSnap.data() : {});
      const modal = document.getElementById('modalContainer');
      const content = document.getElementById('modalContent');
      content.innerHTML = `
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-2xl font-black text-amber-400"><i class="fas fa-edit mr-2"></i>Edit ${type === 'novel' ? 'Chapter' : 'Eps'} ${ch.number}</h2>
          <button id="closeEditCh" class="text-slate-400 text-2xl hover:rotate-90 transition-transform">&times;</button>
        </div>
        <div class="space-y-3">
          <div><label class="block text-sm font-semibold mb-1">Judul ${type === 'novel' ? 'Chapter' : 'Eps'}</label><input id="editChTitle" type="text" value="${escHtml(ch.title || '')}" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm"></div>
          <div class="grid grid-cols-3 gap-3">
            <div><label class="block text-sm font-semibold mb-1">Nomor</label><input id="editChNumber" type="number" min="0" value="${ch.number ?? ''}" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm"></div>
            <div class="col-span-2"><label class="block text-sm font-semibold mb-1">${groupLabel(type)}</label>${groupSelectHtml('editChGroup', editGroups, ch.groupId || '', type)}</div>
          </div>
          ${type === 'novel' ? `<div><label class="block text-sm font-semibold mb-1">Isi Cerita *</label><textarea id="editChContent" rows="10" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm">${escHtml(ch.content || '')}</textarea></div>` : `
            <div id="editExisting-${cid}"><label class="block text-sm font-semibold mb-1">Gambar Saat Ini (<span id="editExistingCount-${cid}">${(ch.images || []).length}</span>)</label><div id="editExistingPreview-${cid}" class="mt-2"></div></div>
            <div><label class="block text-sm font-semibold mb-1">Tambah Gambar Baru</label>${multiImageField('editAdd-' + cid)}</div>
          `}
          <div class="flex gap-2"><button id="saveEditCh" class="flex-1 bg-amber-500 text-black font-bold py-2 rounded-full hover:scale-105 transition">Simpan</button><button id="cancelEditCh" class="bg-slate-700 text-slate-300 px-4 py-2 rounded-full font-bold">Batal</button></div>
        </div>`;
      modal.classList.remove('hidden');
      if (type === 'komik') { attachMultiImageHandlers('editAdd-' + cid); attachExistingImagesHandler(cid, ch.images || []); }
      const close = () => modal.classList.add('hidden');
      document.getElementById('closeEditCh').onclick = close;
      document.getElementById('cancelEditCh').onclick = close;
      document.getElementById('saveEditCh').onclick = async () => {
        const newTitle = document.getElementById('editChTitle').value.trim();
        const numVal = parseInt(document.getElementById('editChNumber').value, 10);
        const extra = { groupId: document.getElementById('editChGroup').value || '' };
        if (!isNaN(numVal)) extra.number = numVal;
        if (type === 'novel') {
          const newContent = document.getElementById('editChContent').value.trim();
          if (!newTitle) { showToast('Judul wajib!'); return; }
          if (!newContent) { showToast('Isi wajib!'); return; }
          await updateDoc(doc(db, 'works', wid, 'chapters', cid), { title: newTitle, content: newContent, ...extra, updatedAt: serverTimestamp() });
        } else {
          const existingImages = window[`_existing_${cid}_images`] || ch.images || [];
          const newImages = getMultiImages('editAdd-' + cid);
          const finalImages = [...existingImages, ...newImages];
          await updateDoc(doc(db, 'works', wid, 'chapters', cid), { title: newTitle, ...extra, images: finalImages, coverImage: finalImages[0] || '', updatedAt: serverTimestamp() });
          if (finalImages.length > 0) {
            const workRef = doc(db, 'works', wid);
            const workSnap = await getDoc(workRef);
            if (workSnap.exists()) { const w = workSnap.data(); if (!w.coverURL || w.coverURL === '') await updateDoc(workRef, { coverURL: finalImages[0] }); }
          }
        }
        showToast('Tersimpan!'); close(); loadManage();
      };
    });
    list.querySelectorAll('.subC').forEach(b => b.onclick = async () => {
      const wid = b.dataset.wid, sid = b.dataset.sid, type = b.dataset.type;
      const t = document.getElementById('ct-' + sid).value.trim();
      const cs = await getDocs(collection(db,'works',wid,'chapters'));
      const next = cs.docs.reduce((m, d) => Math.max(m, Number(d.data().number) || 0), 0) + 1;
      const groupId = document.getElementById('cg-' + sid)?.value || '';
      if (type === 'novel') {
        const c = document.getElementById('cc-' + sid).value.trim();
        if (!t) { showToast('Judul wajib'); return; }
        if (!c) { showToast('Isi wajib'); return; }
        const newChapterRef = await addDoc(collection(db,'works',wid,'chapters'), { number: next, title: t, content: c, images: [], groupId, createdAt: serverTimestamp() });
        await createChapterNotifications(wid, { id:newChapterRef.id, number:next, title:t });
        pushNotify({ kind: 'chapter', workId: wid, chapterId: newChapterRef.id });
      } else {
        const images = getMultiImages('mi-' + sid);
        if (images.length === 0) { showToast('Pilih minimal 1 gambar'); return; }
        const newChapterRef = await addDoc(collection(db,'works',wid,'chapters'), { number: next, title: t, content: '', images: images, coverImage: images[0], groupId, createdAt: serverTimestamp() });
        await createChapterNotifications(wid, { id:newChapterRef.id, number:next, title:t });
        pushNotify({ kind: 'chapter', workId: wid, chapterId: newChapterRef.id });
        const workRef = doc(db, 'works', wid);
        const workSnap = await getDoc(workRef);
        if (workSnap.exists()) { const w = workSnap.data(); if (!w.coverURL || w.coverURL === '') await updateDoc(workRef, { coverURL: images[0] }); }
      }
      showToast('Ditambahkan'); loadManage();
    });
  }
  document.getElementById('creatorTabUpload').onclick = loadUploadForm;
  document.getElementById('creatorTabManage').onclick = loadManage;
  loadManage();
}

  document.getElementById('adminLogoutBtn').onclick = adminLogout;

  async function loadUsers() {
    const snap = await getDocs(collection(db,'users'));
    const users = []; snap.forEach(d => users.push({ id: d.id, ...d.data() }));
    aC.innerHTML = `<input id="adminSearchUser" type="text" placeholder="Cari..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm mb-4 card-anim">
      <div class="space-y-3 max-h-[60vh] overflow-y-auto scrollbar-thin">
        ${users.map(u => {
          const roles = u.roles || [u.role || 'pembaca'];
          const isFeatured = u.featuredCreator === true;
          const isCreatorRole = roles.includes('penulis') || roles.includes('komikus');
          const isOwnerRole = roles.includes('owner');
          return `<div class="card-bg rounded-xl p-3 user-row card-anim ${isFeatured ? 'unggulan-border' : ''} ${isOwnerRole ? 'owner-shine-card' : ''}" data-username="${(u.username || '').toLowerCase()}">
            <div class="flex items-center gap-2 mb-2">
              <img src="${u.photoURL || 'https://ui-avatars.com/api/?name='+encodeURIComponent(u.username || 'U')}" class="w-10 h-10 rounded-full ${isFeatured ? 'border-2 border-amber-400' : ''} ${isOwnerRole ? 'owner-shine' : ''}">
              <div class="flex-1"><p class="font-semibold text-sm">${u.username || 'User'}${getVerifiedBadge(u.followerCount || 0)}${getCreatorVerifiedBadge(u)}</p><p class="text-xs text-slate-400">${u.email || 'Guest'} • Lv.${u.level || 1} • ${formatCount(u.followerCount || 0)} followers</p></div>

              <label class="flex items-center gap-2 text-xs"><input type="checkbox" class="role-checkbox role-toggle" data-uid="${u.id}" data-role="penulis" ${roles.includes('penulis') ? 'checked' : ''}><span class="text-yellow-400">Penulis</span></label>
              <label class="flex items-center gap-2 text-xs"><input type="checkbox" class="role-checkbox role-toggle" data-uid="${u.id}" data-role="komikus" ${roles.includes('komikus') ? 'checked' : ''}><span class="text-orange-400">Komikus</span></label>
              <label class="flex items-center gap-2 text-xs"><input type="checkbox" class="role-checkbox role-toggle" data-uid="${u.id}" data-role="admin" ${roles.includes('admin') ? 'checked' : ''}><span class="text-amber-400">Admin</span></label>
              <label class="flex items-center gap-2 text-xs"><input type="checkbox" class="role-checkbox role-toggle" data-uid="${u.id}" data-role="owner" ${roles.includes('owner') ? 'checked' : ''}><span class="text-red-400">Owner</span></label>
            </div>
            ${isCreatorRole ? `<div class="flex gap-2 pl-12 mt-2">
              <button class="featureCreatorBtn ${isFeatured ? 'bg-yellow-600' : 'bg-slate-700'} text-white px-3 py-1 rounded-lg text-xs font-bold hover:scale-105 transition" data-uid="${u.id}" data-featured="${isFeatured}">
                <i class="fas fa-star mr-1"></i>${isFeatured ? 'Hapus Unggulan' : 'Jadikan Unggulan'}
              </button>
            </div>` : ''}
          </div>`;
        }).join('')}
      </div>`;
    aC.querySelectorAll('.role-toggle').forEach(cb => cb.onchange = async () => {
      const ref = doc(db,'users',cb.dataset.uid);
      const s = await getDoc(ref);
      let roles = s.data().roles || ['pembaca'];
      if (cb.checked) { if (!roles.includes(cb.dataset.role)) roles.push(cb.dataset.role); }
      else { roles = roles.filter(r => r !== cb.dataset.role); if (roles.length === 0) roles = ['pembaca']; }
      const prio = ['owner','admin','penulis','komikus','pembaca']; let primary = 'pembaca';
      for (const p of prio) if (roles.includes(p)) { primary = p; break; }
      const upd = { roles, role: primary };
      if (roles.includes('admin') || roles.includes('owner')) { upd.level = MAX_LEVEL; upd.exp = MAX_LEVEL * 20; }

  async function loadAdminWorks() {
    aC.innerHTML = `
      <div class="flex gap-2 mb-4 flex-wrap">
        <input id="adminWorkSearch" type="text" placeholder="Cari judul karya..." class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm">

          <option value="all">Semua</option>
          <option value="active">Aktif</option>
          <option value="takedown">Takedown</option>
          <option value="nonpublish">Nonpublish</option>
          <option value="unggulan">⭐ Unggulan</option>
        </select>
      </div>
      <div id="adminWorksList" class="space-y-3 max-h-[65vh] overflow-y-auto scrollbar-thin">Memuat...</div>`;
    const snap = await getDocs(collection(db, 'works'));
    let works = []; snap.forEach(d => works.push({ id: d.id, ...d.data() }));
    works.sort((a,b) => (b.createdAt?.toDate?.() || 0) - (a.createdAt?.toDate?.() || 0));
    function renderList() {
      const q = document.getElementById('adminWorkSearch').value.toLowerCase();
      const f = document.getElementById('adminWorkFilter').value;
      let filtered = works.filter(w => (w.title || '').toLowerCase().includes(q));
      if (f === 'active') filtered = filtered.filter(w => !isTakedown(w) && !isNonPublish(w));
      if (f === 'takedown') filtered = filtered.filter(w => isTakedown(w));
      if (f === 'nonpublish') filtered = filtered.filter(w => isNonPublish(w));
      if (f === 'unggulan') filtered = filtered.filter(w => isUnggulan(w));
      const list = document.getElementById('adminWorksList');
      if (filtered.length === 0) { list.innerHTML = '<p class="text-slate-400 text-sm">Tidak ada karya.</p>'; return; }
      list.innerHTML = filtered.map(w => {
        const isTD = isTakedown(w);
        const isNP = isNonPublish(w);
        const isUN = isUnggulan(w);
        const reports = (w.reports || []).length;
        return `<div class="card-bg rounded-xl p-3 card-anim ${isTD ? 'takedown-border' : isNP ? 'nonpublish-border' : isUN ? 'unggulan-border' : ''}">

            <div class="w-12 h-16 bg-slate-800 rounded overflow-hidden flex-shrink-0">${w.coverURL ? `<img src="${w.coverURL}" class="w-full h-full object-cover ${isTD || isNP ? 'grayscale' : ''}">` : ''}</div>

                <h4 class="font-bold text-sm truncate ${isTD ? 'line-through text-slate-500' : ''}">${w.title}</h4>
                <span class="text-[10px] px-2 py-0.5 rounded-full ${w.type === 'novel' ? 'bg-yellow-900/60 text-yellow-300' : 'bg-orange-900/60 text-orange-300'}">${(w.type || 'novel').toUpperCase()}</span>
                ${isTD ? '<span class="text-[10px] bg-red-900/60 text-red-300 px-2 py-0.5 rounded-full font-bold">TAKEDOWN</span>' : isNP ? '<span class="text-[10px] bg-slate-700 text-slate-300 px-2 py-0.5 rounded-full font-bold">NONPUBLISH</span>' : '<span class="text-[10px] bg-green-900/60 text-green-300 px-2 py-0.5 rounded-full">AKTIF</span>'}
                ${isUN ? '<span class="unggulan-tag text-[10px]">⭐</span>' : ''}
                ${reports > 0 ? `<span class="text-[10px] bg-red-900/60 text-red-300 px-2 py-0.5 rounded-full font-bold"><i class="fas fa-flag"></i> ${reports}/10</span>` : ''}
              </div>
              <p class="text-xs text-slate-400 truncate">oleh ${w.authorName || 'Anonim'}</p>

            <button class="featureWorkBtn ${isUN ? 'bg-yellow-600' : 'bg-slate-700'} text-white px-4 py-1.5 rounded-lg text-xs font-bold hover:scale-105 transition" data-wid="${w.id}" data-featured="${isUN}"><i class="fas fa-star mr-1"></i>${isUN ? 'Hapus Unggulan' : 'Unggulan'}</button>

      list.querySelectorAll('.takedownBtn').forEach(b => b.onclick = () => openTakedownModal(b.dataset.wid, b.dataset.title));

        await updateDoc(doc(db, 'works', b.dataset.wid), { takedown: { active: false, reason: '', by: '', at: null }, updatedAt: serverTimestamp() });

      list.querySelectorAll('.featureWorkBtn').forEach(b => b.onclick = async () => {
        const now = b.dataset.featured === 'true';
        await updateDoc(doc(db, 'works', b.dataset.wid), { featured: !now, updatedAt: serverTimestamp() });
        showToast(now ? 'Unggulan dihapus' : '⭐ Karya dijadikan Unggulan!');
        loadAdminWorks();
      });
      list.querySelectorAll('.adminViewBtn').forEach(b => b.onclick = () => { window.location.hash = 'reader/' + b.dataset.wid; });
      list.querySelectorAll('.viewReportsBtn').forEach(b => b.onclick = () => window.openReportsDetailModal(b.dataset.wid, b.dataset.title));
    }
    document.getElementById('adminWorkSearch').oninput = renderList;
    document.getElementById('adminWorkFilter').onchange = renderList;
    renderList();
  }

        <p class="text-xs text-red-300"><b>Karya:</b> ${escHtml(title)}</p>
        <p class="text-xs text-red-300 mt-1"><b>Total Report:</b> ${reports.length}/${REPORT_AUTO_TAKEDOWN_THRESHOLD}</p>
      </div>
      <div class="space-y-2 max-h-[50vh] overflow-y-auto scrollbar-thin">

              <span class="text-xs font-black text-amber-400">#${i+1}</span>

              <span class="text-xs text-slate-500 ml-auto">${r.at ? new Date(r.at).toLocaleString('id-ID') : '-'}</span>
            </div>
            <p class="text-sm text-red-300 font-bold">${escHtml(r.reasonLabel || r.reason || '-')}</p>
            ${r.detail ? `<p class="text-xs text-slate-400 mt-1">${escHtml(r.detail)}</p>` : ''}
          </div>
        `).join('')}
      </div>

async function renderMgRoom(container, roomId) {
  const roomSnap = await getDoc(doc(db, 'mg_rooms', roomId));
  if (!roomSnap.exists()) { showToast('Room tidak ditemukan'); window.location.hash = 'minigame'; renderPage(); return; }
  const room = { id: roomSnap.id, ...roomSnap.data() };
  mgCurrentRoom = room;

  if (mgUnsubRoom) { try { mgUnsubRoom(); } catch(e){} mgUnsubRoom = null; }
  if (mgUnsubGuesses) { try { mgUnsubGuesses(); } catch(e){} mgUnsubGuesses = null; }

  mgUnsubRoom = onSnapshot(doc(db, 'mg_rooms', roomId), (snap) => {
    if (!snap.exists()) { window.location.hash = 'minigame'; renderPage(); return; }
    const r = { id: snap.id, ...snap.data() };
    mgCurrentRoom = r;
    if (!r.players.includes(currentUser.uid)) {
      if (mgUnsubRoom) { mgUnsubRoom(); mgUnsubRoom = null; }
      showToast('Kamu telah keluar dari room');
      window.location.hash = 'minigame'; renderPage();
      return;
    }
    if (r.status === 'waiting') renderMgWaiting(r);
    else if (r.status === 'playing') renderMgPlaying(r);
    else if (r.status === 'finished') renderMgFinished(r);
  });

  if (room.status === 'waiting') renderMgWaiting(room);
  else if (room.status === 'playing') renderMgPlaying(room);
  else renderMgFinished(room);
}
