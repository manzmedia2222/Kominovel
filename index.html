function analyticsDayKey(date = new Date()) {
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,'0');
  const d = String(date.getDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}
function analyticsDocId(workId, date = new Date()) {
  return `${analyticsDayKey(date)}_${workId}`;
}
function searchNormalize(raw) {
  let v = String(raw || '').toLowerCase().trim().replace(/\s+/g,' ');
  v = v.replace(/[^\p{L}\p{N}\s_-]/gu,'');
  const typoMap = {
    'komikkomik':'komik','komik komik':'komik','novell':'novel','novelll':'novel',
    'kominovel':'kominovel','komik online':'komik','novel online':'novel'
  };
  return typoMap[v] || v;
}
function searchMatchesWork(work, rawKeyword) {
  const term=searchNormalize(rawKeyword);
  if (!term) return true;
  const title=searchNormalize(work.title||'');
  const teaser=searchNormalize(work.teaser||'');
  if (title.includes(term) || teaser.includes(term)) return true;
  const tokens=title.split(/\s+/).filter(Boolean);
  if (term.length>=4) {
    const distance=(a,b)=>{
      if (Math.abs(a.length-b.length)>1) return 99;
      const prev=Array.from({length:b.length+1},(_,i)=>i);
      for(let i=1;i<=a.length;i++){
        const cur=[i];
        for(let j=1;j<=b.length;j++) cur[j]=Math.min(cur[j-1]+1,prev[j]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
        for(let j=0;j<cur.length;j++) prev[j]=cur[j];
      }
      return prev[b.length];
    };
    if(tokens.some(t=>distance(term,t)<=1)) return true;
  }
  return false;
}
async function trackWorkActivity(workId, metric, amount = 1) {
  if (!workId || !['views','likes','comments','bookmarks'].includes(metric)) return;
  try {
    const ref = doc(db, 'homeAnalyticsDaily', analyticsDocId(workId));
    await setDoc(ref, {
      workId,
      [metric]: increment(amount),
      dateKey: analyticsDayKey(),
      updatedAt: serverTimestamp()
    }, { merge:true });
  } catch (e) {
    console.warn('Analytics activity gagal:', e.message);
  }
}
async function trackSearchKeyword(rawKeyword) {
  if (!rawKeyword || !currentUser) return;
  const keyword = searchNormalize(rawKeyword);
  if (!keyword || keyword.length < 2) return;
  try {
    await addDoc(collection(db, 'homeSearchEvents'), {
      keyword,
      rawKeyword: String(rawKeyword).trim(),
      userId: currentUser.uid,
      dayKey: analyticsDayKey(),
      createdAt: serverTimestamp()
    });
  } catch (e) {
    console.warn('Analytics search gagal:', e.message);
  }
}
async function loadHomeCache(kind) {
  const id = kind === 'popular' ? 'popularWeekly' : 'searchTrending';
  try {
    const snap = await getDoc(doc(db, 'homeCaches', id));
    const data = snap.exists() ? snap.data() : null;
    homeCacheLoaded[kind] = data;
    return data;
  } catch (e) {
    homeCacheLoaded[kind] = null;
    return null;

}
function getCacheWorkIds(cache, type) {
  if (!cache) return [];
  const list = cache[type] || [];
  return list.map(x => typeof x === 'string' ? x : x.id).filter(Boolean).slice(0,10);
}
async function hydrateCachedWorks(ids) {
  const arr = [];
  for (const id of ids) {
    try {
      const snap = await getDoc(doc(db,'works',id));
      if (snap.exists()) arr.push({id:snap.id,...snap.data()});
    } catch(e) {}
  }
  return arr;
}
async function buildPopularCacheForAdmin() {
  if (!isAdminUser(userProfile)) return;
  const since = new Date(Date.now() - 7*24*60*60*1000);
  try {
    const statsSnap = await getDocs(query(collection(db,'homeAnalyticsDaily'),where('dateKey','>=',analyticsDayKey(since))));
    const stats = {};
    statsSnap.forEach(d => {
      const x = d.data();
      if (!x.dateKey || new Date(x.dateKey+'T00:00:00') < since) return;
      if (!x.workId) return;
      if (!stats[x.workId]) stats[x.workId] = {views:0,likes:0,comments:0,bookmarks:0};
      stats[x.workId].views += Number(x.views||0);
      stats[x.workId].likes += Number(x.likes||0);
      stats[x.workId].comments += Number(x.comments||0);
      stats[x.workId].bookmarks += Number(x.bookmarks||0);
    });
    const workSnap = await getDocs(collection(db,'works'));
    const result = {komik:[],novel:[],updatedAt:serverTimestamp()};
    const maxByMetric = {views:1,likes:1,comments:1,bookmarks:1};
    const works = [];
    workSnap.forEach(d => {
      const w = d.data();
      if (isNonPublish(w) || isTakedown(w)) return;
      const a = stats[d.id] || {views:0,likes:0,comments:0,bookmarks:0};
      works.push({id:d.id,type:w.type,scoreData:a});
      maxByMetric.views = Math.max(maxByMetric.views,a.views);
      maxByMetric.likes = Math.max(maxByMetric.likes,a.likes);
      maxByMetric.comments = Math.max(maxByMetric.comments,a.comments);
      maxByMetric.bookmarks = Math.max(maxByMetric.bookmarks,a.bookmarks);
    });
    for (const type of ['komik','novel']) {
      result[type] = works.filter(w=>w.type===type).map(w => {
        const a=w.scoreData;
        const score =
          (a.views/maxByMetric.views)*30 +
          (a.likes/maxByMetric.likes)*30 +
          (a.comments/maxByMetric.comments)*20 +
          (a.bookmarks/maxByMetric.bookmarks)*20;
        return {id:w.id,score:Number(score.toFixed(4))};
      }).sort((a,b)=>b.score-a.score).slice(0,10);
    }
    await setDoc(doc(db,'homeCaches','popularWeekly'),result,{merge:false});
    homeCacheLoaded.popular=result;
  } catch(e) {
    console.warn('Popular cache gagal:',e.message);
  }
}
async function buildSearchCacheForAdmin() {
  if (!isAdminUser(userProfile)) return;
  try {
    const since = Date.now() - 7*24*60*60*1000;
    const snap = await getDocs(collection(db,'homeSearchEvents'));
    const map = {};
    snap.forEach(d => {
      const x=d.data();
      const created=x.createdAt?.toDate?.()?.getTime?.() || 0;
      if (created && created < since) return;
      if (!x.keyword || !x.userId) return;
      if (!map[x.keyword]) map[x.keyword]={count:0,users:new Set()};
      map[x.keyword].count++;
      map[x.keyword].users.add(x.userId);
    });
    const top=Object.entries(map)
      .filter(([,x])=>x.users.size>=10)
      .sort((a,b)=>b[1].count-a[1].count)
      .slice(0,10)
      .map(([keyword,x])=>({keyword,count:x.count,uniqueUsers:x.users.size}));
    await setDoc(doc(db,'homeCaches','searchTrending'),{items:top,updatedAt:serverTimestamp()},{merge:false});
    homeCacheLoaded.search={items:top};
  } catch(e) {
    console.warn('Search cache gagal:',e.message);
  }
}
async function refreshHomeCachesIfNeeded(force=false) {
  if (!isAdminUser(userProfile)) return;
  const now=Date.now();
  const p=homeCacheLoaded.popular;
  const q=homeCacheLoaded.search;
  const pTime=p?.updatedAt?.toDate?.()?.getTime?.() || 0;
  const qTime=q?.updatedAt?.toDate?.()?.getTime?.() || 0;
  if (force || now-pTime>=60*60*1000) await buildPopularCacheForAdmin();
  if (force || now-qTime>=6*60*60*1000) await buildSearchCacheForAdmin();
}
async function ensureAuthorProfiles(authorIds, onUpdate) {
  const ids=[...new Set(authorIds.filter(Boolean))];
  for (const uid of ids) {
    if (authorProfileUnsubs[uid]) continue;
    try {
      authorProfileUnsubs[uid]=onSnapshot(doc(db,'users',uid), snap=>{
        if (snap.exists()) {
          authorProfileCache[uid]={id:uid,...snap.data()};
          if (onUpdate) onUpdate();
        }
      },()=>{});
    } catch(e) {}
  }
  Object.keys(authorProfileUnsubs).forEach(uid=>{
    if (!ids.includes(uid)) {
      try{authorProfileUnsubs[uid]();}catch(e){}
      delete authorProfileUnsubs[uid];
      delete authorProfileCache[uid];
    }
  });
}
function getLiveWorkAuthor(work) {
  const u=authorProfileCache[work.authorId];
  return u ? {
    name:u.username || 'Anonim',
    photo:u.photoURL || '',
    followerCount:u.followerCount || 0,
    roles:u.roles || (u.role?[u.role]:[]),
    level:u.level || 1,
    sosmed:u.sosmed || {},
    featuredCreator:u.featuredCreator===true
  } : {
    name:work.authorName || 'Anonim',
    photo:work.authorPhotoURL || '',
    followerCount:work.authorFollowerCount || 0,
    roles:work.authorRoles || (work.authorRole?[work.authorRole]:[]),
    level:work.authorLevel || 1,
    sosmed:work.authorSosmed || {},
    featuredCreator:work.featuredCreator===true
  };
}
async function cleanupHomeAuthorListeners() {
  Object.values(authorProfileUnsubs).forEach(fn=>{try{fn();}catch(e){}});
  authorProfileUnsubs={};
  authorProfileCache={};
}
function startHomeCacheScheduler() {
  if (homeCacheRefreshTimer) clearInterval(homeCacheRefreshTimer);
  homeCacheRefreshTimer=setInterval(()=>refreshHomeCachesIfNeeded(false),60*1000);
}

function attachSlideNav(prevId, nextId, trackId) {
  const prev = document.getElementById(prevId);
  const next = document.getElementById(nextId);
  const track = document.getElementById(trackId);
  if (!prev || !next || !track) return;
  const scrollAmount = 400;
  prev.onclick = () => track.scrollBy({ left: -scrollAmount, behavior: 'smooth' });
  next.onclick = () => track.scrollBy({ left: scrollAmount, behavior: 'smooth' });
  const updateBtns = () => {
    prev.disabled = track.scrollLeft <= 5;
    next.disabled = track.scrollLeft >= track.scrollWidth - track.clientWidth - 5;
  };
  track.addEventListener('scroll', updateBtns, { passive: true });
  setTimeout(updateBtns, 100);
}

function renderWorkList(container, works, newIds = new Set(), skipAnim = false) {
  if (works.length === 0) {
    container.innerHTML = `<div class="col-span-full card-bg rounded-2xl p-12 text-center empty-animation">
      <i class="fas fa-book-open text-6xl text-amber-400/50 mb-4"></i>
      <h3 class="text-xl font-bold">Belum ada ${currentContentType === 'novel' ? 'Novel' : 'Komik'}.</h3>
      <p class="text-slate-400 mt-2">Jadilah yang pertama!</p>
      ${isCreator(userProfile) || isAdminSession ? `<button class="mt-4 bg-amber-500 text-black px-6 py-2 rounded-full font-bold btn-glow" onclick="window.location.hash='creator'">Upload Karya</button>` : `<button class="mt-4 bg-green-600 text-white px-6 py-2 rounded-full font-bold hover:scale-105 transition" onclick="window.location.hash='jadi-kreator'"><i class="fas fa-star mr-1"></i>Jadi Kreator</button>`}
    </div>`;
    return;
  }
  container.innerHTML = works.map((work, idx) => {
    const cats = parseCategories(work.category);
    const isNew = newIds && newIds.has(work.id);
    const liked = currentUser && (work.likedBy || []).includes(currentUser.uid);
    const resume = getReadingPos(work.id);
    const author = getLiveWorkAuthor(work);
    const vBadge = getVerifiedBadge(author.followerCount) + getCreatorVerifiedBadge(author, work.type);
    const isTD = isTakedown(work);
    const isNP = isNonPublish(work);
    const isUN = isUnggulan(work);
    const borderClass = isTD ? 'takedown-border' : isNP ? 'nonpublish-border' : isUN ? 'unggulan-border' : '';
    const resumeBadge = (resume && !isTD && !isNP) ? `<div class="absolute top-2 right-20 bg-blue-600/90 backdrop-blur text-white text-[10px] font-bold px-2 py-1 rounded-full"><i class="fas fa-bookmark"></i> Lanjut</div>` : '';
    const animClass = skipAnim ? '' : 'card-anim';
    const newClass = (isNew && !isTD && !skipAnim) ? 'new-work' : '';
    const delayStyle = skipAnim ? '' : `animation-delay:${Math.min(idx*0.03, 0.5)}s`;
    const reportsCount = (work.reports || []).length;
    const reportBadge = (!isTD && reportsCount > 0) ? `<div class="absolute bottom-10 right-2 bg-red-600/90 backdrop-blur text-white text-[10px] font-bold px-2 py-1 rounded-full" title="${reportsCount} report"><i class="fas fa-flag"></i> ${reportsCount}/10</div>` : '';
    return `
    <div class="card-bg hover-lift rounded-2xl overflow-hidden shadow-lg cursor-pointer ${animClass} ${borderClass} ${newClass}" style="${delayStyle}" onclick="${isTD ? `showToast('⛔ Karya ini di-takedown')` : isNP ? `showToast('🔒 Karya belum dipublish')` : `window.location.hash='reader/${work.id}'`}">
      <div class="h-40 md:h-48 bg-slate-800 flex items-center justify-center overflow-hidden relative">
        ${work.coverURL ? `<img src="${work.coverURL}" class="w-full h-full object-cover ${isTD ? 'grayscale opacity-40' : isNP ? 'grayscale opacity-70' : ''}" onerror="this.style.display='none';">` : `<i class="fas fa-image text-5xl text-slate-600"></i>`}
        ${workStatusBadge(work)}
        ${statusLabel(work.isTamat)}
        ${resumeBadge}
        ${reportBadge}
        <div class="absolute bottom-2 left-2 right-2 flex justify-between items-center pointer-events-none">
          <span class="view-badge bg-black/70 backdrop-blur px-2 py-1 rounded-full"><i class="fas fa-eye"></i> <span data-view-id="${work.id}" data-val="${work.views || 0}">${formatCount(work.views || 0)}</span></span>
          <span class="view-badge bg-black/70 backdrop-blur px-2 py-1 rounded-full"><i class="fas fa-heart" style="color:#ef4444"></i> <span data-like-id="${work.id}" data-val="${work.likes || 0}">${formatCount(work.likes || 0)}</span></span>
        </div>
      </div>
      <div class="p-3 md:p-4">
        <h3 class="font-bold text-sm md:text-lg truncate ${isTD ? 'text-slate-500 line-through' : ''}">${work.title}</h3>
        <p class="text-xs md:text-sm text-slate-400 line-clamp-2 mt-1">${work.teaser || ''}</p>
        <div class="flex flex-wrap gap-1 mt-2">
          ${cats.slice(0,2).map(c => `<span class="text-[10px] md:text-xs bg-slate-700 px-1.5 py-0.5 rounded-full">${c}</span>`).join('')}
          ${cats.length > 2 ? `<span class="text-[10px] md:text-xs bg-slate-700 px-1.5 py-0.5 rounded-full">+${cats.length-2}</span>` : ''}
        </div>
        <div class="mt-2 flex items-center gap-2 text-xs text-slate-500">
          <div class="flex items-center gap-1 flex-1 min-w-0 cursor-pointer hover:opacity-80" onclick="event.stopPropagation();window.location.hash='user/${work.authorId}'">
            <img src="${author.photo || 'https://ui-avatars.com/api/?name='+encodeURIComponent(author.name||'U')}" class="w-5 h-5 rounded-full border border-slate-700">
            <span class="flex items-center min-w-0 hover:text-amber-400"><span class="truncate">${author.name || 'Anonim'}</span>${vBadge}</span>
            ${author.level > 1000 ? '<i class="fas fa-crown text-amber-400 text-[10px] badge-float"></i>' : ''}
          </div>
          <button class="like-btn ${liked ? 'liked' : 'text-slate-400'}" onclick="event.stopPropagation();toggleWorkLike('${work.id}')" title="${liked ? 'Unlike' : 'Like'}" ${isTD ? 'disabled' : ''}>
            <i class="fas fa-heart"></i>
          </button>
          ${work.avgRating ? `<span class="text-amber-400"><i class="fas fa-star text-[10px]"></i> ${work.avgRating.toFixed(1)}</span>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');
}

window.toggleWorkLike = async (workId) => {
  if (!currentUser || !userProfile) { showToast('Login dulu untuk like'); return; }
  try {
    const workRef = doc(db, 'works', workId);
    const snap = await getDoc(workRef);
    if (!snap.exists()) return;
    const work = snap.data();
    const likedBy = work.likedBy || [];
    const isLiked = likedBy.includes(currentUser.uid);
    let newLikedBy;
    let likeDelta;
    if (isLiked) {
      newLikedBy = likedBy.filter(id => id !== currentUser.uid);
      likeDelta = -1;
    } else {
      newLikedBy = [...likedBy, currentUser.uid];
      likeDelta = +1;
      await addExp(EXP_PER_COMMENT);
      await trackWorkActivity(workId,'likes',1);
    }
    await updateDoc(workRef, {
      likedBy: newLikedBy,
      likes: increment(likeDelta),
      updatedAt: serverTimestamp()
    });
    const el = document.querySelector(`[data-like-id="${workId}"]`);
    if (el) {
      const cur = parseInt(el.dataset.val || el.textContent.replace(/[^\d]/g, '')) || 0;
      const next = Math.max(0, cur + likeDelta);
      el.textContent = formatCount(next);
      el.dataset.val = next;
    }
    document.querySelectorAll('.like-btn').forEach(b => {
      if (b.getAttribute('onclick')?.includes(workId)) {
        b.classList.toggle('liked', !isLiked);
        b.classList.toggle('text-slate-400', isLiked);
      }
    });
    showToast(isLiked ? 'Like dihapus' : '❤️ Disukai!');
  } catch (e) { showToast('Gagal: ' + e.message); }
};

    try {

  }

  if (data.image) {

    if (pv) {
      const safeUrl = escAttr(data.image);
      pv.innerHTML = `

        </div>`;
    }
  }
  document.getElementById('closeBerita').onclick = () => modal.classList.add('hidden');
  document.getElementById('saveBeritaBtn').onclick = async () => {
    const title = document.getElementById('beritaTitle').value.trim();
    const cnt = document.getElementById('beritaContent').value.trim();
    const img = getCoverValue('beritaCover');
    if (!title || !cnt) { showToast('Judul & isi wajib'); return; }
    const btn = document.getElementById('saveBeritaBtn');
    btn.disabled = true; btn.textContent = 'Menyimpan...';
    try {
      if (id) {
        await updateDoc(doc(db, 'berita', id), { title, content: cnt, image: img, updatedAt: serverTimestamp() });
      } else {
        const beritaRef = await addDoc(collection(db, 'berita'), {
          title, content: cnt, image: img, pinned: false,
          authorId: currentUser?.uid || 'admin',
          authorName: userProfile?.username || 'Admin',
          createdAt: serverTimestamp()

      if (main) await renderBerita(main);
    } catch (e) {
      showToast('Gagal: ' + e.message);
      btn.disabled = false; btn.textContent = 'Simpan';
    }
  };
}

async function renderTopFollowers(container) {
  container.innerHTML = `
    <h2 class="text-2xl font-bold mb-4"><i class="fas fa-crown text-amber-400 mr-2 badge-float"></i>Top Followers</h2>
    <div class="flex gap-2 mb-6 flex-wrap">
      <button id="lfAll" class="px-4 py-2 rounded-full font-bold text-sm bg-amber-500 text-black">Semua</button>
      <button id="lfKreator" class="px-4 py-2 rounded-full font-bold text-sm bg-slate-800 text-slate-300">Kreator</button>
      <button id="lfUnggulan" class="px-4 py-2 rounded-full font-bold text-sm bg-slate-800 text-slate-300">⭐ Unggulan</button>
      <button id="lfStaff" class="px-4 py-2 rounded-full font-bold text-sm bg-slate-800 text-slate-300">Staff</button>
    </div>
    <div id="followersLbList" class="space-y-3">Memuat...</div>`;
  let filterMode = 'all';
  const list = document.getElementById('followersLbList');
  document.getElementById('lfAll').onclick = () => { filterMode = 'all'; setLfActive('lfAll'); load(); };
  document.getElementById('lfKreator').onclick = () => { filterMode = 'kreator'; setLfActive('lfKreator'); load(); };
  document.getElementById('lfUnggulan').onclick = () => { filterMode = 'unggulan'; setLfActive('lfUnggulan'); load(); };
  document.getElementById('lfStaff').onclick = () => { filterMode = 'staff'; setLfActive('lfStaff'); load(); };
  function setLfActive(id) {
    ['lfAll','lfKreator','lfUnggulan','lfStaff'].forEach(x => {
      const el = document.getElementById(x);
      if (x === id) { el.classList.add('bg-amber-500','text-black'); el.classList.remove('bg-slate-800','text-slate-300'); }
      else { el.classList.remove('bg-amber-500','text-black'); el.classList.add('bg-slate-800','text-slate-300'); }
    });
  }
  async function load() {
    list.innerHTML = '<p class="text-slate-400 text-sm">Memuat...</p>';
    const snap = await getDocs(collection(db, 'users'));
    let users = [];
    snap.forEach(d => users.push({ id: d.id, ...d.data() }));
    users = users.filter(u => (u.followerCount || 0) > 0);
    if (filterMode === 'kreator') {
      users = users.filter(u => { const r = u.roles || [u.role || 'pembaca']; return (r.includes('penulis') || r.includes('komikus')) && !r.includes('owner') && !r.includes('admin'); });
      users.sort((a, b) => (b.followerCount || 0) - (a.followerCount || 0));
    } else if (filterMode === 'unggulan') {
      users = users.filter(u => u.featuredCreator === true);
      users.sort((a, b) => (b.followerCount || 0) - (a.followerCount || 0));
    } else if (filterMode === 'staff') {
      users = users.filter(u => { const r = u.roles || [u.role || 'pembaca']; return r.includes('owner') || r.includes('admin'); });
      users.sort((a, b) => {
        const aOwner = (a.roles || []).includes('owner') ? 1 : 0;
        const bOwner = (b.roles || []).includes('owner') ? 1 : 0;
        if (aOwner !== bOwner) return bOwner - aOwner;
        return (b.followerCount || 0) - (a.followerCount || 0);
      });
    } else {
      users = users.filter(u => { const r = u.roles || [u.role || 'pembaca']; return !r.includes('owner') && !r.includes('admin'); });
      users.sort((a, b) => (b.followerCount || 0) - (a.followerCount || 0));
    }
    users = users.slice(0, 30);
    if (users.length === 0) { list.innerHTML = '<div class="card-bg rounded-2xl p-8 text-center text-slate-400"><i class="fas fa-users text-4xl text-amber-400/30 mb-3"></i><p>Belum ada user.</p></div>'; return; }
    const rankColors = ['bg-gradient-to-br from-yellow-400 to-amber-600 text-black','bg-gradient-to-br from-slate-300 to-slate-500 text-black','bg-gradient-to-br from-amber-700 to-amber-900 text-white'];
    list.innerHTML = users.map((u, i) => {
      const r = u.roles || [u.role || 'pembaca'];
      const isO = r.includes('owner'), isA = r.includes('admin');
      const v = getVerifiedBadge(u.followerCount || 0) + getCreatorVerifiedBadge(u);
      const unggulan = u.featuredCreator ? '<span class="unggulan-tag ml-1">⭐ UNGGULAN</span>' : '';
      return `<div class="card-bg hover-lift rounded-2xl p-4 flex items-center gap-4 cursor-pointer card-anim ${u.featuredCreator ? 'unggulan-border' : ''}" style="animation-delay:${i*0.03}s" onclick="window.location.hash='user/${u.id}'">
        <div class="leaderboard-rank ${i < 3 ? rankColors[i] : 'bg-slate-700 text-slate-300'}">${i+1}</div>
        <img src="${u.photoURL || 'https://ui-avatars.com/api/?name='+encodeURIComponent(u.username||'U')}" class="w-14 h-14 rounded-full border-2 ${u.featuredCreator ? 'border-amber-400' : isO?'border-red-500':isA?'border-amber-500':'border-slate-700'} ${isO ? 'owner-shine' : ''}">
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-1 flex-wrap">
            <h3 class="font-bold flex items-center min-w-0"><span class="truncate">${u.username || 'User'}</span>${v}</h3>
            ${getRoleTagsForUid(u.id, u)}
            ${unggulan}
          </div>
          <p class="text-xs text-slate-400">Lv.${u.level || 1} • ${getLevelTitle(u.level || 1)}</p>
        </div>
        <div class="text-right">
          <div class="text-amber-400 font-black text-lg">${formatCount(u.followerCount || 0)}</div>
          <div class="text-xs text-slate-500">followers</div>
        </div>
      </div>`;
    }).join('');
  }
  load();
}

  const u = snap.data();
  const isMe = currentUser && currentUser.uid === uid;
  const isFriend = userProfile?.friends?.includes(uid);
  const hasRequested = userProfile?.friendRequests?.includes(uid);
  const isFollowing = userProfile?.following?.includes(uid);
  const level = u.level || 1, golden = isGolden(level);
  const roles = u.roles || [u.role || 'pembaca'];
  const worksSnap = await getDocs(query(collection(db, 'works'), where('authorId', '==', uid)));
  const works = []; worksSnap.forEach(d => works.push({ id: d.id, ...d.data() }));
  const clanSnap = u.clanId ? await getDoc(doc(db, 'clans', u.clanId)) : null;
  const clan = clanSnap && clanSnap.exists() ? { id: clanSnap.id, ...clanSnap.data() } : null;
  const isClanOwner = clan && clan.leader === uid;
  const isClanAdmin = clan && (clan.admins || []).includes(uid);
  const socialHtml = buildSocialLinks(u);
  const verified = getVerifiedBadge(u.followerCount || 0) + getCreatorVerifiedBadge(u);
  const bio = u.bio || '';
  const unggulan = u.featuredCreator ? '<span class="unggulan-tag ml-1">⭐ KREATOR UNGGULAN</span>' : '';
  const isOwner = hasRole(u, 'owner');
  let bdayDisplay = '';
  if (u.birthday) {
    const [mm, dd] = u.birthday.split('-');
    const monthNames = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
    bdayDisplay = `<span class="user-birthday"><i class="fas fa-birthday-cake"></i> ${parseInt(dd)} ${monthNames[parseInt(mm)-1]}</span>`;
  }
  container.innerHTML = `
    <button onclick="history.back()" class="text-amber-400 mb-4 hover:text-amber-300 transition"><i class="fas fa-arrow-left mr-2"></i>Kembali</button>
    <div class="card-bg rounded-2xl p-6 mb-6 card-anim ${u.featuredCreator ? 'unggulan-border' : ''} ${isOwner ? 'owner-shine-card' : ''}">
      <div class="flex flex-col md:flex-row items-center md:items-start gap-4">
        <div class="relative">
          <img src="${u.photoURL || 'https://ui-avatars.com/api/?name='+encodeURIComponent(u.username||'U')}" class="w-24 h-24 rounded-full border-4 ${u.featuredCreator ? 'border-amber-400' : golden ? 'border-amber-400' : 'border-slate-600'} ${isOwner ? 'owner-shine' : ''}">
          ${u.featuredCreator ? '<i class="fas fa-crown absolute -top-2 -right-2 text-amber-400 text-2xl badge-float"></i>' : ''}
        </div>
        <div class="flex-1 text-center md:text-left">
          <h2 class="text-2xl font-black ${golden || u.featuredCreator ? 'gold-glow' : ''}">${u.username || 'User'}${verified}</h2>
          <div class="flex gap-2 mt-2 flex-wrap justify-center md:justify-start">
            ${unggulan}
            <span class="text-xs px-3 py-1 rounded-full ${golden ? 'gold-badge' : 'bg-slate-700'}">Lv.${level} • ${getLevelTitle(level)}</span>
            ${roles.map(r => `<span class="text-xs bg-indigo-900/60 px-3 py-1 rounded-full">${ROLE_LABELS[r] || r}</span>`).join('')}
            ${clan ? `<span class="${isClanOwner ? 'clan-owner-tag' : isClanAdmin ? 'clan-admin-tag' : 'clan-tag'} cursor-pointer hover:scale-105 transition" onclick="window.location.hash='clan/${clan.id}'">${isClanOwner ? '👑 ' : isClanAdmin ? '⚔️ ' : ''}${clan.name}</span>` : ''}
          </div>
          <div class="flex gap-2 mt-3 flex-wrap justify-center md:justify-start">
            <div class="follower-stat" onclick="window.location.hash='followers/${uid}'"><i class="fas fa-users"></i><b id="followerCount-${uid}">${formatCount(u.followerCount || 0)}</b> Followers</div>
            <div class="follower-stat" onclick="window.location.hash='following/${uid}'"><i class="fas fa-user-check"></i><b>${formatCount(u.followingCount || 0)}</b> Following</div>
            ${bdayDisplay}
          </div>
          ${bio ? `<div class="user-bio"><i class="fas fa-quote-left"></i>${bio}</div>` : ''}
          ${socialHtml ? `<div class="flex flex-wrap gap-1 mt-4 justify-center md:justify-start">${socialHtml}</div>` : ''}
          ${!isMe ? `<div class="flex gap-2 mt-4 justify-center md:justify-start flex-wrap">
            <button id="followBtn-${uid}" class="follow-btn ${isFollowing ? 'following' : 'not-following'}" onclick="toggleFollow('${uid}')">
              ${isFollowing ? '<i class="fas fa-check"></i> Mengikuti' : '<i class="fas fa-user-plus"></i> Follow'}
            </button>
            ${isFriend ? `<button id="btnDM" class="bg-amber-500 text-black font-bold py-2 px-4 rounded-full text-sm hover:scale-105 transition"><i class="fas fa-comment mr-1"></i>Chat</button>` : 
              hasRequested ? `<button class="bg-slate-700 text-slate-300 font-bold py-2 px-4 rounded-full text-sm" disabled>Sudah Request</button>` :
              `<button id="btnAdd" class="bg-green-600 text-white font-bold py-2 px-4 rounded-full text-sm hover:scale-105 transition"><i class="fas fa-user-plus mr-1"></i>Tambah Teman</button>`}
          </div>` : ''}
        </div>
      </div>
    </div>
    <h3 class="text-xl font-bold mb-3">Karya (${works.length})</h3>
    <div id="pubWorks" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 md:gap-5"></div>`;
  renderWorkList(document.getElementById('pubWorks'), works, new Set(), true);
  if (document.getElementById('btnAdd')) {
    document.getElementById('btnAdd').onclick = async () => {
      if (!currentUser) { showToast('Login dulu'); return; }
      const curSnap = await getDoc(doc(db, 'users', uid));
      const curData = curSnap.data();
      await updateDoc(doc(db, 'users', uid), { friendRequests: [...(curData.friendRequests || []), currentUser.uid] });
      showToast('Request terkirim!'); renderPage();
    };
  }
  if (document.getElementById('btnDM')) { document.getElementById('btnDM').onclick = () => { window.location.hash = 'privatechat/' + uid; }; }
}

async function renderPrivateChat(container, otherUid) {
  if (!currentUser) { container.innerHTML = '<p class="text-red-400">Login dulu</p>'; return; }
  const otherSnap = await getDoc(doc(db, 'users', otherUid));
  if (!otherSnap.exists()) { container.innerHTML = '<p class="text-red-400">User tidak ditemukan</p>'; return; }
  const other = otherSnap.data();
  const chatId = [currentUser.uid, otherUid].sort().join('_');
  try {
    await setDoc(doc(db,'privateChats',chatId), {
      participants: [currentUser.uid, otherUid],
      ['unreadCount_' + currentUser.uid]: 0,
      lastOpenedBy: currentUser.uid,
      lastOpenedAt: serverTimestamp()
    }, { merge:true });
  } catch(e) {}
  if (notifState.dm) { notifState.dm.count = Math.max(0, Number(notifState.dm.count || 0)); saveNotifState(); updateBadges(); }
  const isOwner = hasRole(other, 'owner');
  container.innerHTML = `
    <button onclick="window.location.hash='teman'" class="text-amber-400 mb-4 hover:text-amber-300 transition"><i class="fas fa-arrow-left mr-2"></i>Kembali</button>
    <div class="card-bg rounded-2xl p-4 flex items-center gap-3 mb-4 card-anim ${isOwner ? 'owner-shine-card' : ''}">
      <img src="${other.photoURL || 'https://ui-avatars.com/api/?name='+encodeURIComponent(other.username||'U')}" class="w-10 h-10 rounded-full ${isOwner ? 'owner-shine' : ''}">
      <div class="flex-1">
        <div class="flex items-center gap-2 flex-wrap">
          <h3 class="font-bold">${other.username}${getVerifiedBadge(other.followerCount || 0)}${getCreatorVerifiedBadge(other)}</h3>
          ${getRoleTagsForUid(otherUid, other)}
        </div>
        <p class="text-xs text-slate-400">Lv.${other.level || 1} • ${getLevelTitle(other.level || 1)}</p>
      </div>
    </div>
    <div class="card-bg rounded-2xl p-4 h-[60vh] flex flex-col card-anim">
      <div id="pmMsgs" class="flex-1 overflow-y-auto scrollbar-thin space-y-3 mb-3 p-2"></div>
      <div id="pmStickerPreview"></div>
      <div id="pmImgPreview"></div>
      <div class="flex gap-2 items-center mt-2">
        <button class="sticker-send-btn" title="Stiker" onclick="window.openStickerPanel('private')"><i class="fas fa-sticky-note text-lg"></i></button>
        <label class="chat-img-send-btn" title="Kirim gambar"><i class="fas fa-image text-lg"></i><input type="file" id="pmImgInput" accept="image/*"></label>
        <input id="pmInput" type="text" placeholder="Tulis pesan..." class="flex-1 bg-slate-800 border border-slate-700 rounded-full px-4 py-2 text-sm focus:border-amber-500 transition">
        <button id="pmSend" class="bg-amber-500 text-black px-5 py-2 rounded-full font-bold text-sm hover:scale-105 transition"><i class="fas fa-paper-plane"></i></button>
      </div>
    </div>`;
  const msgsDiv = document.getElementById('pmMsgs');
  let lastId = null;
  privateChatUnsub = onSnapshot(query(collection(db, 'privateChats', chatId, 'messages'), orderBy('createdAt', 'asc'), limit(100)), snap => {
    const arr = []; snap.forEach(d => arr.push({ id: d.id, ...d.data() }));
    if (arr.length === 0) { msgsDiv.innerHTML = '<p class="text-slate-500 text-sm text-center">Belum ada pesan.</p>'; return; }
    const lastMsg = arr[arr.length - 1];
    const isNew = lastId && lastMsg.id !== lastId;
    msgsDiv.innerHTML = arr.map((m, idx) => {
      const own = m.userId === currentUser.uid;
      const isLast = idx === arr.length - 1;
      const anim = isLast && isNew ? (own ? 'chat-msg-new-own' : 'chat-msg-new') : '';
      const userObj = usersCache[m.userId] || (m.userId === currentUser?.uid ? userProfile : { username: m.username, photoURL: m.photoURL, level: m.userLevel });
      const un = userObj.username || m.username || 'User';
      const pu = userObj.photoURL || m.photoURL || '';
      const ul = userObj.level || m.userLevel || 1;
      const isImg = m.image && !m.text && !m.sticker;
      const isSticker = m.sticker;
      const isMediaOnly = (m.image || m.sticker) && !m.text;
      return `<div class="flex ${own ? 'justify-end' : ''} gap-2 ${anim}">
        ${!own ? `<img src="${pu || 'https://ui-avatars.com/api/?name='+encodeURIComponent(un)}" class="w-8 h-8 rounded-full">` : ''}
        <div class="max-w-[70%] ${isMediaOnly ? 'chat-img-msg' : (own ? 'bg-amber-500/20' : 'bg-slate-800')} rounded-2xl px-3 py-2">
          ${!isMediaOnly ? `<div class="flex items-center gap-1 flex-wrap text-xs mb-1">
            <span class="${isGolden(ul) ? 'gold-glow font-bold' : 'text-slate-300 font-semibold'}">${un}${getVerifiedBadge(userObj?.followerCount || 0) + getCreatorVerifiedBadge(userObj)}</span>
            ${getRoleTagsForUid(m.userId, userObj)}
            <span class="text-slate-500">Lv.${ul}</span>
          </div>` : ''}
          ${m.sticker ? `<img src="${m.sticker}" class="chat-sticker" onclick="window.showImgFullscreen('${escAttr(m.sticker)}','Stiker dari ${escAttr(un)}')">` : ''}
          ${m.image && !m.sticker ? `<img src="${m.image}" class="chat-img" onclick="window.showImgFullscreen('${escAttr(m.image)}','Gambar dari ${escAttr(un)}')">` : ''}
          ${m.text ? `<p class="text-sm mt-1">${sensor(m.text || '')}</p>` : ''}
          <p class="text-xs text-slate-500 mt-1">${fmtDate(m.createdAt)}</p>
        </div>
        ${own ? `<img src="${pu || 'https://ui-avatars.com/api/?name='+encodeURIComponent(un)}" class="w-8 h-8 rounded-full">` : ''}
      </div>`;
    }).join('');
    lastId = lastMsg.id;
    msgsDiv.scrollTop = msgsDiv.scrollHeight;
  });
  const imgInput = document.getElementById('pmImgInput');
  const imgPreview = document.getElementById('pmImgPreview');
  imgInput.onchange = async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    imgPreview.innerHTML = '<p class="text-xs text-amber-400 mt-2">Mengupload gambar...</p>';
    try {
      const dataUrl = await compressImage(f);
      pendingChatImg.private = dataUrl;
      imgPreview.innerHTML = `<div class="chat-img-preview"><img src="${dataUrl}"><span class="remove-btn" onclick="event.stopPropagation();window.cancelChatImg('private')">×</span></div><p class="text-xs text-green-400 mt-1">✅ Siap dikirim</p>`;
    } catch (err) { imgPreview.innerHTML = `<p class="text-xs text-red-400 mt-1">Gagal: ${err.message}</p>`; }
    imgInput.value = '';
  };
  document.getElementById('pmSend').onclick = async () => {
    const text = document.getElementById('pmInput').value.trim();
    const img = pendingChatImg.private;
    const sticker = pendingChatSticker.private;
    if (!text && !img && !sticker) return;
    const msgData = { userId: currentUser.uid, username: userProfile.username || 'User', photoURL: userProfile.photoURL || '', text: text ? sensor(text) : '', createdAt: serverTimestamp() };
    if (img) msgData.image = img;
    if (sticker) msgData.sticker = sticker;
    const msgRef = await addDoc(collection(db, 'privateChats', chatId, 'messages'), msgData);
    await setDoc(doc(db,'privateChats',chatId), {
      participants: [currentUser.uid, otherUid],
      lastMessageAt: serverTimestamp(),
      lastMessageId: msgRef.id,
      lastSenderId: currentUser.uid,
      ['unreadCount_' + otherUid]: increment(1)
    }, { merge:true });
    pushNotify({ kind: 'dm', chatId, id: msgRef.id });
    document.getElementById('pmInput').value = '';
    pendingChatImg.private = null;
    pendingChatSticker.private = null;
    document.getElementById('pmImgPreview').innerHTML = '';
    document.getElementById('pmStickerPreview').innerHTML = '';
    await addExp(EXP_PER_CHAT);
  };
  document.getElementById('pmInput').addEventListener('keypress', e => { if (e.key === 'Enter') document.getElementById('pmSend').click(); });
}

window.cancelChatImg = (type) => {
  pendingChatImg[type] = null;
  const map = { public: 'publicImgPreview', clan: 'clanImgPreview', private: 'pmImgPreview' };
  const el = document.getElementById(map[type]);
  if (el) el.innerHTML = '';
};

        <button onclick="rejectFriend('${r.id}')" class="bg-red-600 text-white px-3 py-1 rounded-lg text-xs font-bold hover:scale-105 transition">Tolak</button>
      </div>`).join('')}</div>
    </div>` : ''}
    <div class="card-bg rounded-2xl p-4 card-anim">
      <h3 class="font-bold mb-3 text-amber-400">Teman Saya (${friends.length})</h3>
      ${friends.length === 0 ? '<p class="text-slate-400 text-sm">Belum ada teman. Cari di atas!</p>' : `<div class="space-y-2">${friends.map(f => `<div class="flex items-center gap-2 bg-slate-800/50 rounded-xl p-2 hover:bg-slate-800 transition">
        <img src="${f.photoURL || 'https://ui-avatars.com/api/?name='+encodeURIComponent(f.username)}" class="w-10 h-10 rounded-full cursor-pointer" onclick="window.location.hash='user/${f.id}'">
        <div class="flex-1 cursor-pointer" onclick="window.location.hash='user/${f.id}'"><p class="font-semibold text-sm">${f.username}${getVerifiedBadge(f.followerCount || 0)}${getCreatorVerifiedBadge(f)}</p><p class="text-xs text-slate-400">Lv.${f.level || 1}</p></div>
        <button onclick="window.location.hash='privatechat/${f.id}'" class="bg-amber-500 text-black px-3 py-1 rounded-lg text-xs font-bold hover:scale-105 transition"><i class="fas fa-comment"></i> Chat</button>
      </div>`).join('')}</div>`}
    </div>`;

        <div class="flex justify-between items-start mb-3 flex-wrap gap-2">
          <div>
            <h3 class="text-2xl font-black text-amber-400">${isOwner ? '👑 ' : isAdmin ? '⚔️ ' : ''}${myClan.name}</h3>
            <p class="text-sm text-slate-400">Level ${myClan.level || 1} • ${getClanLevelTitle(myClan.level || 1)} • ${(myClan.members || []).length} member</p>
          </div>
          <button onclick="window.location.hash='clan/${myClan.id}'" class="bg-amber-500 text-black px-4 py-2 rounded-full font-bold text-sm hover:scale-105 transition">Buka Chat Clan</button>
        </div>
      </div>` : `
      <div class="card-bg rounded-2xl p-6 mb-6 card-anim">
        <h3 class="font-bold mb-3">Belum punya clan</h3>
        <p class="text-sm text-slate-400 mb-3">Buat clan sendiri atau join dari daftar di bawah.</p>
        <div class="flex gap-2">
          <input id="newClanName" type="text" placeholder="Nama clan (3-20 char)" maxlength="20" class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm">
          <button id="createClanBtn" class="bg-amber-500 text-black px-6 py-2 rounded-full font-bold hover:scale-105 transition">Buat</button>
        </div>
      </div>`}
    <div class="card-bg rounded-2xl p-4 card-anim">
      <h3 class="font-bold mb-3 text-amber-400">Top Clan (${allClans.length})</h3>
      ${allClans.length === 0 ? '<p class="text-slate-400 text-sm">Belum ada clan.</p>' : `<div class="space-y-2">${allClans.slice(0, 20).map((cn, i) => `
        <div class="flex items-center gap-3 bg-slate-800/50 rounded-xl p-3 cursor-pointer hover:bg-slate-800 hover:translate-x-1 transition" onclick="window.location.hash='clan/${cn.id}'">
          <div class="w-10 h-10 rounded-full bg-amber-500 text-black flex items-center justify-center font-black">${cn.name ? cn.name[0].toUpperCase() : 'C'}</div>
          <div class="flex-1"><p class="font-bold">${cn.name}</p><p class="text-xs text-slate-400">Lv.${cn.level || 1} • ${(cn.members || []).length} member</p></div>
          <span class="text-amber-400 text-xs font-bold">#${i + 1}</span>
        </div>`).join('')}</div>`}
    </div>`;
  if (document.getElementById('createClanBtn')) {
    document.getElementById('createClanBtn').onclick = async () => {
      const name = document.getElementById('newClanName').value.trim();
      if (!name || name.length < 3) { showToast('Nama 3-20 karakter'); return; }
      try {
        const ref = await addDoc(collection(db, 'clans'), {
          name, leader: currentUser.uid, leaderName: userProfile.username,
          members: [currentUser.uid], admins: [], joinRequests: [], exp: 0, level: 1, createdAt: serverTimestamp()
        });
        await updateDoc(doc(db, 'users', currentUser.uid), { clanId: ref.id });
        userProfile.clanId = ref.id;
        await loadClansCache();
        showToast('Clan dibuat!'); renderPage();
      } catch (e) { showToast('Gagal: ' + e.message); }
    };
  }
}

// ============================================================
// ===== CLAN DETAIL (CHAT + MEMBER) ==========================
// ============================================================
async function renderClanDetail(container, clanId) {
  const snap = await getDoc(doc(db, 'clans', clanId));
  if (!snap.exists()) { container.innerHTML = '<p class="text-red-400">Clan tidak ditemukan</p>'; return; }
  const clan = { id: snap.id, ...snap.data() };
  markNotifSeen('clan', Date.now());
  const admins = clan.admins || [];
  const joinReqs = clan.joinRequests || [];
  const isMember = currentUser && clan.members?.includes(currentUser.uid);
  const isOwner = currentUser && clan.leader === currentUser.uid;
  const isAdmin = currentUser && admins.includes(currentUser.uid);
  const canKick = isOwner || isAdmin;
  const canManageAdmin = isOwner;
  const hasPendingReq = currentUser && joinReqs.includes(currentUser.uid);
  const memberSnaps = await Promise.all((clan.members || []).map(uid => getDoc(doc(db, 'users', uid))));
  const members = memberSnaps.filter(s => s.exists()).map(s => ({ id: s.id, ...s.data() }));
  const reqSnaps = await Promise.all(joinReqs.map(uid => getDoc(doc(db, 'users', uid))));
  const reqUsers = reqSnaps.filter(s => s.exists()).map(s => ({ id: s.id, ...s.data() }));

  container.innerHTML = `
    <button onclick="window.location.hash='clan'" class="text-amber-400 mb-4 hover:text-amber-300 transition"><i class="fas fa-arrow-left mr-2"></i>Kembali</button>
    <div class="card-bg rounded-2xl p-6 mb-4 card-anim ${isOwner ? 'tamat-border' : 'berlanjut-border'}">
      <div class="flex flex-col md:flex-row items-center gap-4">
        <div class="w-20 h-20 rounded-2xl bg-amber-500 text-black flex items-center justify-center text-3xl font-black badge-float">${clan.name ? clan.name[0].toUpperCase() : 'C'}</div>
        <div class="flex-1 text-center md:text-left">
          <h2 class="text-2xl font-black text-amber-400">${isOwner ? '👑 ' : isAdmin ? '⚔️ ' : ''}${clan.name}</h2>
          <p class="text-sm text-slate-400 mt-1">Leader: ${clan.leaderName || '-'}</p>
          <div class="flex gap-2 mt-2 justify-center md:justify-start flex-wrap">
            <span class="text-xs px-3 py-1 rounded-full bg-slate-700">Lv.${clan.level || 1} • ${getClanLevelTitle(clan.level || 1)}</span>
            <span class="text-xs px-3 py-1 rounded-full bg-slate-700">${members.length} Member</span>
            <span class="text-xs px-3 py-1 rounded-full bg-purple-900/60">${admins.length}/2 Admin</span>
            ${joinReqs.length > 0 ? `<span class="text-xs px-3 py-1 rounded-full join-request-badge">${joinReqs.length} Request Join</span>` : ''}
          </div>
        </div>
        <div class="flex flex-col md:flex-row gap-2 flex-wrap justify-center">
          ${!isMember && currentUser && !hasPendingReq ? `<button id="joinClan" class="bg-green-600 text-white font-bold px-6 py-2 rounded-full hover:scale-105 transition">Request Join</button>` : ''}
          ${hasPendingReq ? `<span class="bg-yellow-600/30 text-yellow-300 font-bold px-4 py-2 rounded-full text-sm border border-yellow-600/50">⏳ Menunggu Persetujuan</span>` : ''}
          ${isMember && !isOwner ? `<button id="leaveClanBtn" class="bg-red-700 text-white font-bold px-4 py-2 rounded-full text-sm hover:scale-105 transition"><i class="fas fa-sign-out-alt mr-1"></i>Keluar Clan</button>` : ''}
          ${isOwner ? `
            <button id="editClanBtn" class="bg-blue-600 text-white font-bold px-4 py-2 rounded-full text-sm hover:scale-105 transition"><i class="fas fa-edit mr-1"></i>Edit</button>
            <button id="deleteClanBtn" class="bg-red-700 text-white font-bold px-4 py-2 rounded-full text-sm hover:scale-105 transition"><i class="fas fa-trash mr-1"></i>Hapus</button>
          ` : ''}
        </div>
      </div>
      ${isOwner ? `<div id="editClanForm" class="hidden mt-4 border-t border-slate-700 pt-4">
        <label class="block text-sm font-semibold mb-1 text-amber-400">Nama Clan Baru</label>
        <div class="flex gap-2">
          <input id="editClanName" type="text" maxlength="20" value="${clan.name}" class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm">
          <button id="saveClanNameBtn" class="bg-green-600 text-white px-4 py-2 rounded-lg font-bold text-sm hover:scale-105 transition">Simpan</button>
          <button id="cancelEditClanBtn" class="bg-slate-700 text-slate-300 px-4 py-2 rounded-lg font-bold text-sm">Batal</button>
        </div>
      </div>` : ''}
    </div>
    ${(isOwner || isAdmin) && reqUsers.length > 0 ? `
    <div class="card-bg rounded-2xl p-4 mb-4 card-anim border border-blue-600/50">
      <h3 class="font-bold mb-3 text-blue-400"><i class="fas fa-user-plus mr-1"></i>Request Join (${reqUsers.length})</h3>
      <p class="text-xs text-slate-400 mb-3">Setiap user yang ingin masuk <b>wajib</b> disetujui Admin/Owner clan.</p>
      <div class="space-y-2">
        ${reqUsers.map(r => `
          <div class="flex items-center gap-2 bg-slate-800/50 rounded-xl p-2">
            <img src="${r.photoURL || 'https://ui-avatars.com/api/?name='+encodeURIComponent(r.username)}" class="w-10 h-10 rounded-full cursor-pointer" onclick="window.location.hash='user/${r.id}'">
            <div class="flex-1 cursor-pointer" onclick="window.location.hash='user/${r.id}'"><p class="font-semibold text-sm">${r.username}${getVerifiedBadge(r.followerCount || 0)}${getCreatorVerifiedBadge(r)}</p><p class="text-xs text-slate-400">Lv.${r.level || 1}</p></div>
            <button onclick="approveClanJoin('${clanId}','${r.id}')" class="bg-green-600 text-white px-3 py-1 rounded-lg text-xs font-bold hover:scale-105 transition">Terima</button>
            <button onclick="rejectClanJoin('${clanId}','${r.id}')" class="bg-red-600 text-white px-3 py-1 rounded-lg text-xs font-bold hover:scale-105 transition">Tolak</button>
          </div>
        `).join('')}
      </div>
    </div>` : ''}
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
      <div class="card-bg rounded-2xl p-4 card-anim">
        <div class="flex justify-between items-center mb-3">
          <h3 class="font-bold text-amber-400">Member (${members.length})</h3>
          <span class="text-xs text-slate-400">Max 2 Admin</span>
        </div>
        <div class="space-y-2 max-h-[50vh] overflow-y-auto scrollbar-thin">
          ${members.map(m => {
            const mOwner = m.id === clan.leader;
            const mAdmin = admins.includes(m.id);
            const isMe = currentUser && m.id === currentUser.uid;
            const canKickThis = canKick && !mOwner && !isMe;
            const canPromoteThis = canManageAdmin && !mOwner && !isMe;
            const canDemoteThis = canManageAdmin && mAdmin && !mOwner;
            const tagHtml = getRoleTagsForUid(m.id, m);
            return `
              <div class="bg-slate-800/50 rounded-xl p-3">
                <div class="flex items-center gap-2 flex-wrap">
                  <img src="${m.photoURL || 'https://ui-avatars.com/api/?name='+encodeURIComponent(m.username)}" class="w-10 h-10 rounded-full cursor-pointer hover:scale-110 transition ${mOwner ? 'owner-shine' : ''}" onclick="window.location.hash='user/${m.id}'">
                  <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-1 flex-wrap">
                      <p class="font-semibold text-sm cursor-pointer hover:text-amber-400" onclick="window.location.hash='user/${m.id}'">${m.username}${getVerifiedBadge(m.followerCount || 0)}${getCreatorVerifiedBadge(m)}</p>
                      ${mOwner ? '<span class="clan-owner-tag text-xs">👑 OWNER</span>' : mAdmin ? '<span class="clan-admin-tag text-xs">⚔️ ADMIN</span>' : '<span class="clan-tag text-xs">MEMBER</span>'}
                    </div>
                    <div class="flex items-center gap-1 flex-wrap mt-1">
                      <span class="text-xs text-slate-400">Lv.${m.level || 1}</span>
                      ${tagHtml}
                    </div>
                  </div>
                </div>
                ${(canKickThis || canPromoteThis || canDemoteThis) ? `
                  <div class="flex gap-2 mt-2 flex-wrap">
                    ${canPromoteThis && !mAdmin && admins.length < 2 ? `<button onclick="promoteToAdmin('${clanId}','${m.id}')" class="bg-purple-600 text-white px-3 py-1 rounded-lg text-xs font-bold hover:scale-105 transition"><i class="fas fa-crown mr-1"></i>Jadikan Admin</button>` : ''}
                    ${canDemoteThis ? `<button onclick="demoteAdmin('${clanId}','${m.id}')" class="bg-yellow-600 text-white px-3 py-1 rounded-lg text-xs font-bold hover:scale-105 transition"><i class="fas fa-arrow-down mr-1"></i>Turunkan</button>` : ''}
                    ${canKickThis ? `<button onclick="kickMember('${clanId}','${m.id}','${m.username}')" class="bg-red-600 text-white px-3 py-1 rounded-lg text-xs font-bold hover:scale-105 transition"><i class="fas fa-user-minus mr-1"></i>Keluarkan</button>` : ''}
                  </div>
                ` : ''}
              </div>
            `;
          }).join('')}
        </div>
      </div>
      <div class="card-bg rounded-2xl p-4 flex flex-col h-[70vh] card-anim">
        <h3 class="font-bold mb-3 text-amber-400">Chat Clan</h3>
        <div id="clanMsgs" class="flex-1 overflow-y-auto scrollbar-thin space-y-3 mb-2 p-2"></div>
        <div id="clanReplyPreview"></div>
        <div id="clanStickerPreview"></div>
        <div id="clanImgPreview"></div>
        ${isMember ? `<div class="flex gap-2 items-center mt-2">
          <button class="sticker-send-btn" title="Stiker" onclick="window.openStickerPanel('clan')"><i class="fas fa-sticky-note text-lg"></i></button>
          <label class="chat-img-send-btn" title="Kirim gambar"><i class="fas fa-image text-lg"></i><input type="file" id="clanImgInput" accept="image/*"></label>
          <input id="clanInput" type="text" placeholder="Pesan..." class="flex-1 bg-slate-800 border border-slate-700 rounded-full px-4 py-2 text-sm focus:border-amber-500 transition">
          <button id="clanSend" class="bg-amber-500 text-black px-4 py-2 rounded-full font-bold text-sm hover:scale-105 transition"><i class="fas fa-paper-plane"></i></button>
        </div>` : '<p class="text-slate-400 text-sm mt-2">Join dulu untuk chat.</p>'}
      </div>
    </div>`;

  if (document.getElementById('joinClan')) {
    document.getElementById('joinClan').onclick = async () => {
      const cur = clan.joinRequests || [];
      if (cur.includes(currentUser.uid)) { showToast('Sudah request'); return; }
      await updateDoc(doc(db, 'clans', clanId), { joinRequests: [...cur, currentUser.uid] });
      showToast('📩 Request join terkirim! Tunggu persetujuan Admin/Owner clan.');
      renderPage();
    };
  }
  if (document.getElementById('leaveClanBtn')) {
    document.getElementById('leaveClanBtn').onclick = async () => {
      if (!currentUser || clan.leader === currentUser.uid) { showToast('Owner tidak bisa keluar sebelum menyerahkan kepemimpinan atau menghapus clan.'); return; }
      if (!confirm(`Yakin keluar dari clan "${clan.name}"?`)) return;
      try {
        const freshSnap = await getDoc(doc(db, 'clans', clanId));
        if (!freshSnap.exists()) throw new Error('Clan tidak ditemukan');
        const fresh = freshSnap.data();
        if (fresh.leader === currentUser.uid) { showToast('Owner tidak bisa keluar dari clan.'); return; }
        await updateDoc(doc(db, 'clans', clanId), {
          members: (fresh.members || []).filter(uid => uid !== currentUser.uid),
          admins: (fresh.admins || []).filter(uid => uid !== currentUser.uid),
          joinRequests: (fresh.joinRequests || []).filter(uid => uid !== currentUser.uid),
          updatedAt: serverTimestamp()
        });
        await updateDoc(doc(db, 'users', currentUser.uid), { clanId: null });
        if (userProfile) userProfile.clanId = null;
        await loadClansCache();
        showToast('Kamu berhasil keluar dari clan.');
        window.location.hash = 'clan';
        renderPage();
      } catch (err) { showToast('Gagal keluar dari clan: ' + err.message); }
    };
  }

  if (document.getElementById('editClanBtn')) {
    document.getElementById('editClanBtn').onclick = () => document.getElementById('editClanForm').classList.toggle('hidden');
    document.getElementById('cancelEditClanBtn').onclick = () => document.getElementById('editClanForm').classList.add('hidden');
    document.getElementById('saveClanNameBtn').onclick = async () => {
      const newName = document.getElementById('editClanName').value.trim();
      if (!newName || newName.length < 3) { showToast('Nama 3-20 karakter'); return; }
      await updateDoc(doc(db, 'clans', clanId), { name: newName, updatedAt: serverTimestamp() });
      await loadClansCache();
      showToast('Nama clan diubah!'); renderPage();
    };
  }
  if (document.getElementById('deleteClanBtn')) {
    document.getElementById('deleteClanBtn').onclick = async () => {
      if (!confirm(`Yakin hapus clan "${clan.name}"?`)) return;
      if (!confirm(`Konfirmasi sekali lagi!`)) return;
      try {
        const msgsSnap = await getDocs(collection(db, 'clans', clanId, 'messages'));
        for (const m of msgsSnap.docs) await deleteDoc(doc(db, 'clans', clanId, 'messages', m.id));
        for (const m of members) await updateDoc(doc(db, 'users', m.id), { clanId: null });
        await deleteDoc(doc(db, 'clans', clanId));
        if (userProfile.clanId === clanId) { userProfile.clanId = null; await updateDoc(doc(db, 'users', currentUser.uid), { clanId: null }); }
        await loadClansCache();
        showToast('Clan dihapus!');
        window.location.hash = 'clan';
      } catch (e) { showToast('Gagal: ' + e.message); }
    };
  }
  const msgsDiv = document.getElementById('clanMsgs');
  let lastId = null;
  clanChatUnsub = onSnapshot(query(collection(db, 'clans', clanId, 'messages'), orderBy('createdAt', 'asc'), limit(100)), snap => {
    const arr = []; snap.forEach(d => arr.push({ id: d.id, ...d.data() }));
    if (arr.length === 0) { msgsDiv.innerHTML = '<p class="text-slate-500 text-xs text-center">Belum ada pesan.</p>'; return; }
    const lastMsg = arr[arr.length - 1];
    const isNew = lastId && lastMsg.id !== lastId;
    msgsDiv.innerHTML = arr.map((msg, idx) => {
      const u = usersCache[msg.userId] || (msg.userId === currentUser?.uid ? userProfile : {}) || {};
      const un = u.username || msg.username || 'Anonim';
      const pu = u.photoURL || msg.photoURL || '';
      const ul = u.level || 1;
      const isOwn = msg.userId === currentUser?.uid;
      const isLast = idx === arr.length - 1;
      const isNewMsg = isLast && isNew;
      const roles = u.roles || (u.role ? [u.role] : ['pembaca']);
      const isO = roles.includes('owner'), isA = roles.includes('admin'), isP = roles.includes('penulis'), isK = roles.includes('komikus'), isPc = roles.includes('pembaca');
      const isG = ul > 1000;
      const clanU = u.clanId ? clansCache[u.clanId] : null;
      let bc = 'pembaca-chat-border';
      if (isO) bc = 'owner-chat-border';
      else if (isA) bc = 'admin-chat-border';
      else if (clanU) bc = 'clan-chat-border';
      else if (isP) bc = 'penulis-chat-border';
      else if (isK) bc = 'komikus-chat-border';
      const isImgOnly = (msg.image || msg.sticker) && !msg.text;
      if (isOwn) bc += ' bg-amber-500/20';
      if (isImgOnly) bc = 'chat-img-msg';
      const anim = isNewMsg ? (isOwn ? 'chat-msg-new-own' : 'chat-msg-new') : '';
      const tagsHtml = getRoleTagsForUid(msg.userId, u);
      let replyPreview = '';
      if (msg.replyTo && msg.replyToText) {
        replyPreview = `<div class="reply-preview"><i class="fas fa-reply text-amber-400 mr-1"></i><b class="text-amber-400">${msg.replyToName || 'Anonim'}:</b> ${sensor(msg.replyToText).slice(0, 80)}</div>`;
      }
      return `<div class="flex items-start gap-2 ${isOwn ? 'justify-end' : ''} group ${anim}" data-clanmsgid="${msg.id}">
        ${!isOwn ? `<img src="${pu || 'https://ui-avatars.com/api/?name='+encodeURIComponent(un)}" class="w-8 h-8 rounded-full cursor-pointer hover:scale-110 transition" onclick="window.location.hash='user/${msg.userId}'">` : ''}
        <div class="max-w-[75%] rounded-2xl px-3 py-2 ${bc}">
          ${!isImgOnly ? `<div class="flex items-center gap-1 flex-wrap text-xs mb-1">
            <span class="${isG ? 'gold-glow font-bold' : 'text-slate-300 font-semibold'} cursor-pointer hover:underline" onclick="window.location.hash='user/${msg.userId}'">${un}${getVerifiedBadge(u.followerCount || 0) + getCreatorVerifiedBadge(u)}</span>
            ${isG ? '<i class="fas fa-crown text-amber-400 text-xs"></i>' : ''}
            ${tagsHtml}
            <span class="text-slate-500">Lv.${ul}</span>
            ${msg.edited ? '<span class="text-slate-500 text-xs italic">(diedit)</span>' : ''}
          </div>` : ''}
          ${replyPreview}
          ${msg.sticker ? `<img src="${msg.sticker}" class="chat-sticker" onclick="window.showImgFullscreen('${escAttr(msg.sticker)}','Stiker dari ${escAttr(un)}')">` : ''}
          ${msg.image && !msg.sticker ? `<img src="${msg.image}" class="chat-img" onclick="window.showImgFullscreen('${escAttr(msg.image)}','Gambar dari ${escAttr(un)}')">` : ''}
          ${msg.text ? `<div id="clanmt-${msg.id}" class="text-sm ${msg.image || msg.sticker ? 'mt-1' : ''}">${sensor(msg.text || '')}</div>` : `<div id="clanmt-${msg.id}" class="hidden"></div>`}
          <div class="flex gap-2 mt-1 text-xs">
            <button onclick="replyClanMsg('${msg.id}')" class="text-slate-400 hover:text-green-400 transition opacity-0 group-hover:opacity-100"><i class="fas fa-reply"></i> Balas</button>
            ${isOwn ? `
              ${!msg.image && !msg.sticker ? `<button onclick="editClanMsg('${msg.id}')" class="text-blue-400 hover:text-blue-300 transition opacity-0 group-hover:opacity-100"><i class="fas fa-edit"></i> Edit</button>` : ''}
              <button onclick="delClanMsg('${msg.id}')" class="text-red-400 hover:text-red-300 transition opacity-0 group-hover:opacity-100"><i class="fas fa-trash"></i> Hapus</button>
            ` : ''}
          </div>
        </div>
        ${isOwn ? `<img src="${pu || 'https://ui-avatars.com/api/?name='+encodeURIComponent(un)}" class="w-8 h-8 rounded-full">` : ''}
      </div>`;
    }).join('');
    lastId = lastMsg.id;
    msgsDiv.scrollTop = msgsDiv.scrollHeight;
  });

  const clanImgInput = document.getElementById('clanImgInput');
  const clanImgPreview = document.getElementById('clanImgPreview');
  if (clanImgInput) {
    clanImgInput.onchange = async (e) => {
      const f = e.target.files[0];
      if (!f) return;
      clanImgPreview.innerHTML = '<p class="text-xs text-amber-400 mb-2">Mengupload...</p>';
      try {
        const dataUrl = await compressImage(f);
        pendingChatImg.clan = dataUrl;
        clanImgPreview.innerHTML = `<div class="chat-img-preview"><img src="${dataUrl}"><span class="remove-btn" onclick="event.stopPropagation();window.cancelChatImg('clan')">×</span></div>`;
      } catch (err) { clanImgPreview.innerHTML = `<p class="text-xs text-red-400 mb-1">Gagal: ${err.message}</p>`; }
      clanImgInput.value = '';
    };
  }

  if (document.getElementById('clanSend')) {
    document.getElementById('clanSend').onclick = async () => {
      const text = document.getElementById('clanInput').value.trim();
      const img = pendingChatImg.clan;
      const sticker = pendingChatSticker.clan;
      if (!text && !img && !sticker) return;
      const msgData = { userId: currentUser.uid, username: userProfile.username, photoURL: userProfile.photoURL || '', text: text ? sensor(text) : '', createdAt: serverTimestamp(), edited: false };
      if (img) msgData.image = img;
      if (sticker) msgData.sticker = sticker;
      if (replyingToClan) { msgData.replyTo = replyingToClan.id; msgData.replyToText = replyingToClan.text || (replyingToClan.image ? '🖼️ Gambar' : (replyingToClan.sticker ? '🎨 Stiker' : '')); msgData.replyToName = replyingToClan.username; }
      const clanMsgRef = await addDoc(collection(db, 'clans', clanId, 'messages'), msgData);
      pushNotify({ kind: 'clan', clanId, id: clanMsgRef.id });
      document.getElementById('clanInput').value = '';
      replyingToClan = null;
      pendingChatImg.clan = null;
      pendingChatSticker.clan = null;
      document.getElementById('clanReplyPreview').innerHTML = '';
      document.getElementById('clanImgPreview').innerHTML = '';
      document.getElementById('clanStickerPreview').innerHTML = '';
      await addExp(EXP_PER_CHAT);
    };
    document.getElementById('clanInput').addEventListener('keypress', e => { if (e.key === 'Enter') document.getElementById('clanSend').click(); });
  }
}

window.approveClanJoin = async (clanId, userId) => {
  const snap = await getDoc(doc(db, 'clans', clanId));
  if (!snap.exists()) return;
  const clan = snap.data();
  const isOwner = clan.leader === currentUser.uid;
  const isAdmin = (clan.admins || []).includes(currentUser.uid);
  if (!isOwner && !isAdmin) { showToast('Tidak punya akses!'); return; }
  const reqs = (clan.joinRequests || []).filter(id => id !== userId);
  const members = [...(clan.members || []), userId];
  await updateDoc(doc(db, 'clans', clanId), { members, joinRequests: reqs, updatedAt: serverTimestamp() });
  await updateDoc(doc(db, 'users', userId), { clanId });
  await loadClansCache();

};

window.kickMember = async (clanId, userId, username) => {

  if (!snap.exists()) return;

  const admins = clan.admins || [];
  const isOwner = clan.leader === currentUser.uid;
  const isAdmin = admins.includes(currentUser.uid);

async function renderReader(container, novelId, chapterId = null) {
  if (!novelId) { container.innerHTML = '<p>Karya tidak ditemukan</p>'; return; }
  const workSnap = await getDoc(doc(db, 'works', novelId));
  if (!workSnap.exists()) { container.innerHTML = '<p class="text-red-400">Karya tidak ditemukan.</p>'; return; }
  const work = { id: workSnap.id, ...workSnap.data() };
  if (work.authorId) {
    try {
      const authorSnap = await getDoc(doc(db,'users',work.authorId));
      if (authorSnap.exists()) {
        const author = authorSnap.data();
        work.authorName = author.username || work.authorName;
        work.authorPhotoURL = author.photoURL || '';
        work.authorSosmed = author.sosmed || {};
        work.authorLevel = author.level || 1;
        work.authorFollowerCount = author.followerCount || 0;
        work.authorRoles = author.roles || (author.role ? [author.role] : []);
        work.featuredCreator = author.featuredCreator === true;
      }
    } catch(e) {}
  }

  if (isTakedown(work)) { container.innerHTML = takedownBanner(work); return; }

  const canManage = currentUser && (currentUser.uid === work.authorId || isAdminUser(userProfile));

  if (isNonPublish(work) && !canManage) {
    container.innerHTML = `<button onclick="window.location.hash='home'" class="text-amber-400 mb-4 hover:text-amber-300 transition"><i class="fas fa-arrow-left mr-2"></i>Kembali</button>` + nonpublishBanner(work);
    return;
  }

  const chaptersSnap = await getDocs(query(collection(db, 'works', novelId, 'chapters'), orderBy('number', 'asc')));
  const chapters = []; chaptersSnap.forEach(d => chapters.push({ id: d.id, ...d.data() }));
  let currentChapter = null;
  if (chapterId) currentChapter = chapters.find(c => c.id === chapterId);
  else if (chapters.length > 0) { currentChapter = chapters[0]; window.location.hash = `reader/${novelId}/${currentChapter.id}`; return; }

  const viewKey = `viewed_${novelId}`;
  const alreadyViewed = sessionStorage.getItem(viewKey);
  if (!alreadyViewed) {
    try {
      await updateDoc(doc(db, 'works', novelId), {
        views: increment(1),
        updatedAt: serverTimestamp()
      });
      work.views = (work.views || 0) + 1;
      await trackWorkActivity(novelId,'views',1);
      sessionStorage.setItem(viewKey, '1');
    } catch (e) {}
  }
  if (currentUser && currentChapter) await addExp(EXP_PER_READ);

  const chapterLabel = work.type === 'novel' ? 'Chapter' : 'Eps';
  const cats = parseCategories(work.category);
  const isKomik = work.type === 'komik';
  const isBookmarked = currentUser && (userProfile?.bookmarks || []).includes(novelId);
  const isLiked = currentUser && (work.likedBy || []).includes(currentUser.uid);
  const socialHtml = buildSocialLinks({ sosmed: work.authorSosmed || {} });
  const vBadge = getVerifiedBadge(work.authorFollowerCount || 0) + getCreatorVerifiedBadge({ roles: work.authorRoles || [work.authorRole || 'pembaca'] }, work.type);
  const isUnggulanAuthor = work.featuredCreator === true;
  const reportsCount = (work.reports || []).length;
  const hasReported = currentUser && (work.reports || []).some(r => r.userId === currentUser.uid);

  const chItemHtml = (ch) => {
    const idx = chapters.indexOf(ch);
    return `
      <div class="flex items-center gap-1">
        <button onclick="window.location.hash='reader/${novelId}/${ch.id}'" class="flex-1 text-left px-3 py-2 rounded-lg ${currentChapter && currentChapter.id === ch.id ? 'bg-amber-500/20 border border-amber-500' : 'hover:bg-slate-800'} text-sm truncate transition">
          ${chapterLabel} ${ch.number || idx+1}${ch.title ? ': ' + escHtml(ch.title) : ''}
        </button>
        ${canManage ? `<button onclick="deleteChapterFromReader('${novelId}','${ch.id}','${ch.number || idx+1}')" class="text-red-400 hover:text-red-300 px-2"><i class="fas fa-trash text-xs"></i></button>` : ''}
      </div>`;
  };
  const readerSections = groupChapters(chapters, work);
  const hasGroups = getGroups(work).length > 0;
  const listHtml = !hasGroups ? chapters.map(chItemHtml).join('') : readerSections.map(sec => {
    const isOpen = currentChapter && sec.items.some(c => c.id === currentChapter.id);
    const name = sec.group ? escHtml(groupTitleText(sec.group, work.type)) : `Tanpa ${groupLabel(work.type)}`;
    return `<details class="rounded-lg border border-slate-700/60 bg-slate-900/40" ${isOpen ? 'open' : ''}>
      <summary class="cursor-pointer select-none px-3 py-2 text-sm font-bold text-amber-300 flex items-center gap-2"><i class="fas fa-folder text-amber-400 text-xs"></i><span class="flex-1 truncate">${name}</span><span class="text-[10px] text-slate-500 font-normal">${sec.items.length}</span></summary>
      <div class="px-1 pb-2 space-y-1">${sec.items.length ? sec.items.map(chItemHtml).join('') : '<p class="text-xs text-slate-500 italic px-3 py-1">Belum ada isi.</p>'}</div>
    </details>`;
  }).join('');
  const curGroup = currentChapter && currentChapter.groupId ? getGroups(work).find(g => g.id === currentChapter.groupId) : null;
  const crumbHtml = curGroup ? `<p class="text-xs text-amber-400 font-bold mb-1"><i class="fas fa-folder mr-1"></i>${escHtml(groupTitleText(curGroup, work.type))}</p>` : '';

  const savedPos = getReadingPos(novelId);
  const hasSavedPos = savedPos && savedPos.chapterId === currentChapter?.id && savedPos.scrollY > 100;

  container.innerHTML = `
    <div id="readerContent" class="card-anim">
      <div class="reader-header mb-6 flex flex-wrap justify-between items-center gap-2">
        <button onclick="window.location.hash='home'" class="text-amber-400 hover:text-amber-300 transition"><i class="fas fa-arrow-left mr-2"></i>Kembali</button>
        <div class="flex gap-2 flex-wrap">
          ${isNonPublish(work) && canManage ? `<span class="bg-slate-700 text-slate-300 text-xs font-bold px-3 py-2 rounded-full"><i class="fas fa-eye-slash mr-1"></i>NONPUBLISH</span>` : ''}
          <button id="reportWorkBtn" class="report-btn" ${hasReported ? 'disabled style="opacity:.6"' : ''}>
            <i class="fas fa-flag"></i> ${hasReported ? `Report (${reportsCount}/10)` : 'Report'}
          </button>
          <button id="bookmarkToggle" class="text-sm font-bold px-4 py-2 rounded-full transition ${isBookmarked ? 'bg-green-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}"><i class="fas fa-bookmark mr-1"></i>${isBookmarked ? 'Tersimpan' : 'Bookmark'}</button>
          <button id="readerLikeBtn" class="text-sm font-bold px-4 py-2 rounded-full transition ${isLiked ? 'bg-red-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}"><i class="fas fa-heart mr-1"></i><span id="readerLikeCount" data-val="${work.likes || 0}">${formatCount(work.likes || 0)}</span></button>
        </div>
      </div>
      <div class="reader-header card-bg rounded-2xl p-4 md:p-6 mb-6 ${work.isTamat ? 'tamat-border' : 'berlanjut-border'} ${isUnggulanAuthor ? 'unggulan-border' : ''}">
        <div class="flex flex-col md:flex-row gap-4 md:gap-6">
          <div class="w-full md:w-48 h-64 bg-slate-800 rounded-xl overflow-hidden flex-shrink-0 relative">
            ${work.coverURL ? `<img src="${work.coverURL}" class="w-full h-full object-cover cover-clickable" onclick="window.showImgFullscreen('${escAttr(work.coverURL)}','Sampul: ${escAttr(work.title)}')" onerror="this.style.display='none';">` : `<div class="flex items-center justify-center h-full"><i class="fas fa-image text-5xl text-slate-600"></i></div>`}
            ${statusLabel(work.isTamat)}
          </div>
          <div class="flex-1">
            <h1 class="text-xl md:text-2xl font-black">${work.title}${isUnggulanAuthor ? ' <span class="unggulan-tag">⭐ UNGGULAN</span>' : ''}</h1>
            <p class="text-amber-400/90 italic mt-2">${work.teaser || ''}</p>
            <p class="text-slate-400 mt-2 text-sm">${work.description || ''}</p>
            <div class="flex items-center gap-3 mt-3 text-sm flex-wrap">${cats.map(c => `<span class="bg-slate-700 px-3 py-1 rounded-full text-xs">${c}</span>`).join('')}</div>
            <div class="mt-3 flex items-center gap-2 cursor-pointer hover:opacity-80" onclick="window.location.hash='user/${work.authorId}'">
              <img src="${work.authorPhotoURL || 'https://ui-avatars.com/api/?name='+encodeURIComponent(work.authorName||'U')}" class="w-8 h-8 rounded-full border border-slate-700">
              <span class="text-sm text-amber-400 hover:underline">${work.authorName || 'Anonim'}${vBadge}</span>
              ${work.authorLevel > 1000 ? '<i class="fas fa-crown text-amber-400 badge-float"></i>' : ''}
            </div>
            <div class="flex items-center gap-3 mt-3 text-xs text-slate-400 flex-wrap">
              <span class="view-badge"><i class="fas fa-eye"></i> ${formatCount(work.views || 0)} kali dilihat</span>
              <span class="view-badge"><i class="fas fa-heart" style="color:#ef4444"></i> ${formatCount(work.likes || 0)} suka</span>
              <span class="view-badge"><i class="fas fa-star"></i> ${formatCount(work.ratingCount || 0)} rating</span>
              ${reportsCount > 0 ? `<span class="view-badge"><i class="fas fa-flag" style="color:#ef4444"></i> ${reportsCount}/10 report</span>` : ''}
            </div>
            ${socialHtml ? `<div class="flex flex-wrap gap-1 mt-3">${socialHtml}</div>` : ''}
          </div>
        </div>
        <div class="reader-sidebar mt-4 border-t border-slate-700 pt-4">
          <details class="rounded-lg border border-slate-700/60 bg-slate-900/40" open>
            <summary class="cursor-pointer select-none px-3 py-2 text-sm font-bold text-amber-400 flex items-center gap-2"><i class="fas fa-list"></i><span class="flex-1">Daftar ${chapterLabel} (${chapters.length})</span><i class="fas fa-chevron-down text-xs"></i></summary>

          <div class="reader-content card-bg rounded-2xl p-4 md:p-6">
            ${currentChapter ? `
              <div class="flex justify-between items-start mb-4 gap-2 flex-wrap">
                <div>${crumbHtml}<h2 class="text-lg md:text-xl font-bold">${chapterLabel} ${currentChapter.number}${currentChapter.title ? ': ' + currentChapter.title : ''}</h2></div>
                ${isKomik && currentChapter.images && currentChapter.images.length > 0 ? `<button onclick="toggleFullscreenReader()" class="bg-amber-500 text-black text-xs font-bold px-3 py-2 rounded-full hover:scale-105 transition"><i class="fas fa-expand"></i> Fullscreen</button>` : ''}
              </div>
              ${work.type === 'novel' ? `<div class="whitespace-pre-wrap text-slate-200" style="line-height:1.9;font-size:15px;">${currentChapter.content || ''}</div>` : `<div class="reader-images grid grid-cols-1 gap-4">${(currentChapter.images || []).map(img => `<img src="${img}" class="w-full rounded-lg hover:shadow-2xl transition cover-clickable" onclick="window.showImgFullscreen('${escAttr(img)}','${escAttr(currentChapter.title || chapterLabel + ' ' + currentChapter.number)}')">`).join('')}</div>`}
            ` : '<p class="text-slate-400">Pilih chapter.</p>'}
          </div>
          ${currentChapter ? (() => {
            const currentIndex = chapters.findIndex(c => c.id === currentChapter.id);
            const prevChapter = currentIndex > 0 ? chapters[currentIndex - 1] : null;
            const nextChapter = currentIndex >= 0 && currentIndex < chapters.length - 1 ? chapters[currentIndex + 1] : null;
            const navBtn = (ch, direction, icon) => {
              if (!ch) return `<button class="chapter-nav-btn" disabled><span class="chapter-nav-icon"><i class="fas fa-${icon}"></i></span><span><small class="chapter-nav-small">${direction}</small><span class="chapter-nav-title">Tidak ada ${chapterLabel.toLowerCase()} lagi</span></span></button>`;
              return `<button class="chapter-nav-btn" onclick="window.location.hash='reader/${novelId}/${ch.id}'"><span class="chapter-nav-icon"><i class="fas fa-${icon}"></i></span><span><small class="chapter-nav-small">${direction}</small><span class="chapter-nav-title">${chapterLabel} ${ch.number || chapters.indexOf(ch)+1}${ch.title ? ': ' + escHtml(ch.title) : ''}</span></span></button>`;
            };
            return `<div class="chapter-nav-wrap">${navBtn(prevChapter,'Sebelumnya','arrow-left')}${navBtn(nextChapter,'Selanjutnya','arrow-right')}</div>`;
          })() : ''}

          ${currentChapter ? `
          <div class="reader-comments card-bg rounded-2xl p-4 md:p-6">
            <h3 class="font-bold mb-4 text-amber-400"><i class="fas fa-star mr-2"></i>Rating & Komentar</h3>
            <div id="ratingSummary" class="mb-4"></div>
            <div class="flex items-center gap-2 mb-4" id="ratingStars">${[1,2,3,4,5].map(n => `<i class="fas fa-star text-2xl star-rating text-slate-600" data-star="${n}"></i>`).join('')}<span id="ratingText" class="text-sm text-slate-400 ml-2">Pilih</span></div>
            <div class="flex gap-2"><input id="commentInput" type="text" placeholder="Komentar..." class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm focus:border-amber-500 transition"><button id="submitComment" class="bg-amber-500 text-black px-5 py-2 rounded-xl font-bold text-sm hover:scale-105 transition">Kirim</button></div>
          </div>
          <div class="reader-comments card-bg rounded-2xl p-4 md:p-6">
            <h3 class="font-bold mb-4 text-amber-400"><i class="fas fa-comments mr-2"></i>Komentar</h3>
            <div id="commentsList" class="space-y-3 max-h-[50vh] overflow-y-auto scrollbar-thin"></div>
          </div>` : ''}
        </div>
      </div>
      ${isKomik && currentChapter && currentChapter.images && currentChapter.images.length > 0 ? `<button id="fullscreenBtn" class="fullscreen-btn" onclick="toggleFullscreenReader()"><i class="fas fa-expand"></i></button>` : ''}
    </div>`;

  document.getElementById('reportWorkBtn')?.addEventListener('click', () => {
    if (hasReported) { showToast('Kamu sudah report karya ini'); return; }
    window.openReportModal(novelId);
  });

  const bmBtn = document.getElementById('bookmarkToggle');
  if (bmBtn) {
    bmBtn.onclick = async () => {
      if (!currentUser || !userProfile) { showToast('Login dulu untuk bookmark'); return; }
      const currentBM = userProfile.bookmarks || [];
      const isNow = currentBM.includes(novelId);
      let newBM = isNow ? currentBM.filter(id => id !== novelId) : [...currentBM, novelId];
      await updateDoc(doc(db, 'users', currentUser.uid), { bookmarks: newBM });
      if (!isNow) await trackWorkActivity(novelId,'bookmarks',1);
      userProfile.bookmarks = newBM;
      showToast(isNow ? 'Bookmark dihapus' : 'Ditambahkan ke bookmark');
      renderPage();
    };
  }

  const likeBtn = document.getElementById('readerLikeBtn');
  if (likeBtn) {
    likeBtn.onclick = async () => {
      if (!currentUser || !userProfile) { showToast('Login dulu untuk like'); return; }
      try {
        const workRef = doc(db, 'works', novelId);
        const snap = await getDoc(workRef);
        if (!snap.exists()) return;
        const w = snap.data();
        const likedBy = w.likedBy || [];
        const isLikedNow = likedBy.includes(currentUser.uid);
        let newLikedBy = isLikedNow
          ? likedBy.filter(id => id !== currentUser.uid)
          : [...likedBy, currentUser.uid];
        let likeDelta = isLikedNow ? -1 : +1;
        if (!isLikedNow) { await addExp(EXP_PER_COMMENT); await trackWorkActivity(novelId,'likes',1); }
        await updateDoc(workRef, {
          likedBy: newLikedBy,
          likes: increment(likeDelta),
          updatedAt: serverTimestamp()
        });
        const cnt = document.getElementById('readerLikeCount');
        if (cnt) {
          const cur = parseInt(cnt.dataset.val || cnt.textContent.replace(/[^\d]/g, '')) || 0;
          const next = Math.max(0, cur + likeDelta);
          cnt.textContent = formatCount(next);
          cnt.dataset.val = next;
        }
        likeBtn.classList.toggle('bg-red-600', !isLikedNow);
        likeBtn.classList.toggle('text-white', !isLikedNow);
        likeBtn.classList.toggle('bg-slate-800', isLikedNow);
        likeBtn.classList.toggle('text-slate-300', isLikedNow);

  }

  if (currentChapter && hasSavedPos) {
    setTimeout(() => {
      const banner = document.createElement('div');
      banner.className = 'resume-banner';
      banner.innerHTML = `<i class="fas fa-bookmark"></i><span>Lanjut baca dari posisi terakhir?</span><button onclick="event.stopPropagation();this.parentElement.remove()" title="Tutup"><i class="fas fa-times"></i></button>`;
      banner.onclick = () => { window.scrollTo({ top: savedPos.scrollY, behavior: 'smooth' }); banner.remove(); currentResumeBanner = null; showToast('📖 Melanjutkan bacaan...'); };
      document.body.appendChild(banner);

      setTimeout(() => { if (banner.parentElement) banner.remove(); if (currentResumeBanner === banner) currentResumeBanner = null; }, 8000);
