
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080000">
    <title>XPloit Hackers</title>

    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(ellipse at center, #350000 0%, #130000 45%, #050000 100%);
            color: #ff1010;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Share Tech Mono', monospace;
            text-align: center;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                transparent 0px,
                rgba(255, 0, 0, 0.035) 1px,
                transparent 2px,
                transparent 4px
            );
            pointer-events: none;
        }

        .container {
            width: 100%;
            padding: 30px 20px;
            position: relative;
            z-index: 2;
        }

        .logo {
            width: 180px;
            height: 180px;
            object-fit: contain;
            margin-bottom: 30px;
            filter: drop-shadow(0 0 15px #ff0000);
            animation: pulse 2s infinite;
        }

        h1 {
            font-family: 'Creepster', cursive;
            font-size: clamp(38px, 8vw, 75px);
            color: #ff1010;
            text-shadow:
                0 0 5px #ff0000,
                0 0 15px #ff0000,
                0 0 35px #900000;
            letter-spacing: 3px;
            margin-bottom: 25px;
        }

        .message {
            font-size: clamp(15px, 3vw, 22px);
            color: #ff7777;
            line-height: 1.8;
            text-shadow: 0 0 10px #ff0000;
        }

        .team {
            margin-top: 35px;
            font-family: 'Creepster', cursive;
            font-size: clamp(30px, 6vw, 48px);
            color: #ff0000;
            text-shadow: 0 0 20px red;
            letter-spacing: 4px;
        }

        .line {
            width: 180px;
            height: 2px;
            background: #ff0000;
            box-shadow: 0 0 15px red;
            margin: 25px auto;
        }

        .footer {
            margin-top: 40px;
            font-size: 12px;
            color: #873333;
            letter-spacing: 3px;
        }

        @keyframes pulse {
            0%, 100% {
                filter: drop-shadow(0 0 10px red);
                transform: scale(1);
            }
            50% {
                filter: drop-shadow(0 0 30px red);
                transform: scale(1.04);
            }
        }

        @media (max-width: 480px) {
            .logo {
                width: 140px;
                height: 140px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <img
            class="logo"
            src="https://i.ibb.co.com/1fg0QKxR/images.jpg"
            alt="XPloit Hackers Logo"
        >

        <h1>HACKED!</h1>

        <div class="line"></div>

        <p class="message">
            WEBSITE INI TELAH DI RETAS<br>
            OLEH TIM
        </p>

        <div class="team">
            XPLOIT HACKERS
        </div>

        <div class="line"></div>

        <p class="footer">
            &lt; XPLOIT HACKERS / DIGITAL DEMO &gt;
        </p>

    </main>

</body>
</html>
