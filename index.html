.review-img-item .order-num{position:absolute;top:-4px;left:-4px;background:#fbbf24;color:#0f0f1a;font-size:10px;font-weight:900;padding:1px 5px;border-radius:4px}
.review-move-btn{position:absolute;background:rgba(59,130,246,.9);color:white;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;cursor:pointer;border:none;z-index:5}
.review-move-btn:hover{background:#2563eb}
.review-move-left{top:50%;left:-8px;transform:translateY(-50%)}
.review-move-right{top:50%;right:-8px;transform:translateY(-50%)}
.review-reader-layout{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:1024px){

}
.review-reader-main{background:#0a0a14;border:2px solid #2d2d44;border-radius:16px;padding:16px;min-height:400px;max-height:75vh;overflow-y:auto;position:relative}
.review-reader-main img{width:100%;border-radius:8px;margin-bottom:12px;display:block}
.review-reader-panel{background:#12121f;border:2px solid #2d2d44;border-radius:16px;padding:16px;max-height:75vh;overflow-y:auto}
.review-reader-panel.drag-mode-active{border-color:#fbbf24}
.review-reader-panel.fullscreen-mode-active{border-color:#3b82f6}
.review-mode-selector{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.review-mode-btn{flex:1;min-width:120px;padding:12px;border-radius:12px;border:2px solid #2d2d44;background:#1a1a2e;color:#cbd5e1;font-weight:900;font-size:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.review-mode-btn i{font-size:20px}
.review-mode-btn:hover{border-color:#fbbf24}
.review-mode-btn.active-drag{background:linear-gradient(135deg,#fbbf24,#d97706);color:#0f0f1a;border-color:#fbbf24}
.review-mode-btn.active-fs{background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:white;border-color:#3b82f6}
.review-mode-locked{opacity:.5;pointer-events:none}
.review-panel-locked-notice{background:rgba(239,68,68,.1);border:1px solid #ef4444;border-radius:10px;padding:10px;font-size:11px;color:#fca5a5;text-align:center;margin-bottom:10px}
.review-img-thumb{position:relative;display:inline-block;margin:4px}
.review-img-thumb img{width:70px;height:70px;object-fit:cover;border-radius:8px;border:2px solid #3b3b5c;user-select:none;-webkit-user-drag:none}
.review-img-thumb.drag-mode img{cursor:grab}
.review-img-thumb.drag-mode:active img{cursor:grabbing}
.review-img-thumb.fs-mode img{cursor:zoom-in}
.review-img-thumb .order-num{position:absolute;top:-4px;left:-4px;background:#fbbf24;color:#0f0f1a;font-size:10px;font-weight:900;padding:1px 5px;border-radius:4px}
.review-img-thumb .remove-btn{position:absolute;top:-6px;right:-6px;background:#ef4444;color:white;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;font-weight:900;border:2px solid #1a1a2e;z-index:5}
.review-img-thumb .drag-handle{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(251,191,36,.9);color:#0f0f1a;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:grab!important;opacity:0;z-index:4}
.review-img-thumb.drag-mode:hover .drag-handle{opacity:1}
.review-img-thumb.dragging{opacity:.4}
.review-img-thumb.drag-over img{border-color:#fbbf24}
.review-mobile-panel-btn{position:fixed;bottom:100px;right:16px;z-index:90;background:linear-gradient(135deg,#fbbf24,#d97706);color:#0f0f1a;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;border:none}
@media(min-width:1024px){.review-mobile-panel-btn{display:none!important}}
.review-mobile-panel{position:fixed;top:0;right:0;height:100vh;width:340px;max-width:90vw;background:#12121f;border-left:2px solid #fbbf24;z-index:95;transform:translateX(100%);transition:transform .25s ease;overflow-y:auto;padding:16px}
.review-mobile-panel.active{transform:translateX(0)}
.review-mobile-panel-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:94;display:none}
.review-mobile-panel-overlay.active{display:block}
.review-empty-hint{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;min-height:300px;color:#64748b;text-align:center;padding:20px}
.review-empty-hint i{font-size:48px;margin-bottom:16px;color:#334155}

/* === BOTTOM NAVIGATION === */
:root{
  --nav-height:64px;
  --nav-safe-bottom:env(safe-area-inset-bottom,0px);
}
.nav-bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:50;
  background:#1a1a2e;
  border-top:1px solid #2d2d44;
  padding-bottom:var(--nav-safe-bottom);
  display:grid;
  grid-template-columns:repeat(7,1fr);
  align-items:stretch;
  height:calc(var(--nav-height) + var(--nav-safe-bottom));
}
.nav-bottom-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  padding:6px 2px;
  font-size:9px;
  font-weight:700;
  cursor:pointer;
  color:#94a3b8;
  background:transparent;
  border:none;
  position:relative;
  height:100%;
  overflow:hidden;
  text-align:center;
  line-height:1.1;
}
.nav-bottom-item:hover{color:#fbbf24;background:rgba(251,191,36,.08)}
.nav-bottom-item.active{color:#fbbf24;background:rgba(251,191,36,.12)}
.nav-bottom-item.active::after{content:'';position:absolute;top:0;left:25%;right:25%;height:3px;background:#fbbf24;border-radius:0 0 3px 3px}
.nav-bottom-item i{font-size:17px;line-height:1}
.nav-bottom-item span{
  font-size:9px;
  line-height:1.1;
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  padding:0 2px;
}
.nav-bottom-center{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#fbbf24,#d97706);
  color:#0f0f1a;
  cursor:pointer;
  border:none;
  position:relative;
  height:100%;
}
.nav-bottom-center:hover{filter:brightness(1.1)}
.nav-bottom-center i{font-size:22px;line-height:1;margin-bottom:2px}
.nav-bottom-center span{font-size:9px;font-weight:900;line-height:1}
.nav-bottom-center::before{
  content:'';
  position:absolute;
  top:-8px;
  left:50%;
  transform:translateX(-50%);
  width:46px;
  height:46px;
  background:linear-gradient(135deg,#fbbf24,#d97706);
  border-radius:50%;
  border:3px solid #0f0f1a;
  z-index:-1;
}
.nav-bottom-center i,
.nav-bottom-center span{
  position:relative;
  z-index:1;
  color:#0f0f1a;
}

@media(min-width:640px){
  .nav-bottom-item{font-size:10px;gap:4px;padding:8px 6px}
  .nav-bottom-item i{font-size:19px}
  .nav-bottom-item span{font-size:10px}
  .nav-bottom-center i{font-size:24px}
  .nav-bottom-center span{font-size:10px}
}

@media(min-width:768px){
  :root{--nav-height:72px}
  .nav-bottom-item{font-size:11px;padding:8px 10px}
  .nav-bottom-item i{font-size:21px}
  .nav-bottom-item span{font-size:11px}
  .nav-bottom-center::before{width:52px;height:52px;top:-10px}
  .nav-bottom-center i{font-size:26px}
}

@media(max-width:360px){
  .nav-bottom-item span{font-size:8px}
  .nav-bottom-item i{font-size:16px}
  .nav-bottom-center i{font-size:20px}
  .nav-bottom-center span{font-size:8px}
}

/* Slide sections */
.slide-section{overflow:hidden;position:relative}
.slide-track{display:flex;gap:12px;overflow-x:auto;scroll-behavior:smooth;padding:4px 2px 12px;scrollbar-width:thin;-ms-overflow-style:none}
.slide-track::-webkit-scrollbar{height:5px}
.slide-track::-webkit-scrollbar-thumb{background:#3b3b5c;border-radius:8px}
.slide-track::-webkit-scrollbar-track{background:transparent}
.slide-track .slide-card{flex:0 0 auto;width:160px;scroll-snap-align:start}
@media(min-width:640px){.slide-track .slide-card{width:180px}}
@media(min-width:768px){.slide-track .slide-card{width:200px}}
.slide-track .slide-card .card-bg{height:100%}
.slide-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;padding:0 2px}
.slide-header h2{font-size:16px;font-weight:900;display:flex;align-items:center;gap:6px}
.slide-nav-btn{background:#2d2d44;color:#cbd5e1;border:none;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;flex-shrink:0}
.slide-nav-btn:hover{background:#fbbf24;color:#0f0f1a}
.slide-nav-btn:disabled{opacity:.3;pointer-events:none}

.maintenance-overlay{

}
.maintenance-subtitle{font-size:14px;color:#94a3b8;margin-bottom:20px}
.maintenance-reason-box{

.maintenance-info-row{

.maintenance-info-row i{color:#fbbf24}
.maintenance-btns{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.maintenance-btn{
  padding:14px 20px;border-radius:9999px;font-weight:900;font-size:14px;

}
.maintenance-btn:hover{filter:brightness(1.1)}
.maintenance-btn-berita{
  background:linear-gradient(135deg,#10b981,#047857);color:white;
}
.maintenance-btn-wa{
  background:linear-gradient(135deg,#25d366,#128c7e);color:white;

.maintenance-btn-admin{

}
.maintenance-status-dot{

.maintenance-banner-top{

.maintenance-banner-top a{
  color:#fff;text-decoration:underline;font-weight:900;

.maintenance-banner-top button{

/* === THEME === */
.theme-toggle-btn{
  display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:9999px;
  border:1px solid #3b3b5c;background:#12121f;color:#fbbf24;font-size:11px;font-weight:900;
  cursor:pointer;transition:.2s ease;
}
.theme-toggle-btn:hover{transform:translateY(-1px);border-color:#fbbf24}
.theme-toggle-btn i{font-size:13px}
[data-theme="light"] body{background:#f4f6fb;color:#172033}
[data-theme="light"] .card-bg{background:#fff;border-color:#d8deea;color:#172033}
[data-theme="light"] .comment-card,[data-theme="light"] .review-card,[data-theme="light"] .guide-step,
[data-theme="light"] .history-item,[data-theme="light"] .news-card{background:#fff;border-color:#d8deea}
[data-theme="light"] .theme-toggle-btn{background:#fff;border-color:#cbd5e1;color:#d97706}
[data-theme="light"] .nav-bottom{background:#fff;border-color:#d8deea}
[data-theme="light"] .mobile-nav-drawer{background:#fff;border-color:#d8deea;color:#172033}
[data-theme="light"] .mobile-nav-item{color:#475569}
[data-theme="light"] .mobile-nav-item:hover{background:#f1f5f9}
[data-theme="light"] .modal-overlay{background:rgba(15,23,42,.45)}

}

[data-theme="light"] .text-slate-200{color:#334155!important}
[data-theme="light"] .text-slate-300{color:#475569!important}
[data-theme="light"] .text-slate-400{color:#64748b!important}
[data-theme="light"] .text-slate-500{color:#64748b!important}
[data-theme="light"] .text-slate-600{color:#94a3b8!important}
[data-theme="light"] .bg-slate-700{background:#e2e8f0!important;color:#334155!important}
[data-theme="light"] .bg-slate-800{background:#f1f5f9!important;color:#334155!important}
[data-theme="light"] .bg-slate-900{background:#e2e8f0!important;color:#334155!important}
[data-theme="light"] .bg-slate-900\/40{background:rgba(226,232,240,.55)!important}
[data-theme="light"] .border-slate-700,[data-theme="light"] .border-slate-800{border-color:#d8deea!important}
[data-theme="light"] .scrollbar-thin::-webkit-scrollbar-thumb{background:#cbd5e1}
[data-theme="light"] .reader-content .whitespace-pre-wrap{color:#334155!important}
[data-theme="light"] .user-bio{color:#475569;background:#f8fafc}
[data-theme="light"] .img-preview-mode-bar{background:#f8fafc;border-color:#d8deea}
[data-theme="light"] .upload-progress{background:#f8fafc;border-color:#fbbf24;color:#b45309}
[data-theme="light"] .review-reader-main{background:#f8fafc;border-color:#d8deea}
[data-theme="light"] .review-reader-panel{background:#fff;border-color:#d8deea}
[data-theme="light"] .review-mode-btn{background:#f8fafc;color:#475569;border-color:#d8deea}
[data-theme="light"] .maintenance-overlay{background:linear-gradient(135deg,#f8fafc 0%,#fff1f2 50%,#f8fafc 100%)}

.chapter-nav-wrap{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0}
.chapter-nav-btn{

.chapter-nav-btn .chapter-nav-icon{font-size:22px;color:#fbbf24;flex-shrink:0}
.chapter-nav-btn .chapter-nav-small{display:block;font-size:10px;color:#94a3b8;font-weight:700;margin-bottom:3px;text-transform:uppercase;letter-spacing:.4px}
.chapter-nav-btn .chapter-nav-title{display:block;font-size:14px;line-height:1.3}

.sticker-tab.active{background:#fbbf24;color:#0f0f1a}

}
.sticker-item:hover{border-color:#fbbf24}
.sticker-item img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.sticker-item .del-sticker{

  right:2px;

  height:18px;

  align-items:center;
  justify-content:center;

.sticker-item:hover .del-sticker{opacity:1}
.sticker-item .save-sticker{

.chat-sticker{width:120px;height:120px;object-fit:contain}
.sticker-send-btn{position:relative;cursor:pointer;background:#334155;color:#cbd5e1;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sticker-send-btn:hover{background:#475569;color:#fbbf24}
.sticker-send-btn input{display:none}

/* === REPORT STYLES === */
.report-btn{
  background:#991b1b;
  color:white;
  font-size:11px;
  font-weight:900;
  padding:6px 12px;
  border-radius:9999px;
  border:none;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:5px;
}
.report-btn:hover{background:#b91c1c}
.report-reason-chip{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:8px 14px;
  border:2px solid #475569;
  border-radius:12px;
  cursor:pointer;
  font-size:12px;
  font-weight:700;
  background:#1a1a2e;
  color:#cbd5e1;
  user-select:none;
  margin:4px 2px;
}
.report-reason-chip:hover{border-color:#ef4444}
.report-reason-chip input{display:none}
.report-reason-chip:has(input:checked){background:#7f1d1d;color:#fecaca;border-color:#ef4444}
.report-reason-chip input:checked + span::after{content:' ✓';font-weight:900}
.report-warning{
  background:linear-gradient(135deg,rgba(127,29,29,.4),rgba(239,68,68,.15));

const THEME_KEY = 'kominovel_theme';
function applyTheme(theme, save = true) {
  const next = theme === 'light' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  if (save) localStorage.setItem(THEME_KEY, next);
  const icon = document.getElementById('themeToggleIcon');
  const text = document.getElementById('themeToggleText');
  const btn = document.getElementById('themeToggle');
  if (icon) icon.className = next === 'light' ? 'fas fa-moon' : 'fas fa-sun';
  if (text) text.textContent = next === 'light' ? 'Gelap' : 'Terang';
  if (btn) btn.title = next === 'light' ? 'Beralih ke tema gelap' : 'Beralih ke tema terang';
}
function initTheme() {
  const saved = localStorage.getItem(THEME_KEY);
  const preferred = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  applyTheme(preferred, false);
  const btn = document.getElementById('themeToggle');
  if (btn) btn.onclick = () => {
    const current = document.documentElement.getAttribute('data-theme') || 'dark';
    applyTheme(current === 'light' ? 'dark' : 'light', true);
  };
}

    if (!notifState.dm) notifState.dm = { count: 0 };
  } catch (e) {}
}
function saveNotifState() {
  try { localStorage.setItem(NOTIF_STORAGE_KEY, JSON.stringify(notifState)); } catch (e) {}
}
function setBadge(elId, count) {
  const el = document.getElementById(elId);
  if (!el) return;
  if (count > 0) {
    el.textContent = count > 99 ? '99+' : String(count);
    el.classList.remove('hidden');
  } else {
    el.classList.add('hidden');
  }
}
function updateBadges() {
  setBadge('notifChatBadge', notifState.chat?.count || 0);
  setBadge('notifClanBadge', notifState.clan?.count || 0);
  setBadge('notifBeritaBadge', notifState.berita?.count || 0);
  setBadge('notifDMBadge', notifState.dm?.count || 0);
  const totalDM = Number(notifState.dm?.count || 0);
  const totalSite = totalDM + Number(notifState.chat?.count || 0) + Number(notifState.clan?.count || 0) + Number(notifState.berita?.count || 0) + v111NotifItems.filter(n => !n.read).length;
  setBadge('v111NotifDot', totalSite);
  const chatBtn = document.querySelector('[data-nav="chat"]');
  const clanBtn = document.querySelector('[data-nav="clan"]');
  const beritaBtn = document.querySelector('[data-nav="berita"]');
  const menuBtn = document.getElementById('bottomMenuBtn');
  if (chatBtn) chatBtn.classList.toggle('has-notif', (notifState.chat?.count || 0) > 0);
  if (clanBtn) clanBtn.classList.toggle('has-notif', (notifState.clan?.count || 0) > 0);
  if (beritaBtn) beritaBtn.classList.toggle('has-notif', (notifState.berita?.count || 0) > 0);
  if (menuBtn) menuBtn.classList.toggle('has-notif', totalDM > 0);
}
function markNotifSeen(type, ts) {
  if (!notifState[type]) notifState[type] = { lastSeen: 0, count: 0 };
  notifState[type].lastSeen = ts || Date.now();
  notifState[type].count = 0;
  saveNotifState();
  updateBadges();
}
window.markNotifSeen = markNotifSeen;

function startNotifListeners() {
  // Bersihkan listener lama
  notifListeners.forEach(u => { try { u(); } catch(e){} });
  notifListeners = [];

  // Chat publik
  try {
    const chatQ = query(collection(db, 'chats'), orderBy('createdAt', 'desc'), limit(1));
    const u1 = onSnapshot(chatQ, snap => {
      snap.forEach(d => {
        const msg = d.data();
        const ts = msg.createdAt?.toDate?.()?.getTime() || Date.now();
        if (msg.userId === currentUser?.uid) return;
        if (ts > (notifState.chat?.lastSeen || 0)) {
          notifState.chat.count = (notifState.chat.count || 0) + 1;
          saveNotifState();
          updateBadges();
        }
      });
    });
    notifListeners.push(u1);
  } catch (e) { console.warn('notif chat err', e); }

  // Berita
  try {
    const beritaQ = query(collection(db, 'berita'), orderBy('createdAt', 'desc'), limit(5));
    const u2 = onSnapshot(beritaQ, snap => {
      snap.docChanges().forEach(ch => {
        if (ch.type === 'added') {
          const b = ch.doc.data();
          const ts = b.createdAt?.toDate?.()?.getTime() || Date.now();
          if (ts > (notifState.berita?.lastSeen || 0)) {
            notifState.berita.count = (notifState.berita.count || 0) + 1;
            saveNotifState();
            updateBadges();
          }
        }
      });
    });
    notifListeners.push(u2);
  } catch (e) { console.warn('notif berita err', e); }
}

function startClanNotifListener() {
  if (!userProfile?.clanId) return;
  try {
    const cq = query(collection(db, 'clans', userProfile.clanId, 'messages'), orderBy('createdAt', 'desc'), limit(1));
    const u = onSnapshot(cq, snap => {
      snap.forEach(d => {
        const msg = d.data();
        if (msg.userId === currentUser?.uid) return;
        const ts = msg.createdAt?.toDate?.()?.getTime() || Date.now();
        if (ts > (notifState.clan?.lastSeen || 0)) {
          notifState.clan.count = (notifState.clan.count || 0) + 1;
          saveNotifState();
          updateBadges();
        }
      });
    });
    notifListeners.push(u);
  } catch (e) { console.warn('notif clan err', e); }
}

async function loadGlobalStickers() {
  try {
    const snap = await getDocs(query(collection(db, 'stickers'), orderBy('createdAt', 'desc')));
    stickersCache.global = [];
    snap.forEach(d => stickersCache.global.push({ id: d.id, ...d.data() }));
  } catch (e) { stickersCache.global = []; }
}

async function loadMyStickers() {
  if (!currentUser) { stickersCache.mine = []; return; }
  try {
    const snap = await getDocs(query(collection(db, 'user_stickers'), where('userId', '==', currentUser.uid)));
    stickersCache.mine = [];
    snap.forEach(d => stickersCache.mine.push({ id: d.id, ...d.data() }));
  } catch (e) { stickersCache.mine = []; }
}

function listenStickers() {
  if (stickersUnsub) { try { stickersUnsub(); } catch(e){} stickersUnsub = null; }
  stickersUnsub = onSnapshot(collection(db, 'stickers'), snap => {

    });

window.openReportModal = async (workId) => {

  if (!workSnap.exists()) { showToast('Karya tidak ditemukan'); return; }
  const work = { id: workSnap.id, ...workSnap.data() };
  const reports = work.reports || [];
  const myReport = reports.find(r => r.userId === currentUser.uid);

  const modal = document.getElementById('modalContainer');
  const content = document.getElementById('modalContent');

  if (myReport) {
    content.innerHTML = `
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-2xl font-black text-red-400"><i class="fas fa-flag mr-2"></i>Sudah Report</h2>

      </div>

    `;
  } else {
    content.innerHTML = `
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-2xl font-black text-red-400"><i class="fas fa-flag mr-2"></i>Report Karya</h2>
        <button id="closeReport" class="text-slate-400 text-2xl hover:rotate-90 transition-transform">&times;</button>
      </div>
      <div class="report-warning">
        <i class="fas fa-exclamation-triangle mr-1"></i>
        Report palsu dapat menyebabkan akun kamu diblokir. Laporkan hanya jika karya benar-benar melanggar aturan.
      </div>
      <div class="bg-slate-900/50 border border-slate-700 rounded-xl p-3 mb-4">
        <p class="text-xs text-slate-400">Karya yang dilaporkan:</p>
        <p class="font-bold text-sm">${escHtml(work.title)}</p>

      </div>
      <label class="block text-sm font-bold text-red-400 mb-2">Pilih Alasan Report <span class="text-red-500">*</span></label>
      <div class="flex flex-wrap gap-1 mb-4" id="reportReasonsBox">
        ${REPORT_REASONS.map(r => `
          <label class="report-reason-chip" title="${escAttr(r.desc)}">
            <input type="radio" name="reportReason" value="${r.id}" data-label="${escAttr(r.label)}">
            <span>${escAttr(r.label)}</span>
          </label>
        `).join('')}
      </div>
      <label class="block text-sm font-bold text-red-400 mb-1">Detail Tambahan <span class="text-xs text-slate-500">(opsional)</span></label>
      <textarea id="reportDetail" rows="3" maxlength="300" placeholder="Jelaskan lebih detail (contoh: ada adegan di chapter 3)..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm mb-4"></textarea>
      <div class="flex gap-2">
        <button id="confirmReportBtn" class="flex-1 bg-red-600 text-white font-bold py-3 rounded-full hover:scale-105 transition"><i class="fas fa-flag mr-1"></i>Kirim Report</button>
        <button id="cancelReportBtn" class="bg-slate-700 text-slate-300 px-6 py-3 rounded-full font-bold">Batal</button>
      </div>
    `;
  }

  modal.classList.remove('hidden');
  document.getElementById('closeReport').onclick = () => modal.classList.add('hidden');
  if (document.getElementById('cancelReportBtn')) {
    document.getElementById('cancelReportBtn').onclick = () => modal.classList.add('hidden');
  }
  if (document.getElementById('confirmReportBtn')) {
    document.getElementById('confirmReportBtn').onclick = async () => {
      const sel = document.querySelector('input[name="reportReason"]:checked');
      if (!sel) { showToast('Pilih alasan report dulu!'); return; }
      const detail = document.getElementById('reportDetail').value.trim();
      const reasonId = sel.value;
      const reasonLabel = REPORT_REASONS.find(r => r.id === reasonId)?.label || reasonId;
      const btn = document.getElementById('confirmReportBtn');
      btn.disabled = true; btn.innerHTML = '<span class="uploading-spinner"></span>Mengirim...';
      try {
        const newReport = {
          userId: currentUser.uid,
          userName: userProfile?.username || 'User',
          reason: reasonId,
          reasonLabel: reasonLabel,
          detail: sensor(detail),
          at: new Date().toISOString()
        };
        const newReports = [...reports, newReport];
        const updates = { reports: newReports };
        // Cek apakah mencapai threshold auto takedown
        if (newReports.length >= REPORT_AUTO_TAKEDOWN_THRESHOLD && !isTakedown(work)) {
          updates.takedown = {
            active: true,
            reason: `AUTO-TAKEDOWN: Mencapai ${REPORT_AUTO_TAKEDOWN_THRESHOLD} report dari pengguna. Report terakhir: ${reasonLabel}`,
            by: 'SYSTEM (Auto)',
            at: serverTimestamp()
          };
          showToast(`⛔ Karya otomatis di-takedown karena mencapai ${REPORT_AUTO_TAKEDOWN_THRESHOLD} report!`, 5000);
        } else {
          showToast(`✅ Report terkirim (${newReports.length}/${REPORT_AUTO_TAKEDOWN_THRESHOLD})`, 4000);
        }
        await updateDoc(doc(db, 'works', workId), { ...updates, updatedAt: serverTimestamp() });
        modal.classList.add('hidden');
        renderPage();
      } catch (e) {
        showToast('Gagal: ' + e.message);
        btn.disabled = false; btn.innerHTML = '<i class="fas fa-flag mr-1"></i>Kirim Report';
      }
    };
  }
};

async function loadMaintenanceState() {
  try {
    const snap = await getDoc(doc(db, 'settings', 'maintenance'));
    if (snap.exists()) {
      const d = snap.data();
      webMaintenance = d.enabled === true;
      maintenanceData = {
        enabled: d.enabled === true,
        reason: d.reason || '',
        endTime: d.endTime || '',
        by: d.by || '',
        at: d.at || null
      };
    } else {
      webMaintenance = false;
      maintenanceData = { enabled: false, reason: '', endTime: '', by: '', at: null };
    }
  } catch (e) {
    console.warn('Gagal load maintenance state:', e.message);
    webMaintenance = false;
  }
}

function listenMaintenanceState() {
  if (maintenanceUnsub) { try { maintenanceUnsub(); } catch(e){} maintenanceUnsub = null; }
  maintenanceUnsub = onSnapshot(doc(db, 'settings', 'maintenance'), (snap) => {
    if (!snap.exists()) {
      const wasOn = webMaintenance;
      webMaintenance = false;
      maintenanceData = { enabled: false, reason: '', endTime: '', by: '', at: null };
      if (wasOn) {
        document.querySelectorAll('.maintenance-overlay, .maintenance-banner-top').forEach(el => el.remove());
        renderPage();
        showToast('✅ Website kembali ONLINE!', 4000);
      }
      return;
    }
    const d = snap.data();
    const newState = d.enabled === true;
    const changed = newState !== webMaintenance;
    webMaintenance = newState;
    maintenanceData = {
      enabled: newState,
      reason: d.reason || '',
      endTime: d.endTime || '',
      by: d.by || '',
      at: d.at || null
    };
    if (changed) {
      maintenanceBannerDismissed = false;
      if (newState) {
        showToast('⚠️ Website dimatikan sementara oleh Admin', 5000);
      } else {
        document.querySelectorAll('.maintenance-overlay, .maintenance-banner-top').forEach(el => el.remove());
        showToast('✅ Website kembali ONLINE!', 4000);
      }
      renderPage();
    }
  }, (err) => {
    console.warn('Maintenance listener error:', err.message);
  });
}

function isMaintenanceBlocked() {
  if (!webMaintenance) return false;
  const hash = getHash();
  const base = hash.split('/')[0];
  if (base === 'berita') return false;
  if (isAdminUser(userProfile) || isAdminSession) return false;
  return true;
}

async function loadAllUsersCache() {
  if (usersCacheUnsub) { try { usersCacheUnsub(); } catch(e){} usersCacheUnsub = null; }
  return new Promise((resolve) => {
    usersCacheUnsub = onSnapshot(collection(db, 'users'), snap => {
      snap.forEach(d => {
        usersCache[d.id] = { id: d.id, ...d.data() };
      });
      if (currentUser && usersCache[currentUser.uid] && userProfile) {
        const fresh = usersCache[currentUser.uid];
        userProfile.roles = fresh.roles || userProfile.roles;
        userProfile.role = fresh.role || userProfile.role;
        userProfile.username = fresh.username || userProfile.username;
        userProfile.photoURL = fresh.photoURL || userProfile.photoURL;
        userProfile.level = fresh.level ?? userProfile.level;
        userProfile.followerCount = fresh.followerCount ?? userProfile.followerCount;
        userProfile.featuredCreator = fresh.featuredCreator ?? userProfile.featuredCreator;
        userProfile.clanId = fresh.clanId ?? userProfile.clanId;
      }
      resolve();
    }, err => {
      console.warn('usersCache listener error:', err.message);
      resolve();
    });
  });
}

function getRoleTagsForUid(uid, fallbackProfile = null) {
  if (!uid) return '';
  let profile = usersCache[uid];
  if (!profile && currentUser && uid === currentUser.uid && userProfile) {
    profile = userProfile;
  }
  if (!profile && fallbackProfile) {
    profile = fallbackProfile;
  }
  if (!profile) return '';
  const roles = profile.roles || (profile.role ? [profile.role] : ['pembaca']);
  const isOwner = roles.includes('owner');
  const isAdmin = roles.includes('admin');
  const isPenulis = roles.includes('penulis');
  const isKomikus = roles.includes('komikus');
  const isPembaca = roles.includes('pembaca');
  const hasHighRole = isOwner || isAdmin || isPenulis || isKomikus;
  let html = '';
  if (isOwner) html += '<span class="owner-tag">👑 OWNER</span> ';
  if (isAdmin) html += '<span class="admin-tag">ADMIN</span> ';
  if (isPenulis) html += '<span class="penulis-tag">PENULIS</span> ';
  if (isKomikus) html += '<span class="komikus-tag">KOMIKUS</span> ';
  if (isPembaca && !hasHighRole) html += '<span class="pembaca-tag">PEMBACA</span> ';
  if (profile.clanId && clansCache[profile.clanId]) {
    const clan = clansCache[profile.clanId];
    const clanIsOwner = clan.leader === uid;
    const clanIsAdmin = (clan.admins || []).includes(uid);
    if (clanIsOwner) html += `<span class="clan-owner-tag cursor-pointer" onclick="event.stopPropagation();window.location.hash='clan/${profile.clanId}'">👑 ${clan.name}</span> `;
    else if (clanIsAdmin) html += `<span class="clan-admin-tag cursor-pointer" onclick="event.stopPropagation();window.location.hash='clan/${profile.clanId}'">⚔️ ${clan.name}</span> `;
    else html += `<span class="clan-tag cursor-pointer" onclick="event.stopPropagation();window.location.hash='clan/${profile.clanId}'">${clan.name}</span> `;
  }
  return html;
}
window.getRoleTagsForUid = getRoleTagsForUid;

function buildUserTags(profile, userId) {
  if (!profile && !userId) return '';
  const uid = userId || profile?.uid || profile?.id;

const GROUP_LABELS = { komik: 'Chapter', novel: 'Volume' };
function groupLabel(type) { return GROUP_LABELS[type] || 'Chapter'; }
function getGroups(work) {
  const g = Array.isArray(work && work.chapterGroups) ? work.chapterGroups : [];
  return g.slice().sort((a, b) => (Number(a.number) || 0) - (Number(b.number) || 0));
}
function newGroupId() { return 'g' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function groupTitleText(g, type) { return `${groupLabel(type)} ${g.number}${g.title ? ': ' + g.title : ''}`; }
function groupChapters(chapters, work) {
  const groups = getGroups(work);
  if (!groups.length) return [{ group: null, loose: false, items: chapters }];
  const byId = {}; groups.forEach(g => byId[g.id] = []);
  const loose = [];
  chapters.forEach(c => { if (c.groupId && byId[c.groupId]) byId[c.groupId].push(c); else loose.push(c); });
  const out = groups.map(g => ({ group: g, loose: false, items: byId[g.id] }));
  if (loose.length) out.push({ group: null, loose: true, items: loose });
  return out;
}
function groupSelectHtml(id, groups, selected, type) {
  return `<select id="${id}" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm">
    <option value="">— Tanpa ${groupLabel(type)} —</option>
    ${groups.map(g => `<option value="${g.id}" ${g.id === selected ? 'selected' : ''}>${escHtml(groupTitleText(g, type))}</option>`).join('')}
  </select>`;
}

const READING_POS_KEY = 'kominovel_reading_pos';
function saveReadingPos(workId, chapterId, scrollY) {
  try {
    const data = JSON.parse(localStorage.getItem(READING_POS_KEY) || '{}');
    data[workId] = { chapterId, scrollY, ts: Date.now() };
    const keys = Object.keys(data).sort((a,b) => data[b].ts - data[a].ts);
    if (keys.length > 50) keys.slice(50).forEach(k => delete data[k]);
    localStorage.setItem(READING_POS_KEY, JSON.stringify(data));
  } catch (e) {}
}
function getReadingPos(workId) {
  try {
    const data = JSON.parse(localStorage.getItem(READING_POS_KEY) || '{}');
    return data[workId] || null;
  } catch (e) { return null; }
}
window.clearReadingPos = (workId) => {
  try {
    const data = JSON.parse(localStorage.getItem(READING_POS_KEY) || '{}');
    delete data[workId];
    localStorage.setItem(READING_POS_KEY, JSON.stringify(data));
  } catch (e) {}
};

// ============================================================
// ===== IMGBB UPLOAD =========================================
// ============================================================
function ibbChain(url) {
  const m = String(url || '').match(/^https?:\/\/i\.ibb\.co(?:\.com)?\/(.+)$/);
  if (!m) return null;
  return ['https://i.ibb.co.com/' + m[1], 'https://i.ibb.co/' + m[1], 'https://wsrv.nl/?url=' + encodeURIComponent('i.ibb.co/' + m[1])];
}
function ibbFix(u) { const c = ibbChain(u); return c ? c[0] : u; }
function testImgLoad(url, ms = 5000) {
  return new Promise(res => {
    const i = new Image(); let done = false;
    const f = ok => { if (!done) { done = true; res(ok); } };
    i.onload = () => f(true); i.onerror = () => f(false);
    setTimeout(() => f(false), ms);
    i.src = url;
  });
}
async function pickWorkingUrl(u) {
  const chain = ibbChain(u);
  if (!chain) return u;
  for (const c of chain) { if (await testImgLoad(c)) return c; }
  return chain[0];
}
document.addEventListener('error', (e) => {
  const t = e.target;
  if (!t || t.tagName !== 'IMG') return;
  const chain = ibbChain(t.src);
  if (!chain) return;
  let idx = chain.indexOf(t.src); if (idx < 0) idx = 0;
  const next = chain[idx + 1];
  if (next) { e.stopImmediatePropagation(); t.src = next; }
}, true);
const IMGBB_KEY = 'ba3afa5b0d8e2ea7a8dc2098ac38aad6';
const IMGBB_MAX_MB = 32;
async function uploadToImgbb(file) {
  if (!file || !file.type || !file.type.startsWith('image/')) throw new Error('Bukan gambar');
  if (file.size > IMGBB_MAX_MB * 1024 * 1024) throw new Error(`Ukuran file > ${IMGBB_MAX_MB} MB`);
  let lastErr = 'Upload gagal';
  for (let attempt = 1; attempt <= 3; attempt++) {
    try {
      const fd = new FormData();
      fd.append('image', file);
      const res = await fetch('https://api.imgbb.com/1/upload?key=' + IMGBB_KEY, { method: 'POST', body: fd });
      const json = await res.json().catch(() => ({}));
      if (res.ok && json.success && json.data && json.data.url) return await pickWorkingUrl(json.data.url);
      lastErr = (json.error && (json.error.message || json.error)) || ('HTTP ' + res.status);
      if (res.status === 400) break;
    } catch (e) { lastErr = 'Koneksi bermasalah'; }
    await new Promise(r => setTimeout(r, 800 * attempt));
  }
  throw new Error(String(lastErr));
}
function compressImage(file) { return uploadToImgbb(file); }

function listenAutoBoostState() {

    const changed = newState !== autoBoostEnabled;
    autoBoostEnabled = newState;
    if (changed) {
      const statusEl = document.getElementById('boostStatusLabel');
      if (statusEl) {
        const statusIcon = document.getElementById('boostStatusIcon');
        const statusCard = document.getElementById('boostStatusCard');
        const toggleBtn = document.getElementById('boostToggleBtn');
        statusEl.textContent = autoBoostEnabled ? 'AKTIF' : 'NONAKTIF';
        statusEl.className = autoBoostEnabled ? 'font-black text-green-400 text-lg' : 'font-black text-red-400 text-lg';
        if (statusIcon) statusIcon.className = autoBoostEnabled ? 'fas fa-toggle-on text-green-400 text-4xl' : 'fas fa-toggle-off text-red-400 text-4xl';
        if (statusCard) statusCard.className = autoBoostEnabled ? 'card-bg rounded-2xl p-6 card-anim berlanjut-border' : 'card-bg rounded-2xl p-6 card-anim tamat-border';
        if (toggleBtn) {

            : 'w-full bg-green-600 text-white font-bold py-3 rounded-full hover:scale-105 transition btn-glow';
        }
      }
    }
  }, (err) => {
    console.warn('Auto boost listener error:', err.message);
  });
}

async function autoBoostAllWorks() {
  if (!autoBoostEnabled) return;
  try {
    const snap = await getDocs(collection(db, 'works'));
    if (snap.empty) return;
    const promises = [];
    snap.forEach(d => {
      const work = d.data();
      if (isNonPublish(work) || isTakedown(work)) return;
      promises.push(
        updateDoc(doc(db, 'works', d.id), {
          views: increment(AUTO_VIEW_AMOUNT),
          likes: increment(AUTO_LIKE_AMOUNT),
          updatedAt: serverTimestamp()
        }).catch(() => {})
      );
    });
    if (promises.length > 0) {
      await Promise.allSettled(promises);
    }
  } catch (e) {
    console.warn('Auto boost error:', e.message);
  }
}

function startAutoBoost() {
  if (autoBoostInterval) { clearInterval(autoBoostInterval); autoBoostInterval = null; }
  if (!autoBoostEnabled) return;
  setTimeout(() => { if (autoBoostEnabled) autoBoostAllWorks(); }, 3000);
  autoBoostInterval = setInterval(() => { if (autoBoostEnabled) autoBoostAllWorks(); }, AUTO_BOOST_INTERVAL);
}

function stopAutoBoost() {
  if (autoBoostInterval) { clearInterval(autoBoostInterval); autoBoostInterval = null; }
}

window.toggleAutoBoost = async function() {
  const newState = !autoBoostEnabled;

async function addCustomCategory(name) {
  const trimmed = name.trim();
  if (!trimmed || trimmed.length < 2) return null;
  const exists = customCategories.find(c => c.name.toLowerCase() === trimmed.toLowerCase());
  if (exists) return exists.name;
  try {
    const ref = await addDoc(collection(db, 'custom_categories'), {
      name: trimmed,
      createdBy: currentUser?.uid || null,
      createdByName: userProfile?.username || 'User',
      createdAt: serverTimestamp()
    });
    customCategories.push({ id: ref.id, name: trimmed });
    return trimmed;
  } catch (e) {
    return trimmed;
  }
}

async function toggleFollow(targetUid) {
  if (!currentUser || !userProfile) { showToast('Login dulu untuk follow'); return; }
  if (targetUid === currentUser.uid) { showToast('Tidak bisa follow diri sendiri'); return; }
  try {
    const targetRef = doc(db, 'users', targetUid);
    const meRef = doc(db, 'users', currentUser.uid);
    const targetSnap = await getDoc(targetRef);
    if (!targetSnap.exists()) { showToast('User tidak ditemukan'); return; }
    const target = targetSnap.data();
    const followers = target.followers || [];
    const isFollowing = followers.includes(currentUser.uid);
    const myFollowing = userProfile.following || [];
    if (isFollowing) {
      const newFollowers = followers.filter(id => id !== currentUser.uid);
      const newFollowing = myFollowing.filter(id => id !== targetUid);
      await updateDoc(targetRef, { followers: newFollowers, followerCount: newFollowers.length });
      await updateDoc(meRef, { following: newFollowing, followingCount: newFollowing.length });
      userProfile.following = newFollowing;
      userProfile.followingCount = newFollowing.length;
      showToast('Berhenti mengikuti');
    } else {
      const newFollowers = [...followers, currentUser.uid];
      const newFollowing = [...myFollowing, targetUid];
      await updateDoc(targetRef, { followers: newFollowers, followerCount: newFollowers.length });
      await updateDoc(meRef, { following: newFollowing, followingCount: newFollowing.length });
      userProfile.following = newFollowing;
      userProfile.followingCount = newFollowing.length;
      showToast('✅ Mengikuti!');
    }
    const btn = document.getElementById('followBtn-' + targetUid);
    if (btn) {
      const nowFollowing = !isFollowing;
      btn.className = 'follow-btn ' + (nowFollowing ? 'following' : 'not-following');
      btn.innerHTML = nowFollowing ? '<i class="fas fa-check"></i> Mengikuti' : '<i class="fas fa-user-plus"></i> Follow';
    }
    const cEl = document.getElementById('followerCount-' + targetUid);
    if (cEl) cEl.textContent = formatCount(newFollowers.length);
  } catch (e) { showToast('Gagal: ' + e.message); }
}
window.toggleFollow = toggleFollow;

async function boostOwnerFollowers() {
  if (!currentUser || !userProfile) return;
  if (!hasRole(userProfile, 'owner')) return;
  const last = userProfile.lastOwnerBoost || 0;
  const now = Date.now();
  if (now - last < FOLLOWER_INTERVAL) return;
  try {
    const ref = doc(db, 'users', currentUser.uid);
    const newCount = (userProfile.followerCount || 0) + OWNER_FOLLOWER_RATE;
    await updateDoc(ref, { followerCount: newCount, lastOwnerBoost: now, updatedAt: serverTimestamp() });
    userProfile.followerCount = newCount;
    userProfile.lastOwnerBoost = now;
  } catch (e) {}
}

async function checkBirthdays() {
  try {
    const today = new Date();
    const todayMMDD = `${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
    const snap = await getDocs(collection(db, 'users'));
    const bdayUsers = [];
    snap.forEach(d => {
      const u = { id: d.id, ...d.data() };
      if (!u.birthday) return;
      const roles = u.roles || [u.role || 'pembaca'];
      const isKreator = roles.includes('penulis') || roles.includes('komikus');
      if (!isKreator) return;
      if (u.birthday === todayMMDD) bdayUsers.push(u);
    });
    if (bdayUsers.length === 0) return;
    const settingsSnap = await getDoc(doc(db, 'settings', 'birthday'));
    const settings = settingsSnap.exists() ? settingsSnap.data() : {};
    const customTemplate = settings.text || '';
    const defaultTemplate = '🎉 Selamat Ulang Tahun, {username}! 🎂 Semoga sukses selalu dan karyanya makin banyak penggemar! 🎈';
    const template = customTemplate || defaultTemplate;
    const names = bdayUsers.map(u => {
      const roleLabel = hasRole(u, 'komikus') ? 'KOMIKUS' : 'PENULIS';
      const roleColor = hasRole(u, 'komikus') ? 'text-orange-400' : 'text-yellow-400';
      let text = template.replace(/{username}/g, '@' + (u.username || 'User')).replace(/{name}/g, u.username || 'User');
      return `<span>${text} <span class="${roleColor} text-xs font-black">[${roleLabel}]</span></span>`;
    }).join('<br>');
    const existing = document.getElementById('birthdayBanner');
    if (existing) existing.remove();
    const banner = document.createElement('div');
    banner.id = 'birthdayBanner';
    banner.className = 'birthday-banner';
    banner.innerHTML = `<i class="fas fa-birthday-cake text-xl badge-float"></i><div style="flex:1;text-align:left;max-width:900px">${names}</div><button onclick="document.getElementById('birthdayBanner').remove()"><i class="fas fa-times"></i></button>`;
    document.body.appendChild(banner);
    for (const u of bdayUsers) {
      try {
        await addDoc(collection(db, 'birthday_history'), {
          userId: u.id, username: u.username || 'User',
          roles: u.roles || [u.role || 'pembaca'],
          date: todayMMDD, year: today.getFullYear(),
          template: template, createdAt: serverTimestamp()
        });
      } catch (e) {}
    }
  } catch (e) {}
}

window.openGroupManager = async (wid, type, onDone) => {

  const wRef = doc(db, 'works', wid);
  const modal = document.getElementById('modalContainer');
  const content = document.getElementById('modalContent');
  let changed = false;
  const close = () => { modal.classList.add('hidden'); if (changed && onDone) onDone(); };
  async function load() {
    const wSnap = await getDoc(wRef);
    if (!wSnap.exists()) { close(); return; }
    const groups = getGroups(wSnap.data());
    const cs = await getDocs(collection(db, 'works', wid, 'chapters'));
    const counts = {};
    cs.forEach(d => { const g = d.data().groupId; if (g) counts[g] = (counts[g] || 0) + 1; });
    const nextNum = groups.reduce((m, g) => Math.max(m, Number(g.number) || 0), 0) + 1;
    content.innerHTML = `
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-2xl font-black text-amber-400"><i class="fas fa-folder-open mr-2"></i>Kelola ${gl}</h2>
        <button id="gmClose" class="text-slate-400 text-2xl hover:rotate-90 transition-transform">&times;</button>
      </div>
      <p class="text-xs text-slate-400 mb-3">${gl} dipakai untuk mengelompokkan ${type === 'novel' ? 'Chapter' : 'Eps'}. Nomor menentukan urutan tampil.</p>
      <div class="space-y-2 max-h-[45vh] overflow-y-auto scrollbar-thin mb-4">
        ${groups.length === 0 ? `<p class="text-sm text-slate-500 italic">Belum ada ${gl}.</p>` : groups.map(g => `
          <div class="bg-slate-800/60 border border-slate-700 rounded-lg p-2 flex items-center gap-2 flex-wrap" data-gid="${g.id}">
            <span class="text-amber-400 text-xs font-bold">${gl}</span>
            <input type="number" min="0" class="gmNum w-16 bg-slate-900 border border-slate-700 rounded px-2 py-1 text-sm" value="${g.number}">
            <input type="text" class="gmTitle flex-1 min-w-[120px] bg-slate-900 border border-slate-700 rounded px-2 py-1 text-sm" placeholder="Judul (opsional)" value="${escHtml(g.title || '')}">
            <span class="text-[10px] text-slate-500">${counts[g.id] || 0} ${type === 'novel' ? 'chapter' : 'eps'}</span>
            <button class="gmSave bg-green-600 text-white px-2 py-1 rounded text-xs font-bold" title="Simpan"><i class="fas fa-check"></i></button>
            <button class="gmDel bg-red-700 text-white px-2 py-1 rounded text-xs font-bold" title="Hapus"><i class="fas fa-trash"></i></button>
          </div>`).join('')}
      </div>
      <div class="border-t border-slate-700 pt-3">
        <p class="text-sm font-semibold mb-2">+ Tambah ${gl} Baru</p>
        <div class="flex items-center gap-2 flex-wrap">
          <input type="number" min="0" id="gmNewNum" class="w-16 bg-slate-800 border border-slate-700 rounded px-2 py-2 text-sm" value="${nextNum}">
          <input type="text" id="gmNewTitle" class="flex-1 min-w-[120px] bg-slate-800 border border-slate-700 rounded px-3 py-2 text-sm" placeholder="Judul ${gl} (opsional)">
          <button id="gmAdd" class="bg-amber-500 text-black px-4 py-2 rounded-lg text-sm font-bold">Tambah</button>
        </div>
      </div>
      <button id="gmDone" class="w-full mt-4 bg-slate-700 text-white font-bold py-2 rounded-full">Selesai</button>`;
    modal.classList.remove('hidden');
    document.getElementById('gmClose').onclick = close;
    document.getElementById('gmDone').onclick = close;
    const save = async (arr) => { await updateDoc(wRef, { chapterGroups: arr, updatedAt: serverTimestamp() }); changed = true; await load(); };
    document.getElementById('gmAdd').onclick = async () => {
      const num = parseInt(document.getElementById('gmNewNum').value, 10);
      if (isNaN(num)) { showToast('Nomor wajib diisi'); return; }
      const title = document.getElementById('gmNewTitle').value.trim();
      try { await save([...groups, { id: newGroupId(), number: num, title }]); showToast(`${gl} ditambahkan`); }
      catch (e) { showToast('Gagal: ' + e.message); }
    };
    content.querySelectorAll('[data-gid]').forEach(row => {
      const gid = row.dataset.gid;
      row.querySelector('.gmSave').onclick = async () => {
        const num = parseInt(row.querySelector('.gmNum').value, 10);
        if (isNaN(num)) { showToast('Nomor wajib diisi'); return; }
        const title = row.querySelector('.gmTitle').value.trim();
        try { await save(groups.map(g => g.id === gid ? { ...g, number: num, title } : g)); showToast(`${gl} diperbarui`); }

          showToast(`${gl} dihapus`);
        } catch (e) { showToast('Gagal: ' + e.message); }
      };
    });
  }
  await load();
};

window.addCustomGenre = async (containerId) => {
  const inp = document.getElementById(containerId + '-custom-text');
  if (!inp) return;
  const val = inp.value.trim();
  if (!val || val.length < 2) { showToast('Genre minimal 2 karakter'); return; }
  const allCats = [...new Set([...ALL_CATEGORIES, ...customCategories.map(c => c.name)])];
  const existing = allCats.find(c => c.toLowerCase() === val.toLowerCase());
  if (existing) {
    const container = document.getElementById(containerId);
    const cbs = container.querySelectorAll('input[type="checkbox"]');
    let found = false;
    cbs.forEach(cb => { if (cb.value.toLowerCase() === val.toLowerCase()) { cb.checked = true; found = true; } });
    if (!found) {
      const label = document.createElement('label');
      label.className = 'cat-chip';
      label.innerHTML = `<input type="checkbox" value="${escHtml(existing)}" checked><span>${escHtml(existing)}</span>`;
      container.appendChild(label);
    }
    showToast(`"${existing}" sudah ada, otomatis dipilih`);
    inp.value = '';
    updateSelectedCount(containerId);
    return;
  }
  const saved = await addCustomCategory(val);
  const finalName = saved || val;
  const container = document.getElementById(containerId);
  const label = document.createElement('label');
  label.className = 'cat-chip';
  label.innerHTML = `<input type="checkbox" value="${escHtml(finalName)}" checked><span>${escHtml(finalName)}</span>`;
  container.appendChild(label);
  showToast(`✅ Genre "${finalName}" ditambahkan & dipilih`);
  inp.value = '';
  document.getElementById(containerId + '-custom-input').classList.add('hidden');
  updateSelectedCount(containerId);
};

function updateSelectedCount(containerId) {
  const container = document.getElementById(containerId);
  const countEl = document.getElementById(containerId + '-selected-count');
  if (!container || !countEl) return;
  const checked = container.querySelectorAll('input:checked').length;
  countEl.textContent = checked;
  const handler = () => updateSelectedCount(containerId);
  container.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    cb.removeEventListener('change', handler);
    cb.addEventListener('change', handler);
  });
}

window.toggleAllCategories = async (containerId) => {
  const container = document.getElementById(containerId);
  if (!container) return;
  const checked = Array.from(container.querySelectorAll('input:checked')).map(cb => cb.value);
  showAllCategories = true;
  const parentWrapper = container.closest('.bg-slate-900\\/50');
  if (parentWrapper) {
    parentWrapper.outerHTML = categoryChipsField(containerId, checked);
    updateSelectedCount(containerId);
  }
};

function getSelectedCats(containerId) {
  const c = document.getElementById(containerId);
  if (!c) return [];
  return Array.from(c.querySelectorAll('input:checked')).map(cb => cb.value);
}

function attachMultiImageHandlers(containerId) {
  const fileInput = document.getElementById(`${containerId}-file`);
  const preview = document.getElementById(`${containerId}-preview`);
  const progress = document.getElementById(`${containerId}-progress`);
  if (!fileInput) return;
  window[`_${containerId}_files`] = window[`_${containerId}_files`] || [];
  window[`_${containerId}_dragSrc`] = null;
  if (!window[`_${containerId}_mode`]) window[`_${containerId}_mode`] = dragMode;

  fileInput.onchange = async (e) => {
    const files = Array.from(e.target.files);
    if (files.length === 0) return;
    progress.classList.remove('hidden');
    progress.innerHTML = `Mengupload ${files.length} foto ke ImgBB...<br>`;
    const newFiles = [];
    for (let i = 0; i < files.length; i++) {
      const f = files[i];
      progress.innerHTML += `[${i+1}/${files.length}] ${f.name}...<br>`;
      try {
        const dataUrl = await uploadToImgbb(f);
        newFiles.push({ name: f.name, dataUrl, preview: URL.createObjectURL(f) });
        progress.innerHTML += `&nbsp;&nbsp;✅ ${(f.size/1024).toFixed(0)} KB terupload<br>`;
      } catch (err) {
        progress.innerHTML += `&nbsp;&nbsp;❌ ${err.message}<br>`;
      }
    }
    window[`_${containerId}_files`] = [...(window[`_${containerId}_files`] || []), ...newFiles];
    progress.innerHTML += `<br>Total: ${window[`_${containerId}_files`].length} foto`;
    fileInput.value = '';
    renderPreview();
  };

  function renderPreview() {
    const files = window[`_${containerId}_files`] || [];
    const urlText = document.getElementById(`${containerId}-urls`)?.value || '';
    const urls = parseImgbbUrls(urlText);
    const total = files.length + urls.length;
    const mode = window[`_${containerId}_mode`] || 'drag';
    preview.innerHTML = '';
    if (total === 0) return;
    const modeBar = document.createElement('div');
    modeBar.className = 'img-preview-mode-bar';
    modeBar.innerHTML = `
      <span class="mode-label"><i class="fas fa-layer-group"></i>Total: ${total} foto</span>
      <div class="mode-btns">
        <button class="mode-btn ${mode === 'drag' ? 'active' : 'inactive'}" data-mode="drag"><i class="fas fa-hand-rock"></i> 🖐️ Mode Drag</button>
        <button class="mode-btn ${mode === 'fullscreen' ? 'active' : 'inactive'}" data-mode="fullscreen"><i class="fas fa-expand"></i> 🔍 Mode Fullscreen</button>
      </div>
    `;
    preview.appendChild(modeBar);
    modeBar.querySelectorAll('.mode-btn').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        const newMode = btn.dataset.mode;
        window[`_${containerId}_mode`] = newMode;
        dragMode = newMode;
        showToast(newMode === 'drag' ? '🖐️ Mode Drag aktif' : '🔍 Mode Fullscreen aktif');
        renderPreview();
      };
    });
    const hint = document.createElement('div');
    hint.className = 'w-full text-[11px] mb-2 ' + (mode === 'drag' ? 'text-amber-400' : 'text-blue-400');
    hint.innerHTML = mode === 'drag' 
      ? '<i class="fas fa-hand-rock mr-1"></i> <b>Mode Drag:</b> Geser gambar untuk ubah urutan.'
      : '<i class="fas fa-expand mr-1"></i> <b>Mode Fullscreen:</b> Klik gambar untuk perbesar.';
    preview.appendChild(hint);
    function setupDragEvents(wrap, type, index) {
      wrap.dataset.dragType = type;
      wrap.dataset.dragIndex = index;
      wrap.dataset.dragCid = containerId;
      if (mode === 'drag') {
        wrap.draggable = true;
        wrap.classList.add('draggable-ready');
        wrap.addEventListener('dragstart', (e) => {
          e.dataTransfer.effectAllowed = 'move';
          try { e.dataTransfer.setData('text/plain', JSON.stringify({ cid: containerId, type, idx: index })); } catch (err) {}
          window[`_${containerId}_dragSrc`] = { type, idx: index };
          wrap.classList.add('dragging');
          setTimeout(() => { wrap.style.opacity = '0.4'; }, 0);
        });
        wrap.addEventListener('dragend', () => {
          wrap.classList.remove('dragging');
          wrap.style.opacity = '';
          window[`_${containerId}_dragSrc`] = null;
          preview.querySelectorAll('.img-preview-wrap').forEach(w => { w.style.borderColor = ''; w.style.transform = ''; });
        });
        wrap.addEventListener('dragover', (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          if (window[`_${containerId}_dragSrc`]) { wrap.style.borderColor = '#fbbf24'; wrap.style.transform = 'scale(1.1)'; }
        });
        wrap.addEventListener('dragleave', () => { wrap.style.borderColor = ''; wrap.style.transform = ''; });
        wrap.addEventListener('drop', (e) => {
          e.preventDefault();
          e.stopPropagation();
          wrap.style.borderColor = '';
          wrap.style.transform = '';
          let data = window[`_${containerId}_dragSrc`];
          if (!data) return;
          reorderImages(containerId, data.type, data.idx, type, index);
        });
      } else {
        wrap.draggable = false;
      }
    }
    files.forEach((f, i) => {
      const wrap = document.createElement('div');
      wrap.className = 'img-preview-wrap' + (mode === 'drag' ? ' no-fullscreen' : '');
      wrap.innerHTML = `
        <img src="${f.preview || f.dataUrl}" class="img-preview" draggable="false" ${mode === 'fullscreen' ? `onclick="event.stopPropagation();window.showImgFullscreen('${f.dataUrl}','Gambar #${i+1} dari ${total}')"` : ''}>
        <span class="order-num">#${i+1}</span>
        ${mode === 'fullscreen' ? `<span class="zoom-badge" onclick="event.stopPropagation();window.showImgFullscreen('${f.dataUrl}','Gambar #${i+1} dari ${total}')"><i class="fas fa-expand"></i></span>` : ''}
        <span class="remove-btn" onclick="event.stopPropagation();removeImg('${containerId}',${i})">×</span>
        ${mode === 'drag' ? `<span class="drag-handle" title="Tahan & geser"><i class="fas fa-arrows-alt"></i></span>` : ''}
      `;
      setupDragEvents(wrap, 'file', i);
      preview.appendChild(wrap);
    });
    urls.forEach((url, i) => {
      const wrap = document.createElement('div');
      wrap.className = 'img-preview-wrap' + (mode === 'drag' ? ' no-fullscreen' : '');
      const safeUrl = escAttr(url);
      wrap.innerHTML = `
        <img src="${url}" class="img-preview" draggable="false" onerror="this.src='https://placehold.co/80x80/1a1a2e/64748b?text=Err'" ${mode === 'fullscreen' ? `onclick="event.stopPropagation();window.showImgFullscreen('${safeUrl}','Gambar #${files.length + i + 1} dari ${total}')"` : ''}>
        <span class="order-num">#${files.length + i + 1}</span>
        ${mode === 'fullscreen' ? `<span class="zoom-badge" onclick="event.stopPropagation();window.showImgFullscreen('${safeUrl}','Gambar #${files.length + i + 1} dari ${total}')"><i class="fas fa-expand"></i></span>` : ''}
        <span class="remove-btn" onclick="event.stopPropagation();removeUrl('${containerId}',${i})">×</span>
        ${mode === 'drag' ? `<span class="drag-handle" title="Tahan & geser"><i class="fas fa-arrows-alt"></i></span>` : ''}
      `;
      setupDragEvents(wrap, 'url', i);
      preview.appendChild(wrap);
    });
  }
  const urlTextarea = document.getElementById(`${containerId}-urls`);
  if (urlTextarea) urlTextarea.oninput = renderPreview;
  window[`_${containerId}_render`] = renderPreview;
  renderPreview();
}

function attachExistingImagesHandler(cid, images) {
  const preview = document.getElementById(`editExistingPreview-${cid}`);
  const countEl = document.getElementById(`editExistingCount-${cid}`);
  if (!preview) return;
  if (!window[`_existing_${cid}_images`]) window[`_existing_${cid}_images`] = [...images];
  if (!window[`_existing_${cid}_mode`]) window[`_existing_${cid}_mode`] = dragMode;
  window[`_existing_${cid}_dragSrc`] = null;
  function render() {
    const imgs = window[`_existing_${cid}_images`] || [];
    const mode = window[`_existing_${cid}_mode`] || 'drag';
    const total = imgs.length;
    preview.innerHTML = '';
    if (countEl) countEl.textContent = total;
    if (total === 0) { preview.innerHTML = '<p class="text-xs text-slate-500 italic mt-2">Tidak ada gambar.</p>'; return; }
    const modeBar = document.createElement('div');
    modeBar.className = 'img-preview-mode-bar';
    modeBar.innerHTML = `
      <span class="mode-label"><i class="fas fa-layer-group"></i>Total: ${total} gambar</span>
      <div class="mode-btns">
        <button class="mode-btn ${mode === 'drag' ? 'active' : 'inactive'}" data-mode="drag"><i class="fas fa-hand-rock"></i> 🖐️ Mode Drag</button>
        <button class="mode-btn ${mode === 'fullscreen' ? 'active' : 'inactive'}" data-mode="fullscreen"><i class="fas fa-expand"></i> 🔍 Mode Fullscreen</button>
      </div>
    `;
    preview.appendChild(modeBar);
    modeBar.querySelectorAll('.mode-btn').forEach(btn => {
      btn.onclick = (e) => { e.stopPropagation(); window[`_existing_${cid}_mode`] = btn.dataset.mode; dragMode = btn.dataset.mode; render(); };
    });
    const grid = document.createElement('div');
    grid.className = 'flex flex-wrap gap-2 max-h-60 overflow-y-auto scrollbar-thin bg-slate-900/50 border border-slate-700 rounded-lg p-2';
    preview.appendChild(grid);
    function setupDrag(wrap, index) {
      if (mode === 'drag') {
        wrap.draggable = true;
        wrap.addEventListener('dragstart', () => {
          window[`_existing_${cid}_dragSrc`] = index;
          wrap.classList.add('dragging');
          setTimeout(() => { wrap.style.opacity = '0.4'; }, 0);
        });
        wrap.addEventListener('dragend', () => {
          wrap.classList.remove('dragging');
          wrap.style.opacity = '';
          window[`_existing_${cid}_dragSrc`] = null;
        });
        wrap.addEventListener('dragover', (e) => { e.preventDefault(); wrap.style.borderColor = '#fbbf24'; });
        wrap.addEventListener('dragleave', () => { wrap.style.borderColor = ''; });
        wrap.addEventListener('drop', (e) => {
          e.preventDefault();
          wrap.style.borderColor = '';
          const fromIdx = window[`_existing_${cid}_dragSrc`];
          if (fromIdx === null || fromIdx === undefined || fromIdx === index) return;
          const imgs = [...(window[`_existing_${cid}_images`] || [])];
          const item = imgs.splice(fromIdx, 1)[0];
          imgs.splice(index, 0, item);
          window[`_existing_${cid}_images`] = imgs;
          render();
        });
      }
    }
    imgs.forEach((img, i) => {
      const wrap = document.createElement('div');
      wrap.className = 'img-preview-wrap' + (mode === 'drag' ? ' no-fullscreen' : '');
      wrap.innerHTML = `
        <img src="${img}" class="img-preview" draggable="false" onerror="this.src='https://placehold.co/80x80/1a1a2e/64748b?text=Err'" ${mode === 'fullscreen' ? `onclick="window.showImgFullscreen('${escAttr(img)}','Gambar #${i+1}')"` : ''}>
        <span class="order-num">#${i+1}</span>
        <span class="remove-btn" onclick="event.stopPropagation();window.removeExistingImage('${cid}',${i})">×</span>
      `;
      setupDrag(wrap, i);
      grid.appendChild(wrap);
    });
  }
  render();
}

window.removeExistingImage = (cid, index) => {
  if (!confirm('Hapus gambar ini?')) return;
  const imgs = window[`_existing_${cid}_images`] || [];
  imgs.splice(index, 1);
  window[`_existing_${cid}_images`] = imgs;
  attachExistingImagesHandler(cid, imgs);
};

function reorderImages(containerId, fromType, fromIdx, toType, toIdx) {
  if (fromType === toType && fromIdx === toIdx) return;
  const files = [...(window[`_${containerId}_files`] || [])];
  const urlTextarea = document.getElementById(`${containerId}-urls`);
  const urls = [...parseImgbbUrls(urlTextarea.value)];
  let item;
  if (fromType === 'file') item = files.splice(fromIdx, 1)[0];
  else item = urls.splice(fromIdx, 1)[0];
  if (toType === 'file') {
    if (fromType === 'url') files.splice(toIdx, 0, { name: 'url-item', dataUrl: item });
    else files.splice(toIdx, 0, item);
  } else {
    if (fromType === 'file') urls.splice(toIdx, 0, item.dataUrl || item);
    else urls.splice(toIdx, 0, item);
  }
  window[`_${containerId}_files`] = files;
  urlTextarea.value = urls.join('\n');
  window[`_${containerId}_render`]?.();
  showToast('✅ Urutan diubah!');
}

window.removeImg = (cid, idx) => { const files = window[`_${cid}_files`] || []; files.splice(idx, 1); window[`_${cid}_files`] = files; window[`_${cid}_render`]?.(); };
window.removeUrl = (cid, idx) => { const ta = document.getElementById(`${cid}-urls`); const urls = parseImgbbUrls(ta.value); urls.splice(idx, 1); ta.value = urls.join('\n'); window[`_${cid}_render`]?.(); };

function getMultiImages(containerId) {
  const files = window[`_${containerId}_files`] || [];
  const urlText = document.getElementById(`${containerId}-urls`)?.value || '';
  const urls = parseImgbbUrls(urlText);
  const result = [];
  files.forEach(f => result.push(f.dataUrl));
  urls.forEach(u => result.push(u));
  return result;
}

window.openReviewWorkModal = async (wid) => {

  if (!snap.exists()) { showToast('Karya tidak ditemukan'); return; }
  const w = { id: snap.id, ...snap.data() };
  if (w.authorId !== currentUser?.uid && !isAdminUser(userProfile)) {
    showToast('Tidak punya akses review karya ini');
    return;
  }

  reviewWorkId = wid;
  reviewWorkData = w;
  reviewMode = null;
  reviewMobilePanelOpen = false;

  const cs = await getDocs(query(collection(db, 'works', wid, 'chapters'), orderBy('number', 'asc')));
  reviewChaptersData = [];
  cs.forEach(d => reviewChaptersData.push({ id: d.id, ...d.data() }));

function initReviewDragDrop() {
  const grid = document.getElementById('reviewImageGrid');
  if (!grid) return;
  let dragSrcIdx = null;

  grid.querySelectorAll('.review-img-thumb').forEach((thumb) => {
    thumb.addEventListener('dragstart', (e) => {
      dragSrcIdx = parseInt(thumb.dataset.idx);
      thumb.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', String(dragSrcIdx)); } catch (err) {}
    });
    thumb.addEventListener('dragend', () => {
      thumb.classList.remove('dragging');
      grid.querySelectorAll('.review-img-thumb').forEach(t => t.classList.remove('drag-over'));
    });
    thumb.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      thumb.classList.add('drag-over');
    });
    thumb.addEventListener('dragleave', () => {
      thumb.classList.remove('drag-over');
    });
    thumb.addEventListener('drop', (e) => {
      e.preventDefault();
      e.stopPropagation();
      thumb.classList.remove('drag-over');
      const toIdx = parseInt(thumb.dataset.idx);
      if (dragSrcIdx === null || dragSrcIdx === toIdx) return;
      const cid = reviewCurrentChapterId;
      const arr = [...(reviewImagesMap[cid] || [])];
      const item = arr.splice(dragSrcIdx, 1)[0];
      arr.splice(toIdx, 0, item);
      reviewImagesMap[cid] = arr;
      renderReviewReaderModal();
      showToast('✅ Urutan diubah. Klik "Simpan Urutan" untuk menyimpan.');
    });
  });

  let touchSrcIdx = null;
  grid.querySelectorAll('.review-img-thumb').forEach((thumb) => {
    thumb.addEventListener('touchstart', (e) => {
      touchSrcIdx = parseInt(thumb.dataset.idx);
      thumb.classList.add('dragging');
    }, { passive: true });
    thumb.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      const el = document.elementFromPoint(touch.clientX, touch.clientY);
      const targetThumb = el ? el.closest('.review-img-thumb') : null;
      grid.querySelectorAll('.review-img-thumb').forEach(t => t.classList.remove('drag-over'));
      if (targetThumb && targetThumb !== thumb) targetThumb.classList.add('drag-over');
    }, { passive: false });
    thumb.addEventListener('touchend', (e) => {
      thumb.classList.remove('dragging');
      const touch = e.changedTouches[0];
      const el = document.elementFromPoint(touch.clientX, touch.clientY);
      const targetThumb = el ? el.closest('.review-img-thumb') : null;
      if (targetThumb && targetThumb !== thumb && touchSrcIdx !== null) {
        const toIdx = parseInt(targetThumb.dataset.idx);
        const cid = reviewCurrentChapterId;
        const arr = [...(reviewImagesMap[cid] || [])];
        const item = arr.splice(touchSrcIdx, 1)[0];
        arr.splice(toIdx, 0, item);
        reviewImagesMap[cid] = arr;
        renderReviewReaderModal();

  const safeAmount = Math.max(0, Number(amount || 0));

  const l = getLevelFromExp(e);
  await updateDoc(ref, { exp: e, level: l, updatedAt: serverTimestamp() });

async function addClanExp(clanId, amount) {

    await updateDoc(ref, { exp: e, level: l, updatedAt: serverTimestamp() });

}

// ============================================================
const VAPID_KEY = 'BMpHpbQhI5aY4PgW0eBEKYrytkl1FebiEA9nOd8hsCfx5U5gXwL5yguq0ps1_Cce0nbgMVdWWZtxrQ8pMoJZDCQ';
const PUSH_API_URL = '/api/push';
const PUSH_PREFS_KEY = 'kominovel_push_prefs';
const PUSH_ASK_KEY = 'kominovel_push_ask';
const PUSH_PREF_DEFS = [
  { key:'works',  label:'Komik & Novel baru', desc:'Karya baru + episode/chapter terbaru' },
  { key:'berita', label:'Berita',             desc:'Pengumuman dari admin' },
  { key:'chat',   label:'Chat publik',        desc:'Pesan baru di chat publik' },
  { key:'clan',   label:'Chat clan',          desc:'Pesan baru di clan kamu' },
  { key:'dm',     label:'Pesan pribadi',      desc:'DM masuk dari teman' }
];
let pushMessaging = null, pushSwReg = null, pushToken = null, pushSupported = false;
let pushInitPromise = null, pushForegroundBound = false;

function pushLoadPrefs() {
  const prefs = {};
  PUSH_PREF_DEFS.forEach(p => { prefs[p.key] = true; });
  try {
    const saved = JSON.parse(localStorage.getItem(PUSH_PREFS_KEY) || '{}');
    PUSH_PREF_DEFS.forEach(p => { if (typeof saved[p.key] === 'boolean') prefs[p.key] = saved[p.key]; });
  } catch (e) {}
  return prefs;
}
function pushIsIOSNeedInstall() {
  const ua = navigator.userAgent || '';
  const isIOS = /iphone|ipad|ipod/i.test(ua);
  const standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone;
  return isIOS && !standalone;
}

function pushInit() {
  if (pushInitPromise) return pushInitPromise;
  pushInitPromise = (async () => {
    try {
      if (!('serviceWorker' in navigator) || !('Notification' in window) || !('PushManager' in window)) return false;
      if (location.protocol !== 'https:' && location.hostname !== 'localhost') return false;
      if (!(await isSupported())) return false;
      pushMessaging = getMessaging(app);
      pushSwReg = await navigator.serviceWorker.register('/firebase-messaging-sw.js');
      pushSupported = true;
      if (!pushForegroundBound) {
        pushForegroundBound = true;
        onMessage(pushMessaging, handlePushForeground);
      }
      return true;
    } catch (e) {
      console.warn('push init gagal:', e);
      return false;
    }
  })();
  return pushInitPromise;
}

async function pushEnsureToken() {
  if (!pushSupported || !currentUser) return null;
  if (!('Notification' in window) || Notification.permission !== 'granted') return null;
  try {
    const token = await getToken(pushMessaging, { vapidKey: VAPID_KEY, serviceWorkerRegistration: pushSwReg });
    if (!token) return null;
    pushToken = token;
    await setDoc(doc(db, 'fcmTokens', token), {
      token,
      uid: currentUser.uid,
      prefs: pushLoadPrefs(),
      platform: String(navigator.platform || '').slice(0, 40),
      ua: String(navigator.userAgent || '').slice(0, 180),
      updatedAt: serverTimestamp()
    }, { merge: true });
    return token;
  } catch (e) {
    console.warn('push token gagal:', e);
    return null;
  }
}

async function pushEnable() {
  if (!pushSupported) { showToast('Notifikasi belum didukung di browser/perangkat ini'); return false; }
  if (Notification.permission === 'denied') {
    showToast('Notifikasi diblokir. Buka pengaturan situs di browser lalu izinkan notifikasi.', 5000);
    return false;
  }
  let perm = Notification.permission;
  if (perm !== 'granted') perm = await Notification.requestPermission();
  if (perm !== 'granted') { showToast('Izin notifikasi tidak diberikan'); refreshPushSettingsUI(); return false; }
  const t = await pushEnsureToken();
  if (t) showToast('🔔 Notifikasi aktif!');
  else showToast('Gagal mengaktifkan notifikasi. Coba lagi.');
  refreshPushSettingsUI();
  return !!t;
}

async function pushDisable() {
  try {
    if (pushToken) await deleteDoc(doc(db, 'fcmTokens', pushToken));
    if (pushMessaging) await deleteToken(pushMessaging);
  } catch (e) { console.warn('push disable:', e); }
  pushToken = null;
  showToast('Notifikasi dimatikan');
  refreshPushSettingsUI();
}

async function pushDetachToken() {
  try {
    if (pushToken && currentUser) await deleteDoc(doc(db, 'fcmTokens', pushToken));
  } catch (e) {}
  pushToken = null;
}

async function pushSetPref(key, val) {
  const prefs = pushLoadPrefs();
  prefs[key] = !!val;
  try { localStorage.setItem(PUSH_PREFS_KEY, JSON.stringify(prefs)); } catch (e) {}
  if (pushToken && currentUser) {
    try {
      await setDoc(doc(db, 'fcmTokens', pushToken), { token: pushToken, uid: currentUser.uid, prefs, updatedAt: serverTimestamp() }, { merge: true });
    } catch (e) { showToast('Gagal menyimpan pengaturan notifikasi'); }
  }
}

        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + idToken },

      });

    if (item.workId) window.location.hash = 'reader/' + item.workId;
    else if (item.chatId) window.location.hash = 'privatechat/' + item.otherUid;
    bar.remove();
  };
  document.body.appendChild(bar);
  setTimeout(() => { if (bar.isConnected) bar.remove(); }, 4200);
}

function enqueueV111Notif(item) {
  if (!item) return;
  v111NotifQueue.push(item);
  if (!v111NotifShowing) playNextV111Notif();
}
function playNextV111Notif() {
  if (v111NotifQueue.length === 0) { v111NotifShowing = false; return; }
  v111NotifShowing = true;
  const item = v111NotifQueue.shift();
  showV111NotifBar(item);
  setTimeout(() => {
    v111NotifShowing = false;
    playNextV111Notif();
  }, 4500);
}

function initChapterNotificationListener() {
  if (!currentUser || v111NotifUnsub) return;
  try {
    v111NotifUnsub = onSnapshot(
      query(collection(db,'notifications'), where('recipientId','==',currentUser.uid)),
      snap => {
        const incoming = [];
        snap.forEach(d => incoming.push({ id:d.id, ...d.data() }));
        incoming.sort((a,b) => {
          const ta = a.createdAt?.toDate?.()?.getTime?.() || 0;
          const tb = b.createdAt?.toDate?.()?.getTime?.() || 0;
          return tb - ta;
        });
        const wasInitialized = v111NotifInitialized;
        const known = new Set(v111NotifItems.map(n => n.id));
        v111NotifItems = incoming.slice(0, 100);
        updateBadges();
        if (wasInitialized) {
          incoming.filter(n => !known.has(n.id) && !n.read).sort((a,b) => {
            const ta = a.createdAt?.toDate?.()?.getTime?.() || 0;
            const tb = b.createdAt?.toDate?.()?.getTime?.() || 0;
            return ta - tb;
          }).forEach(n => {
            enqueueV111Notif(n);
            if (n.type === 'custom_admin' && document.visibilityState === 'visible' &&
                'Notification' in window && Notification.permission === 'granted') {
              try {
                const browserNotif = new Notification(n.title || 'KomiNovel', {
                  body: n.body || 'Ada pengumuman baru dari admin.',
                  icon: 'https://i.ibb.co.com/SDTthJ7m/Gemini-Generated-Image-fhupt4fhupt4fhup.jpg',
                  tag: 'kominovel-' + n.id
                });
                browserNotif.onclick = () => { window.focus(); openV111NotifPanel(); browserNotif.close(); };
              } catch (e) { console.warn('Notifikasi browser tidak dapat ditampilkan:', e); }
            }
          });
        }
        v111NotifInitialized = true;
        renderV111NotifPanel();
      },
      () => {}
    );
  } catch(e) {}
}

async function createChapterNotifications(workId, chapterData) {
  try {
    const wSnap = await getDoc(doc(db,'works',workId));
    if (!wSnap.exists()) return;
    const w = wSnap.data();
    if (w.status !== 'publish') return;
    const aSnap = await getDoc(doc(db,'users',w.authorId));
    const author = aSnap.exists() ? aSnap.data() : {};
    const followers = [...new Set((author.followers || []).filter(Boolean))];
    const chapterLabel = w.type === 'novel' ? 'chapter' : 'episode';
    const title = `New ${chapterLabel}: ${w.title}`;
    const body = `${w.type === 'novel' ? 'Chapter' : 'Episode'} ${chapterData.number}${chapterData.title ? ' • ' + chapterData.title : ''}`;
    const targets = followers.filter(uid => uid !== w.authorId);
    for (const uid of targets) {
      await addDoc(collection(db,'notifications'), {
        recipientId: uid,
        type: 'new_chapter',
        workId,
        workTitle: w.title || 'Karya',
        chapterId: chapterData.id || '',
        chapterNumber: chapterData.number,
        chapterTitle: chapterData.title || '',
        authorId: w.authorId,
        authorName: author.username || w.authorName || 'Kreator',
        title, body, read:false, createdAt:serverTimestamp()
      });
    }
  } catch(e) { console.warn('chapter notification error', e); }
}

    panel.querySelector('#v111NotifReadAll').onclick = async () => {
      await markAllV111NotificationsRead();
      renderV111NotifPanel();
    };
    const customToggle = panel.querySelector('#customNotifToggle');
    if (customToggle) customToggle.onclick = () => panel.querySelector('#customNotifForm')?.classList.toggle('hidden');
    const customSend = panel.querySelector('#customNotifSend');
    if (customSend) customSend.onclick = async () => {
      if (!currentUser || !userProfile || !isAdminUser(userProfile)) { showToast('Akses ditolak.'); return; }
      const title = panel.querySelector('#customNotifTitle')?.value.trim() || '';
      const body = panel.querySelector('#customNotifBody')?.value.trim() || '';

      customSend.disabled = true; customSend.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i>Mengirim...';
      try {
        const usersSnap = await getDocs(collection(db, 'users'));
        let sent = 0;
        for (const userDoc of usersSnap.docs) {
          if (userDoc.id === currentUser.uid) continue;
          await addDoc(collection(db, 'notifications'), {
            recipientId: userDoc.id, type: 'custom_admin', title, body,
            senderId: currentUser.uid, senderName: userProfile.username || 'Admin',
            read: false, createdAt: serverTimestamp()
          });
          sent++;
        }
        try { pushNotify({ kind: 'custom', title, body, audience: 'all' }); } catch (pushErr) { console.warn('Push kustom tidak terkirim:', pushErr); }
        showToast(`Notifikasi masuk ke pusat notifikasi ${sent} pengguna. Push saat aplikasi tertutup memerlukan dukungan server FCM.`);

      finally { customSend.disabled = false; customSend.innerHTML = '<i class="fas fa-paper-plane mr-1"></i>Kirim ke Semua User'; }
    };
    renderV111NotifPanel();
  } else {
    panel.remove();
  }
}

    await renderPublicProfile(main, hash.replace('user/',''));
  } else if (hash.startsWith('privatechat/')) {
    await renderPrivateChat(main, hash.replace('privatechat/',''));
  } else if (hash.startsWith('clan/')) {
    await renderClanDetail(main, hash.replace('clan/',''));
  } else if (hash.startsWith('followers/')) {
    await renderFollowersPage(main, hash.replace('followers/',''), 'followers');
  } else if (hash.startsWith('following/')) {

  } else if (hash === 'baru') await renderBaru(main);
  else if (hash === 'baruupload') await renderBaruUpload(main);
  else if (hash === 'berita') await renderBerita(main);
  else if (hash === 'kategori') await renderKategori(main);
  else if (hash === 'leaderboard') await renderLeaderboard(main);
  else if (hash === 'followers') await renderTopFollowers(main);

  else if (hash === 'clan') await renderClan(main);

  else if (hash === 'notifikasi') await renderV111NotificationsPage(main);

  else await renderHome(main);
}

async function renderBaruUpload(container) {
  container.innerHTML = `
    <h2 class="text-2xl font-bold mb-4"><i class="fas fa-upload text-green-400 mr-2"></i>Baru Upload</h2>

  const list = document.getElementById('baruUploadList');
