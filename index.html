// === FIX: FOLLOW SYSTEM — followers owner tetap bertambah, bukan berkurang ===
// Fungsi toggleFollow yang benar: ketika user asli follow owner, followers owner nambah.
// Ketika unfollow, followers owner berkurang wajar (bukan bug).
// Data followers disimpan sebagai array UID asli, bukan bot.
async function toggleFollow(targetUid) {
  if (!currentUser || !userProfile) { showToast('Login dulu untuk follow'); return; }
  if (targetUid === currentUser.uid) { showToast('Tidak bisa follow diri sendiri'); return; }
  try {
    const targetRef = doc(db, 'users', targetUid);
    const meRef = doc(db, 'users', currentUser.uid);
    const targetSnap = await getDoc(targetRef);
    if (!targetSnap.exists()) { showToast('User tidak ditemukan'); return; }
    const target = targetSnap.data();
    const followers = target.followers || [];
    const isFollowing = followers.includes(currentUser.uid);
    const myFollowing = userProfile.following || [];
    
    if (isFollowing) {
      // UNFOLLOW — kurangi followers target
      const newFollowers = followers.filter(id => id !== currentUser.uid);
      const newFollowing = myFollowing.filter(id => id !== targetUid);
      await updateDoc(targetRef, { followers: newFollowers, followerCount: newFollowers.length });
      await updateDoc(meRef, { following: newFollowing, followingCount: newFollowing.length });
      userProfile.following = newFollowing;
      userProfile.followingCount = newFollowing.length;
      showToast('Berhenti mengikuti');
    } else {
      // FOLLOW — tambah followers target (termasuk owner)
      const newFollowers = [...followers, currentUser.uid];
      const newFollowing = [...myFollowing, targetUid];
      await updateDoc(targetRef, { followers: newFollowers, followerCount: newFollowers.length });
      await updateDoc(meRef, { following: newFollowing, followingCount: newFollowing.length });
      userProfile.following = newFollowing;
      userProfile.followingCount = newFollowing.length;
      showToast('✅ Mengikuti!');
    }
    
    // Update UI secara langsung
    const btn = document.getElementById('followBtn-' + targetUid);
    if (btn) {
      const nowFollowing = !isFollowing;
      btn.className = 'follow-btn ' + (nowFollowing ? 'following' : 'not-following');
      btn.innerHTML = nowFollowing ? '<i class="fas fa-check"></i> Mengikuti' : '<i class="fas fa-user-plus"></i> Follow';
    }
    const cEl = document.getElementById('followerCount-' + targetUid);
    if (cEl) cEl.textContent = formatCount(newFollowers.length);
  } catch (e) { showToast('Gagal: ' + e.message); }
}
window.toggleFollow = toggleFollow;

// === FIX: Owner follower boost — hanya untuk owner, tidak mengurangi ===
async function boostOwnerFollowers() {
  if (!currentUser || !userProfile) return;
  if (!hasRole(userProfile, 'owner')) return;
  const last = userProfile.lastOwnerBoost || 0;
  const now = Date.now();
  if (now - last < FOLLOWER_INTERVAL) return;
  try {
    const ref = doc(db, 'users', currentUser.uid);
    const newCount = (userProfile.followerCount || 0) + OWNER_FOLLOWER_RATE;
    await updateDoc(ref, { followerCount: newCount, lastOwnerBoost: now, updatedAt: serverTimestamp() });
    userProfile.followerCount = newCount;
    userProfile.lastOwnerBoost = now;
  } catch (e) {}
}

const GROUP_LABELS = { komik: 'Chapter', novel: 'Volume' };
function groupLabel(type) { return GROUP_LABELS[type] || 'Chapter'; }
function getGroups(work) {
  const g = Array.isArray(work && work.chapterGroups) ? work.chapterGroups : [];
  return g.slice().sort((a, b) => (Number(a.number) || 0) - (Number(b.number) || 0));
}
function newGroupId() { return 'g' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function groupTitleText(g, type) { return `${groupLabel(type)} ${g.number}${g.title ? ': ' + g.title : ''}`; }
function groupChapters(chapters, work) {
  const groups = getGroups(work);
  if (!groups.length) return [{ group: null, loose: false, items: chapters }];
  const byId = {}; groups.forEach(g => byId[g.id] = []);
  const loose = [];
  chapters.forEach(c => { if (c.groupId && byId[c.groupId]) byId[c.groupId].push(c); else loose.push(c); });
  const out = groups.map(g => ({ group: g, loose: false, items: byId[g.id] }));
  if (loose.length) out.push({ group: null, loose: true, items: loose });
  return out;
}
function groupSelectHtml(id, groups, selected, type) {
  return `<select id="${id}" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm">

    ${groups.map(g => `<option value="${g.id}" ${g.id === selected ? 'selected' : ''}>${escHtml(groupTitleText(g, type))}</option>`).join('')}
  </select>`;
}

function formatCount(n) {
  if (!n || n === 0) return '0';
  if (n >= 1000000000) return (n/1000000000).toFixed(1) + 'B';
  if (n >= 1000000) return (n/1000000).toFixed(1) + 'M';
  if (n >= 1000) return (n/1000).toFixed(1) + 'K';

}

function saveReadingPos(workId, chapterId, scrollY) {

function ibbChain(url) {
  const m = String(url || '').match(/^https?:\/\/i\.ibb\.co(?:\.com)?\/(.+)$/);
  if (!m) return null;
  return ['https://i.ibb.co.com/' + m[1], 'https://i.ibb.co/' + m[1], 'https://wsrv.nl/?url=' + encodeURIComponent('i.ibb.co/' + m[1])];
}
function ibbFix(u) { const c = ibbChain(u); return c ? c[0] : u; }
function testImgLoad(url, ms = 5000) {
  return new Promise(res => {
    const i = new Image(); let done = false;
    const f = ok => { if (!done) { done = true; res(ok); } };
    i.onload = () => f(true); i.onerror = () => f(false);
    setTimeout(() => f(false), ms);
    i.src = url;
  });
}
async function pickWorkingUrl(u) {
  const chain = ibbChain(u);
  if (!chain) return u;
  for (const c of chain) { if (await testImgLoad(c)) return c; }
  return chain[0];
}
document.addEventListener('error', (e) => {
  const t = e.target;
  if (!t || t.tagName !== 'IMG') return;
  const chain = ibbChain(t.src);
  if (!chain) return;
  let idx = chain.indexOf(t.src); if (idx < 0) idx = 0;
  const next = chain[idx + 1];
  if (next) { e.stopImmediatePropagation(); t.src = next; }
}, true);
const IMGBB_KEY = 'ba3afa5b0d8e2ea7a8dc2098ac38aad6';
const IMGBB_MAX_MB = 32;
async function uploadToImgbb(file) {
  if (!file || !file.type || !file.type.startsWith('image/')) throw new Error('Bukan gambar');
  if (file.size > IMGBB_MAX_MB * 1024 * 1024) throw new Error(`Ukuran file > ${IMGBB_MAX_MB} MB (batas ImgBB)`);
  let lastErr = 'Upload gagal';
  for (let attempt = 1; attempt <= 3; attempt++) {
    try {
      const fd = new FormData();
      fd.append('image', file);
      const res = await fetch('https://api.imgbb.com/1/upload?key=' + IMGBB_KEY, { method: 'POST', body: fd });
      const json = await res.json().catch(() => ({}));
      if (res.ok && json.success && json.data && json.data.url) return await pickWorkingUrl(json.data.url);
      lastErr = (json.error && (json.error.message || json.error)) || ('HTTP ' + res.status);
      if (res.status === 400) break;
    } catch (e) { lastErr = 'Koneksi bermasalah'; }
    await new Promise(r => setTimeout(r, 800 * attempt));
  }
  throw new Error(String(lastErr));
}
function compressImage(file) { return uploadToImgbb(file); }

function buildUserTags(profile, userId) {
  if (!profile) return '';
  const roles = profile.roles || (profile.role ? [profile.role] : ['pembaca']);
  let html = '';
  if (roles.includes('owner')) html += '<span class="owner-tag">👑 OWNER</span> ';
  if (roles.includes('admin')) html += '<span class="admin-tag">ADMIN</span> ';
  if (roles.includes('penulis')) html += '<span class="penulis-tag">PENULIS</span> ';
  if (roles.includes('komikus')) html += '<span class="komikus-tag">KOMIKUS</span> ';
  if (roles.includes('pembaca')) html += '<span class="pembaca-tag">PEMBACA</span> ';
  if (profile.clanId && clansCache[profile.clanId]) {
    const clan = clansCache[profile.clanId];
    const isOwner = clan.leader === userId || clan.leader === profile.uid;
    const isClanAdmin = (clan.admins || []).includes(userId) || (clan.admins || []).includes(profile.uid);
    if (isOwner) html += `<span class="clan-owner-tag cursor-pointer" onclick="event.stopPropagation();window.location.hash='clan/${profile.clanId}'">👑 ${clan.name}</span> `;
    else if (isClanAdmin) html += `<span class="clan-admin-tag cursor-pointer" onclick="event.stopPropagation();window.location.hash='clan/${profile.clanId}'">⚔️ ${clan.name}</span> `;
    else html += `<span class="clan-tag cursor-pointer" onclick="event.stopPropagation();window.location.hash='clan/${profile.clanId}'">${clan.name}</span> `;
  }
  return html;
}

async function checkBirthdays() {
  try {
    const today = new Date();
    const todayMMDD = `${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
    const snap = await getDocs(collection(db, 'users'));
    const bdayUsers = [];
    snap.forEach(d => {
      const u = { id: d.id, ...d.data() };
      if (!u.birthday) return;
      const roles = u.roles || [u.role || 'pembaca'];
      const isKreator = roles.includes('penulis') || roles.includes('komikus');
      if (!isKreator) return;
      if (u.birthday === todayMMDD) bdayUsers.push(u);
    });
    if (bdayUsers.length === 0) return;
    const settingsSnap = await getDoc(doc(db, 'settings', 'birthday'));
    const settings = settingsSnap.exists() ? settingsSnap.data() : {};
    const customTemplate = settings.text || '';
    const defaultTemplate = '🎉 Selamat Ulang Tahun, {username}! 🎂 Semoga sukses selalu dan karyanya makin banyak penggemar! 🎈';
    const template = customTemplate || defaultTemplate;
    const names = bdayUsers.map(u => {
      const roleLabel = hasRole(u, 'komikus') ? 'KOMIKUS' : 'PENULIS';
      const roleColor = hasRole(u, 'komikus') ? 'text-orange-400' : 'text-yellow-400';
      let text = template.replace(/{username}/g, '@' + (u.username || 'User')).replace(/{name}/g, u.username || 'User');
      return `<span>${text} <span class="${roleColor} text-xs font-black">[${roleLabel}]</span></span>`;
    }).join('<br>');
    const existing = document.getElementById('birthdayBanner');
    if (existing) existing.remove();
    const banner = document.createElement('div');
    banner.id = 'birthdayBanner';
    banner.className = 'birthday-banner';
    banner.innerHTML = `<i class="fas fa-birthday-cake text-xl badge-float"></i><div style="flex:1;text-align:left;max-width:900px">${names}</div><button onclick="document.getElementById('birthdayBanner').remove()"><i class="fas fa-times"></i></button>`;
    document.body.appendChild(banner);

    for (const u of bdayUsers) {
      try {
        await addDoc(collection(db, 'birthday_history'), {
          userId: u.id,
          username: u.username || 'User',
          roles: u.roles || [u.role || 'pembaca'],
          date: todayMMDD,
          year: today.getFullYear(),
          template: template,
          createdAt: serverTimestamp()
        });
      } catch (e) {}
    }
  } catch (e) {}
}

window.toggleFullscreenReader = () => {
  isFullscreenReader = !isFullscreenReader;
  const rc = document.getElementById('readerContent');
  const fb = document.getElementById('fullscreenBtn');
  if (!rc) return;
  if (isFullscreenReader) {
    rc.classList.add('reader-fullscreen');
    if (fb) fb.classList.add('hidden');
    if (!document.getElementById('fullscreenClose')) {
      const btn = document.createElement('button');
      btn.id = 'fullscreenClose'; btn.className = 'fullscreen-close';
      btn.innerHTML = '<i class="fas fa-times"></i>';
      btn.onclick = toggleFullscreenReader;
      document.body.appendChild(btn);
    }
    document.body.style.overflow = 'hidden';
  } else {
    rc.classList.remove('reader-fullscreen');
    if (fb) fb.classList.remove('hidden');
    const cb = document.getElementById('fullscreenClose');
    if (cb) cb.remove();
    document.body.style.overflow = '';
  }
};

        const title = row.querySelector('.gmTitle').value.trim();

        catch (e) { showToast('Gagal: ' + e.message); }
      };
      row.querySelector('.gmDel').onclick = async () => {
        const g = groups.find(x => x.id === gid);
        if (!confirm(`Hapus ${groupTitleText(g, type)}?`)) return;
        try {
          for (const d of cs.docs) if (d.data().groupId === gid) await updateDoc(doc(db, 'works', wid, 'chapters', d.id), { groupId: '' });
          await save(groups.filter(x => x.id !== gid));
          showToast(`${gl} dihapus`);
        } catch (e) { showToast('Gagal: ' + e.message); }
      };
    });
  }
  await load();
};

function attachMultiImageHandlers(containerId) {
  const fileInput = document.getElementById(`${containerId}-file`);
  const preview = document.getElementById(`${containerId}-preview`);
  const progress = document.getElementById(`${containerId}-progress`);
  if (!fileInput) return;
  window[`_${containerId}_files`] = window[`_${containerId}_files`] || [];
  window[`_${containerId}_dragSrc`] = null;
  if (!window[`_${containerId}_mode`]) window[`_${containerId}_mode`] = dragMode;
  
  fileInput.onchange = async (e) => {
    const files = Array.from(e.target.files);
    if (files.length === 0) return;
    progress.classList.remove('hidden');
    progress.innerHTML = `Mengupload ${files.length} foto ke ImgBB...<br>`;
    const newFiles = [];
    for (let i = 0; i < files.length; i++) {
      const f = files[i];
      progress.innerHTML += `[${i+1}/${files.length}] ${f.name}...<br>`;
      try {
        const dataUrl = await uploadToImgbb(f);
        newFiles.push({ name: f.name, dataUrl, preview: URL.createObjectURL(f) });
        progress.innerHTML += `&nbsp;&nbsp;✅ ${(f.size/1024).toFixed(0)} KB terupload<br>`;
      } catch (err) {
        progress.innerHTML += `&nbsp;&nbsp;❌ ${err.message}<br>`;
      }
    }
    window[`_${containerId}_files`] = [...(window[`_${containerId}_files`] || []), ...newFiles];
    progress.innerHTML += `<br>Total: ${window[`_${containerId}_files`].length} foto`;
    fileInput.value = '';
    renderPreview();
  };
  
  function renderPreview() {
    const files = window[`_${containerId}_files`] || [];
    const urlText = document.getElementById(`${containerId}-urls`)?.value || '';
    const urls = parseImgbbUrls(urlText);
    const total = files.length + urls.length;
    const mode = window[`_${containerId}_mode`] || 'drag';
    preview.innerHTML = '';
    if (total === 0) return;
    const modeBar = document.createElement('div');
    modeBar.className = 'img-preview-mode-bar';
    modeBar.innerHTML = `
      <span class="mode-label"><i class="fas fa-layer-group"></i>Total: ${total} foto</span>
      <div class="mode-btns">
        <button class="mode-btn ${mode === 'drag' ? 'active' : 'inactive'}" data-mode="drag">
          <i class="fas fa-hand-rock"></i> 🖐️ Mode Drag
        </button>
        <button class="mode-btn ${mode === 'fullscreen' ? 'active' : 'inactive'}" data-mode="fullscreen">
          <i class="fas fa-expand"></i> 🔍 Mode Fullscreen
        </button>
      </div>
    `;
    preview.appendChild(modeBar);
    modeBar.querySelectorAll('.mode-btn').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        const newMode = btn.dataset.mode;
        window[`_${containerId}_mode`] = newMode;
        dragMode = newMode;
        showToast(newMode === 'drag' ? '🖐️ Mode Drag aktif' : '🔍 Mode Fullscreen aktif');
        renderPreview();
      };
    });
    const hint = document.createElement('div');
    hint.className = 'w-full text-[11px] mb-2 ' + (mode === 'drag' ? 'text-amber-400' : 'text-blue-400');
    hint.innerHTML = mode === 'drag' 
      ? '<i class="fas fa-hand-rock mr-1"></i> <b>Mode Drag:</b> Geser gambar untuk ubah urutan.'
      : '<i class="fas fa-expand mr-1"></i> <b>Mode Fullscreen:</b> Klik gambar untuk perbesar.';
    preview.appendChild(hint);
    function setupDragEvents(wrap, type, index) {
      wrap.dataset.dragType = type;
      wrap.dataset.dragIndex = index;
      wrap.dataset.dragCid = containerId;
      if (mode === 'drag') {
        wrap.draggable = true;
        wrap.classList.add('draggable-ready');
        wrap.addEventListener('dragstart', (e) => {
          e.dataTransfer.effectAllowed = 'move';
          try { e.dataTransfer.setData('text/plain', JSON.stringify({ cid: containerId, type, idx: index })); } catch (err) {}
          window[`_${containerId}_dragSrc`] = { type, idx: index };
          wrap.classList.add('dragging');
          setTimeout(() => { wrap.style.opacity = '0.4'; }, 0);
        });
        wrap.addEventListener('dragend', () => {
          wrap.classList.remove('dragging');
          wrap.style.opacity = '';
          window[`_${containerId}_dragSrc`] = null;
          preview.querySelectorAll('.img-preview-wrap').forEach(w => { w.style.borderColor = ''; w.style.transform = ''; });
        });
        wrap.addEventListener('dragover', (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          if (window[`_${containerId}_dragSrc`]) { wrap.style.borderColor = '#fbbf24'; wrap.style.transform = 'scale(1.1)'; }
        });
        wrap.addEventListener('dragleave', () => { wrap.style.borderColor = ''; wrap.style.transform = ''; });
        wrap.addEventListener('drop', (e) => {
          e.preventDefault();
          e.stopPropagation();
          wrap.style.borderColor = '';
          wrap.style.transform = '';
          let data = window[`_${containerId}_dragSrc`];
          if (!data) return;
          reorderImages(containerId, data.type, data.idx, type, index);
        });
      } else {
        wrap.draggable = false;
      }
    }
    files.forEach((f, i) => {
      const wrap = document.createElement('div');
      wrap.className = 'img-preview-wrap' + (mode === 'drag' ? ' no-fullscreen' : '');
      wrap.innerHTML = `
        <img src="${f.preview || f.dataUrl}" class="img-preview" draggable="false" ${mode === 'fullscreen' ? `onclick="event.stopPropagation();window.showImgFullscreen('${f.dataUrl}','Gambar #${i+1} dari ${total}')"` : ''}>
        <span class="order-num">#${i+1}</span>
        ${mode === 'fullscreen' ? `<span class="zoom-badge" onclick="event.stopPropagation();window.showImgFullscreen('${f.dataUrl}','Gambar #${i+1} dari ${total}')"><i class="fas fa-expand"></i></span>` : ''}
        <span class="remove-btn" onclick="event.stopPropagation();removeImg('${containerId}',${i})">×</span>
        ${mode === 'drag' ? `<span class="drag-handle" title="Tahan & geser"><i class="fas fa-arrows-alt"></i></span>` : ''}
      `;
      setupDragEvents(wrap, 'file', i);
      preview.appendChild(wrap);
    });
    urls.forEach((url, i) => {
      const wrap = document.createElement('div');
      wrap.className = 'img-preview-wrap' + (mode === 'drag' ? ' no-fullscreen' : '');
      const safeUrl = escAttr(url);
      wrap.innerHTML = `
        <img src="${url}" class="img-preview" draggable="false" onerror="this.src='https://placehold.co/80x80/1a1a2e/64748b?text=Err'" ${mode === 'fullscreen' ? `onclick="event.stopPropagation();window.showImgFullscreen('${safeUrl}','Gambar #${files.length + i + 1} dari ${total}')"` : ''}>
        <span class="order-num">#${files.length + i + 1}</span>
        ${mode === 'fullscreen' ? `<span class="zoom-badge" onclick="event.stopPropagation();window.showImgFullscreen('${safeUrl}','Gambar #${files.length + i + 1} dari ${total}')"><i class="fas fa-expand"></i></span>` : ''}
        <span class="remove-btn" onclick="event.stopPropagation();removeUrl('${containerId}',${i})">×</span>
        ${mode === 'drag' ? `<span class="drag-handle" title="Tahan & geser"><i class="fas fa-arrows-alt"></i></span>` : ''}
      `;
      setupDragEvents(wrap, 'url', i);
      preview.appendChild(wrap);
    });
  }
  const urlTextarea = document.getElementById(`${containerId}-urls`);
  if (urlTextarea) urlTextarea.oninput = renderPreview;
  window[`_${containerId}_render`] = renderPreview;
  renderPreview();
}

function attachExistingImagesHandler(cid, images) {
  const preview = document.getElementById(`editExistingPreview-${cid}`);
  const countEl = document.getElementById(`editExistingCount-${cid}`);
  if (!preview) return;
  if (!window[`_existing_${cid}_images`]) window[`_existing_${cid}_images`] = [...images];
  if (!window[`_existing_${cid}_mode`]) window[`_existing_${cid}_mode`] = dragMode;
  window[`_existing_${cid}_dragSrc`] = null;
  function render() {
    const imgs = window[`_existing_${cid}_images`] || [];
    const mode = window[`_existing_${cid}_mode`] || 'drag';
    const total = imgs.length;
    preview.innerHTML = '';
    if (countEl) countEl.textContent = total;
    if (total === 0) { preview.innerHTML = '<p class="text-xs text-slate-500 italic mt-2">Tidak ada gambar.</p>'; return; }
    const modeBar = document.createElement('div');
    modeBar.className = 'img-preview-mode-bar';
    modeBar.innerHTML = `
      <span class="mode-label"><i class="fas fa-layer-group"></i>Total: ${total} gambar</span>
      <div class="mode-btns">
        <button class="mode-btn ${mode === 'drag' ? 'active' : 'inactive'}" data-mode="drag"><i class="fas fa-hand-rock"></i> 🖐️ Mode Drag</button>
        <button class="mode-btn ${mode === 'fullscreen' ? 'active' : 'inactive'}" data-mode="fullscreen"><i class="fas fa-expand"></i> 🔍 Mode Fullscreen</button>
      </div>
    `;
    preview.appendChild(modeBar);
    modeBar.querySelectorAll('.mode-btn').forEach(btn => {
      btn.onclick = (e) => { e.stopPropagation(); window[`_existing_${cid}_mode`] = btn.dataset.mode; dragMode = btn.dataset.mode; render(); };
    });
    const grid = document.createElement('div');
    grid.className = 'flex flex-wrap gap-2 max-h-60 overflow-y-auto scrollbar-thin bg-slate-900/50 border border-slate-700 rounded-lg p-2';
    preview.appendChild(grid);
    function setupDrag(wrap, index) {
      if (mode === 'drag') {
        wrap.draggable = true;
        wrap.addEventListener('dragstart', (e) => {
          e.dataTransfer.effectAllowed = 'move';
          window[`_existing_${cid}_dragSrc`] = index;
          wrap.classList.add('dragging');
          setTimeout(() => { wrap.style.opacity = '0.4'; }, 0);
        });
        wrap.addEventListener('dragend', () => {
          wrap.classList.remove('dragging');
          wrap.style.opacity = '';
          window[`_existing_${cid}_dragSrc`] = null;
        });
        wrap.addEventListener('dragover', (e) => { e.preventDefault(); wrap.style.borderColor = '#fbbf24'; });
        wrap.addEventListener('dragleave', () => { wrap.style.borderColor = ''; });
        wrap.addEventListener('drop', (e) => {
          e.preventDefault();
          wrap.style.borderColor = '';
          const fromIdx = window[`_existing_${cid}_dragSrc`];
          if (fromIdx === null || fromIdx === undefined || fromIdx === index) return;
          const imgs = [...(window[`_existing_${cid}_images`] || [])];
          const item = imgs.splice(fromIdx, 1)[0];
          imgs.splice(index, 0, item);
          window[`_existing_${cid}_images`] = imgs;
          render();
        });
      }
    }
    imgs.forEach((img, i) => {
      const wrap = document.createElement('div');
      wrap.className = 'img-preview-wrap' + (mode === 'drag' ? ' no-fullscreen' : '');
      wrap.innerHTML = `
        <img src="${img}" class="img-preview" draggable="false" onerror="this.src='https://placehold.co/80x80/1a1a2e/64748b?text=Err'" ${mode === 'fullscreen' ? `onclick="window.showImgFullscreen('${escAttr(img)}','Gambar #${i+1}')"` : ''}>
        <span class="order-num">#${i+1}</span>
        <span class="remove-btn" onclick="event.stopPropagation();window.removeExistingImage('${cid}',${i})">×</span>
      `;
      setupDrag(wrap, i);
      grid.appendChild(wrap);
    });
  }
  render();
}

window.removeExistingImage = (cid, index) => {
  if (!confirm('Hapus gambar ini?')) return;
  const imgs = window[`_existing_${cid}_images`] || [];
  imgs.splice(index, 1);
  window[`_existing_${cid}_images`] = imgs;
  attachExistingImagesHandler(cid, imgs);
};

function reorderImages(containerId, fromType, fromIdx, toType, toIdx) {
  if (fromType === toType && fromIdx === toIdx) return;
  const files = [...(window[`_${containerId}_files`] || [])];
  const urlTextarea = document.getElementById(`${containerId}-urls`);
  const urls = [...parseImgbbUrls(urlTextarea.value)];
  let item;
  if (fromType === 'file') item = files.splice(fromIdx, 1)[0];
  else item = urls.splice(fromIdx, 1)[0];
  if (toType === 'file') {
    if (fromType === 'url') files.splice(toIdx, 0, { name: 'url-item', dataUrl: item });
    else files.splice(toIdx, 0, item);
  } else {
    if (fromType === 'file') urls.splice(toIdx, 0, item.dataUrl || item);
    else urls.splice(toIdx, 0, item);
  }
  window[`_${containerId}_files`] = files;
  urlTextarea.value = urls.join('\n');
  window[`_${containerId}_render`]?.();
  showToast('✅ Urutan diubah!');
}

window.removeImg = (cid, idx) => { const files = window[`_${cid}_files`] || []; files.splice(idx, 1); window[`_${cid}_files`] = files; window[`_${cid}_render`]?.(); };
window.removeUrl = (cid, idx) => { const ta = document.getElementById(`${cid}-urls`); const urls = parseImgbbUrls(ta.value); urls.splice(idx, 1); ta.value = urls.join('\n'); window[`_${cid}_render`]?.(); };

function getMultiImages(containerId) {
  const files = window[`_${containerId}_files`] || [];
  const urlText = document.getElementById(`${containerId}-urls`)?.value || '';
  const urls = parseImgbbUrls(urlText);

  files.forEach(f => result.push(f.dataUrl));
  urls.forEach(u => result.push(u));
  return result;
}

      currentUser = user;
      const userRef = doc(db, 'users', user.uid);
      const snap = await getDoc(userRef);
      if (!snap.exists()) {
        const np = {
          uid: user.uid, username: user.displayName || 'User', email: user.email || '',
          photoURL: user.photoURL || '', role: 'pembaca', roles: ['pembaca'],
          exp: 0, level: 1, banned: false,
          friends: [], friendRequests: [], clanId: null,
          bookmarks: [], sosmed: {},
          followers: [], following: [], followerCount: 0, followingCount: 0,
          bio: '', birthday: '', featuredCreator: false,
          createdAt: serverTimestamp(), updatedAt: serverTimestamp()
        };
        await setDoc(userRef, np);
        userProfile = np;
      } else {
        userProfile = snap.data();
        if (!userProfile.roles) { userProfile.roles = [userProfile.role || 'pembaca']; await updateDoc(userRef, { roles: userProfile.roles }); }
        if (!userProfile.friends) { userProfile.friends = []; await updateDoc(userRef, { friends: [] }); }
        if (!userProfile.friendRequests) { userProfile.friendRequests = []; await updateDoc(userRef, { friendRequests: [] }); }
        if (!userProfile.bookmarks) { userProfile.bookmarks = []; await updateDoc(userRef, { bookmarks: [] }); }
        if (!userProfile.sosmed) { userProfile.sosmed = {}; await updateDoc(userRef, { sosmed: {} }); }
        if (!userProfile.followers) { userProfile.followers = []; await updateDoc(userRef, { followers: [] }); }
        if (!userProfile.following) { userProfile.following = []; await updateDoc(userRef, { following: [] }); }
        if (userProfile.followerCount === undefined) { userProfile.followerCount = 0; await updateDoc(userRef, { followerCount: 0 }); }
        if (userProfile.followingCount === undefined) { userProfile.followingCount = 0; await updateDoc(userRef, { followingCount: 0 }); }
        if (!userProfile.bio) { userProfile.bio = ''; await updateDoc(userRef, { bio: '' }); }
        if (!userProfile.birthday) { userProfile.birthday = ''; await updateDoc(userRef, { birthday: '' }); }
        if (userProfile.featuredCreator === undefined) { userProfile.featuredCreator = false; }
        if ((hasRole(userProfile, 'admin') || hasRole(userProfile, 'owner')) && userProfile.level !== MAX_LEVEL) {
          await updateDoc(userRef, { level: MAX_LEVEL, exp: MAX_LEVEL * 20 });
          userProfile.level = MAX_LEVEL; userProfile.exp = MAX_LEVEL * 20;
        }
        if (!userProfile.photoURL && user.photoURL) { await updateDoc(userRef, { photoURL: user.photoURL }); userProfile.photoURL = user.photoURL; }
        if (userProfile.banned) { showToast('Akun diblokir!', 5000); await signOut(auth); return; }
      }
      await loadClansCache();
      document.getElementById('navAuthMobile').innerHTML = `<i class="fas fa-sign-out-alt"></i>`;
      renderPage();
      setTimeout(() => initNotifListener(), 2000);
      setTimeout(() => checkBirthdays(), 1500);
      setTimeout(() => boostOwnerFollowers(), 2500);
      if (ownerFollowerInterval) clearInterval(ownerFollowerInterval);
      ownerFollowerInterval = setInterval(() => boostOwnerFollowers(), FOLLOWER_INTERVAL);
    } else {
      currentUser = null; userProfile = null;
      await loadClansCache();
      document.getElementById('navAuthMobile').innerHTML = `<i class="fas fa-sign-in-alt"></i>`;
      renderPage();
    }
  });
}

    showToast('Admin login!');

async function addClanExp(clanId, amount) {

function initNotifListener() {
  if (notifInitialized) return;
  notifInitialized = true;
  if (userProfile?.clanId) {
    const clanQ = query(collection(db, 'clans', userProfile.clanId, 'messages'), orderBy('createdAt', 'desc'), limit(1));
    onSnapshot(clanQ, snap => {
      snap.forEach(d => {
        const msg = d.data();
        if (msg.userId === currentUser?.uid) return;
        const ts = msg.createdAt?.toDate?.();
        if (ts && Date.now() - ts.getTime() > 30000) return;
        const un = usersCache[msg.userId]?.username || msg.username || 'Seseorang';
        const preview = msg.image ? '🖼️ Gambar' : (msg.text || '').slice(0, 40);
        showNotifBar(`🛡️ Clan - ${un}: ${preview}`, 'blue');
      });
    });
  }
  initPrivateNotifListener();
}

function initPrivateNotifListener() {
  if (notifPrivateInit) return;
  notifPrivateInit = true;
  const unsub = onSnapshot(collection(db, 'privateChats'), snap => {
    snap.docChanges().forEach(change => {
      if (change.type === 'added') {
        const chatId = change.doc.id;
        if (!chatId.includes(currentUser.uid)) return;
        const otherUid = chatId.split('_').find(u => u !== currentUser.uid);
        if (!otherUid) return;
        const msgQ = query(collection(db, 'privateChats', chatId, 'messages'), orderBy('createdAt', 'desc'), limit(1));
        const unsubMsg = onSnapshot(msgQ, msgSnap => {
          msgSnap.docChanges().forEach(mc => {
            if (mc.type !== 'added') return;
            const m = mc.doc.data();
            if (m.userId === currentUser.uid) return;
            const ts = m.createdAt?.toDate?.();
            if (ts && Date.now() - ts.getTime() > 30000) return;
            const un = usersCache[m.userId]?.username || m.username || 'Seseorang';
            const preview = m.image ? '🖼️ Gambar' : (m.text || '').slice(0, 40);
            showNotifBar(`💬 ${un}: ${preview}`, 'green');
          });
        });
        notifPrivateUnsubs.push(unsubMsg);
      }
    });
  });
  notifPrivateUnsubs.push(unsub);
}

async function renderHome(container) {

        <button id="tabKomik" class="px-4 py-2 rounded-full font-bold transition text-sm ${currentContentType === 'komik' ? 'bg-orange-500 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}">Komik</button>
        <button id="tabNovel" class="px-4 py-2 rounded-full font-bold transition text-sm ${currentContentType === 'novel' ? 'bg-amber-500 text-black' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}">Novel</button>
      </div>
      <div class="flex gap-2 w-full md:w-auto">
        <input id="searchInput" type="text" placeholder="Cari judul..." value="${currentSearch}" class="bg-slate-800 border border-slate-700 rounded-full px-4 py-2 text-sm w-full md:w-64 focus:border-amber-500 transition">
        <button id="searchBtn" class="bg-amber-500 text-black px-4 py-2 rounded-full font-bold text-sm hover:scale-105 transition"><i class="fas fa-search"></i></button>
      </div>
    </div>
    <div id="contentList" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 md:gap-5"></div>`;
  document.getElementById('tabKomik').onclick = () => { currentContentType = 'komik'; renderPage(); };
  document.getElementById('tabNovel').onclick = () => { currentContentType = 'novel'; renderPage(); };
  document.getElementById('searchBtn').onclick = () => { currentSearch = document.getElementById('searchInput').value.trim(); renderPage(); };
  document.getElementById('searchInput').addEventListener('keypress', e => { if (e.key === 'Enter') { currentSearch = e.target.value.trim(); renderPage(); } });
  const contentList = document.getElementById('contentList');
  const q = query(collection(db, 'works'), where('type', '==', currentContentType));
  let initialLoad = true;
  let lastKnownIds = new Set();
  worksUnsub = onSnapshot(q, (snapshot) => {
    let works = [];
    snapshot.forEach(d => works.push({ id: d.id, ...d.data() }));
    works.sort((a, b) => {
      const popA = (a.views || 0) + (a.likes || 0) * 2 + (a.avgRating || 0) * 10;
      const popB = (b.views || 0) + (b.likes || 0) * 2 + (b.avgRating || 0) * 10;
      return popB - popA;
    });
    if (currentSearch) works = works.filter(w => w.title.toLowerCase().includes(currentSearch.toLowerCase()));
    const currentIds = new Set(works.map(w => w.id));
    const newIds = new Set([...currentIds].filter(id => !lastKnownIds.has(id)));
    renderWorkList(contentList, works, initialLoad ? new Set() : newIds);
    lastKnownIds = currentIds;
    initialLoad = false;
  });
}

function renderWorkList(container, works, newIds = new Set()) {
  if (works.length === 0) {
    container.innerHTML = `<div class="col-span-full card-bg rounded-2xl p-12 text-center empty-animation">
      <i class="fas fa-book-open text-6xl text-amber-400/50 mb-4"></i>
      <h3 class="text-xl font-bold">Belum ada ${currentContentType === 'novel' ? 'Novel' : 'Komik'}.</h3>
      <p class="text-slate-400 mt-2">Jadilah yang pertama!</p>
      ${isCreator(userProfile) || isAdminSession ? `<button class="mt-4 bg-amber-500 text-black px-6 py-2 rounded-full font-bold btn-glow" onclick="window.location.hash='creator'">Upload Karya</button>` : `<button class="mt-4 bg-green-600 text-white px-6 py-2 rounded-full font-bold hover:scale-105 transition" onclick="window.location.hash='jadi-kreator'"><i class="fas fa-star mr-1"></i>Jadi Kreator</button>`}
    </div>`;
    return;
  }
  container.innerHTML = works.map((work, idx) => {
    const cats = parseCategories(work.category);
    const isNew = newIds && newIds.has(work.id);
    const liked = currentUser && (work.likedBy || []).includes(currentUser.uid);
    const resume = getReadingPos(work.id);
    const vBadge = getVerifiedBadge(work.authorFollowerCount || 0);
    const isTD = isTakedown(work);
    const isNP = isNonPublish(work);
    const isUN = isUnggulan(work);
    const borderClass = isTD ? 'takedown-border' : isNP ? 'nonpublish-border' : isUN ? 'unggulan-border' : (work.isTamat ? 'tamat-border' : 'berlanjut-border');
    return `
    <div class="card-bg hover-lift rounded-2xl overflow-hidden shadow-lg cursor-pointer card-anim ${borderClass} ${isNew && !isTD ? 'new-work' : ''}" style="animation-delay:${Math.min(idx*0.03, 0.5)}s" onclick="${isTD ? `showToast('⛔ Karya ini di-takedown')` : `window.location.hash='reader/${work.id}'`}">
      <div class="h-40 md:h-48 bg-slate-800 flex items-center justify-center overflow-hidden relative">
        ${work.coverURL ? `<img src="${work.coverURL}" class="w-full h-full object-cover ${isTD ? 'grayscale opacity-40' : isNP ? 'grayscale opacity-70' : ''}" onerror="this.style.display='none';">` : `<i class="fas fa-image text-5xl text-slate-600"></i>`}
        ${workStatusBadge(work)}
        ${statusLabel(work.isTamat)}
        <div class="absolute bottom-2 left-2 right-2 flex justify-between items-center pointer-events-none">
          <span class="view-badge bg-black/70 backdrop-blur px-2 py-1 rounded-full"><i class="fas fa-eye"></i> ${formatCount(work.views || 0)}</span>
          <span class="view-badge bg-black/70 backdrop-blur px-2 py-1 rounded-full"><i class="fas fa-heart" style="color:#ef4444"></i> ${formatCount(work.likes || 0)}</span>
        </div>
        ${resume && !isTD && !isNP ? `<div class="absolute top-2 right-2 bg-blue-600/90 backdrop-blur text-white text-[10px] font-bold px-2 py-1 rounded-full"><i class="fas fa-bookmark"></i> Lanjut</div>` : ''}
      </div>
      <div class="p-3 md:p-4">
        <h3 class="font-bold text-sm md:text-lg truncate ${isTD ? 'text-slate-500 line-through' : ''}">${work.title}</h3>
        <p class="text-xs md:text-sm text-slate-400 line-clamp-2 mt-1">${work.teaser || ''}</p>
        <div class="flex flex-wrap gap-1 mt-2">
          ${cats.slice(0,2).map(c => `<span class="text-[10px] md:text-xs bg-slate-700 px-1.5 py-0.5 rounded-full">${c}</span>`).join('')}
          ${cats.length > 2 ? `<span class="text-[10px] md:text-xs bg-slate-700 px-1.5 py-0.5 rounded-full">+${cats.length-2}</span>` : ''}
        </div>
        <div class="mt-2 flex items-center gap-2 text-xs text-slate-500">
          <div class="flex items-center gap-1 flex-1 min-w-0 cursor-pointer hover:opacity-80" onclick="event.stopPropagation();window.location.hash='user/${work.authorId}'">
            <img src="${work.authorPhotoURL || 'https://ui-avatars.com/api/?name='+encodeURIComponent(work.authorName||'U')}" class="w-5 h-5 rounded-full border border-slate-700">
            <span class="truncate max-w-[80px] hover:text-amber-400">${work.authorName || 'Anonim'}${vBadge}</span>
            ${work.authorLevel > 1000 ? '<i class="fas fa-crown text-amber-400 text-[10px] badge-float"></i>' : ''}
          </div>
          <button class="like-btn ${liked ? 'liked' : 'text-slate-400'}" onclick="event.stopPropagation();toggleWorkLike('${work.id}')" title="${liked ? 'Unlike' : 'Like'}" ${isTD ? 'disabled' : ''}>
            <i class="fas fa-heart"></i> <span id="like-count-${work.id}">${formatCount(work.likes || 0)}</span>
          </button>
          ${work.avgRating ? `<span class="text-amber-400"><i class="fas fa-star text-[10px]"></i> ${work.avgRating.toFixed(1)}</span>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');
}

window.toggleWorkLike = async (workId) => {
  if (!currentUser || !userProfile) { showToast('Login dulu untuk like'); return; }
  try {
    const workRef = doc(db, 'works', workId);
    const snap = await getDoc(workRef);
    if (!snap.exists()) return;
    const work = snap.data();
    const likedBy = work.likedBy || [];
    const isLiked = likedBy.includes(currentUser.uid);
    let newLikedBy;
    if (isLiked) { newLikedBy = likedBy.filter(id => id !== currentUser.uid); }
    else { newLikedBy = [...likedBy, currentUser.uid]; await addExp(EXP_PER_COMMENT); }
    await updateDoc(workRef, { likedBy: newLikedBy, likes: newLikedBy.length, updatedAt: serverTimestamp() });
    const el = document.getElementById('like-count-' + workId);
    if (el) el.textContent = formatCount(newLikedBy.length);
    document.querySelectorAll('.like-btn').forEach(b => {
      if (b.getAttribute('onclick')?.includes(workId)) {
        b.classList.toggle('liked', !isLiked);
        b.classList.toggle('text-slate-400', isLiked);
      }
    });
    showToast(isLiked ? 'Like dihapus' : '❤️ Disukai!');
  } catch (e) { showToast('Gagal: ' + e.message); }
};

      const main = document.getElementById('mainContent');
      if (main && container) await renderBerita(main);
      else if (main) await renderBerita(main);
    } catch (e) {
      showToast('Gagal: ' + e.message);
      btn.disabled = false; btn.textContent = 'Simpan';
    }
  };
}

async function renderTopFollowers(container) {
  container.innerHTML = `
    <h2 class="text-2xl font-bold mb-4"><i class="fas fa-crown text-amber-400 mr-2 badge-float"></i>Top Followers</h2>
    <div class="flex gap-2 mb-6 flex-wrap">

      <button id="lfKreator" class="px-4 py-2 rounded-full font-bold text-sm bg-slate-800 text-slate-300">Kreator</button>
      <button id="lfUnggulan" class="px-4 py-2 rounded-full font-bold text-sm bg-slate-800 text-slate-300">⭐ Unggulan</button>
      <button id="lfStaff" class="px-4 py-2 rounded-full font-bold text-sm bg-slate-800 text-slate-300">Staff</button>
    </div>
    <div id="followersLbList" class="space-y-3">Memuat...</div>`;
  let filterMode = 'all';
  const list = document.getElementById('followersLbList');
  document.getElementById('lfAll').onclick = () => { filterMode = 'all'; setLfActive('lfAll'); load(); };
  document.getElementById('lfKreator').onclick = () => { filterMode = 'kreator'; setLfActive('lfKreator'); load(); };
  document.getElementById('lfUnggulan').onclick = () => { filterMode = 'unggulan'; setLfActive('lfUnggulan'); load(); };
  document.getElementById('lfStaff').onclick = () => { filterMode = 'staff'; setLfActive('lfStaff'); load(); };
  function setLfActive(id) {
    ['lfAll','lfKreator','lfUnggulan','lfStaff'].forEach(x => {
      const el = document.getElementById(x);
      if (x === id) { el.classList.add('bg-amber-500','text-black'); el.classList.remove('bg-slate-800','text-slate-300'); }
      else { el.classList.remove('bg-amber-500','text-black'); el.classList.add('bg-slate-800','text-slate-300'); }
    });
  }
  async function load() {
    list.innerHTML = '<p class="text-slate-400 text-sm">Memuat...</p>';
    const snap = await getDocs(collection(db, 'users'));
    let users = [];
    snap.forEach(d => users.push({ id: d.id, ...d.data() }));
    users = users.filter(u => (u.followerCount || 0) > 0);
    if (filterMode === 'kreator') {
      users = users.filter(u => { const r = u.roles || [u.role || 'pembaca']; return (r.includes('penulis') || r.includes('komikus')) && !r.includes('owner') && !r.includes('admin'); });
      users.sort((a, b) => (b.followerCount || 0) - (a.followerCount || 0));
    } else if (filterMode === 'unggulan') {
      users = users.filter(u => u.featuredCreator === true);
      users.sort((a, b) => (b.followerCount || 0) - (a.followerCount || 0));
    } else if (filterMode === 'staff') {
      users = users.filter(u => { const r = u.roles || [u.role || 'pembaca']; return r.includes('owner') || r.includes('admin'); });
      users.sort((a, b) => {
        const aOwner = (a.roles || []).includes('owner') ? 1 : 0;
        const bOwner = (b.roles || []).includes('owner') ? 1 : 0;
        if (aOwner !== bOwner) return bOwner - aOwner;
        return (b.followerCount || 0) - (a.followerCount || 0);
      });
    } else {
      users = users.filter(u => { const r = u.roles || [u.role || 'pembaca']; return !r.includes('owner') && !r.includes('admin'); });
      users.sort((a, b) => (b.followerCount || 0) - (a.followerCount || 0));
    }
    users = users.slice(0, 30);
    if (users.length === 0) { list.innerHTML = '<div class="card-bg rounded-2xl p-8 text-center text-slate-400"><i class="fas fa-users text-4xl text-amber-400/30 mb-3"></i><p>Belum ada user.</p></div>'; return; }
    const rankColors = ['bg-gradient-to-br from-yellow-400 to-amber-600 text-black','bg-gradient-to-br from-slate-300 to-slate-500 text-black','bg-gradient-to-br from-amber-700 to-amber-900 text-white'];
    list.innerHTML = users.map((u, i) => {
      const r = u.roles || [u.role || 'pembaca'];
      const isO = r.includes('owner'), isA = r.includes('admin');
      const v = getVerifiedBadge(u.followerCount || 0) + getCreatorVerifiedBadge(u);
      const unggulan = u.featuredCreator ? '<span class="unggulan-tag ml-1">⭐ UNGGULAN</span>' : '';
      return `<div class="card-bg hover-lift rounded-2xl p-4 flex items-center gap-4 cursor-pointer card-anim ${u.featuredCreator ? 'unggulan-border' : ''}" style="animation-delay:${i*0.03}s" onclick="window.location.hash='user/${u.id}'">
        <div class="leaderboard-rank ${i < 3 ? rankColors[i] : 'bg-slate-700 text-slate-300'}">${i+1}</div>
        <img src="${u.photoURL || 'https://ui-avatars.com/api/?name='+encodeURIComponent(u.username||'U')}" class="w-14 h-14 rounded-full border-2 ${u.featuredCreator ? 'border-amber-400' : isO?'border-red-500':isA?'border-amber-500':'border-slate-700'} ${isO ? 'owner-shine' : ''}">
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-1 flex-wrap">
            <h3 class="font-bold truncate">${u.username || 'User'}${v}</h3>
            ${isO ? '<span class="owner-tag">OWNER</span>' : isA ? '<span class="admin-tag">ADMIN</span>' : ''}
            ${unggulan}
          </div>
          <p class="text-xs text-slate-400">Lv.${u.level || 1} • ${getLevelTitle(u.level || 1)}</p>
        </div>
        <div class="text-right">
          <div class="text-amber-400 font-black text-lg">${formatCount(u.followerCount || 0)}</div>
          <div class="text-xs text-slate-500">followers</div>
        </div>
      </div>`;
    }).join('');
  }
  load();
}

      const own = m.userId === currentUser.uid;
      const isLast = idx === arr.length - 1;
      const anim = isLast && isNew ? (own ? 'chat-msg-new-own' : 'chat-msg-new') : '';
      const userObj = usersCache[m.userId] || { username: m.username, photoURL: m.photoURL, level: m.userLevel };
      const un = userObj.username || m.username || 'User';
      const pu = userObj.photoURL || m.photoURL || '';
      const ul = userObj.level || m.userLevel || 1;
      const isImg = m.image && !m.text;

            <span class="${isGolden(ul) ? 'gold-glow font-bold' : 'text-slate-300 font-semibold'}">${un}</span>
            ${buildUserTags(userObj, m.userId)}
            <span class="text-slate-500">Lv.${ul}</span>
          </div>` : ''}
          ${m.image ? `<img src="${m.image}" class="chat-img" onclick="window.showImgFullscreen('${escAttr(m.image)}','Gambar dari ${escAttr(un)}')">` : ''}
          ${m.text ? `<p class="text-sm mt-1">${sensor(m.text || '')}</p>` : ''}
          <p class="text-xs text-slate-500 mt-1">${fmtDate(m.createdAt)}</p>
        </div>
        ${own ? `<img src="${pu || 'https://ui-avatars.com/api/?name='+encodeURIComponent(un)}" class="w-8 h-8 rounded-full">` : ''}
      </div>`;
    }).join('');
    lastId = lastMsg.id;
    msgsDiv.scrollTop = msgsDiv.scrollHeight;
  });
  const imgInput = document.getElementById('pmImgInput');
  const imgPreview = document.getElementById('pmImgPreview');
  imgInput.onchange = async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    imgPreview.innerHTML = '<p class="text-xs text-amber-400 mt-2">Mengupload gambar...</p>';
    try {
      const dataUrl = await compressImage(f);
      pendingChatImg.private = dataUrl;
      imgPreview.innerHTML = `<div class="chat-img-preview"><img src="${dataUrl}"><span class="remove-btn" onclick="event.stopPropagation();window.cancelChatImg('private')">×</span></div><p class="text-xs text-green-400 mt-1">✅ Siap dikirim</p>`;
    } catch (err) { imgPreview.innerHTML = `<p class="text-xs text-red-400 mt-1">Gagal: ${err.message}</p>`; }
    imgInput.value = '';
  };
  document.getElementById('pmSend').onclick = async () => {
    const text = document.getElementById('pmInput').value.trim();
    const img = pendingChatImg.private;
    if (!text && !img) return;
    const msgData = { userId: currentUser.uid, username: userProfile.username || 'User', photoURL: userProfile.photoURL || '', text: text ? sensor(text) : '', createdAt: serverTimestamp() };
    if (img) msgData.image = img;
    await addDoc(collection(db, 'privateChats', chatId, 'messages'), msgData);
    document.getElementById('pmInput').value = '';
    pendingChatImg.private = null;
    document.getElementById('pmImgPreview').innerHTML = '';
    await addExp(EXP_PER_CHAT);
  };
  document.getElementById('pmInput').addEventListener('keypress', e => { if (e.key === 'Enter') document.getElementById('pmSend').click(); });
}

    <h2 class="text-2xl font-bold mb-4"><i class="fas fa-user-friends text-amber-400 mr-2"></i>Teman & Chat</h2>
    <div class="card-bg rounded-2xl p-4 mb-4 card-anim">

      <div id="sResults"></div>

        <div class="flex-1 cursor-pointer" onclick="window.location.hash='user/${r.id}'"><p class="font-semibold text-sm">${r.username}</p><p class="text-xs text-slate-400">Lv.${r.level || 1}</p></div>
        <button onclick="acceptFriend('${r.id}')" class="bg-green-600 text-white px-3 py-1 rounded-lg text-xs font-bold hover:scale-105 transition">Terima</button>
        <button onclick="rejectFriend('${r.id}')" class="bg-red-600 text-white px-3 py-1 rounded-lg text-xs font-bold hover:scale-105 transition">Tolak</button>
      </div>`).join('')}</div>
    </div>` : ''}

      <h3 class="font-bold mb-3 text-amber-400">Teman Saya (${friends.length})</h3>
      ${friends.length === 0 ? '<p class="text-slate-400 text-sm">Belum ada teman. Cari di atas!</p>' : `<div class="space-y-2">${friends.map(f => `<div class="flex items-center gap-2 bg-slate-800/50 rounded-xl p-2 hover:bg-slate-800 transition">
        <img src="${f.photoURL || 'https://ui-avatars.com/api/?name='+encodeURIComponent(f.username)}" class="w-10 h-10 rounded-full cursor-pointer" onclick="window.location.hash='user/${f.id}'">
        <div class="flex-1 cursor-pointer" onclick="window.location.hash='user/${f.id}'"><p class="font-semibold text-sm">${f.username}</p><p class="text-xs text-slate-400">Lv.${f.level || 1}</p></div>
        <button onclick="window.location.hash='privatechat/${f.id}'" class="bg-amber-500 text-black px-3 py-1 rounded-lg text-xs font-bold hover:scale-105 transition"><i class="fas fa-comment"></i> Chat</button>
      </div>`).join('')}</div>`}
    </div>`;
  const searchInput = document.getElementById('sUser');
  const resDiv = document.getElementById('sResults');
  searchInput.oninput = async (e) => {
    const val = e.target.value.toLowerCase().trim();
    if (val.length < 2) { resDiv.innerHTML = ''; return; }
    const allSnap = await getDocs(collection(db, 'users'));
    const matches = []; allSnap.forEach(d => { const u = { id: d.id, ...d.data() }; if (u.uid !== currentUser.uid && (u.username || '').toLowerCase().includes(val)) matches.push(u); });
    resDiv.innerHTML = matches.slice(0, 10).map(m => `
      <div class="flex items-center gap-2 bg-slate-800/50 rounded-xl p-2 mt-2 card-anim">
        <img src="${m.photoURL || 'https://ui-avatars.com/api/?name='+encodeURIComponent(m.username)}" class="w-10 h-10 rounded-full cursor-pointer" onclick="window.location.hash='user/${m.id}'">
        <div class="flex-1 cursor-pointer" onclick="window.location.hash='user/${m.id}'"><p class="font-semibold text-sm">${m.username}${getVerifiedBadge(m.followerCount||0)}</p><p class="text-xs text-slate-400">Lv.${m.level || 1}</p></div>
        ${(userProfile.friends || []).includes(m.id) ? '<span class="text-green-400 text-xs">Teman</span>' :

      </div>`).join('');
  };
}

async function renderClan(c) {
  if (!currentUser) { c.innerHTML = `<div class="card-bg rounded-2xl p-8 text-center card-anim"><p>Login untuk akses clan.</p></div>`; return; }
  const clanSnap = userProfile.clanId ? await getDoc(doc(db, 'clans', userProfile.clanId)) : null;
  const myClan = clanSnap && clanSnap.exists() ? { id: clanSnap.id, ...clanSnap.data() } : null;
  const allClansSnap = await getDocs(query(collection(db, 'clans'), orderBy('exp', 'desc'), limit(50)));
  const allClans = []; allClansSnap.forEach(d => allClans.push({ id: d.id, ...d.data() }));
  const isOwner = myClan && myClan.leader === currentUser.uid;
  const isAdmin = myClan && (myClan.admins || []).includes(currentUser.uid);
  c.innerHTML = `
    <h2 class="text-2xl font-bold mb-4"><i class="fas fa-users text-amber-400 mr-2"></i>Clan</h2>
    ${myClan ? `
      <div class="card-bg rounded-2xl p-6 mb-6 card-anim berlanjut-border">
        <div class="flex justify-between items-start mb-3 flex-wrap gap-2">
          <div>
            <h3 class="text-2xl font-black text-amber-400">${isOwner ? '👑 ' : isAdmin ? '⚔️ ' : ''}${myClan.name}</h3>
            <p class="text-sm text-slate-400">Level ${myClan.level || 1} • ${getClanLevelTitle(myClan.level || 1)} • ${(myClan.members || []).length} member</p>
          </div>
          <button onclick="window.location.hash='clan/${myClan.id}'" class="bg-amber-500 text-black px-4 py-2 rounded-full font-bold text-sm hover:scale-105 transition">Buka Chat Clan</button>
        </div>
      </div>` : `
      <div class="card-bg rounded-2xl p-6 mb-6 card-anim">
        <h3 class="font-bold mb-3">Belum punya clan</h3>
        <p class="text-sm text-slate-400 mb-3">Buat clan sendiri atau join dari daftar di bawah.</p>
        <div class="flex gap-2">
          <input id="newClanName" type="text" placeholder="Nama clan (3-20 char)" maxlength="20" class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm">
          <button id="createClanBtn" class="bg-amber-500 text-black px-6 py-2 rounded-full font-bold hover:scale-105 transition">Buat</button>
        </div>
      </div>`}
    <div class="card-bg rounded-2xl p-4 card-anim">
      <h3 class="font-bold mb-3 text-amber-400">Top Clan (${allClans.length})</h3>
      ${allClans.length === 0 ? '<p class="text-slate-400 text-sm">Belum ada clan.</p>' : `<div class="space-y-2">${allClans.slice(0, 20).map((cn, i) => `
        <div class="flex items-center gap-3 bg-slate-800/50 rounded-xl p-3 cursor-pointer hover:bg-slate-800 hover:translate-x-1 transition" onclick="window.location.hash='clan/${cn.id}'">
          <div class="w-10 h-10 rounded-full bg-amber-500 text-black flex items-center justify-center font-black">${cn.name ? cn.name[0].toUpperCase() : 'C'}</div>
          <div class="flex-1"><p class="font-bold">${cn.name}</p><p class="text-xs text-slate-400">Lv.${cn.level || 1} • ${(cn.members || []).length} member</p></div>
          <span class="text-amber-400 text-xs font-bold">#${i + 1}</span>
        </div>`).join('')}</div>`}
    </div>`;
  if (document.getElementById('createClanBtn')) {
    document.getElementById('createClanBtn').onclick = async () => {
      const name = document.getElementById('newClanName').value.trim();
      if (!name || name.length < 3) { showToast('Nama 3-20 karakter'); return; }
      try {
        const ref = await addDoc(collection(db, 'clans'), {
          name, leader: currentUser.uid, leaderName: userProfile.username,
          members: [currentUser.uid], admins: [], joinRequests: [], exp: 0, level: 1, createdAt: serverTimestamp()
        });
        await updateDoc(doc(db, 'users', currentUser.uid), { clanId: ref.id });
        userProfile.clanId = ref.id;
        await loadClansCache();
        showToast('Clan dibuat!'); renderPage();
      } catch (e) { showToast('Gagal: ' + e.message); }
    };
  }
}

        <div class="flex-1 text-center md:text-left">

          ${isOwner ? `

            <button id="deleteClanBtn" class="bg-red-700 text-white font-bold px-4 py-2 rounded-full text-sm hover:scale-105 transition"><i class="fas fa-trash mr-1"></i>Hapus</button>
          ` : ''}
        </div>
      </div>
      ${isOwner ? `<div id="editClanForm" class="hidden mt-4 border-t border-slate-700 pt-4">
        <label class="block text-sm font-semibold mb-1 text-amber-400">Nama Clan Baru</label>
        <div class="flex gap-2">
          <input id="editClanName" type="text" maxlength="20" value="${clan.name}" class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm">
          <button id="saveClanNameBtn" class="bg-green-600 text-white px-4 py-2 rounded-lg font-bold text-sm hover:scale-105 transition">Simpan</button>
          <button id="cancelEditClanBtn" class="bg-slate-700 text-slate-300 px-4 py-2 rounded-lg font-bold text-sm">Batal</button>
        </div>
      </div>` : ''}
    </div>
    ${(isOwner || isAdmin) && reqUsers.length > 0 ? `
    <div class="card-bg rounded-2xl p-4 mb-4 card-anim border border-blue-600/50">
      <h3 class="font-bold mb-3 text-blue-400"><i class="fas fa-user-plus mr-1"></i>Request Join (${reqUsers.length})</h3>
      <p class="text-xs text-slate-400 mb-3">Setiap user yang ingin masuk <b>wajib</b> disetujui Admin/Owner clan.</p>
      <div class="space-y-2">
        ${reqUsers.map(r => `
          <div class="flex items-center gap-2 bg-slate-800/50 rounded-xl p-2">
            <img src="${r.photoURL || 'https://ui-avatars.com/api/?name='+encodeURIComponent(r.username)}" class="w-10 h-10 rounded-full cursor-pointer" onclick="window.location.hash='user/${r.id}'">
            <div class="flex-1 cursor-pointer" onclick="window.location.hash='user/${r.id}'"><p class="font-semibold text-sm">${r.username}</p><p class="text-xs text-slate-400">Lv.${r.level || 1}</p></div>
            <button onclick="approveClanJoin('${clanId}','${r.id}')" class="bg-green-600 text-white px-3 py-1 rounded-lg text-xs font-bold hover:scale-105 transition">Terima</button>
            <button onclick="rejectClanJoin('${clanId}','${r.id}')" class="bg-red-600 text-white px-3 py-1 rounded-lg text-xs font-bold hover:scale-105 transition">Tolak</button>
          </div>
        `).join('')}
      </div>
    </div>` : ''}
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
      <div class="card-bg rounded-2xl p-4 card-anim">
        <div class="flex justify-between items-center mb-3">

          <span class="text-xs text-slate-400">Max 2 Admin</span>

        <div class="space-y-2 max-h-[50vh] overflow-y-auto scrollbar-thin">
          ${members.map(m => {
            const mOwner = m.id === clan.leader;
            const mAdmin = admins.includes(m.id);
            const isMe = currentUser && m.id === currentUser.uid;
            const canKickThis = canKick && !mOwner && !isMe;
            const canPromoteThis = canManageAdmin && !mOwner && !isMe;
            const canDemoteThis = canManageAdmin && mAdmin && !mOwner;
            const userRoles = m.roles || [m.role || 'pembaca'];
            let tagHtml = '';
            if (userRoles.includes('owner')) tagHtml += '<span class="owner-tag text-xs">OWNER</span> ';
            if (userRoles.includes('admin')) tagHtml += '<span class="admin-tag text-xs">ADMIN</span> ';
            if (userRoles.includes('penulis')) tagHtml += '<span class="penulis-tag text-xs">PENULIS</span> ';
            if (userRoles.includes('komikus')) tagHtml += '<span class="komikus-tag text-xs">KOMIKUS</span> ';
            if (userRoles.includes('pembaca')) tagHtml += '<span class="pembaca-tag text-xs">PEMBACA</span> ';
            return `
              <div class="bg-slate-800/50 rounded-xl p-3">
                <div class="flex items-center gap-2 flex-wrap">
                  <img src="${m.photoURL || 'https://ui-avatars.com/api/?name='+encodeURIComponent(m.username)}" class="w-10 h-10 rounded-full cursor-pointer hover:scale-110 transition ${mOwner ? 'owner-shine' : ''}" onclick="window.location.hash='user/${m.id}'">
                  <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-1 flex-wrap">
                      <p class="font-semibold text-sm cursor-pointer hover:text-amber-400" onclick="window.location.hash='user/${m.id}'">${m.username}</p>
                      ${mOwner ? '<span class="clan-owner-tag text-xs">👑 OWNER</span>' : mAdmin ? '<span class="clan-admin-tag text-xs">⚔️ ADMIN</span>' : '<span class="clan-tag text-xs">MEMBER</span>'}
                    </div>
                    <div class="flex items-center gap-1 flex-wrap mt-1">
                      <span class="text-xs text-slate-400">Lv.${m.level || 1}</span>
                      ${tagHtml}
                    </div>
                  </div>
                </div>
                ${(canKickThis || canPromoteThis || canDemoteThis) ? `
                  <div class="flex gap-2 mt-2 flex-wrap">
                    ${canPromoteThis && !mAdmin && admins.length < 2 ? `<button onclick="promoteToAdmin('${clanId}','${m.id}')" class="bg-purple-600 text-white px-3 py-1 rounded-lg text-xs font-bold hover:scale-105 transition"><i class="fas fa-crown mr-1"></i>Jadikan Admin</button>` : ''}
                    ${canDemoteThis ? `<button onclick="demoteAdmin('${clanId}','${m.id}')" class="bg-yellow-600 text-white px-3 py-1 rounded-lg text-xs font-bold hover:scale-105 transition"><i class="fas fa-arrow-down mr-1"></i>Turunkan</button>` : ''}
                    ${canKickThis ? `<button onclick="kickMember('${clanId}','${m.id}','${m.username}')" class="bg-red-600 text-white px-3 py-1 rounded-lg text-xs font-bold hover:scale-105 transition"><i class="fas fa-user-minus mr-1"></i>Keluarkan</button>` : ''}
                  </div>
                ` : ''}
              </div>
            `;
          }).join('')}
        </div>
      </div>
      <div class="card-bg rounded-2xl p-4 flex flex-col h-[70vh] card-anim">
        <h3 class="font-bold mb-3 text-amber-400">Chat Clan</h3>
        <div id="clanMsgs" class="flex-1 overflow-y-auto scrollbar-thin space-y-3 mb-2 p-2"></div>
        <div id="clanReplyPreview"></div>
        <div id="clanImgPreview"></div>
        ${isMember ? `<div class="flex gap-2 items-center mt-2">
          <label class="chat-img-send-btn" title="Kirim gambar"><i class="fas fa-image text-lg"></i><input type="file" id="clanImgInput" accept="image/*"></label>
          <input id="clanInput" type="text" placeholder="Pesan..." class="flex-1 bg-slate-800 border border-slate-700 rounded-full px-4 py-2 text-sm focus:border-amber-500 transition">

  if (document.getElementById('joinClan')) {

      const cur = clan.joinRequests || [];

      await updateDoc(doc(db, 'clans', clanId), { joinRequests: [...cur, currentUser.uid] });
      showToast('📩 Request join terkirim! Tunggu persetujuan Admin/Owner clan.');
      renderPage();
    };
  }
  if (document.getElementById('editClanBtn')) {
    document.getElementById('editClanBtn').onclick = () => document.getElementById('editClanForm').classList.toggle('hidden');
    document.getElementById('cancelEditClanBtn').onclick = () => document.getElementById('editClanForm').classList.add('hidden');
    document.getElementById('saveClanNameBtn').onclick = async () => {
      const newName = document.getElementById('editClanName').value.trim();
      if (!newName || newName.length < 3) { showToast('Nama 3-20 karakter'); return; }
      await updateDoc(doc(db, 'clans', clanId), { name: newName, updatedAt: serverTimestamp() });
      await loadClansCache();
      showToast('Nama clan diubah!'); renderPage();
    };
  }
  if (document.getElementById('deleteClanBtn')) {
    document.getElementById('deleteClanBtn').onclick = async () => {
      if (!confirm(`Yakin hapus clan "${clan.name}"?`)) return;
      if (!confirm(`Konfirmasi sekali lagi!`)) return;
      try {
        const msgsSnap = await getDocs(collection(db, 'clans', clanId, 'messages'));
        for (const m of msgsSnap.docs) await deleteDoc(doc(db, 'clans', clanId, 'messages', m.id));
        for (const m of members) await updateDoc(doc(db, 'users', m.id), { clanId: null });
        await deleteDoc(doc(db, 'clans', clanId));
        if (userProfile.clanId === clanId) { userProfile.clanId = null; await updateDoc(doc(db, 'users', currentUser.uid), { clanId: null }); }
        await loadClansCache();
        showToast('Clan dihapus!');
        window.location.hash = 'clan';
      } catch (e) { showToast('Gagal: ' + e.message); }
    };
  }
  const msgsDiv = document.getElementById('clanMsgs');
  let lastId = null;
  clanChatUnsub = onSnapshot(query(collection(db, 'clans', clanId, 'messages'), orderBy('createdAt', 'asc'), limit(100)), snap => {
    const arr = []; snap.forEach(d => arr.push({ id: d.id, ...d.data() }));
    if (arr.length === 0) { msgsDiv.innerHTML = '<p class="text-slate-500 text-xs text-center">Belum ada pesan.</p>'; return; }
    const lastMsg = arr[arr.length - 1];
    const isNew = lastId && lastMsg.id !== lastId;
    msgsDiv.innerHTML = arr.map((msg, idx) => {
      const u = usersCache[msg.userId] || {};
      const un = u.username || msg.username || 'Anonim';
      const pu = u.photoURL || msg.photoURL || '';
      const ul = u.level || 1;
      const isOwn = msg.userId === currentUser?.uid;
      const isLast = idx === arr.length - 1;
      const isNewMsg = isLast && isNew;
      const roles = u.roles || (u.role ? [u.role] : ['pembaca']);
      const isO = roles.includes('owner'), isA = roles.includes('admin'), isP = roles.includes('penulis'), isK = roles.includes('komikus'), isPc = roles.includes('pembaca');
      const isG = ul > 1000;
      const clanU = u.clanId ? clansCache[u.clanId] : null;
      const isClanOwner = clanU && clanU.leader === u.uid;
      const isClanAdminMsg = clanU && (clanU.admins || []).includes(u.uid);
      let bc = 'pembaca-chat-border';
      if (isO) bc = 'owner-chat-border';
      else if (isA) bc = 'admin-chat-border';
      else if (clanU) bc = 'clan-chat-border';
      else if (isP) bc = 'penulis-chat-border';
      else if (isK) bc = 'komikus-chat-border';
      const isImgOnly = msg.image && !msg.text;
      if (isOwn) bc += ' bg-amber-500/20';
      if (isImgOnly) bc = 'chat-img-msg';
      const anim = isNewMsg ? (isOwn ? 'chat-msg-new-own' : 'chat-msg-new') : '';
      let tagsHtml = '';
      if (isO) tagsHtml += '<span class="owner-tag">👑 OWNER</span> ';
      if (isA) tagsHtml += '<span class="admin-tag">ADMIN</span> ';
      if (isP) tagsHtml += '<span class="penulis-tag">PENULIS</span> ';
      if (isK) tagsHtml += '<span class="komikus-tag">KOMIKUS</span> ';
      if (isPc) tagsHtml += '<span class="pembaca-tag">PEMBACA</span> ';
      if (clanU) {
        if (isClanOwner) tagsHtml += `<span class="clan-owner-tag cursor-pointer" onclick="window.location.hash='clan/${clanU.id}'">👑 ${clanU.name}</span> `;
        else if (isClanAdminMsg) tagsHtml += `<span class="clan-admin-tag cursor-pointer" onclick="window.location.hash='clan/${clanU.id}'">⚔️ ${clanU.name}</span> `;
        else tagsHtml += `<span class="clan-tag cursor-pointer" onclick="window.location.hash='clan/${clanU.id}'">${clanU.name}</span> `;
      }
      let replyPreview = '';
      if (msg.replyTo && msg.replyToText) {
        replyPreview = `<div class="reply-preview"><i class="fas fa-reply text-amber-400 mr-1"></i><b class="text-amber-400">${msg.replyToName || 'Anonim'}:</b> ${sensor(msg.replyToText).slice(0, 80)}</div>`;
      }
      return `<div class="flex items-start gap-2 ${isOwn ? 'justify-end' : ''} group ${anim}" data-clanmsgid="${msg.id}">
        ${!isOwn ? `<img src="${pu || 'https://ui-avatars.com/api/?name='+encodeURIComponent(un)}" class="w-8 h-8 rounded-full cursor-pointer hover:scale-110 transition" onclick="window.location.hash='user/${msg.userId}'">` : ''}
        <div class="max-w-[75%] rounded-2xl px-3 py-2 ${bc}">
          ${!isImgOnly ? `<div class="flex items-center gap-1 flex-wrap text-xs mb-1">
            <span class="${isG ? 'gold-glow font-bold' : 'text-slate-300 font-semibold'} cursor-pointer hover:underline" onclick="window.location.hash='user/${msg.userId}'">${un}</span>
            ${isG ? '<i class="fas fa-crown text-amber-400 text-xs"></i>' : ''}
            ${tagsHtml}
            <span class="text-slate-500">Lv.${ul}</span>
            ${msg.edited ? '<span class="text-slate-500 text-xs italic">(diedit)</span>' : ''}
          </div>` : ''}
          ${replyPreview}
          ${msg.image ? `<img src="${msg.image}" class="chat-img" onclick="window.showImgFullscreen('${escAttr(msg.image)}','Gambar dari ${escAttr(un)}')">` : ''}
          ${msg.text ? `<div id="clanmt-${msg.id}" class="text-sm ${msg.image ? 'mt-1' : ''}">${sensor(msg.text || '')}</div>` : `<div id="clanmt-${msg.id}" class="hidden"></div>`}
          <div class="flex gap-2 mt-1 text-xs">
            <button onclick="replyClanMsg('${msg.id}')" class="text-slate-400 hover:text-green-400 transition opacity-0 group-hover:opacity-100"><i class="fas fa-reply"></i> Balas</button>
            ${isOwn ? `
              ${!msg.image ? `<button onclick="editClanMsg('${msg.id}')" class="text-blue-400 hover:text-blue-300 transition opacity-0 group-hover:opacity-100"><i class="fas fa-edit"></i> Edit</button>` : ''}
              <button onclick="delClanMsg('${msg.id}')" class="text-red-400 hover:text-red-300 transition opacity-0 group-hover:opacity-100"><i class="fas fa-trash"></i> Hapus</button>
            ` : ''}
          </div>
        </div>
        ${isOwn ? `<img src="${pu || 'https://ui-avatars.com/api/?name='+encodeURIComponent(un)}" class="w-8 h-8 rounded-full">` : ''}
      </div>`;
    }).join('');
    lastId = lastMsg.id;
    msgsDiv.scrollTop = msgsDiv.scrollHeight;
  });
  
  const clanImgInput = document.getElementById('clanImgInput');
  const clanImgPreview = document.getElementById('clanImgPreview');
  if (clanImgInput) {
    clanImgInput.onchange = async (e) => {
      const f = e.target.files[0];
      if (!f) return;
      clanImgPreview.innerHTML = '<p class="text-xs text-amber-400 mb-2">Mengupload...</p>';
      try {
        const dataUrl = await compressImage(f);
        pendingChatImg.clan = dataUrl;
        clanImgPreview.innerHTML = `<div class="chat-img-preview"><img src="${dataUrl}"><span class="remove-btn" onclick="event.stopPropagation();window.cancelChatImg('clan')">×</span></div>`;
      } catch (err) { clanImgPreview.innerHTML = `<p class="text-xs text-red-400 mb-1">Gagal: ${err.message}</p>`; }
      clanImgInput.value = '';
    };
  }
  
  if (document.getElementById('clanSend')) {
    document.getElementById('clanSend').onclick = async () => {
      const text = document.getElementById('clanInput').value.trim();
      const img = pendingChatImg.clan;
      if (!text && !img) return;
      const msgData = { userId: currentUser.uid, username: userProfile.username, photoURL: userProfile.photoURL || '', text: text ? sensor(text) : '', createdAt: serverTimestamp(), edited: false };
      if (img) msgData.image = img;
      if (replyingToClan) { msgData.replyTo = replyingToClan.id; msgData.replyToText = replyingToClan.text || (replyingToClan.image ? '🖼️ Gambar' : ''); msgData.replyToName = replyingToClan.username; }
      await addDoc(collection(db, 'clans', clanId, 'messages'), msgData);
      document.getElementById('clanInput').value = '';
      replyingToClan = null;
      pendingChatImg.clan = null;
      document.getElementById('clanReplyPreview').innerHTML = '';
      document.getElementById('clanImgPreview').innerHTML = '';
      await addExp(EXP_PER_CHAT);
      await addClanExp(clanId, 2);
    };
    document.getElementById('clanInput').addEventListener('keypress', e => { if (e.key === 'Enter') document.getElementById('clanSend').click(); });
  }
}

window.approveClanJoin = async (clanId, userId) => {
  const snap = await getDoc(doc(db, 'clans', clanId));
  if (!snap.exists()) return;
  const clan = snap.data();
  const isOwner = clan.leader === currentUser.uid;
  const isAdmin = (clan.admins || []).includes(currentUser.uid);
  if (!isOwner && !isAdmin) { showToast('Tidak punya akses!'); return; }
  const reqs = (clan.joinRequests || []).filter(id => id !== userId);
  const members = [...(clan.members || []), userId];
  await updateDoc(doc(db, 'clans', clanId), { members, joinRequests: reqs, updatedAt: serverTimestamp() });
  await updateDoc(doc(db, 'users', userId), { clanId });
  await loadClansCache();
  showToast('✅ Member diterima!');
  renderPage();
};
window.rejectClanJoin = async (clanId, userId) => {
  const snap = await getDoc(doc(db, 'clans', clanId));
  if (!snap.exists()) return;
  const clan = snap.data();

};

window.promoteToAdmin = async (clanId, userId) => {
  const snap = await getDoc(doc(db, 'clans', clanId));
  if (!snap.exists()) return;
  const clan = snap.data();
  if (clan.leader !== currentUser.uid) { showToast('Hanya owner bisa!'); return; }
  const admins = clan.admins || [];
  if (admins.length >= 2) { showToast('Maksimal 2 admin!'); return; }
  if (admins.includes(userId)) { showToast('Sudah admin'); return; }
  await updateDoc(doc(db, 'clans', clanId), { admins: [...admins, userId], updatedAt: serverTimestamp() });
  await loadClansCache();
  showToast('Berhasil dijadikan admin!'); renderPage();
};
window.demoteAdmin = async (clanId, userId) => {
  const snap = await getDoc(doc(db, 'clans', clanId));
  if (!snap.exists()) return;
  const clan = snap.data();
  if (clan.leader !== currentUser.uid) { showToast('Hanya owner bisa!'); return; }
  const admins = (clan.admins || []).filter(id => id !== userId);
  await updateDoc(doc(db, 'clans', clanId), { admins, updatedAt: serverTimestamp() });

  showToast('Jabatan admin dicabut'); renderPage();
};
window.kickMember = async (clanId, userId, username) => {
  if (!confirm(`Keluarkan ${username} dari clan?`)) return;
  const snap = await getDoc(doc(db, 'clans', clanId));
  if (!snap.exists()) return;
  const clan = snap.data();
  const admins = clan.admins || [];
  const isOwner = clan.leader === currentUser.uid;
  const isAdmin = admins.includes(currentUser.uid);
  if (!isOwner && !isAdmin) { showToast('Tidak punya akses!'); return; }
  if (clan.leader === userId) { showToast('Tidak bisa keluarkan owner!'); return; }
  if (admins.includes(userId) && !isOwner) { showToast('Hanya owner bisa keluarkan admin!'); return; }
  const newMembers = (clan.members || []).filter(id => id !== userId);
  const newAdmins = admins.filter(id => id !== userId);
  await updateDoc(doc(db, 'clans', clanId), { members: newMembers, admins: newAdmins, updatedAt: serverTimestamp() });
  await updateDoc(doc(db, 'users', userId), { clanId: null });
  await loadClansCache();
  showToast('Member dikeluarkan'); renderPage();
};

window.saveClanMsg = async (msgId) => {
  const clanId = getHash().replace('clan/','');

window.delClanMsg = async (msgId) => {

};
