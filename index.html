const READING_POS_KEY = 'kominovel_reading_pos';
function saveReadingPos(workId, chapterId, scrollY) {
  try {

}

}

  } catch (e) {}
};

// ==================== AUTO KOMPRES ====================
function compressImage(file, maxWidth = 1000, quality = 0.75, maxSizeKB = 180) {
  return new Promise((resolve, reject) => {
    if (!file.type.startsWith('image/')) { reject(new Error('Bukan gambar')); return; }
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxWidth) {
          height = Math.round((height * maxWidth) / width);
          width = maxWidth;
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, width, height);
        ctx.drawImage(img, 0, 0, width, height);
        let q = quality;
        let dataUrl = canvas.toDataURL('image/jpeg', q);
        while (dataUrl.length > maxSizeKB * 1024 && q > 0.25) {
          q -= 0.1;
          dataUrl = canvas.toDataURL('image/jpeg', q);
        }
        if (dataUrl.length > (maxSizeKB + 40) * 1024) {
          reject(new Error('Gambar terlalu besar setelah kompres'));
          return;
        }
        resolve(dataUrl);
      };
      img.onerror = () => reject(new Error('Gagal memuat gambar'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('Gagal baca file'));
    reader.readAsDataURL(file);
  });
}

function buildUserTags(profile, userId) {
  if (!profile) return '';
  const roles = profile.roles || (profile.role ? [profile.role] : ['pembaca']);
  let html = '';
  if (roles.includes('admin')) html += '<span class="admin-tag">ADMIN</span> ';
  if (roles.includes('penulis')) html += '<span class="penulis-tag">PENULIS</span> ';
  if (roles.includes('komikus')) html += '<span class="komikus-tag">KOMIKUS</span> ';
  if (roles.includes('pembaca')) html += '<span class="pembaca-tag">PEMBACA</span> ';
  if (profile.clanId && clansCache[profile.clanId]) {
    const clan = clansCache[profile.clanId];
    const isOwner = clan.leader === userId || clan.leader === profile.uid;
    const isClanAdmin = (clan.admins || []).includes(userId) || (clan.admins || []).includes(profile.uid);
    if (isOwner) html += `<span class="clan-owner-tag cursor-pointer" onclick="event.stopPropagation();window.location.hash='clan/${profile.clanId}'">👑 ${clan.name}</span> `;
    else if (isClanAdmin) html += `<span class="clan-admin-tag cursor-pointer" onclick="event.stopPropagation();window.location.hash='clan/${profile.clanId}'">⚔️ ${clan.name}</span> `;
    else html += `<span class="clan-tag cursor-pointer" onclick="event.stopPropagation();window.location.hash='clan/${profile.clanId}'">${clan.name}</span> `;
  }
  return html;
}

      showToast('Maksimal 5 foto. Hapus dulu salah satu.');
      fileInput.value = '';
      return;
    }
    const toProcess = files.slice(0, remaining);
    if (files.length > remaining) showToast(`Hanya ${remaining} foto bisa ditambahkan.`);
    
    progress.classList.remove('hidden');
    progress.innerHTML = `Memproses ${toProcess.length} foto...<br>`;
    const newFiles = [];
    for (let i = 0; i < toProcess.length; i++) {
      const f = toProcess[i];
      progress.innerHTML += `[${i+1}/${toProcess.length}] ${f.name}...<br>`;
      try {
        const dataUrl = await compressImage(f);
        const sizeKb = (dataUrl.length / 1024).toFixed(0);
        newFiles.push({ name: f.name, dataUrl });
        progress.innerHTML += `&nbsp;&nbsp;✅ ${sizeKb} KB<br>`;
      } catch (err) {
        progress.innerHTML += `&nbsp;&nbsp;❌ ${err.message}<br>`;
      }
    }
    window[`_${containerId}_files`] = [...(window[`_${containerId}_files`] || []), ...newFiles];
    progress.innerHTML += `<br>Total: ${window[`_${containerId}_files`].length} foto`;
    fileInput.value = '';
    renderPreview();
  };
  
  function renderPreview() {
    const files = window[`_${containerId}_files`] || [];
    const urlText = document.getElementById(`${containerId}-urls`)?.value || '';
    const urls = parseImgbbUrls(urlText);
    const total = files.length + urls.length;
    const mode = window[`_${containerId}_mode`] || 'drag';
    preview.innerHTML = '';
    
    if (total === 0) return;
    
    const modeBar = document.createElement('div');
    modeBar.className = 'img-preview-mode-bar';
    modeBar.innerHTML = `
      <span class="mode-label"><i class="fas fa-layer-group"></i>Total: ${total} foto${total > 5 ? ' ⚠️' : ''}</span>
      <div class="mode-btns">
        <button class="mode-btn ${mode === 'drag' ? 'active' : 'inactive'}" data-mode="drag">
          <i class="fas fa-hand-rock"></i> 🖐️ Mode Drag
        </button>
        <button class="mode-btn ${mode === 'fullscreen' ? 'active' : 'inactive'}" data-mode="fullscreen">
          <i class="fas fa-expand"></i> 🔍 Mode Fullscreen
        </button>
      </div>
    `;
    preview.appendChild(modeBar);
    
    modeBar.querySelectorAll('.mode-btn').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        const newMode = btn.dataset.mode;
        window[`_${containerId}_mode`] = newMode;
        dragMode = newMode;
        showToast(newMode === 'drag' ? '🖐️ Mode Drag aktif' : '🔍 Mode Fullscreen aktif');
        renderPreview();
      };
    });
    
    const hint = document.createElement('div');
    hint.className = 'w-full text-[11px] mb-2 ' + (mode === 'drag' ? 'text-amber-400' : 'text-blue-400');
    hint.innerHTML = mode === 'drag' 
      ? '<i class="fas fa-hand-rock mr-1"></i> <b>Mode Drag:</b> Geser gambar untuk ubah urutan.'
      : '<i class="fas fa-expand mr-1"></i> <b>Mode Fullscreen:</b> Klik gambar untuk perbesar.';
    preview.appendChild(hint);
    
    function setupDragEvents(wrap, type, index) {
      wrap.dataset.dragType = type;
      wrap.dataset.dragIndex = index;
      wrap.dataset.dragCid = containerId;
      
      if (mode === 'drag') {
        wrap.draggable = true;
        wrap.classList.add('draggable-ready');
        
        wrap.addEventListener('dragstart', (e) => {
          e.dataTransfer.effectAllowed = 'move';
          try {
            e.dataTransfer.setData('text/plain', JSON.stringify({ cid: containerId, type, idx: index }));
          } catch (err) {
            e.dataTransfer.setData('text/plain', containerId + '||' + type + '||' + index);
          }
          window[`_${containerId}_dragSrc`] = { type, idx: index };
          wrap.classList.add('dragging');
          setTimeout(() => { wrap.style.opacity = '0.4'; }, 0);
        });
        
        wrap.addEventListener('dragend', () => {
          wrap.classList.remove('dragging');
          wrap.style.opacity = '';
          wrap.style.borderColor = '';
          wrap.style.transform = '';
          window[`_${containerId}_dragSrc`] = null;
          preview.querySelectorAll('.img-preview-wrap').forEach(w => {
            w.style.borderColor = '';
            w.style.transform = '';
          });
        });
        
        wrap.addEventListener('dragover', (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          if (window[`_${containerId}_dragSrc`]) {
            wrap.style.borderColor = '#fbbf24';
            wrap.style.transform = 'scale(1.1)';
          }
        });
        
        wrap.addEventListener('dragleave', () => {
          wrap.style.borderColor = '';
          wrap.style.transform = '';
        });
        
        wrap.addEventListener('drop', (e) => {
          e.preventDefault();
          e.stopPropagation();
          wrap.style.borderColor = '';
          wrap.style.transform = '';
          
          let data = window[`_${containerId}_dragSrc`];
          try {
            const raw = e.dataTransfer.getData('text/plain');
            if (raw) {
              if (raw.startsWith('{')) {
                const parsed = JSON.parse(raw);
                if (parsed.cid === containerId) data = parsed;
              } else {
                const parts = raw.split('||');
                if (parts[0] === containerId) {
                  data = { cid: parts[0], type: parts[1], idx: parseInt(parts[2]) };
                }
              }
            }
          } catch (err) {}
          
          if (!data || data.cid !== containerId) return;
          reorderImages(containerId, data.type, data.idx, type, index);
        });
      } else {
        wrap.draggable = false;
      }
    }
    
    files.forEach((f, i) => {
      const wrap = document.createElement('div');
      wrap.className = 'img-preview-wrap' + (mode === 'drag' ? ' no-fullscreen' : '');
      wrap.innerHTML = `
        <img src="${f.dataUrl}" class="img-preview" draggable="false" ${mode === 'fullscreen' ? `onclick="event.stopPropagation();window.showImgFullscreen('${f.dataUrl}','Gambar #${i+1} dari ${total}')"` : ''}>
        <span class="order-num">#${i+1}</span>
        ${mode === 'fullscreen' ? `<span class="zoom-badge" onclick="event.stopPropagation();window.showImgFullscreen('${f.dataUrl}','Gambar #${i+1} dari ${total}')"><i class="fas fa-expand"></i></span>` : ''}
        <span class="remove-btn" onclick="event.stopPropagation();removeImg('${containerId}',${i})">×</span>
        ${mode === 'drag' ? `<span class="drag-handle" title="Tahan & geser"><i class="fas fa-arrows-alt"></i></span>` : ''}
      `;
      setupDragEvents(wrap, 'file', i);
      preview.appendChild(wrap);
    });
    
    urls.forEach((url, i) => {
      const wrap = document.createElement('div');
      wrap.className = 'img-preview-wrap' + (mode === 'drag' ? ' no-fullscreen' : '');
      const safeUrl = escAttr(url);
      wrap.innerHTML = `
        <img src="${url}" class="img-preview" draggable="false" onerror="this.src='https://placehold.co/80x80/1a1a2e/64748b?text=Err'" ${mode === 'fullscreen' ? `onclick="event.stopPropagation();window.showImgFullscreen('${safeUrl}','Gambar #${files.length + i + 1} dari ${total}')"` : ''}>
        <span class="order-num">#${files.length + i + 1}</span>
        ${mode === 'fullscreen' ? `<span class="zoom-badge" onclick="event.stopPropagation();window.showImgFullscreen('${safeUrl}','Gambar #${files.length + i + 1} dari ${total}')"><i class="fas fa-expand"></i></span>` : ''}
        <span class="remove-btn" onclick="event.stopPropagation();removeUrl('${containerId}',${i})">×</span>
        ${mode === 'drag' ? `<span class="drag-handle" title="Tahan & geser"><i class="fas fa-arrows-alt"></i></span>` : ''}
      `;
      setupDragEvents(wrap, 'url', i);
      preview.appendChild(wrap);
    });
  }
  
  const urlTextarea = document.getElementById(`${containerId}-urls`);
  if (urlTextarea) urlTextarea.oninput = renderPreview;
  window[`_${containerId}_render`] = renderPreview;
  renderPreview();
}

        wrap.classList.add('draggable-ready');
        
        wrap.addEventListener('dragstart', (e) => {
          e.dataTransfer.effectAllowed = 'move';
          try {
            e.dataTransfer.setData('text/plain', JSON.stringify({ cid: 'existing_' + cid, idx: index }));
          } catch (err) {
            e.dataTransfer.setData('text/plain', 'existing_' + cid + '||' + index);
          }
          window[`_existing_${cid}_dragSrc`] = index;
          wrap.classList.add('dragging');
          setTimeout(() => { wrap.style.opacity = '0.4'; }, 0);
        });
        
        wrap.addEventListener('dragend', () => {
          wrap.classList.remove('dragging');
          wrap.style.opacity = '';
          wrap.style.borderColor = '';
          wrap.style.transform = '';
          window[`_existing_${cid}_dragSrc`] = null;
          grid.querySelectorAll('.img-preview-wrap').forEach(w => {
            w.style.borderColor = '';
            w.style.transform = '';
          });
        });
        
        wrap.addEventListener('dragover', (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          if (window[`_existing_${cid}_dragSrc`] !== null) {
            wrap.style.borderColor = '#fbbf24';
            wrap.style.transform = 'scale(1.1)';
          }
        });
        
        wrap.addEventListener('dragleave', () => {
          wrap.style.borderColor = '';

          try {

          showToast('✅ Urutan diubah!');

      } else {

    imgs.forEach((img, i) => {

window.removeExistingImage = (cid, index) => {
  if (!confirm('Hapus gambar ini?')) return;
  const imgs = window[`_existing_${cid}_images`] || [];

  window[`_existing_${cid}_images`] = imgs;
  attachExistingImagesHandler(cid, imgs);
};

function reorderImages(containerId, fromType, fromIdx, toType, toIdx) {
  if (fromType === toType && fromIdx === toIdx) return;
  const files = [...(window[`_${containerId}_files`] || [])];
  const urlTextarea = document.getElementById(`${containerId}-urls`);
  const urls = [...parseImgbbUrls(urlTextarea.value)];
  
  let item;
  if (fromType === 'file') item = files.splice(fromIdx, 1)[0];
  else item = urls.splice(fromIdx, 1)[0];
  
  if (toType === 'file') {
    if (fromType === 'url') {
      files.splice(toIdx, 0, { name: 'url-item', dataUrl: item });
    } else {
      files.splice(toIdx, 0, item);
    }
  } else {
    if (fromType === 'file') {
      urls.splice(toIdx, 0, item.dataUrl || item);
    } else {
      urls.splice(toIdx, 0, item);
    }
  }
  
  window[`_${containerId}_files`] = files;
  urlTextarea.value = urls.join('\n');
  window[`_${containerId}_render`]?.();
  showToast('✅ Urutan diubah!');
}

window.removeImg = (cid, idx) => {
  const files = window[`_${cid}_files`] || [];
  files.splice(idx, 1);

};
window.removeUrl = (cid, idx) => {

};

async function initAuth() {
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
      const userRef = doc(db, 'users', user.uid);
      const snap = await getDoc(userRef);
      if (!snap.exists()) {
        const np = {
          uid: user.uid, username: user.displayName || 'User', email: user.email || '',
          photoURL: user.photoURL || '', role: 'pembaca', roles: ['pembaca'],
          exp: 0, level: 1, banned: false,
          friends: [], friendRequests: [], clanId: null,
          bookmarks: [], sosmed: {},
          createdAt: serverTimestamp(), updatedAt: serverTimestamp()
        };
        await setDoc(userRef, np);
        userProfile = np;
      } else {
        userProfile = snap.data();
        if (!userProfile.roles) { userProfile.roles = [userProfile.role || 'pembaca']; await updateDoc(userRef, { roles: userProfile.roles }); }
        if (!userProfile.friends) { userProfile.friends = []; await updateDoc(userRef, { friends: [] }); }
        if (!userProfile.friendRequests) { userProfile.friendRequests = []; await updateDoc(userRef, { friendRequests: [] }); }
        if (!userProfile.bookmarks) { userProfile.bookmarks = []; await updateDoc(userRef, { bookmarks: [] }); }
        if (!userProfile.sosmed) { userProfile.sosmed = {}; await updateDoc(userRef, { sosmed: {} }); }
        if (hasRole(userProfile, 'admin') && userProfile.level !== MAX_LEVEL) {
          await updateDoc(userRef, { level: MAX_LEVEL, exp: MAX_LEVEL * 20 });
          userProfile.level = MAX_LEVEL; userProfile.exp = MAX_LEVEL * 20;
        }
        if (!userProfile.photoURL && user.photoURL) {
          await updateDoc(userRef, { photoURL: user.photoURL });
          userProfile.photoURL = user.photoURL;
        }
        if (userProfile.banned) { showToast('Akun diblokir!', 5000); await signOut(auth); return; }
      }
      await loadClansCache();
      document.getElementById('navAuth').innerHTML = `<i class="fas fa-sign-out-alt mr-1"></i>Keluar`;
      document.getElementById('navAuthMobile').innerHTML = `<i class="fas fa-sign-out-alt"></i>`;
      if (isAdminUser(userProfile)) document.getElementById('navAdmin').classList.remove('hidden');
      else document.getElementById('navAdmin').classList.add('hidden');
      if (isCreator(userProfile)) document.getElementById('navCreator').classList.remove('hidden');
      else document.getElementById('navCreator').classList.add('hidden');
      renderPage();
      setTimeout(() => initNotifListener(), 2000);
    } else {
      currentUser = null; userProfile = null;
      await loadClansCache();
      document.getElementById('navAuth').innerHTML = `<i class="fas fa-sign-in-alt mr-1"></i>Masuk`;

  const l = getLevelFromExp(e);

}
async function addClanExp(clanId, amount) {

    const c = snap.data();

}

function initNotifListener() {
  if (notifInitialized) return;
  notifInitialized = true;
  if (userProfile?.clanId) {
    const clanQ = query(collection(db, 'clans', userProfile.clanId, 'messages'), orderBy('createdAt', 'desc'), limit(1));
    onSnapshot(clanQ, snap => {
      snap.forEach(d => {
        const msg = d.data();
        if (msg.userId === currentUser?.uid) return;
        const ts = msg.createdAt?.toDate?.();
        if (ts && Date.now() - ts.getTime() > 30000) return;
        const un = usersCache[msg.userId]?.username || msg.username || 'Seseorang';
        const preview = msg.image ? '🖼️ Gambar' : (msg.text || '').slice(0, 40);
        showNotifBar(`🛡️ Clan - ${un}: ${preview}`, 'blue');
      });
    });
  }
  initPrivateNotifListener();
}

function initPrivateNotifListener() {
  if (notifPrivateInit) return;
  notifPrivateInit = true;
  const unsub = onSnapshot(collection(db, 'privateChats'), snap => {
    snap.docChanges().forEach(change => {
      if (change.type === 'added') {
        const chatId = change.doc.id;
        if (!chatId.includes(currentUser.uid)) return;
        const otherUid = chatId.split('_').find(u => u !== currentUser.uid);
        if (!otherUid) return;
        const msgQ = query(collection(db, 'privateChats', chatId, 'messages'), orderBy('createdAt', 'desc'), limit(1));
        const unsubMsg = onSnapshot(msgQ, msgSnap => {
          msgSnap.docChanges().forEach(mc => {
            if (mc.type !== 'added') return;
            const m = mc.doc.data();
            if (m.userId === currentUser.uid) return;
            const ts = m.createdAt?.toDate?.();
            if (ts && Date.now() - ts.getTime() > 30000) return;
            const un = usersCache[m.userId]?.username || m.username || 'Seseorang';
            const preview = m.image ? '🖼️ Gambar' : (m.text || '').slice(0, 40);
            showNotifBar(`💬 ${un}: ${preview}`, 'green');
          });
        });
        notifPrivateUnsubs.push(unsubMsg);
      }
    });
  });
  notifPrivateUnsubs.push(unsub);
}

window.toggleWorkLike = async (workId) => {
  if (!currentUser || !userProfile) { showToast('Login dulu untuk like'); return; }
  try {
    const workRef = doc(db, 'works', workId);
    const snap = await getDoc(workRef);
    if (!snap.exists()) return;
    const work = snap.data();
    const likedBy = work.likedBy || [];
    const isLiked = likedBy.includes(currentUser.uid);
    let newLikedBy;
    if (isLiked) {
      newLikedBy = likedBy.filter(id => id !== currentUser.uid);
    } else {
      newLikedBy = [...likedBy, currentUser.uid];
      await addExp(EXP_PER_COMMENT);
    }
    await updateDoc(workRef, {
      likedBy: newLikedBy,
      likes: newLikedBy.length,
      updatedAt: serverTimestamp()
    });
    const el = document.getElementById('like-count-' + workId);
    if (el) el.textContent = formatCount(newLikedBy.length);
    document.querySelectorAll('.like-btn').forEach(b => {
      if (b.getAttribute('onclick')?.includes(workId)) {
        b.classList.toggle('liked', !isLiked);
        b.classList.toggle('text-slate-400', isLiked);
      }
    });
    showToast(isLiked ? 'Like dihapus' : '❤️ Disukai!');
  } catch (e) { showToast('Gagal: ' + e.message); }
};

    <div id="bookmarkList" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 md:gap-5"></div>`;
  const list = document.getElementById('bookmarkList');
  if (bookmarks.length === 0) {
    list.innerHTML = `<div class="col-span-full card-bg rounded-2xl p-12 text-center card-anim"><i class="fas fa-bookmark text-5xl text-amber-400/50 mb-3"></i><p class="text-slate-300">Belum ada bookmark.</p><p class="text-slate-500 text-sm">Tekan tombol bookmark saat baca novel/komik.</p></div>`;
    return;
  }
  const works = [];
  for (const id of bookmarks) {
    try {
      const s = await getDoc(doc(db, 'works', id));
      if (s.exists()) works.push({ id: s.id, ...s.data() });
    } catch (e) {}
  }
  if (works.length === 0) {
    list.innerHTML = `<div class="col-span-full card-bg rounded-2xl p-12 text-center"><p class="text-slate-400">Bookmark kosong.</p></div>`;
    return;
  }
  renderWorkList(list, works);
}

        </label>

      </div>
    </div>`;
  const msgsDiv = document.getElementById('pmMsgs');
  let lastId = null;
  privateChatUnsub = onSnapshot(query(collection(db, 'privateChats', chatId, 'messages'), orderBy('createdAt', 'asc'), limit(100)), snap => {
    const arr = []; snap.forEach(d => arr.push({ id: d.id, ...d.data() }));
    if (arr.length === 0) { msgsDiv.innerHTML = '<p class="text-slate-500 text-sm text-center">Belum ada pesan.</p>'; return; }
    const lastMsg = arr[arr.length - 1];
    const isNew = lastId && lastMsg.id !== lastId;
    msgsDiv.innerHTML = arr.map((m, idx) => {
      const own = m.userId === currentUser.uid;
      const isLast = idx === arr.length - 1;
      const anim = isLast && isNew ? (own ? 'chat-msg-new-own' : 'chat-msg-new') : '';
      const userObj = usersCache[m.userId] || { username: m.username, photoURL: m.photoURL, level: m.userLevel };
      const un = userObj.username || m.username || 'User';
      const pu = userObj.photoURL || m.photoURL || '';
      const ul = userObj.level || m.userLevel || 1;
      const isImg = m.image && !m.text;
      return `<div class="flex ${own ? 'justify-end' : ''} gap-2 ${anim}">
        ${!own ? `<img src="${pu || 'https://ui-avatars.com/api/?name='+encodeURIComponent(un)}" class="w-8 h-8 rounded-full">` : ''}
        <div class="max-w-[70%] ${isImg ? 'chat-img-msg' : (own ? 'bg-amber-500/20' : 'bg-slate-800')} rounded-2xl px-3 py-2">
          ${!isImg ? `<div class="flex items-center gap-1 flex-wrap text-xs mb-1">
            <span class="${isGolden(ul) ? 'gold-glow font-bold' : 'text-slate-300 font-semibold'}">${un}</span>
            ${buildUserTags(userObj, m.userId)}
            <span class="text-slate-500">Lv.${ul}</span>
          </div>` : ''}
          ${m.image ? `<img src="${m.image}" class="chat-img" onclick="window.showImgFullscreen('${escAttr(m.image)}','Gambar dari ${escAttr(un)}')">` : ''}
          ${m.text ? `<p class="text-sm mt-1">${sensor(m.text || '')}</p>` : ''}
          <p class="text-xs text-slate-500 mt-1">${fmtDate(m.createdAt)}</p>
        </div>
        ${own ? `<img src="${pu || 'https://ui-avatars.com/api/?name='+encodeURIComponent(un)}" class="w-8 h-8 rounded-full">` : ''}
      </div>`;
    }).join('');
    lastId = lastMsg.id;
    msgsDiv.scrollTop = msgsDiv.scrollHeight;
  });
  const imgInput = document.getElementById('pmImgInput');
  const imgPreview = document.getElementById('pmImgPreview');
  imgInput.onchange = async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    imgPreview.innerHTML = '<p class="text-xs text-amber-400 mt-2">Memproses gambar...</p>';
    try {
      const dataUrl = await compressImage(f, 800, 0.7, 150);
      pendingChatImg.private = dataUrl;
      imgPreview.innerHTML = `
        <div class="chat-img-preview">
          <img src="${dataUrl}">
          <span class="remove-btn" onclick="event.stopPropagation();window.cancelChatImg('private')">×</span>
        </div>
        <p class="text-xs text-slate-500 mt-1">Gambar siap dikirim (${(dataUrl.length/1024).toFixed(0)} KB)</p>
      `;
    } catch (err) {
      imgPreview.innerHTML = `<p class="text-xs text-red-400 mt-1">Gagal: ${err.message}</p>`;
    }
    imgInput.value = '';
  };
  document.getElementById('pmSend').onclick = async () => {
    const text = document.getElementById('pmInput').value.trim();
    const img = pendingChatImg.private;
    if (!text && !img) return;
    const msgData = {
      userId: currentUser.uid, username: userProfile.username || 'User',
      photoURL: userProfile.photoURL || '', text: text ? sensor(text) : '', createdAt: serverTimestamp()
    };
    if (img) msgData.image = img;
    await addDoc(collection(db, 'privateChats', chatId, 'messages'), msgData);
    document.getElementById('pmInput').value = '';
    pendingChatImg.private = null;
    document.getElementById('pmImgPreview').innerHTML = '';
    await addExp(EXP_PER_CHAT);
  };
  document.getElementById('pmInput').addEventListener('keypress', e => { if (e.key === 'Enter') document.getElementById('pmSend').click(); });
}

window.cancelChatImg = (type) => {
  pendingChatImg[type] = null;
  const map = { public: 'publicImgPreview', clan: 'clanImgPreview', private: 'pmImgPreview' };
  const el = document.getElementById(map[type]);
  if (el) el.innerHTML = '';
};

      const isA = roles.includes('admin'), isP = roles.includes('penulis'), isK = roles.includes('komikus'), isPc = roles.includes('pembaca');
      const isG = ul > 1000;
      const clanU = u.clanId ? clansCache[u.clanId] : null;
      const isClanOwner = clanU && clanU.leader === u.uid;
      const isClanAdminMsg = clanU && (clanU.admins || []).includes(u.uid);
      let bc = 'pembaca-chat-border';
      if (isA) bc = 'admin-chat-border';
      else if (clanU) bc = 'clan-chat-border';
      else if (isP) bc = 'penulis-chat-border';
      else if (isK) bc = 'komikus-chat-border';
      const isImgOnly = msg.image && !msg.text;
      if (isOwn) bc += ' bg-amber-500/20';
      if (isImgOnly) bc = 'chat-img-msg';
      const anim = isNewMsg ? (isOwn ? 'chat-msg-new-own' : 'chat-msg-new') : '';
      let tagsHtml = '';
      if (isA) tagsHtml += '<span class="admin-tag">ADMIN</span> ';
      if (isP) tagsHtml += '<span class="penulis-tag">PENULIS</span> ';
      if (isK) tagsHtml += '<span class="komikus-tag">KOMIKUS</span> ';
      if (isPc) tagsHtml += '<span class="pembaca-tag">PEMBACA</span> ';
      if (clanU) {
        if (isClanOwner) tagsHtml += `<span class="clan-owner-tag cursor-pointer" onclick="window.location.hash='clan/${clanU.id}'">👑 ${clanU.name}</span> `;
        else if (isClanAdminMsg) tagsHtml += `<span class="clan-admin-tag cursor-pointer" onclick="window.location.hash='clan/${clanU.id}'">⚔️ ${clanU.name}</span> `;
        else tagsHtml += `<span class="clan-tag cursor-pointer" onclick="window.location.hash='clan/${clanU.id}'">${clanU.name}</span> `;
      }
      let replyPreview = '';
      if (msg.replyTo && msg.replyToText) {
        replyPreview = `<div class="reply-preview"><i class="fas fa-reply text-amber-400 mr-1"></i><b class="text-amber-400">${msg.replyToName || 'Anonim'}:</b> ${sensor(msg.replyToText).slice(0, 80)}${msg.replyToText.length > 80 ? '...' : ''}</div>`;
      }
      return `<div class="flex items-start gap-2 ${isOwn ? 'justify-end' : ''} group ${anim}" data-clanmsgid="${msg.id}">
        ${!isOwn ? `<img src="${pu || 'https://ui-avatars.com/api/?name='+encodeURIComponent(un)}" class="w-8 h-8 rounded-full cursor-pointer hover:scale-110 transition" onclick="window.location.hash='user/${msg.userId}'">` : ''}
        <div class="max-w-[75%] rounded-2xl px-3 py-2 ${bc}">
          ${!isImgOnly ? `<div class="flex items-center gap-1 flex-wrap text-xs mb-1">
            <span class="${isG ? 'gold-glow font-bold' : 'text-slate-300 font-semibold'} cursor-pointer hover:underline" onclick="window.location.hash='user/${msg.userId}'">${un}</span>
            ${isG ? '<i class="fas fa-crown text-amber-400 text-xs"></i>' : ''}
            ${tagsHtml}
            <span class="text-slate-500">Lv.${ul}</span>
            ${msg.edited ? '<span class="text-slate-500 text-xs italic">(diedit)</span>' : ''}
          </div>` : ''}
          ${replyPreview}
          ${msg.image ? `<img src="${msg.image}" class="chat-img" onclick="window.showImgFullscreen('${escAttr(msg.image)}','Gambar dari ${escAttr(un)}')">` : ''}
          ${msg.text ? `<div id="clanmt-${msg.id}" class="text-sm ${msg.image ? 'mt-1' : ''}">${sensor(msg.text || '')}</div>` : `<div id="clanmt-${msg.id}" class="hidden"></div>`}
          <div class="flex gap-2 mt-1 text-xs">
            <button onclick="replyClanMsg('${msg.id}')" class="text-slate-400 hover:text-green-400 transition opacity-0 group-hover:opacity-100"><i class="fas fa-reply"></i> Balas</button>
            ${isOwn ? `
              ${!msg.image ? `<button onclick="editClanMsg('${msg.id}')" class="text-blue-400 hover:text-blue-300 transition opacity-0 group-hover:opacity-100"><i class="fas fa-edit"></i> Edit</button>` : ''}
              <button onclick="delClanMsg('${msg.id}')" class="text-red-400 hover:text-red-300 transition opacity-0 group-hover:opacity-100"><i class="fas fa-trash"></i> Hapus</button>
            ` : ''}
          </div>
        </div>
        ${isOwn ? `<img src="${pu || 'https://ui-avatars.com/api/?name='+encodeURIComponent(un)}" class="w-8 h-8 rounded-full">` : ''}
      </div>`;
    }).join('');
    lastId = lastMsg.id;
    msgsDiv.scrollTop = msgsDiv.scrollHeight;
  });
  
  const clanImgInput = document.getElementById('clanImgInput');
  const clanImgPreview = document.getElementById('clanImgPreview');
  if (clanImgInput) {
    clanImgInput.onchange = async (e) => {
      const f = e.target.files[0];
      if (!f) return;
      clanImgPreview.innerHTML = '<p class="text-xs text-amber-400 mb-2">Memproses gambar...</p>';
      try {
        const dataUrl = await compressImage(f, 800, 0.7, 150);
        pendingChatImg.clan = dataUrl;
        clanImgPreview.innerHTML = `
          <div class="chat-img-preview">
            <img src="${dataUrl}">
            <span class="remove-btn" onclick="event.stopPropagation();window.cancelChatImg('clan')">×</span>
          </div>
        `;
      } catch (err) {
        clanImgPreview.innerHTML = `<p class="text-xs text-red-400 mb-1">Gagal: ${err.message}</p>`;
      }
      clanImgInput.value = '';
    };
  }
  
  if (document.getElementById('clanSend')) {
    document.getElementById('clanSend').onclick = async () => {
      const text = document.getElementById('clanInput').value.trim();
      const img = pendingChatImg.clan;
      if (!text && !img) return;
      const msgData = {
        userId: currentUser.uid, username: userProfile.username, photoURL: userProfile.photoURL || '',
        text: text ? sensor(text) : '', createdAt: serverTimestamp(), edited: false
      };
      if (img) msgData.image = img;
      if (replyingToClan) {
        msgData.replyTo = replyingToClan.id;
        msgData.replyToText = replyingToClan.text || (replyingToClan.image ? '🖼️ Gambar' : '');
        msgData.replyToName = replyingToClan.username;
      }
      await addDoc(collection(db, 'clans', clanId, 'messages'), msgData);
      document.getElementById('clanInput').value = '';
      replyingToClan = null;
      pendingChatImg.clan = null;
      document.getElementById('clanReplyPreview').innerHTML = '';
      document.getElementById('clanImgPreview').innerHTML = '';
      await addExp(EXP_PER_CHAT);
      await addClanExp(clanId, 2);
    };
    document.getElementById('clanInput').addEventListener('keypress', e => { if (e.key === 'Enter') document.getElementById('clanSend').click(); });
  }
}

window.promoteToAdmin = async (clanId, userId) => {
  const snap = await getDoc(doc(db, 'clans', clanId));
  if (!snap.exists()) return;
  const clan = snap.data();
  if (clan.leader !== currentUser.uid) { showToast('Hanya owner bisa!'); return; }
  const admins = clan.admins || [];
  if (admins.length >= 2) { showToast('Maksimal 2 admin!'); return; }
  if (admins.includes(userId)) { showToast('Sudah admin'); return; }
  await updateDoc(doc(db, 'clans', clanId), { admins: [...admins, userId], updatedAt: serverTimestamp() });
  await loadClansCache();
  showToast('Berhasil dijadikan admin!');
  renderPage();
};
window.demoteAdmin = async (clanId, userId) => {
  const snap = await getDoc(doc(db, 'clans', clanId));
  if (!snap.exists()) return;
  const clan = snap.data();
  if (clan.leader !== currentUser.uid) { showToast('Hanya owner bisa!'); return; }
  const admins = (clan.admins || []).filter(id => id !== userId);
  await updateDoc(doc(db, 'clans', clanId), { admins, updatedAt: serverTimestamp() });
  await loadClansCache();
  showToast('Jabatan admin dicabut');
  renderPage();
};
window.kickMember = async (clanId, userId, username) => {
  if (!confirm(`Keluarkan ${username} dari clan?`)) return;
  const snap = await getDoc(doc(db, 'clans', clanId));
  if (!snap.exists()) return;
  const clan = snap.data();
  const admins = clan.admins || [];
  const isOwner = clan.leader === currentUser.uid;
  const isAdmin = admins.includes(currentUser.uid);
  if (!isOwner && !isAdmin) { showToast('Tidak punya akses!'); return; }
  if (clan.leader === userId) { showToast('Tidak bisa keluarkan owner!'); return; }
  if (admins.includes(userId) && !isOwner) { showToast('Hanya owner bisa keluarkan admin!'); return; }
  const newMembers = (clan.members || []).filter(id => id !== userId);
  const newAdmins = admins.filter(id => id !== userId);
  await updateDoc(doc(db, 'clans', clanId), { members: newMembers, admins: newAdmins, updatedAt: serverTimestamp() });
  await updateDoc(doc(db, 'users', userId), { clanId: null });
  await loadClansCache();
  showToast('Member dikeluarkan');
  renderPage();
};
window.replyClanMsg = (msgId) => {

  if (!el) return;
  const text = el.querySelector(`#clanmt-${msgId}`)?.textContent || '';
  const username = el.querySelector('span.font-semibold, span.gold-glow')?.textContent || 'Anonim';

  replyingToClan = { id: msgId, text, username, image: img };
  const preview = img ? '🖼️ Gambar' : `${text.slice(0, 60)}${text.length > 60 ? '...' : ''}`;
  document.getElementById('clanReplyPreview').innerHTML = `
    <div class="flex items-center justify-between bg-amber-500/10 border-l-2 border-amber-500 rounded px-3 py-2 mb-2">
      <div class="text-xs">
        <i class="fas fa-reply text-amber-400 mr-2"></i>
        <b class="text-amber-400">${username}:</b> <span class="text-slate-300">${preview}</span>
      </div>
      <button onclick="cancelReplyClan()" class="text-red-400 hover:text-red-300 text-lg">&times;</button>
    </div>`;
  document.getElementById('clanInput')?.focus();
};
window.cancelReplyClan = () => {
  replyingToClan = null;
  document.getElementById('clanReplyPreview').innerHTML = '';
};
window.editClanMsg = async (msgId) => {
  const clanId = getHash().replace('clan/','');
  const ref = doc(db, 'clans', clanId, 'messages', msgId);
  const s = await getDoc(ref);
  if (!s.exists() || s.data().userId !== currentUser.uid) return;
  const orig = s.data().text || '';
  const el = document.getElementById('clanmt-' + msgId);
  if (!el) return;
  el.classList.remove('hidden');
  el.innerHTML = `<textarea id="clanet-${msgId}" rows="2" class="chat-edit-input">${orig}</textarea><div class="flex gap-2 mt-1"><button onclick="saveClanMsg('${msgId}')" class="bg-green-600 text-white px-3 py-1 rounded text-xs font-bold">Simpan</button><button onclick="cancelClanEdit('${msgId}', '${escAttr(orig)}')" class="bg-slate-600 text-white px-3 py-1 rounded text-xs font-bold">Batal</button></div>`;
};
window.saveClanMsg = async (msgId) => {
  const clanId = getHash().replace('clan/','');
  const t = document.getElementById('clanet-' + msgId).value.trim();
  if (!t) return;
  await updateDoc(doc(db, 'clans', clanId, 'messages', msgId), { text: sensor(t), edited: true, updatedAt: serverTimestamp() });
};
window.cancelClanEdit = (msgId, orig) => {
  const el = document.getElementById('clanmt-' + msgId);
  if (el) el.textContent = orig;
};
window.delClanMsg = async (msgId) => {
  const clanId = getHash().replace('clan/','');
  const ref = doc(db, 'clans', clanId, 'messages', msgId);
  const s = await getDoc(ref);
  if (!s.exists() || s.data().userId !== currentUser.uid) return;
  if (!confirm('Hapus pesan?')) return;
  await deleteDoc(ref);
  showToast('Dihapus');
};

async function renderReader(container, novelId, chapterId = null) {
  if (!novelId) { container.innerHTML = '<p>Karya tidak ditemukan</p>'; return; }
  const workSnap = await getDoc(doc(db, 'works', novelId));
  if (!workSnap.exists()) { container.innerHTML = '<p class="text-red-400">Karya tidak ditemukan.</p>'; return; }
  const work = { id: workSnap.id, ...workSnap.data() };
  const chaptersSnap = await getDocs(query(collection(db, 'works', novelId, 'chapters'), orderBy('number', 'asc')));
  const chapters = []; chaptersSnap.forEach(d => chapters.push({ id: d.id, ...d.data() }));
  let currentChapter = null;
  if (chapterId) currentChapter = chapters.find(c => c.id === chapterId);
  else if (chapters.length > 0) { currentChapter = chapters[0]; window.location.hash = `reader/${novelId}/${currentChapter.id}`; return; }
  
  const viewKey = `viewed_${novelId}`;
  const alreadyViewed = sessionStorage.getItem(viewKey);
  if (!alreadyViewed) {
    try {
      await updateDoc(doc(db, 'works', novelId), {
        views: (work.views || 0) + 1,
        updatedAt: serverTimestamp()
      });
      work.views = (work.views || 0) + 1;
      sessionStorage.setItem(viewKey, '1');
    } catch (e) {}
  }
  if (currentUser && currentChapter) await addExp(EXP_PER_READ);
  
  const chapterLabel = work.type === 'novel' ? 'Chapter' : 'Eps';
  const canManage = currentUser && (currentUser.uid === work.authorId || isAdminUser(userProfile));
  const cats = parseCategories(work.category);
  const isKomik = work.type === 'komik';
  const isBookmarked = currentUser && (userProfile?.bookmarks || []).includes(novelId);
  const isLiked = currentUser && (work.likedBy || []).includes(currentUser.uid);
  const socialHtml = buildSocialLinks({ sosmed: work.authorSosmed || {} });
  
  const savedPos = getReadingPos(novelId);
  const hasSavedPos = savedPos && savedPos.chapterId === currentChapter?.id && savedPos.scrollY > 100;
  
  container.innerHTML = `
    <div id="readerContent" class="card-anim">
      <div class="reader-header mb-6 flex flex-wrap justify-between items-center gap-2">

              <div class="flex justify-between items-start mb-4 gap-2 flex-wrap">

    </div>`;

  const bmBtn = document.getElementById('bookmarkToggle');
  if (bmBtn) {
    bmBtn.onclick = async () => {
      if (!currentUser || !userProfile) { showToast('Login dulu untuk bookmark'); return; }
      const currentBM = userProfile.bookmarks || [];
      const isNow = currentBM.includes(novelId);
      let newBM;
      if (isNow) newBM = currentBM.filter(id => id !== novelId);
      else newBM = [...currentBM, novelId];
      await updateDoc(doc(db, 'users', currentUser.uid), { bookmarks: newBM });
      userProfile.bookmarks = newBM;
      showToast(isNow ? 'Bookmark dihapus' : 'Ditambahkan ke bookmark');
      renderPage();
    };
  }

  const likeBtn = document.getElementById('readerLikeBtn');
  if (likeBtn) {
    likeBtn.onclick = async () => {
      if (!currentUser || !userProfile) { showToast('Login dulu untuk like'); return; }
      const workRef = doc(db, 'works', novelId);
      const snap = await getDoc(workRef);
      if (!snap.exists()) return;
      const w = snap.data();
      const likedBy = w.likedBy || [];
      const isLikedNow = likedBy.includes(currentUser.uid);
      let newLikedBy;
      if (isLikedNow) {
        newLikedBy = likedBy.filter(id => id !== currentUser.uid);
      } else {
        newLikedBy = [...likedBy, currentUser.uid];
        await addExp(EXP_PER_COMMENT);
      }
      await updateDoc(workRef, {
        likedBy: newLikedBy,
        likes: newLikedBy.length,
        updatedAt: serverTimestamp()
      });
      const cnt = document.getElementById('readerLikeCount');
      if (cnt) cnt.textContent = formatCount(newLikedBy.length);
      likeBtn.classList.toggle('bg-red-600', !isLikedNow);
      likeBtn.classList.toggle('text-white', !isLikedNow);
      likeBtn.classList.toggle('bg-slate-800', isLikedNow);
      likeBtn.classList.toggle('text-slate-300', isLikedNow);
      showToast(isLikedNow ? 'Like dihapus' : '❤️ Disukai!');
    };
  }

  if (currentChapter && hasSavedPos) {
    setTimeout(() => {
      const banner = document.createElement('div');
      banner.className = 'resume-banner';
      banner.innerHTML = `
        <i class="fas fa-bookmark"></i>
        <span>Lanjut baca dari posisi terakhir?</span>
        <button onclick="event.stopPropagation();this.parentElement.remove()" title="Tutup"><i class="fas fa-times"></i></button>
      `;
      banner.onclick = () => {
        const target = document.querySelector('.reader-content');
        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        window.scrollTo({ top: savedPos.scrollY, behavior: 'smooth' });
        banner.remove();
        currentResumeBanner = null;
        showToast('📖 Melanjutkan bacaan...');
      };
      document.body.appendChild(banner);
      currentResumeBanner = banner;
      setTimeout(() => {
        if (banner.parentElement) banner.remove();
        if (currentResumeBanner === banner) currentResumeBanner = null;
      }, 8000);
    }, 500);
  }

  if (currentChapter) {
    let saveTimer = null;
    const savePos = () => {
      const scrollY = window.scrollY || document.documentElement.scrollTop;
      if (scrollY > 100) {
        saveReadingPos(novelId, currentChapter.id, scrollY);
      }
    };
    const scrollHandler = () => {
      if (saveTimer) clearTimeout(saveTimer);
      saveTimer = setTimeout(savePos, 500);
    };
    window.addEventListener('scroll', scrollHandler, { passive: true });
    window.addEventListener('beforeunload', savePos);
  }

  if (!currentChapter) return;
  const commentsRef = collection(db, 'works', novelId, 'chapters', currentChapter.id, 'comments');
  onSnapshot(query(commentsRef, orderBy('createdAt', 'desc')), (snap) => {
    const div = document.getElementById('commentsList');
    if (!div) return;
    const arr = []; snap.forEach(d => arr.push({ id: d.id, ...d.data() }));
    const parents = arr.filter(c => !c.parentId);
    const replies = arr.filter(c => c.parentId);
    if (parents.length === 0) { div.innerHTML = '<p class="text-slate-500 text-sm">Belum ada komentar.</p>'; return; }
    div.innerHTML = parents.map(c => {
      const cReps = replies.filter(r => r.parentId === c.id);
      return `<div class="comment-card rounded-xl p-3 card-anim">
        <div class="flex items-start gap-2">
          <img src="${c.photoURL || 'https://ui-avatars.com/api/?name='+encodeURIComponent(c.username||'U')}" class="w-8 h-8 rounded-full cursor-pointer hover:scale-110 transition" onclick="window.location.hash='user/${c.userId}'">
          <div class="flex-1">
            <div class="flex items-center gap-2 text-xs mb-1 flex-wrap">
              <span class="${isGolden(c.userLevel) ? 'gold-glow font-bold' : 'text-slate-300 font-semibold'} cursor-pointer" onclick="window.location.hash='user/${c.userId}'">${c.username || 'Anonim'}</span>
              ${isGolden(c.userLevel) ? '<i class="fas fa-crown text-amber-400 text-xs"></i>' : ''}
              <span class="text-slate-500">Lv.${c.userLevel || 1}</span>
              ${buildUserTags(c, c.userId)}
              <span class="text-slate-500">• ${fmtDate(c.createdAt)}</span>
            </div>
            <p class="text-sm">${sensor(c.text || '')}</p>
            <div class="flex items-center gap-3 mt-2 text-xs">
              <button onclick="likeComment('${novelId}','${currentChapter.id}','${c.id}')" class="text-slate-400 hover:text-red-400 transition"><i class="fas fa-heart"></i> ${c.likes || 0}</button>
              <button onclick="showReplyInput('${c.id}')" class="text-slate-400 hover:text-amber-400 transition"><i class="fas fa-reply"></i> Balas</button>
            </div>
            <div id="reply-input-${c.id}" class="hidden mt-2 flex gap-2"><input type="text" id="reply-text-${c.id}" placeholder="Balasan..." class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-xs"><button onclick="submitReply('${novelId}','${currentChapter.id}','${c.id}')" class="bg-amber-500 text-black px-3 py-1.5 rounded-lg text-xs font-bold">Kirim</button></div>
            ${cReps.length > 0 ? `<div class="mt-3 space-y-2">${cReps.map(r => `<div class="reply-indent">
              <div class="flex items-start gap-2">
                <img src="${r.photoURL || 'https://ui-avatars.com/api/?name='+encodeURIComponent(r.username||'U')}" class="w-6 h-6 rounded-full">
                <div><span class="${isGolden(r.userLevel) ? 'gold-glow font-bold' : 'text-slate-300'} text-xs">${r.username}</span> ${buildUserTags(r, r.userId)}<p class="text-xs">${sensor(r.text || '')}</p></div>
              </div>
            </div>`).join('')}</div>` : ''}
          </div>
        </div>
      </div>`;
    }).join('');
  });
  let selRating = 0;
  document.querySelectorAll('#ratingStars .star-rating').forEach(s => s.onclick = () => {
    selRating = parseInt(s.dataset.star);
    document.querySelectorAll('#ratingStars .star-rating').forEach((x, i) => { x.classList.toggle('text-amber-400', i < selRating); x.classList.toggle('text-slate-600', i >= selRating); });
    s.classList.add('star-pop');
    setTimeout(() => s.classList.remove('star-pop'), 300);
    document.getElementById('ratingText').textContent = selRating + ' bintang';
  });
  document.getElementById('submitComment').onclick = async () => {
    if (!currentUser || !userProfile) { showToast('Login dulu'); return; }
    const text = document.getElementById('commentInput').value.trim();
    if (!text && selRating === 0) { showToast('Tulis komentar/rating'); return; }
    if (text) {
      await addDoc(commentsRef, { userId: currentUser.uid, username: userProfile.username, photoURL: userProfile.photoURL || '', userLevel: userProfile.level || 1, isAdmin: isAdminUser(userProfile), isPenulis: hasRole(userProfile, 'penulis'), isKomikus: hasRole(userProfile, 'komikus'), text: sensor(text), likes: 0, parentId: null, createdAt: serverTimestamp() });
      await addExp(EXP_PER_COMMENT);
    }
    if (selRating > 0) {
      await setDoc(doc(db, 'works', novelId, 'chapters', currentChapter.id, 'ratings', currentUser.uid), { userId: currentUser.uid, rating: selRating, createdAt: serverTimestamp() });
      await recalcWorkRating(novelId);
    }
    document.getElementById('commentInput').value = ''; selRating = 0;
    document.querySelectorAll('#ratingStars .star-rating').forEach(s => { s.classList.remove('text-amber-400'); s.classList.add('text-slate-600'); });
    document.getElementById('ratingText').textContent = 'Pilih';
    showToast('Terkirim');
  };
}

async function recalcWorkRating(workId) {
  const cs = await getDocs(collection(db, 'works', workId, 'chapters'));
  let total = 0, count = 0;
  for (const ch of cs.docs) {
    const rs = await getDocs(collection(db, 'works', workId, 'chapters', ch.id, 'ratings'));
    rs.forEach(r => { total += r.data().rating || 0; count++; });
  }
  await updateDoc(doc(db, 'works', workId), { avgRating: count > 0 ? total/count : 0, ratingCount: count, updatedAt: serverTimestamp() });
}

window.likeComment = async (wid,cid,id) => {
  if (!currentUser) { showToast('Login dulu'); return; }
  const r = doc(db,'works',wid,'chapters',cid,'comments',id); const s = await getDoc(r);
  if (s.exists()) await updateDoc(r, { likes: (s.data().likes || 0) + 1 });
};
window.showReplyInput = id => document.getElementById('reply-input-' + id)?.classList.toggle('hidden');
window.submitReply = async (wid,cid,pid) => {
  if (!currentUser) { showToast('Login dulu'); return; }
  const inp = document.getElementById('reply-text-' + pid);
  const t = inp.value.trim();
  if (!t) return;
  await addDoc(collection(db,'works',wid,'chapters',cid,'comments'), { userId: currentUser.uid, username: userProfile.username, photoURL: userProfile.photoURL || '', userLevel: userProfile.level || 1, isAdmin: isAdminUser(userProfile), isPenulis: hasRole(userProfile,'penulis'), isKomikus: hasRole(userProfile,'komikus'), text: sensor(t), likes: 0, parentId: pid, createdAt: serverTimestamp() });
  await addExp(EXP_PER_COMMENT);
  inp.value = ''; document.getElementById('reply-input-' + pid).classList.add('hidden');
  showToast('Balasan terkirim');
};
window.deleteChapterFromReader = async (wid,cid,num) => {
  if (!confirm(`Hapus ${num}?`)) return;
  try {
    const cs = await getDocs(collection(db,'works',wid,'chapters',cid,'comments'));
    for (const c of cs.docs) await deleteDoc(doc(db,'works',wid,'chapters',cid,'comments',c.id));
    const rs = await getDocs(collection(db,'works',wid,'chapters',cid,'ratings'));
    for (const r of rs.docs) await deleteDoc(doc(db,'works',wid,'chapters',cid,'ratings',r.id));
    await deleteDoc(doc(db,'works',wid,'chapters',cid));
    showToast('Dihapus'); window.location.hash = 'reader/' + wid;
  } catch (e) { showToast('Gagal: ' + e.message); }
};
window.acceptFriend = async (uid) => {
  await updateDoc(doc(db,'users',currentUser.uid), { friends: [...(userProfile.friends || []), uid], friendRequests: (userProfile.friendRequests || []).filter(x => x !== uid) });
  const otherSnap = await getDoc(doc(db, 'users', uid));
  const otherData = otherSnap.data();
  await updateDoc(doc(db,'users',uid), { friends: [...(otherData.friends || []), currentUser.uid] });
  userProfile.friends = [...(userProfile.friends || []), uid];
  userProfile.friendRequests = (userProfile.friendRequests || []).filter(x => x !== uid);
  showToast('Teman ditambahkan'); renderPage();
};
window.rejectFriend = async (uid) => {
  await updateDoc(doc(db,'users',currentUser.uid), { friendRequests: (userProfile.friendRequests || []).filter(x => x !== uid) });
  userProfile.friendRequests = (userProfile.friendRequests || []).filter(x => x !== uid);
  showToast('Ditolak'); renderPage();
};
window.sendFriendRequest = async (uid) => {
  const s = await getDoc(doc(db,'users',uid));
  const u = s.data();
  await updateDoc(doc(db,'users',uid), { friendRequests: [...(u.friendRequests || []), currentUser.uid] });
  showToast('Request terkirim'); renderPage();
};

async function renderKategori(container) {
  container.innerHTML = `
    <h2 class="text-2xl font-bold mb-4">Kategori</h2>

      <button class="cat-btn px-4 py-2 rounded-full bg-amber-500 text-black font-bold text-sm hover:scale-105 transition" data-cat="all">Semua</button>
      ${ALL_CATEGORIES.map(c => `<button class="cat-btn px-4 py-2 rounded-full bg-slate-800 text-sm hover:bg-slate-700 transition" data-cat="${c}">${c}</button>`).join('')}
    </div>
    <div id="kategoriList" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 md:gap-5"></div>`;
  document.querySelectorAll('.cat-btn').forEach(b => b.onclick = () => {
    document.querySelectorAll('.cat-btn').forEach(x => x.classList.remove('bg-amber-500','text-black'));
    b.classList.add('bg-amber-500','text-black');
    currentCategory = b.dataset.cat; loadKL();
  });
  async function loadKL() {

  }
  loadKL();
}

async function renderChat(container) {
  container.innerHTML = `
    <h2 class="text-2xl font-bold mb-4"><i class="fas fa-comments text-amber-400 mr-2"></i>Chat Publik</h2>
    <div class="card-bg rounded-2xl p-4 h-[65vh] flex flex-col card-anim">
      <div id="chatMessages" class="flex-1 overflow-y-auto scrollbar-thin space-y-3 mb-3 p-2"></div>

      <div class="flex gap-2 items-center mt-2">
        <label class="chat-img-send-btn" title="Kirim gambar">
          <i class="fas fa-image text-lg"></i>
          <input type="file" id="publicImgInput" accept="image/*">
        </label>
        <input id="chatInput" type="text" placeholder="Tulis pesan..." class="flex-1 bg-slate-800 border border-slate-700 rounded-full px-4 py-2 text-sm focus:border-amber-500 transition">
        <button id="sendChat" class="bg-amber-500 text-black px-5 py-2 rounded-full font-bold text-sm hover:scale-105 transition"><i class="fas fa-paper-plane"></i></button>
      </div>
    </div>`;
  const messagesDiv = document.getElementById('chatMessages');
  const input = document.getElementById('chatInput');
  const sendBtn = document.getElementById('sendChat');
  let rawMessages = [];
  let lastId = null;
  chatUnsub = onSnapshot(query(collection(db,'chats'), orderBy('createdAt','asc'), limit(100)), snapshot => {
    rawMessages = []; snapshot.forEach(d => rawMessages.push({ id: d.id, ...d.data() }));
    renderMsgs();
  });
  chatUsersUnsub = onSnapshot(collection(db,'users'), snap => {
    usersCache = {}; snap.forEach(d => usersCache[d.id] = { id: d.id, ...d.data() });
    renderMsgs();
  });
  onSnapshot(collection(db,'clans'), snap => {
    clansCache = {}; snap.forEach(d => clansCache[d.id] = { id: d.id, ...d.data() });
    renderMsgs();
  });
  function renderMsgs() {
    if (rawMessages.length === 0) { messagesDiv.innerHTML = '<p class="text-slate-500 text-sm text-center">Belum ada pesan.</p>'; return; }
    const lastMsg = rawMessages[rawMessages.length - 1];
    const isNew = lastId && lastMsg.id !== lastId;
    messagesDiv.innerHTML = rawMessages.map((msg, idx) => {
      const u = usersCache[msg.userId] || {};
      const un = u.username || msg.username || 'Anonim';
      const pu = u.photoURL || msg.photoURL || '';
      const ul = u.level || 1;
      const roles = u.roles || (u.role ? [u.role] : ['pembaca']);
      const isA = roles.includes('admin'), isP = roles.includes('penulis'), isK = roles.includes('komikus'), isPc = roles.includes('pembaca');
      const isG = ul > 1000;
      const own = msg.userId === currentUser?.uid;
      const clanId = u.clanId;
      const clan = clanId ? clansCache[clanId] : null;
      const isClanOwner = clan && clan.leader === u.uid;
      const isClanAdminMsg = clan && (clan.admins || []).includes(u.uid);
      let bc = 'pembaca-chat-border';
      if (isA) bc = 'admin-chat-border';
      else if (clan) bc = 'clan-chat-border';
      else if (isP) bc = 'penulis-chat-border';
      else if (isK) bc = 'komikus-chat-border';
      const isImgOnly = msg.image && !msg.text;
      if (own) bc += ' bg-amber-500/20';
      if (isImgOnly) bc = 'chat-img-msg';
      const isLast = idx === rawMessages.length - 1;
      const anim = isLast && isNew ? (own ? 'chat-msg-new-own' : 'chat-msg-new') : '';
      let tagsHtml = '';
      if (isA) tagsHtml += '<span class="admin-tag">ADMIN</span> ';
      if (isP) tagsHtml += '<span class="penulis-tag">PENULIS</span> ';
      if (isK) tagsHtml += '<span class="komikus-tag">KOMIKUS</span> ';
      if (isPc) tagsHtml += '<span class="pembaca-tag">PEMBACA</span> ';
      if (clan) {
        if (isClanOwner) tagsHtml += `<span class="clan-owner-tag cursor-pointer" onclick="event.stopPropagation();window.location.hash='clan/${clan.id}'">👑 ${clan.name}</span> `;
        else if (isClanAdminMsg) tagsHtml += `<span class="clan-admin-tag cursor-pointer" onclick="event.stopPropagation();window.location.hash='clan/${clan.id}'">⚔️ ${clan.name}</span> `;
        else tagsHtml += `<span class="clan-tag cursor-pointer" onclick="event.stopPropagation();window.location.hash='clan/${clan.id}'">${clan.name}</span> `;
      }
      let replyPreview = '';
      if (msg.replyTo && msg.replyToText) {
        replyPreview = `<div class="reply-preview"><i class="fas fa-reply text-amber-400 mr-1"></i><b class="text-amber-400">${msg.replyToName || 'Anonim'}:</b> ${sensor(msg.replyToText).slice(0, 80)}${msg.replyToText.length > 80 ? '...' : ''}</div>`;
      }
      return `<div class="flex items-start gap-2 ${own ? 'justify-end' : ''} group ${anim}" data-publicmsgid="${msg.id}">
        ${!own ? `<img src="${pu || 'https://ui-avatars.com/api/?name='+encodeURIComponent(un)}" class="w-8 h-8 rounded-full cursor-pointer hover:scale-110 transition" onclick="window.location.hash='user/${msg.userId}'">` : ''}
        <div class="max-w-[75%] rounded-2xl px-3 py-2 ${bc}">
          ${!isImgOnly ? `<div class="flex items-center gap-1 flex-wrap text-xs mb-1">
            <span class="${isG ? 'gold-glow font-bold' : 'text-slate-300 font-semibold'} cursor-pointer hover:underline" onclick="window.location.hash='user/${msg.userId}'">${un}</span>
            ${isG ? '<i class="fas fa-crown text-amber-400 text-xs"></i>' : ''}
            ${tagsHtml}
            <span class="text-slate-500">Lv.${ul}</span>
            ${msg.edited ? '<span class="text-slate-500 text-xs italic">(diedit)</span>' : ''}
          </div>` : ''}
          ${replyPreview}
          ${msg.image ? `<img src="${msg.image}" class="chat-img" onclick="window.showImgFullscreen('${escAttr(msg.image)}','Gambar dari ${escAttr(un)}')">` : ''}
          ${msg.text ? `<div id="pubmt-${msg.id}" class="text-sm ${msg.image ? 'mt-1' : ''}">${sensor(msg.text || '')}</div>` : `<div id="pubmt-${msg.id}" class="hidden"></div>`}
          <div class="flex gap-2 mt-1 text-xs">
            <button onclick="replyPubMsg('${msg.id}')" class="text-slate-400 hover:text-green-400 transition opacity-0 group-hover:opacity-100"><i class="fas fa-reply"></i> Balas</button>
            ${own ? `
              ${!msg.image ? `<button onclick="editPubMsg('${msg.id}')" class="text-blue-400 hover:text-blue-300 transition opacity-0 group-hover:opacity-100"><i class="fas fa-edit"></i> Edit</button>` : ''}
              <button onclick="delPubMsg('${msg.id}')" class="text-red-400 hover:text-red-300 transition opacity-0 group-hover:opacity-100"><i class="fas fa-trash"></i> Hapus</button>
            ` : ''}
          </div>
        </div>
        ${own ? `<img src="${pu || 'https://ui-avatars.com/api/?name='+encodeURIComponent(un)}" class="w-8 h-8 rounded-full">` : ''}
      </div>`;
    }).join('');
    lastId = lastMsg.id;
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }
  
  const pubImgInput = document.getElementById('publicImgInput');
  const pubImgPreview = document.getElementById('publicImgPreview');
  pubImgInput.onchange = async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    pubImgPreview.innerHTML = '<p class="text-xs text-amber-400 mb-2">Memproses gambar...</p>';
    try {
      const dataUrl = await compressImage(f, 800, 0.7, 150);
      pendingChatImg.public = dataUrl;
      pubImgPreview.innerHTML = `
        <div class="chat-img-preview">
          <img src="${dataUrl}">
          <span class="remove-btn" onclick="event.stopPropagation();window.cancelChatImg('public')">×</span>
        </div>
      `;
    } catch (err) {
      pubImgPreview.innerHTML = `<p class="text-xs text-red-400 mb-1">Gagal: ${err.message}</p>`;
    }
    pubImgInput.value = '';
  };
  
  sendBtn.onclick = async () => {
    const text = input.value.trim();
    const img = pendingChatImg.public;
    if ((!text && !img) || !currentUser) { showToast('Login dulu'); return; }
    const msgData = {
      userId: currentUser.uid, username: userProfile.username || 'Guest',
      photoURL: userProfile.photoURL || '', userLevel: userProfile.level || 1,
      isAdmin: isAdminUser(userProfile), isPenulis: hasRole(userProfile,'penulis'), isKomikus: hasRole(userProfile,'komikus'),
      text: text ? sensor(text) : '', edited: false, createdAt: serverTimestamp()
    };
    if (img) msgData.image = img;
    if (replyingToPublic) {
      msgData.replyTo = replyingToPublic.id;
      msgData.replyToText = replyingToPublic.text || (replyingToPublic.image ? '🖼️ Gambar' : '');
      msgData.replyToName = replyingToPublic.username;
    }
    await addDoc(collection(db,'chats'), msgData);
    input.value = '';
    replyingToPublic = null;
    pendingChatImg.public = null;
    document.getElementById('publicReplyPreview').innerHTML = '';
    document.getElementById('publicImgPreview').innerHTML = '';
    await addExp(EXP_PER_CHAT);
  };
  input.addEventListener('keypress', e => { if (e.key === 'Enter') sendBtn.click(); });
}
window.replyPubMsg = (msgId) => {
  const el = document.querySelector(`[data-publicmsgid="${msgId}"]`);
  if (!el) return;
  const text = el.querySelector(`#pubmt-${msgId}`)?.textContent || '';
  const username = el.querySelector('span.font-semibold, span.gold-glow')?.textContent || 'Anonim';
  const img = el.querySelector('.chat-img')?.src || '';
  replyingToPublic = { id: msgId, text, username, image: img };
  const preview = img ? '🖼️ Gambar' : `${text.slice(0, 60)}${text.length > 60 ? '...' : ''}`;
  document.getElementById('publicReplyPreview').innerHTML = `
    <div class="flex items-center justify-between bg-amber-500/10 border-l-2 border-amber-500 rounded px-3 py-2 mb-2">
      <div class="text-xs">
        <i class="fas fa-reply text-amber-400 mr-2"></i>
        <b class="text-amber-400">${username}:</b> <span class="text-slate-300">${preview}</span>
      </div>
      <button onclick="cancelReplyPub()" class="text-red-400 hover:text-red-300 text-lg">&times;</button>
    </div>`;
  document.getElementById('chatInput')?.focus();
};
window.cancelReplyPub = () => {
  replyingToPublic = null;
  document.getElementById('publicReplyPreview').innerHTML = '';
};
window.editPubMsg = async (id) => {
  const ref = doc(db,'chats',id); const s = await getDoc(ref);
  if (!s.exists() || s.data().userId !== currentUser.uid) return;
  const orig = s.data().text || '';
  const el = document.getElementById('pubmt-'+id);
  if (!el) return;
  el.classList.remove('hidden');
  el.innerHTML = `<textarea id="pubet-${id}" rows="2" class="chat-edit-input">${orig}</textarea><div class="flex gap-2 mt-1"><button onclick="savePubMsg('${id}')" class="bg-green-600 text-white px-3 py-1 rounded text-xs font-bold">Simpan</button><button onclick="cancelPubEdit('${id}', '${escAttr(orig)}')" class="bg-slate-600 text-white px-3 py-1 rounded text-xs font-bold">Batal</button></div>`;
};
window.savePubMsg = async (id) => {
  const t = document.getElementById('pubet-'+id).value.trim();
  if (!t) return;
  await updateDoc(doc(db,'chats',id), { text: sensor(t), edited: true, updatedAt: serverTimestamp() });
};
window.cancelPubEdit = (id, orig) => {
  const el = document.getElementById('pubmt-'+id);
  if (el) el.textContent = orig;
};
window.delPubMsg = async (id) => {
  const r = doc(db,'chats',id); const s = await getDoc(r);
  if (!s.exists() || s.data().userId !== currentUser.uid) return;
  if (!confirm('Hapus?')) return;
  await deleteDoc(r); showToast('Dihapus');
};

          ` : `
            <div id="editExisting-${cid}">

          const existingImages = window[`_existing_${cid}_images`] || ch.images || [];

            title: newTitle, 
            images: finalImages,

        if (images.length > 5) { showToast('Maksimal 5 foto'); return; }

          const w = workSnap.data();
          if (!w.coverURL || w.coverURL === '') {
            await updateDoc(workRef, { coverURL: images[0] });
          }
        }
      }
      showToast('Ditambahkan'); loadManage();
    });
  }
  document.getElementById('creatorTabUpload').onclick = loadUploadForm;
  document.getElementById('creatorTabManage').onclick = loadManage;
  loadManage();
}

window.removeImageFromChapter = async (wid, cid, index) => {
  if (!confirm('Hapus gambar ini?')) return;
  const chSnap = await getDoc(doc(db, 'works', wid, 'chapters', cid));
  if (!chSnap.exists()) return;
  const ch = chSnap.data();
  const newImages = [...(ch.images || [])];
  newImages.splice(index, 1);
  await updateDoc(doc(db, 'works', wid, 'chapters', cid), { images: newImages, updatedAt: serverTimestamp() });
  showToast('Gambar dihapus');
  const b = document.querySelector(`.editChapterBtn[data-cid="${cid}"]`);
  if (b) b.click();
};

        <input id="adminUploadTitle" type="text" placeholder="Judul *" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm">
        <input id="adminUploadTeaser" type="text" maxlength="150" placeholder="Teaser * (max 150)" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm">
        <select id="adminUploadType" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm"><option value="novel">Novel</option><option value="komik">Komik</option></select>
        ${categoryChipsField('adminUploadCategories')}
        <textarea id="adminUploadDesc" rows="3" placeholder="Deskripsi" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm"></textarea>
        ${coverField('adminUploadCover')}
        <button id="adminUploadSubmit" class="w-full bg-amber-500 text-black font-bold py-3 rounded-full hover:scale-105 transition">Upload</button>
      </div></div>`;
    attachCoverHandler('adminUploadCover');
    document.getElementById('adminUploadSubmit').onclick = async () => {
      const title = document.getElementById('adminUploadTitle').value.trim();
      const teaser = document.getElementById('adminUploadTeaser').value.trim();
      const type = document.getElementById('adminUploadType').value;
      const cats = getSelectedCats('adminUploadCategories');
      const category = cats.join(', ');
      const desc = document.getElementById('adminUploadDesc').value.trim();
      const coverURL = getCoverValue('adminUploadCover');
      if (!title || !teaser || cats.length === 0 || !coverURL) { showToast('Lengkapi'); return; }
      await addDoc(collection(db,'works'), { 
        title, teaser, type, category, description: desc, coverURL, 
        authorId: currentUser?.uid || 'admin', 
        authorName: userProfile?.username || 'Admin', 
        authorPhotoURL: userProfile?.photoURL || '', 
        authorSosmed: userProfile?.sosmed || {},
        authorLevel: MAX_LEVEL, 
        avgRating: 0, ratingCount: 0, isTamat: false, 
        views: 0, likes: 0, likedBy: [],
        createdAt: serverTimestamp(), updatedAt: serverTimestamp() 
      });
      showToast('Dibuat'); window.location.hash = 'creator';
    };
  }
  async function loadKritik() {
    aC.innerHTML = `<div class="card-bg rounded-2xl p-6 card-anim"><h3 class="font-bold mb-4">Kritik</h3><div id="kL"></div></div>`;
    const snap = await getDocs(query(collection(db,'kritik_saran'), orderBy('createdAt','desc'), limit(50)));
    const arr = []; snap.forEach(d => arr.push({ id: d.id, ...d.data() }));
    const l = document.getElementById('kL');
    if (arr.length === 0) { l.innerHTML = '<p class="text-slate-400">Belum ada.</p>'; return; }
    l.innerHTML = arr.map(k => `<div class="comment-card rounded-xl p-3 mb-2 card-anim"><div class="flex gap-2 text-xs mb-1"><span class="text-amber-400 font-semibold">${k.nama}</span><span class="bg-slate-700 px-2 py-0.5 rounded-full">${k.jenis}</span><span class="ml-auto text-slate-500">${fmtDate(k.createdAt)}</span></div><p class="text-sm whitespace-pre-wrap">${k.pesan}</p></div>`).join('');
  }
  async function loadSet() {
    aC.innerHTML = `<div class="card-bg rounded-2xl p-6 max-w-lg mx-auto card-anim"><h3 class="font-bold mb-4">Setting</h3>
      <label class="block text-sm font-semibold mb-1">Nomor WA Admin</label>
      <input id="adminWANumber" type="text" value="${localStorage.getItem('adminWA') || WA_NUMBER}" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm">
      <button id="saveSettings" class="mt-4 w-full bg-amber-500 text-black font-bold py-2 rounded-full hover:scale-105 transition">Simpan</button></div>`;
    document.getElementById('saveSettings').onclick = () => {
      localStorage.setItem('adminWA', document.getElementById('adminWANumber').value.trim());
      showToast('Disimpan');
    };
  }
  document.getElementById('adminTabUsers').onclick = loadUsers;
  document.getElementById('adminTabUpload').onclick = loadUploadForm;
  document.getElementById('adminTabKritik').onclick = loadKritik;
  document.getElementById('adminTabSettings').onclick = loadSet;
  loadUsers();
}

function handleAuthClick() {
  if (currentUser) logout();
  else {
    const m = document.getElementById('modalContainer');
    const c = document.getElementById('modalContent');
    c.innerHTML = `<div class="text-center mb-4"><img src="${LOGO_URL}" class="w-20 h-20 mx-auto rounded-2xl mb-3 border-2 border-amber-500 logo-glow"><h3 class="text-xl font-bold">Masuk</h3></div>
      <div class="flex flex-col gap-3">
        <button id="mg" class="bg-white text-black font-bold py-3 rounded-full hover:scale-105 transition"><i class="fab fa-google mr-2"></i>Google</button>
        <button id="mgu" class="bg-slate-700 text-slate-300 font-bold py-2 rounded-full text-xs">Guest</button>
      </div>`;
    m.classList.remove('hidden');
    document.getElementById('mg').onclick = () => { signInWithGoogle(); m.classList.add('hidden'); };
    document.getElementById('mgu').onclick = () => { signInAsGuest(); m.classList.add('hidden'); };
  }
}
document.getElementById('navAuth').onclick = handleAuthClick;
document.getElementById('navAuthMobile').onclick = handleAuthClick;
document.getElementById('modalContainer').onclick = e => { if (e.target.id === 'modalContainer') e.target.classList.add('hidden'); };
window.addEventListener('hashchange', renderPage);

(async function init() {
  await initAuth();
  if (localStorage.getItem('adminSession') === 'true') {
    isAdminSession = true;
    adminEmail = localStorage.getItem('adminEmail');
    document.getElementById('navAdmin').classList.remove('hidden');
  }
  if (!window.location.hash) window.location.hash = 'home';
  renderPage();
})();
</script>
</body>
</html>
